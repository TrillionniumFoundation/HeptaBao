[package]
name = "heptabao-darwin-vnode-events"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
libc = "=0.2.189"

[lib]
path = "src/lib.rs"
doctest = false

# Explicit, narrow OS boundary. The filesystem guard and every existing crate
# retain forbid(unsafe_code). This crate does not claim to inherit that forbid.
[lints.rust]
unsafe_code = "allow"
unsafe_op_in_unsafe_fn = "deny"
unused_must_use = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
expect_used = "deny"
panic = "deny"
unwrap_used = "deny"
