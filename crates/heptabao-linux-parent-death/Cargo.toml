[package]
name = "heptabao-linux-parent-death"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "=1.1.4", features = ["process"] }

# The fixed pre-exec hook is this crate's only audited unsafe boundary. Existing
# workspace crates retain forbid(unsafe_code); no caller closure is accepted.
[lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
expect_used = "deny"
panic = "deny"
unwrap_used = "deny"
