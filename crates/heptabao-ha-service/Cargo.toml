[package]
name = "heptabao-ha-service"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[features]
default = []
# Only private synthetic fault cells enable fixed-label transport diagnostics.
# The default transport reports identical errors and emits no stage trace.
private-forward-stage-diagnostic = []
# Independent experimental mTLS peer-ingress fixture; NOT installed into
# production peer dispatch, root publication or a majority-ack path.
experimental-v6-peer-ingress = ["dep:heptabao-raft-runtime", "heptabao-raft-runtime/experimental-v6-raft-objects"]

[dependencies]
zeroize = "=1.8.1"
rustls = { version = "=0.23.44", default-features = false, features = ["ring", "std", "tls12"] }
ring = "0.17.14"
heptabao-raft-runtime = { path = "../heptabao-raft-runtime", optional = true }

[dev-dependencies]
rustls-pemfile = "=2.2.0"

[[example]]
name = "v6_replica_multihost_private"
required-features = ["experimental-v6-peer-ingress"]

[[example]]
name = "v6_replica_two_peers_private"
required-features = ["experimental-v6-peer-ingress"]
