[package]
name = "heptabao-raft-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[features]
default = []
# Experimental external objects and durable V6 root CAS. Service HA admission
# still requires its original Actor/clock and authenticated majority durability.
experimental-v6-raft-objects = ["dep:heptabao-filesystem-guard"]
[dependencies]
base64 = "=0.22.1"
crc32fast = "=1.5.2"
heptabao-filesystem-guard = { path = "../heptabao-filesystem-guard", optional = true }
sha2 = "=0.10.9"
futures = "=0.3.34"
openraft = { version = "=0.10.0-alpha.34", default-features = false, features = ["serde", "tokio-rt", "type-alias"] }
openraft-memstore = { version = "=0.10.0-alpha.34" }
openraft-rt = "=0.10.0-alpha.34"
openraft-rt-tokio = "=0.10.0-alpha.34"
openraft-macros = "=0.10.0-alpha.34"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tokio = { version = "=1.53.1", default-features = false, features = ["macros", "rt-multi-thread", "sync", "time"] }

[lints]
workspace = true
