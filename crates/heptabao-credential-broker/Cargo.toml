[package]
name = "heptabao-credential-broker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
heptabao-filesystem-guard = { path = "../heptabao-filesystem-guard" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
ring = "=0.17.14"
base64 = "=0.22.1"
zeroize = "=1.8.1"
ssh-key = { version = "=0.6.7", default-features = false, features = ["std", "crypto"] }
rustix = { version = "=1.1.4", features = ["fs", "process"] }

[lints]
workspace = true
