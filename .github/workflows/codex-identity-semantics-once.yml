name: Codex identity semantic alignment once

on:
  push:
    branches:
      - codex/openbao-complete-replacement-20260912
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: codex/openbao-complete-replacement-20260912
          fetch-depth: 0
          persist-credentials: true

      - name: Apply semantic alignment, validate and commit exact source
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .codex/identity_semantics.patch.b64 > /tmp/identity.patch
          git apply --check /tmp/identity.patch
          git apply /tmp/identity.patch
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
          cargo +1.98.0 fmt --all
          python scripts/current_source_inventory.py --write
          python scripts/validate_repository_v2.py
          python scripts/validate_compatibility_corpus.py
          git diff --check
          cargo +1.98.0 test -p heptabao-server --locked
          cargo +1.98.0 clippy -p heptabao-server --all-targets --locked -- -D warnings
          git rm .github/workflows/codex-identity-semantics-once.yml .codex/identity_semantics.patch.b64
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/heptabao-server/src/engines/identity.rs planning/HEPTABAO_CURRENT_SOURCE_INVENTORY_V2.json
          git commit -m "fix(identity): align OpenBao identity semantics"
          git push origin HEAD:codex/openbao-complete-replacement-20260912
