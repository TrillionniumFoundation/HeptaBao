name: Codex materialize OpenBao replacement seal closure

on:
  push:
    branches:
      - codex/openbao-replacement-full-closure-20260908

permissions:
  contents: write

concurrency:
  group: codex-openbao-replacement-materialize
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Verify and assemble exact patch payload
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/parts.sha256" <<'EOF'
          1bc257f2c943a6a255de9feabf58a81d9b2d98e0eed6fa905538ff5e76aab255  .g1/codex-openbao-replacement/parts/part-00
          f6bb60eb4594041917012688e3d8337922202c811119db14dc5da65865fc8e1b  .g1/codex-openbao-replacement/parts/part-01
          13a3f6187113bd8c8a11acbfe06309e7ffd03d27b7e95f0c4ee5595ce61a19c2  .g1/codex-openbao-replacement/parts/part-02
          0b445102127c6a0f791ab5e1f86557552559b11a289ae4a52722004639db915b  .g1/codex-openbao-replacement/parts/part-03
          3898d18af54dd41b4265a4e61e6ead9c785d018c1dc06678adaefd61aea5333f  .g1/codex-openbao-replacement/parts/part-04
          0f6f7ccfd03b72eb29bb5eae359937faa881b2f243d5c2e762c787ba29000523  .g1/codex-openbao-replacement/parts/part-05
          8050414c00593e278795eba91fe8bd73cd89442ccaf8f79ddfe6224e57076b0b  .g1/codex-openbao-replacement/parts/part-06
          5e41f80c103580657fab4887ac5115ef63d7af184642944966e10d4b1c821e14  .g1/codex-openbao-replacement/parts/part-07
          59b5e80716232781c9d032bece397f45bffce112b9b1bfbfaf7df7e2ccbab75b  .g1/codex-openbao-replacement/parts/part-08
          EOF
          sha256sum --check "$RUNNER_TEMP/parts.sha256"
          cat .g1/codex-openbao-replacement/parts/part-* > "$RUNNER_TEMP/seal.patch.gz.b64"
          test "$(sha256sum "$RUNNER_TEMP/seal.patch.gz.b64" | cut -d' ' -f1)" = "c22fc6f3624b9825f63cc44470aadb2bb84367dac6bc3d9b782db72497a5962b"
          base64 --decode "$RUNNER_TEMP/seal.patch.gz.b64" > "$RUNNER_TEMP/seal.patch.gz"
          gzip --test "$RUNNER_TEMP/seal.patch.gz"
          gzip --decompress --stdout "$RUNNER_TEMP/seal.patch.gz" > "$RUNNER_TEMP/seal.patch"
          test "$(sha256sum "$RUNNER_TEMP/seal.patch" | cut -d' ' -f1)" = "c17e8d5ddd16f9d8f699f307f68c318c3b5b54b9d43c5462f379685ffd3f759a"

      - name: Apply bounded source patch
        shell: bash
        run: |
          set -euo pipefail
          git apply --check --verbose "$RUNNER_TEMP/seal.patch"
          git apply --verbose "$RUNNER_TEMP/seal.patch"
          git diff --check
          git diff --stat

      - name: Install exact Rust toolchain
        shell: bash
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy

      - name: Format and qualify server
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.98.0 fmt --all
          python scripts/validate_repository_v2.py
          cargo +1.98.0 test --locked -p heptabao-server
          cargo +1.98.0 clippy --locked -p heptabao-server --all-targets -- -D warnings
          git diff --check

      - name: Publish qualified source commit
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .g1/codex-openbao-replacement
          rm -f .github/workflows/codex-openbao-replacement-materialize.yml
          rm -f .github/workflows/codex-openbao-replacement-source-export.yml
          git config user.name "HeptaBao Codex Closure"
          git config user.email "102159240+ProfHepta@users.noreply.github.com"
          git add -A
          git commit -m "feat(seal): add threshold unseal and durable online rekey"
          git push origin HEAD:codex/openbao-replacement-full-closure-20260908
