name: Codex materialize OpenBao replacement seal closure

on:
  push:
    branches:
      - codex/openbao-replacement-full-closure-20260908

permissions:
  contents: write

concurrency:
  group: codex-openbao-replacement-materialize
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Verify staged patch payload
        shell: bash
        run: |
          set -euo pipefail
          actual="$(sha256sum .g1/codex-openbao-replacement/seal.patch.gz.b64 | cut -d' ' -f1)"
          echo "staged_base64_sha256=$actual"
          test "$actual" = "c22fc6f3624b9825f63cc44470aadb2bb84367dac6bc3d9b782db72497a5962b"
          base64 --decode .g1/codex-openbao-replacement/seal.patch.gz.b64 > "$RUNNER_TEMP/seal.patch.gz"
          gzip --test "$RUNNER_TEMP/seal.patch.gz"
          gzip --decompress --stdout "$RUNNER_TEMP/seal.patch.gz" > "$RUNNER_TEMP/seal.patch"
          actual_patch="$(sha256sum "$RUNNER_TEMP/seal.patch" | cut -d' ' -f1)"
          echo "decoded_patch_sha256=$actual_patch"
          test "$actual_patch" = "c17e8d5ddd16f9d8f699f307f68c318c3b5b54b9d43c5462f379685ffd3f759a"

      - name: Apply bounded source patch
        shell: bash
        run: |
          set -euo pipefail
          git apply --check --verbose "$RUNNER_TEMP/seal.patch"
          git apply --verbose "$RUNNER_TEMP/seal.patch"
          git diff --check
          git diff --stat

      - name: Install exact Rust toolchain
        shell: bash
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy

      - name: Format and qualify server
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.98.0 fmt --all
          python scripts/validate_repository_v2.py
          cargo +1.98.0 test --locked -p heptabao-server
          cargo +1.98.0 clippy --locked -p heptabao-server --all-targets -- -D warnings
          git diff --check

      - name: Publish qualified source commit
        shell: bash
        run: |
          set -euo pipefail
          rm -f .g1/codex-openbao-replacement/seal.patch.gz.b64
          rmdir .g1/codex-openbao-replacement 2>/dev/null || true
          rm -f .github/workflows/codex-openbao-replacement-materialize.yml
          rm -f .github/workflows/codex-openbao-replacement-source-export.yml
          git config user.name "HeptaBao Codex Closure"
          git config user.email "102159240+ProfHepta@users.noreply.github.com"
          git add -A
          git commit -m "feat(seal): add threshold unseal and durable online rekey"
          git push origin HEAD:codex/openbao-replacement-full-closure-20260908
