name: oracle-foundation

on:
  push:
    branches: ["codex/h01-oracle-foundation"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: oracle-foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sanitized-oracle-foundation:
    if: ${{ (github.event_name != 'pull_request' || github.head_ref != 'codex/plan-v1.3-gap-closure-v2') && (github.event_name != 'push' || github.ref != 'refs/heads/codex/plan-v1.3-gap-closure-v2') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact source binding
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected"
          git diff --quiet
          git diff --cached --quiet

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-plan.txt

      - name: Install pinned validation dependencies
        run: python -m pip install --disable-pip-version-check --requirement requirements-plan.txt

      - name: Validate parent Plan V1.1 execution model
        run: |
          python scripts/validate_plan_v2.py
          python scripts/validate_plan_v2_extensions.py
          python scripts/validate_provenance_v1.py

      - name: Validate H01 baseline, inventories and fixture contracts
        run: python scripts/validate_oracle_foundation_v1.py

      - name: Run Oracle normalizer tests
        run: python -m unittest discover -s tests/oracle -p 'test_*.py' -v

      - name: Run synthetic CLI normalization
        shell: bash
        run: |
          set -euo pipefail
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          cat >"$tmpdir/input.json" <<'JSON'
          {
            "request_id": "synthetic-request-id",
            "auth": {
              "client_token": "synthetic-token-value",
              "policies": ["z-policy", "a-policy"],
              "lease_duration": 3600
            },
            "data": {
              "creation_time": "2026-08-28T00:00:00Z",
              "stable_status": "active"
            }
          }
          JSON
          python scripts/oracle_normalize_v1.py \
            --input "$tmpdir/input.json" \
            --policy oracle/normalization/HEPTABAO_ORACLE_NORMALIZATION_POLICY_V1.yaml \
            --output "$tmpdir/output.json"
          python - "$tmpdir/output.json" <<'PY'
          import json
          import sys
          output = json.load(open(sys.argv[1], encoding='utf-8'))
          encoded = json.dumps(output, sort_keys=True)
          assert 'synthetic-token-value' not in encoded
          assert output['document']['request_id'] == '$REQUEST_ID'
          assert output['document']['auth']['policies'] == ['a-policy', 'z-policy']
          assert output['document']['auth']['lease_duration'] == 3600
          assert output['document']['data']['stable_status'] == 'active'
          assert output['authority_effect'] == 'NONE'
          print('synthetic normalized fixture is deterministic and secret-free')
          PY

      - name: Confirm no compatibility or operational authority
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          status = json.load(open('qualifications/H01/H01-IMPLEMENTATION-STATUS.json', encoding='utf-8'))
          if status['qualification']['status'] != 'NOT_QUALIFIED':
              raise SystemExit('H01 cannot self-qualify')
          enabled = [name for name, value in status['authority_flags'].items() if value]
          if enabled:
              raise SystemExit(f'unexpected H01 authority: {enabled}')

          evidence = status['capture_evidence']
          expected = {
              'raw_restricted_fixtures': 0,
              'black_box_sanitized_fixtures': 0,
              'synthetic_contract_fixtures': 1,
              'signed_provenance_transfers': 0,
              'reviewed_normalization_rules': 0,
              'qualified_fixtures': 0,
          }
          if evidence != expected:
              raise SystemExit(f'unexpected H01 evidence maturity: {evidence!r}')
          print('H01 foundation validated; synthetic=1 real-capture=0 qualified=0 authority=NONE')
          PY
