name: Temporary Rustfmt for OpenBao P0 fixes

on:
  push:
    branches:
      - codex/openbao-replacement-full-closure-20260908

permissions:
  contents: write

concurrency:
  group: temporary-openbao-p0-rustfmt
  cancel-in-progress: false

jobs:
  format:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Apply exact Rust 1.98 formatting and push
        shell: bash
        run: |
          set -euo pipefail
          branch=codex/openbao-replacement-full-closure-20260908
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt
          cargo +1.98.0 fmt --all
          git diff --check

          changed="$(git diff --name-only)"
          test -n "$changed"
          while IFS= read -r path; do
            case "$path" in
              crates/heptabao-server/src/http.rs|crates/heptabao-server/src/service.rs|crates/heptabao-server/src/service_tests.rs) ;;
              *) echo "unexpected rustfmt path: $path" >&2; exit 1 ;;
            esac
          done <<< "$changed"
          for expected in \
            crates/heptabao-server/src/http.rs \
            crates/heptabao-server/src/service.rs \
            crates/heptabao-server/src/service_tests.rs
          do
            grep -Fx "$expected" <<< "$changed"
          done

          git fetch origin "$branch"
          test "$(git rev-parse "refs/remotes/origin/$branch")" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/heptabao-server/src/http.rs crates/heptabao-server/src/service.rs crates/heptabao-server/src/service_tests.rs
          git commit -m 'style(server): apply Rust 1.98 formatting'
          git push origin "HEAD:refs/heads/$branch"
