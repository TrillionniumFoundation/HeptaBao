name: Codex materialize durable maintenance tranche

on:
  push:
    branches:
      - codex/openbao-replacement-full-closure-20260908

permissions:
  contents: write

concurrency:
  group: codex-openbao-replacement-maintenance-materialize
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Verify and assemble bounded payload
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum crates/heptabao-durable-service/src/lib.rs | cut -d' ' -f1)" = "c79a2264618f0c16c6426524e47c871252c34f4099c8b488026de88b9c47f341"
          sha256sum --check <(head -n 1 .g1/codex-openbao-replacement/maintenance-tranche/payload.sha256)
          cat .g1/codex-openbao-replacement/maintenance-tranche/part-* > "$RUNNER_TEMP/maintenance.patch.gz.b64"
          test "$(sha256sum "$RUNNER_TEMP/maintenance.patch.gz.b64" | cut -d' ' -f1)" = "66c3a3439f18bb8f9a17402be1013c06985b0ff98a03082b289be2e076945909"
          base64 --decode "$RUNNER_TEMP/maintenance.patch.gz.b64" > "$RUNNER_TEMP/maintenance.patch.gz"
          gzip --test "$RUNNER_TEMP/maintenance.patch.gz"
          gzip --decompress --stdout "$RUNNER_TEMP/maintenance.patch.gz" > "$RUNNER_TEMP/maintenance.patch"
          test "$(sha256sum "$RUNNER_TEMP/maintenance.patch" | cut -d' ' -f1)" = "c3526c8bd67758f6746c07da0c7b6483a486a1e88be55cb2bb1fdffed5cb7442"

      - name: Apply durable maintenance source
        shell: bash
        run: |
          set -euo pipefail
          git apply --check --verbose "$RUNNER_TEMP/maintenance.patch"
          git apply --verbose "$RUNNER_TEMP/maintenance.patch"
          git diff --check

      - name: Install exact Rust toolchain
        shell: bash
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy

      - name: Qualify compaction backup restore and recovery
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.98.0 fmt --all
          python scripts/validate_repository_v2.py
          cargo +1.98.0 test --locked -p heptabao-durable-service
          cargo +1.98.0 clippy --locked -p heptabao-durable-service --all-targets -- -D warnings
          git diff --check

      - name: Publish qualified source commit
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .g1/codex-openbao-replacement/maintenance-tranche
          rmdir .g1/codex-openbao-replacement 2>/dev/null || true
          rm -f .github/workflows/codex-maintenance-materialize.yml
          git config user.name "HeptaBao Codex Closure"
          git config user.email "102159240+ProfHepta@users.noreply.github.com"
          git add -A
          git commit -m "feat(storage): add checkpoint compaction and encrypted backup restore"
          git push origin HEAD:codex/openbao-replacement-full-closure-20260908
