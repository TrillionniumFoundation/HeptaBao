name: materialize-replay-retirement-20260916
on:
  push:
    branches:
      - codex/next-round-product-closure-20260916
permissions:
  contents: write
jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Bind exact parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "f1c8a2fdde53a79d919631601f1692259413df29"
      - name: Install Rust 1.98
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
      - name: Materialize replay retirement
        shell: bash
        run: |
          set -euo pipefail
          python scripts/materialize_replay_retirement_20260916.py
          python - <<'PY'
          from pathlib import Path
          p = Path('crates/heptabao-durable-service/src/lib.rs')
          s = p.read_text()
          old = 'persist_ledger(&root.0, &TestBarrier::new(), 1, &ledger)?;'
          new = 'persist_ledger(&root.0, &TestBarrier::new(), 2, 0, 0, &ledger)?;'
          if s.count(old) != 1:
              raise SystemExit(f'legacy persist_ledger fixture count={s.count(old)}')
          s = s.replace(old, new, 1)
          old = '''    if replay_epoch == 0 && retired_through_generation != 0 {\n        return Err(ServiceError::CorruptState);\n    }\n    if replay_epoch > 0 && retired_through_generation == 0 {\n        return Err(ServiceError::CorruptState);\n    }\n'''
          new = '''    if replay_epoch == 0 && retired_through_generation != 0 {\n        return Err(ServiceError::CorruptState);\n    }\n'''
          if s.count(old) != 1:
              raise SystemExit('replay epoch/frontier invariant patch mismatch')
          s = s.replace(old, new, 1)
          old = '        let ledger = service.ledger.clone();\n'
          new = '''        let mut ledger = service.ledger.clone();\n        let record = ledger\n            .values_mut()\n            .find(|record| record.generation == 1)\n            .ok_or(ServiceError::CorruptState)?;\n        record.binding_digest[0] ^= 0x80;\n'''
          if s.count(old) != 1:
              raise SystemExit(f'hostile ledger fixture count={s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          PY
          cargo +1.98.0 fmt --all
          cargo +1.98.0 test --locked -p heptabao-durable-service
          cargo +1.98.0 clippy --locked -p heptabao-durable-service --all-targets -- -D warnings
      - name: Remove transport and publish source
        shell: bash
        run: |
          set -euo pipefail
          rm scripts/materialize_replay_retirement_20260916.py
          rm .github/workflows/materialize-replay-retirement-20260916.yml
          git diff --check
          git config user.name "OpenAI replay-retirement materializer"
          git config user.email "noreply@openai.com"
          git add -A
          git commit -m "feat(storage): add authenticated replay epoch retirement"
          git push origin HEAD:codex/next-round-product-closure-20260916
