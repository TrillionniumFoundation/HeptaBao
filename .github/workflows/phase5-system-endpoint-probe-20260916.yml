name: phase5-system-endpoint-probe-20260916
on:
  push:
    branches:
      - codex/phase5-60-surface-closure-20260916
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Bind exact parent
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "5185e604b5cc940f6c3dcb5f788bda72e7450a20"
      - name: Emit system endpoint function bodies
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          text = Path('crates/heptabao-server/src/service.rs').read_text()
          names = ['initialize', 'unseal', 'seal_status', 'rekey_route', 'ack_initialization']
          for name in names:
              marker = f'    fn {name}('
              start = text.find(marker)
              if start < 0:
                  print(f'### {name}: NOT FOUND')
                  continue
              nxt = text.find('\n    fn ', start + len(marker))
              if nxt < 0:
                  nxt = len(text)
              print(f'\n### FUNCTION {name}\n')
              print(text[start:nxt][:18000])
          print('\n### LIFECYCLE PATH LITERALS')
          for i, line in enumerate(text.splitlines(), 1):
              if any(token in line for token in ('sys/health','sys/init','sys/unseal','sys/seal','sys/rekey/')):
                  print(f'{i}: {line}')
          PY
      - name: Remove probe
        run: |
          set -euo pipefail
          rm .github/workflows/phase5-system-endpoint-probe-20260916.yml
          git config user.name "OpenAI phase5 system endpoint probe"
          git config user.email "noreply@openai.com"
          git add -A
          git commit -m "ops: remove phase5 system endpoint probe"
          git push origin HEAD:codex/phase5-60-surface-closure-20260916
