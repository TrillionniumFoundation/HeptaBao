name: Qualify migration Clippy repair

on:
  push:
    branches:
      - exec/fix-migration-clippy-20260916

permissions:
  contents: write

concurrency:
  group: fix-migration-clippy-20260916
  cancel-in-progress: false

jobs:
  validate-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout materializer payload
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: exec/fix-migration-clippy-20260916
          path: materializer
          persist-credentials: false

      - name: Checkout exact target branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: codex/next-round-product-closure-20260916
          path: target
          fetch-depth: 0
          persist-credentials: true

      - name: Verify target and apply exact repair
        shell: bash
        working-directory: target
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "9e2d7df37f6562cf05d1fa33be8071ee85a2b04c"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          git apply --check ../materializer/materializers/fix-migration-clippy-20260916.patch
          git apply ../materializer/materializers/fix-migration-clippy-20260916.patch
          git diff --check

      - name: Install exact qualification dependencies
        shell: bash
        working-directory: target
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --requirement requirements-plan.txt
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy

      - name: Run full exact-head product gate before publication
        shell: bash
        working-directory: target
        run: |
          set -euo pipefail
          cargo +1.98.0 fmt --all
          python scripts/current_source_inventory.py --write
          python scripts/validate_repository_v2.py
          python scripts/validate_openbao_replacement_admission.py
          python scripts/validate_module_closure.py
          python -m unittest discover -s tests/repository -p 'test_*.py' -v
          python -m unittest discover -s tests/security -p 'test_*.py' -v
          python scripts/validate_workflow_trust.py
          python scripts/validate_module_documentation_v1_4_4.py
          python -m unittest discover -s tests/plan -p 'test_module_documentation_v1_4_4.py' -v
          python -m unittest discover -s tests/plan -p 'test_external_completion_evidence_v1.py' -v
          python -m unittest discover -s tests/platform -p 'test_*.py' -v
          python -m unittest discover -s tests/oracle -p 'test_*.py' -v
          python -m compileall -q scripts tests
          cargo +1.98.0 fmt --all -- --check
          cargo +1.98.0 test --locked --workspace --all-targets
          cargo +1.98.0 clippy --locked --workspace --all-targets -- -D warnings
          cargo +1.98.0 doc --locked --workspace --no-deps
          cargo +1.98.0 build --locked -p heptabao-server
          python -m unittest discover -s qa/openbao-acceptance/tests -v
          python qa/single-node/smoke.py --binary "$PWD/target/debug/heptabao-server" --work-dir "$RUNNER_TEMP/heptabao-single-node-clippy-repair"
          git diff --check
          actual="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' crates/heptabao-migration/src/durable.rs planning/HEPTABAO_CURRENT_SOURCE_INVENTORY_V2.json | sort)"
          test "$actual" = "$expected"

      - name: Publish validated repair only
        shell: bash
        working-directory: target
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/heptabao-migration/src/durable.rs planning/HEPTABAO_CURRENT_SOURCE_INVENTORY_V2.json
          test -n "$(git status --porcelain=v1)"
          git commit -m "fix(migration): satisfy Rust 1.98 strict Clippy"
          git push origin HEAD:codex/next-round-product-closure-20260916
