name: h02-openraft-inmemory-cluster

on:
  push:
    branches:
      - "codex/h02-openraft-inmemory-cluster-v1"
      - "codex/h02-os-durable-clock-supplychain-v1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: h02-openraft-inmemory-cluster-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-plan:
    if: ${{ (github.event_name != 'pull_request' || github.head_ref != 'codex/plan-v1.3-gap-closure-v2') && (github.event_name != 'push' || github.ref != 'refs/heads/codex/plan-v1.3-gap-closure-v2') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-plan.txt
      - run: python -m pip install --disable-pip-version-check --requirement requirements-plan.txt
      - run: python scripts/validate_h02_openraft_inmemory_cluster_v1.py
      - run: python -m unittest tests/platform/test_h02_openraft_inmemory_cluster_v1.py -v

  cluster-sequential:
    if: ${{ (github.event_name != 'pull_request' || github.head_ref != 'codex/plan-v1.3-gap-closure-v2') && (github.event_name != 'push' || github.ref != 'refs/heads/codex/plan-v1.3-gap-closure-v2') }}
    needs: validate-plan
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      TOOLCHAINS: "1.88.0 1.98.0"
      SEEDS: "0x5eed20260828cafe 0x8badf00d12345678 0xd15ea5e5cafef00d"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python -m pip install --disable-pip-version-check --requirement requirements-plan.txt
      - name: Install exact Rust toolchains
        shell: bash
        run: |
          set -euo pipefail
          for toolchain in $TOOLCHAINS; do
            rustup toolchain install "$toolchain" --profile minimal
            rustup target add x86_64-unknown-linux-gnu --toolchain "$toolchain"
            rustup run "$toolchain" rustc --version --verbose
            rustup run "$toolchain" cargo --version --verbose
          done
      - name: Execute all six entries serially and retain every outcome
        shell: bash
        run: |
          set -u
          root="$RUNNER_TEMP/h02-openraft-sequential"
          evidence_root="$GITHUB_WORKSPACE/evidence/h02-openraft-inmemory"
          rm -rf "$root" "$evidence_root"
          mkdir -p "$root" "$evidence_root"

          for toolchain in $TOOLCHAINS; do
            work="$root/$toolchain"
            mkdir -p "$work"
            cp -a probes/h02/openraft-tokio/. "$work/"
            manifest="$work/Cargo.toml"
            export CARGO_TARGET_DIR="$root/target-$toolchain"

            toolchain_status=0
            rustup run "$toolchain" cargo generate-lockfile --manifest-path "$manifest" \
              >"$evidence_root/cargo-generate-lockfile-$toolchain.log" 2>&1 || toolchain_status=$?
            if [ "$toolchain_status" -eq 0 ]; then
              rustup run "$toolchain" cargo test --locked --all-targets --manifest-path "$manifest" \
                >"$evidence_root/cargo-test-$toolchain.log" 2>&1 || toolchain_status=$?
            fi

            for seed in $SEEDS; do
              seed_name="${seed#0x}"
              entry="$evidence_root/$toolchain-$seed_name"
              mkdir -p "$entry"
              status="$toolchain_status"
              if [ "$status" -eq 0 ]; then
                rustup run "$toolchain" cargo run --quiet --locked --manifest-path "$manifest" \
                  --bin heptabao-h02-openraft-inmemory-cluster -- --seed "$seed" \
                  >"$entry/cluster-output.jsonl" 2>"$entry/cluster-stderr.log" || status=$?
              fi
              if [ "$status" -eq 0 ]; then
                rustup run "$toolchain" cargo run --quiet --locked --manifest-path "$manifest" \
                  --bin heptabao-h02-openraft-inmemory-cluster -- --seed "$seed" \
                  >"$entry/cluster-replay.jsonl" 2>"$entry/cluster-replay-stderr.log" || status=$?
              fi
              touch "$entry/cluster-output.jsonl" "$entry/cluster-replay.jsonl"
              cp "$manifest" "$entry/Cargo.toml"
              if [ -f "$work/Cargo.lock" ]; then cp "$work/Cargo.lock" "$entry/Cargo.lock"; else : > "$entry/Cargo.lock"; fi
              printf '%s\n' "$status" > "$entry/execution-exit-code.txt"
            done
          done
          exit 0
      - name: Build and validate fail-closed evidence for every entry
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          tree_sha="$(git rev-parse 'HEAD^{tree}')"
          branch="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          evidence_root="$GITHUB_WORKSPACE/evidence/h02-openraft-inmemory"
          for toolchain in $TOOLCHAINS; do
            for seed in $SEEDS; do
              seed_name="${seed#0x}"
              entry="$evidence_root/$toolchain-$seed_name"
              status="$(cat "$entry/execution-exit-code.txt" 2>/dev/null || printf '125')"
              environment_id="github-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${RUNNER_NAME}-${toolchain}-${seed}"
              python scripts/h02_openraft_inmemory_cluster_evidence_v1.py collect \
                --adapter-output "$entry/cluster-output.jsonl" \
                --replay-output "$entry/cluster-replay.jsonl" \
                --execution-exit-code "$status" \
                --seed "$seed" \
                --toolchain "$toolchain" \
                --manifest "$entry/Cargo.toml" \
                --cargo-lock "$entry/Cargo.lock" \
                --source-commit "$(git rev-parse HEAD)" \
                --source-tree "$tree_sha" \
                --branch "$branch" \
                --clean-tree \
                --environment-id "$environment_id" \
                --executor-kind github-hosted \
                --runner-id github-api-enrichment-pending \
                --runner-name "$RUNNER_NAME" \
                --output "$entry/cluster-evidence.json"
            done
          done
          python - <<'PY'
          import json
          from pathlib import Path
          from jsonschema import Draft202012Validator
          schema = json.load(open('schemas/heptabao_h02_openraft_cluster_evidence_v1.schema.json', encoding='utf-8'))
          paths = sorted(Path('evidence/h02-openraft-inmemory').glob('*-*/cluster-evidence.json'))
          assert len(paths) == 6, [str(path) for path in paths]
          for path in paths:
              value = json.load(path.open(encoding='utf-8'))
              errors = list(Draft202012Validator(schema).iter_errors(value))
              if errors:
                  raise SystemExit(f"{path}: {[error.message for error in errors]}")
              assert value['qualification'] is False
              assert value['selection_effect'] == 'NONE'
              assert value['promotion_effect'].startswith('BLOCK_')
              assert value['authority_effect'] == 'NONE'
              print(path, value['status'])
          PY
      - name: Upload all evidence before final gate
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: h02-openraft-inmemory-sequential-${{ github.run_id }}-${{ github.run_attempt }}
          path: evidence/h02-openraft-inmemory/
          if-no-files-found: error
          retention-days: 30
      - name: Require all six executed passes without qualification
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          paths = sorted(Path('evidence/h02-openraft-inmemory').glob('*-*/cluster-evidence.json'))
          assert len(paths) == 6, len(paths)
          for path in paths:
              value = json.load(path.open(encoding='utf-8'))
              assert value['status'] == 'EXECUTED_PASS', (str(path), value['status'])
              assert value['scope']['real_full_snapshot_rpc'] is True
              assert value['qualification'] is False
              assert value['selection_effect'] == 'NONE'
              assert value['authority_effect'] == 'NONE'
          print('all six real in-memory cluster entries passed; qualification=false selection=0 authority=NONE')
          PY

  authority-sentinel:
    needs: [validate-plan, cluster-sequential]
    if: ${{ ((github.event_name != 'pull_request' || github.head_ref != 'codex/plan-v1.3-gap-closure-v2') && (github.event_name != 'push' || github.ref != 'refs/heads/codex/plan-v1.3-gap-closure-v2')) && (always()) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Keep all authority closed
        env:
          VALIDATE_RESULT: ${{ needs.validate-plan.result }}
          CLUSTER_RESULT: ${{ needs.cluster-sequential.result }}
        run: |
          set -euo pipefail
          printf 'validate=%s\ncluster=%s\n' "$VALIDATE_RESULT" "$CLUSTER_RESULT"
          test "$VALIDATE_RESULT" = success
          test "$CLUSTER_RESULT" = success
          echo 'OpenRaft cluster evidence collected; qualification=false selection=0 authority=NONE.'
