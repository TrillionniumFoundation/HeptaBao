name: HeptaBao V2.4 regression-free provenance selector

on:
  push:
    branches:
      - ops/v24-provenance-select-r1-20260909

permissions:
  contents: write

concurrency:
  group: heptabao-v24-provenance-select-r1
  cancel-in-progress: false

env:
  EXACT_PARENT: 633848024e5315f3def23c035a1dec53f83a62b3
  OUTPUT_BRANCH: codex/openbao-replacement-v2.4-selected-provenance-20260909

jobs:
  select:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout exact staging head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Prepare exact toolchain and repository refs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXACT_PARENT"
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
          git fetch --no-tags --prune origin '+refs/heads/*:refs/remotes/origin/*'
          git config user.name 'HeptaBao V2.4 Provenance Selector'
          git config user.email '102159240+ProfHepta@users.noreply.github.com'
          mkdir -p "$RUNNER_TEMP/heptabao-v24-select"

      - name: Build feature candidate index
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import os,re,subprocess,json
          current=os.environ['EXACT_PARENT']
          features={
            'identity-auth-mfa': r'(identity|mfa|external[-_]?auth|oidc|jwt|ldap|kubernetes)',
            'migration-recovery': r'(migration|import|export|cutover|rollback|recovery)',
            'raft-service-ha': r'(service[-_]?ha|(^|[-_/])ha([-_/]|$)|raft|cluster|leader|quorum)',
            'plugin-dynamic-secrets': r'(plugin|dynamic[-_]?secret|lease)',
            'compatibility-clients': r'(compat|openbao|client|terraform|wire)',
            'operator-surface': r'(operator|maintenance|backup|restore|rekey|seal)',
          }
          prefixes=('crates/','tests/','qa/','scripts/','docs/modules/','docs/architecture/','docs/operations/')
          suffixes=('.rs','.toml','.py','.json','.yaml','.yml','.md','.txt')
          denied=('materializ','transport','relay','authority','approval','/payload/')
          def run(*args,check=True,text=True): return subprocess.run(args,capture_output=True,text=text,check=check)
          refs=[]
          raw=run('git','for-each-ref','--format=%(refname)\t%(objectname)\t%(committerdate:unix)','refs/remotes/origin/').stdout.splitlines()
          for line in raw:
            ref,sha,stamp=line.split('\t')
            if ref.endswith('/HEAD') or sha==current: continue
            refs.append({'ref':ref,'sha':sha,'stamp':int(stamp)})
          index={}
          for feature,pattern in features.items():
            rex=re.compile(pattern,re.I)
            feature_refs=[r for r in refs if rex.search(r['ref'])]
            feature_refs.sort(key=lambda r:r['stamp'],reverse=True)
            choices={}
            for item in feature_refs:
              basep=run('git','merge-base',current,item['sha'],check=False)
              if basep.returncode: continue
              base=basep.stdout.strip()
              changed=run('git','diff','--name-only','--diff-filter=AM',f'{base}..{item["sha"]}').stdout.splitlines()
              for path in changed:
                low=path.lower()
                if not path.startswith(prefixes) or not low.endswith(suffixes): continue
                if not rex.search(low): continue
                if any(d in f'/{low}' for d in denied): continue
                choices.setdefault(path,{'ref':item['ref'],'sha':item['sha'],'base':base,'stamp':item['stamp']})
            index[feature]=choices
          out=Path(os.environ['RUNNER_TEMP'])/'heptabao-v24-select'/'feature-index.json'
          out.write_text(json.dumps(index,indent=2,sort_keys=True))
          print({k:len(v) for k,v in index.items()})
          PY

      - name: Select regression-free feature groups
        shell: bash
        run: |
          set -euo pipefail
          index="$RUNNER_TEMP/heptabao-v24-select/feature-index.json"
          accepted="$RUNNER_TEMP/heptabao-v24-select/accepted.txt"
          rejected="$RUNNER_TEMP/heptabao-v24-select/rejected.txt"
          : > "$accepted"
          : > "$rejected"
          for feature in identity-auth-mfa migration-recovery raft-service-ha plugin-dynamic-secrets compatibility-clients operator-surface identity-auth-mfa migration-recovery raft-service-ha; do
            count="$(python - "$index" "$feature" <<'PY'
          import json,sys
          print(len(json.load(open(sys.argv[1])).get(sys.argv[2],{})))
          PY
          )"
            if [ "$count" -eq 0 ]; then
              printf '%s\tno-candidates\n' "$feature" >> "$rejected"
              continue
            fi
            before="$(git rev-parse HEAD)"
            FEATURE="$feature" INDEX="$index" python - <<'PY'
          from pathlib import Path
          import json,os,subprocess,tempfile
          current=os.environ['EXACT_PARENT']; feature=os.environ['FEATURE']
          choices=json.load(open(os.environ['INDEX'])).get(feature,{})
          def run(*args,text=True,check=True): return subprocess.run(args,capture_output=True,text=text,check=check)
          def blob(commit,path):
            p=run('git','rev-parse',f'{commit}:{path}',check=False)
            return p.stdout.strip() if p.returncode==0 else None
          def content(commit,path):
            p=run('git','show',f'{commit}:{path}',text=False,check=False)
            return p.stdout if p.returncode==0 else None
          changed=[]; conflicts=[]
          for path,choice in sorted(choices.items()):
            src=content(choice['sha'],path)
            if src is None or b'\x00' in src: continue
            cur_blob=blob(current,path); base_blob=blob(choice['base'],path)
            target=Path(path); target.parent.mkdir(parents=True,exist_ok=True)
            if cur_blob is None or cur_blob==base_blob:
              target.write_bytes(src); changed.append(path); continue
            cur=content(current,path); anc=content(choice['base'],path)
            if cur is None or anc is None or b'\x00' in cur or b'\x00' in anc: continue
            with tempfile.TemporaryDirectory() as td:
              td=Path(td); a=td/'cur'; b=td/'base'; c=td/'src'
              a.write_bytes(cur); b.write_bytes(anc); c.write_bytes(src)
              p=run('git','merge-file','-p',str(a),str(b),str(c),text=False,check=False)
              if p.returncode==0 and p.stdout!=cur and b'<<<<<<<' not in p.stdout:
                target.write_bytes(p.stdout); changed.append(path)
              elif p.returncode!=0: conflicts.append(path)
          evidence=Path(os.environ['RUNNER_TEMP'])/'heptabao-v24-select'
          (evidence/f'{feature}-applied.txt').write_text('\n'.join(changed)+'\n')
          (evidence/f'{feature}-conflicts.txt').write_text('\n'.join(conflicts)+'\n')
          if not changed: raise SystemExit(3)
          PY
            apply_rc=$?
            if [ "$apply_rc" -ne 0 ]; then
              git reset --hard "$before"
              git clean -fd
              printf '%s\tno-applicable-change\n' "$feature" >> "$rejected"
              continue
            fi
            set +e
            cargo +1.98.0 generate-lockfile > "$RUNNER_TEMP/heptabao-v24-select/${feature}-lock.log" 2>&1 && \
            cargo +1.98.0 fmt --all > "$RUNNER_TEMP/heptabao-v24-select/${feature}-fmt.log" 2>&1 && \
            timeout --signal=TERM --kill-after=20s 900s cargo +1.98.0 check --workspace --all-targets --locked > "$RUNNER_TEMP/heptabao-v24-select/${feature}-check.log" 2>&1 && \
            python scripts/validate_repository_v2.py > "$RUNNER_TEMP/heptabao-v24-select/${feature}-repository.log" 2>&1 && \
            python scripts/validate_compatibility_corpus.py > "$RUNNER_TEMP/heptabao-v24-select/${feature}-compatibility.log" 2>&1
            gate_rc=$?
            set -e
            if [ "$gate_rc" -ne 0 ]; then
              git reset --hard "$before"
              git clean -fd
              printf '%s\tgate-%s\n' "$feature" "$gate_rc" >> "$rejected"
              continue
            fi
            git add -A
            if git diff --cached --quiet; then
              git reset --hard "$before"
              printf '%s\tno-diff\n' "$feature" >> "$rejected"
              continue
            fi
            git commit -m "feat(v2.4): select regression-free ${feature} provenance"
            printf '%s\t%s\n' "$feature" "$(git rev-parse HEAD)" >> "$accepted"
          done
          test -s "$accepted"

      - name: Normalize module inventory
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.98.0 metadata --no-deps --format-version 1 > /tmp/metadata.json
          python - <<'PY'
          from pathlib import Path
          import json,re
          metadata=json.loads(Path('/tmp/metadata.json').read_text())
          workspace=set(metadata['workspace_members'])
          packages=sorted((p for p in metadata['packages'] if p['id'] in workspace),key=lambda p:p['name'])
          names=[p['name'] for p in packages]; count=len(names)
          docs=Path('docs/modules'); docs.mkdir(parents=True,exist_ok=True)
          sections=['Purpose and boundaries','Public API and ownership','State and data model','Invariants and authorization','Failure, retry and reconciliation','Concurrency model','Security considerations','Persistence and compatibility','Observability','Operations','Tests and evidence','Evolution and open boundaries']
          for p in packages:
            guide=docs/f"{p['name']}.md"
            if guide.exists(): continue
            rel=Path(p['manifest_path']).parent.relative_to(Path.cwd())
            lines=[f"# {p['name']}",'',f"Package: `{p['name']}`",'',f"Source: `{rel}`",'']
            for section in sections: lines += [f"## {section}",'','Only implemented and tested behavior is owned here; compatibility, migration, production and independent-admission authority remain fail-closed.','']
            guide.write_text('\n'.join(lines),encoding='utf-8')
          for filename in ('README.md','docs/CURRENT_DOCUMENTATION.md','docs/modules/README.md'):
            path=Path(filename)
            if not path.exists(): continue
            text=path.read_text(encoding='utf-8')
            text=re.sub(r'current workspace contains \*\*\d+ packages\*\*',f'current workspace contains **{count} packages**',text,flags=re.I)
            text=re.sub(r'workspace contains \*\*\d+ packages\*\*',f'workspace contains **{count} packages**',text,flags=re.I)
            path.write_text(text,encoding='utf-8')
          index=Path('docs/modules/README.md'); text=index.read_text(encoding='utf-8') if index.exists() else '# Module guides\n'
          missing=[n for n in names if f'`{n}`' not in text and f'/{n}.md' not in text]
          if missing:
            index.write_text(text+'\n## V2.4 selected provenance modules\n\n'+'\n'.join(f'- [`{n}`](./{n}.md)' for n in missing)+'\n',encoding='utf-8')
          PY
          cargo +1.98.0 generate-lockfile
          cargo +1.98.0 fmt --all
          git add -A
          if ! git diff --cached --quiet; then git commit -m 'docs(v2.4): synchronize selected workspace module inventory'; fi

      - name: Remove selector and run final gates
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/v24-provenance-selection-materializer.yml
          out="$RUNNER_TEMP/heptabao-v24-select"
          python scripts/validate_repository_v2.py 2>&1 | tee "$out/final-repository-validator.log"
          python scripts/validate_compatibility_corpus.py 2>&1 | tee "$out/final-compatibility-validator.log"
          python -m unittest discover -s tests/repository -p 'test_*.py' 2>&1 | tee "$out/final-repository-tests.log"
          cargo +1.98.0 fmt --all -- --check 2>&1 | tee "$out/final-fmt.log"
          timeout --signal=TERM --kill-after=30s 3600s cargo +1.98.0 test --workspace --all-targets --locked 2>&1 | tee "$out/final-workspace-tests.log"
          cargo +1.98.0 clippy --workspace --all-targets --locked -- -D warnings 2>&1 | tee "$out/final-clippy.log"
          cargo +1.98.0 doc --workspace --no-deps --locked 2>&1 | tee "$out/final-rustdoc.log"
          cargo +1.98.0 build --locked -p heptabao-server 2>&1 | tee "$out/final-server-build.log"

      - name: Publish source-only selected candidate
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .github/workflows/v24-provenance-selection-materializer.yml
          git add -A
          git commit -m 'ci(v2.4): remove provenance selector before review'
          git push --force-with-lease="refs/heads/$OUTPUT_BRANCH:" origin "HEAD:refs/heads/$OUTPUT_BRANCH"

      - name: Upload bounded selection evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: heptabao-v24-regression-free-provenance
          path: ${{ runner.temp }}/heptabao-v24-select/
          if-no-files-found: warn
          retention-days: 3
