name: HeptaBao V2.4 final clean qualifier

on:
  push:
    branches:
      - ops/v24-final-clean-qualifier-r1-20260909

permissions:
  contents: write

concurrency:
  group: heptabao-v24-final-clean-qualifier-r1
  cancel-in-progress: false

env:
  EXACT_PARENT: 633848024e5315f3def23c035a1dec53f83a62b3
  INPUT_BRANCH: codex/openbao-replacement-v2.4-clean-candidate-20260909
  OUTPUT_BRANCH: codex/openbao-replacement-v2.4-final-clean-candidate-20260909

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Checkout qualifier controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Wait for exact clean single-commit candidate
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/heptabao-v24-final-clean"
          mkdir -p "$out"
          deadline=$((SECONDS + 10800))
          while [ "$SECONDS" -lt "$deadline" ]; do
            git fetch --no-tags origin "+refs/heads/$INPUT_BRANCH:refs/remotes/origin/$INPUT_BRANCH" || true
            if git show-ref --verify --quiet "refs/remotes/origin/$INPUT_BRANCH"; then
              candidate="$(git rev-parse "refs/remotes/origin/$INPUT_BRANCH")"
              parent="$(git rev-parse "$candidate^")"
              parent_count="$(git show -s --format=%P "$candidate" | wc -w)"
              test "$parent_count" -eq 1
              test "$parent" = "$EXACT_PARENT"
              git merge-base --is-ancestor "$EXACT_PARENT" "$candidate"
              tree="$(git rev-parse "$candidate^{tree}")"
              printf 'candidate=%s\nparent=%s\ntree=%s\n' "$candidate" "$parent" "$tree" > "$out/input-binding.txt"
              printf 'CANDIDATE_SHA=%s\nCANDIDATE_TREE=%s\n' "$candidate" "$tree" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 30
          done
          echo 'clean candidate did not materialize before timeout' >&2
          exit 1

      - name: Reject write transports and staging payloads from candidate tree
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/heptabao-v24-final-clean"
          git ls-tree -r --name-only "$CANDIDATE_SHA" > "$out/tree-paths.txt"
          if grep -E '(^|/)(v24-.*(materializer|orchestrator|republisher|qualifier|opener|cleanup)\.ya?ml|payload/|part-[0-9]+$)' "$out/tree-paths.txt"; then
            echo 'candidate tree contains a write transport or staged payload' >&2
            exit 1
          fi
          for path in \
            .github/workflows/v24-plugin-toctou-materializer.yml \
            .github/workflows/v24-migration-journal-materializer.yml \
            .github/workflows/v24-federated-auth-materializer.yml \
            .github/workflows/v24-ha-service-materializer.yml \
            .github/workflows/v24-compat-capture-materializer.yml \
            .github/workflows/v24-source-convergence.yml \
            .github/workflows/v24-source-convergence-r2.yml \
            .github/workflows/v24-clean-republisher.yml; do
            if git cat-file -e "$CANDIDATE_SHA:$path" 2>/dev/null; then
              echo "candidate tree contains forbidden controller: $path" >&2
              exit 1
            fi
          done

      - name: Install exact Rust toolchain
        shell: bash
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy

      - name: Qualify immutable exact candidate
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/heptabao-v24-final-clean/exact"
          mkdir -p "$out"
          work="$RUNNER_TEMP/heptabao-v24-final-clean-exact"
          git worktree add --detach "$work" "$CANDIDATE_SHA"
          (
            cd "$work"
            test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
            test "$(git rev-parse 'HEAD^{tree}')" = "$CANDIDATE_TREE"
            python scripts/validate_repository_v2.py 2>&1 | tee "$out/repository-validator.log"
            python scripts/validate_compatibility_corpus.py 2>&1 | tee "$out/compatibility-validator.log"
            python -m unittest discover -s tests/repository -p 'test_*.py' 2>&1 | tee "$out/repository-tests.log"
            cargo +1.98.0 fmt --all -- --check 2>&1 | tee "$out/fmt.log"
            timeout --signal=TERM --kill-after=30s 5400s cargo +1.98.0 test --workspace --all-targets --locked 2>&1 | tee "$out/workspace-tests.log"
            cargo +1.98.0 clippy --workspace --all-targets --locked -- -D warnings 2>&1 | tee "$out/clippy.log"
            cargo +1.98.0 doc --workspace --no-deps --locked 2>&1 | tee "$out/rustdoc.log"
            cargo +1.98.0 build --locked -p heptabao-server 2>&1 | tee "$out/server-build.log"
            test -z "$(git status --porcelain=v1 --untracked-files=all)"
            cargo +1.98.0 metadata --locked --no-deps --format-version 1 > "$out/cargo-metadata.json"
            python - "$out/cargo-metadata.json" <<'PY'
          import json, sys
          metadata = json.load(open(sys.argv[1]))
          workspace = set(metadata['workspace_members'])
          packages = sorted(p['name'] for p in metadata['packages'] if p['id'] in workspace)
          assert len(packages) == 45, packages
          for required in ('heptabao-plugin-host', 'heptabao-migration', 'heptabao-identity', 'heptabao-raft-runtime', 'heptabao-server'):
              assert required in packages, required
          PY
          )
          git worktree remove --force "$work"

      - name: Construct and qualify prospective merge into current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          main_sha="$(git rev-parse refs/remotes/origin/main)"
          out="$RUNNER_TEMP/heptabao-v24-final-clean/prospective-merge"
          mkdir -p "$out"
          work="$RUNNER_TEMP/heptabao-v24-final-clean-prospective"
          git worktree add --detach "$work" "$main_sha"
          (
            cd "$work"
            git config user.name 'HeptaBao V2.4 Prospective Merge'
            git config user.email '102159240+ProfHepta@users.noreply.github.com'
            git merge --no-ff --no-edit "$CANDIDATE_SHA" 2>&1 | tee "$out/merge.log"
            merge_sha="$(git rev-parse HEAD)"
            python scripts/validate_repository_v2.py 2>&1 | tee "$out/repository-validator.log"
            python scripts/validate_compatibility_corpus.py 2>&1 | tee "$out/compatibility-validator.log"
            python -m unittest discover -s tests/repository -p 'test_*.py' 2>&1 | tee "$out/repository-tests.log"
            cargo +1.98.0 fmt --all -- --check 2>&1 | tee "$out/fmt.log"
            timeout --signal=TERM --kill-after=30s 5400s cargo +1.98.0 test --workspace --all-targets --locked 2>&1 | tee "$out/workspace-tests.log"
            cargo +1.98.0 clippy --workspace --all-targets --locked -- -D warnings 2>&1 | tee "$out/clippy.log"
            cargo +1.98.0 doc --workspace --no-deps --locked 2>&1 | tee "$out/rustdoc.log"
            cargo +1.98.0 build --locked -p heptabao-server 2>&1 | tee "$out/server-build.log"
            printf 'main=%s\ncandidate=%s\nprospective_merge=%s\ntree=%s\n' \
              "$main_sha" "$CANDIDATE_SHA" "$merge_sha" "$(git rev-parse 'HEAD^{tree}')" \
              > "$out/source-binding.txt"
          )
          git worktree remove --force "$work"

      - name: Publish final clean candidate only after both qualifications
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code origin "refs/heads/$OUTPUT_BRANCH" >/dev/null 2>&1; then
            existing="$(git ls-remote origin "refs/heads/$OUTPUT_BRANCH" | cut -f1)"
            test "$existing" = "$CANDIDATE_SHA"
            echo 'final clean candidate already binds the qualified SHA'
          else
            git push --force-with-lease="refs/heads/$OUTPUT_BRANCH:" origin "$CANDIDATE_SHA:refs/heads/$OUTPUT_BRANCH"
          fi

      - name: Upload bounded final-clean evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: heptabao-v24-final-clean-qualification
          path: ${{ runner.temp }}/heptabao-v24-final-clean/
          if-no-files-found: warn
          retention-days: 14
