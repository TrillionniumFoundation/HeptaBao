name: PR88 explicit rustls verifier provider materializer

on:
  push:
    branches:
      - ops/pr88-rustls-verifier-provider-20260911-gpt56

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]' && github.actor != 'actions'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true
      - name: Install Rust 1.98
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
      - name: Bind client verifier to explicit ring provider
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('crates/heptabao-server/src/ha.rs')
          text = p.read_text()
          old = '''    let verifier = WebPkiClientVerifier::builder(Arc::new(root_store(&ca)?))\n        .build()\n'''
          new = '''    let verifier = WebPkiClientVerifier::builder_with_provider(\n        Arc::new(root_store(&ca)?),\n        Arc::new(rustls::crypto::ring::default_provider()),\n    )\n        .build()\n'''
          if text.count(old) != 1:
              raise SystemExit('verifier provider patch target mismatch')
          p.write_text(text.replace(old, new, 1))
          PY
          cargo +1.98.0 fmt --all
          git diff --check
      - name: Validate targeted HA slice
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.98.0 test --locked -p heptabao-server -p heptabao-raft-runtime --all-targets
          cargo +1.98.0 clippy --locked -p heptabao-server -p heptabao-raft-runtime --all-targets -- -D warnings
      - name: Publish source-only descendant
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/pr88-rustls-verifier-materializer.yml
          git diff --check
          paths="$(git diff --name-only | sort | tr '\n' ' ')"
          test "$paths" = ".github/workflows/pr88-rustls-verifier-materializer.yml crates/heptabao-server/src/ha.rs "
          git config user.name heptabao-materializer
          git config user.email actions@users.noreply.github.com
          git add -u
          git commit -m "fix(ha): bind mTLS verifier to explicit rustls provider"
          git push origin "HEAD:${GITHUB_REF_NAME}"
