name: HeptaBao V2.4 provenance-union materializer

on:
  push:
    branches:
      - ops/v24-provenance-union-r1-20260909

permissions:
  contents: write

concurrency:
  group: heptabao-v24-provenance-union-r1
  cancel-in-progress: false

env:
  EXACT_PARENT: 633848024e5315f3def23c035a1dec53f83a62b3
  OUTPUT_BRANCH: codex/openbao-replacement-v2.4-provenance-candidate-20260909

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout exact staging head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Discover and merge conflict-free feature provenance
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXACT_PARENT"
          git fetch --no-tags --prune origin '+refs/heads/*:refs/remotes/origin/*'
          python - <<'PY'
          from __future__ import annotations
          from dataclasses import dataclass
          from pathlib import Path
          import os
          import re
          import subprocess
          import tempfile

          current = os.environ['EXACT_PARENT']
          branch_re = re.compile(r'(identity|mfa|external[-_]?auth|migration|service[-_]?ha|(^|[-_/])ha([-_/]|$)|raft|plugin|compat|operator)', re.I)
          path_tokens = ('identity','mfa','auth','migration','ha','raft','plugin','compat','operator','lease','cluster','server')
          allowed_prefixes = ('crates/','tests/','qa/','scripts/','docs/modules/','docs/architecture/','docs/operations/')
          allowed_suffixes = ('.rs','.toml','.py','.json','.yaml','.yml','.md','.txt')
          denied_fragments = ('/.github/','/payload/','materializ','transport','relay','authority','approval')

          def run(*args: str, text: bool = True, check: bool = True):
              return subprocess.run(args, capture_output=True, text=text, check=check)

          def git_text(*args: str, check: bool = True) -> str:
              return run('git', *args, check=check).stdout.strip()

          def blob(commit: str, path: str) -> str | None:
              p = run('git','rev-parse',f'{commit}:{path}',check=False)
              return p.stdout.strip() if p.returncode == 0 else None

          def bytes_at(commit: str, path: str) -> bytes | None:
              p = run('git','show',f'{commit}:{path}',text=False,check=False)
              return p.stdout if p.returncode == 0 else None

          refs = git_text('for-each-ref','--format=%(refname)\t%(objectname)\t%(committerdate:unix)','refs/remotes/origin/').splitlines()
          candidates: list[tuple[str,str,int]] = []
          for line in refs:
              ref, sha, stamp = line.split('\t')
              if ref.endswith('/HEAD') or sha == current or not branch_re.search(ref):
                  continue
              candidates.append((ref, sha, int(stamp)))
          candidates.sort(key=lambda item: item[2], reverse=True)

          @dataclass
          class Choice:
              ref: str
              sha: str
              base: str
              stamp: int

          best: dict[str, Choice] = {}
          branch_failures: list[str] = []
          for ref, sha, stamp in candidates:
              base_p = run('git','merge-base',current,sha,check=False)
              if base_p.returncode != 0:
                  branch_failures.append(f'{ref}\tno-merge-base')
                  continue
              base = base_p.stdout.strip()
              changed = git_text('diff','--name-only','--diff-filter=AM',f'{base}..{sha}').splitlines()
              for path in changed:
                  low = path.lower()
                  if not path.startswith(allowed_prefixes):
                      continue
                  if not low.endswith(allowed_suffixes):
                      continue
                  if not any(token in low for token in path_tokens):
                      continue
                  if any(fragment in f'/{low}' for fragment in denied_fragments):
                      continue
                  best.setdefault(path, Choice(ref,sha,base,stamp))

          imported: list[str] = []
          merged: list[str] = []
          skipped_conflict: list[str] = []
          skipped_binary: list[str] = []
          provenance: list[str] = []
          for path, choice in sorted(best.items()):
              source_blob = blob(choice.sha,path)
              if source_blob is None:
                  continue
              current_blob = blob(current,path)
              base_blob = blob(choice.base,path)
              source_bytes = bytes_at(choice.sha,path)
              if source_bytes is None or b'\x00' in source_bytes:
                  skipped_binary.append(path)
                  continue
              target = Path(path)
              target.parent.mkdir(parents=True,exist_ok=True)
              if current_blob is None or current_blob == base_blob:
                  target.write_bytes(source_bytes)
                  imported.append(path)
                  provenance.append(f'{path}\timport\t{choice.ref}\t{choice.sha}\t{choice.base}')
                  continue
              current_bytes = bytes_at(current,path)
              base_bytes = bytes_at(choice.base,path)
              if current_bytes is None or base_bytes is None or b'\x00' in current_bytes or b'\x00' in base_bytes:
                  skipped_binary.append(path)
                  continue
              with tempfile.TemporaryDirectory() as td:
                  td_path = Path(td)
                  cur = td_path/'current'; anc=td_path/'base'; src=td_path/'source'
                  cur.write_bytes(current_bytes); anc.write_bytes(base_bytes); src.write_bytes(source_bytes)
                  proc = run('git','merge-file','-p',str(cur),str(anc),str(src),text=False,check=False)
                  if proc.returncode == 0 and proc.stdout != current_bytes and b'<<<<<<<' not in proc.stdout:
                      target.write_bytes(proc.stdout)
                      merged.append(path)
                      provenance.append(f'{path}\tmerge-file\t{choice.ref}\t{choice.sha}\t{choice.base}')
                  elif proc.returncode == 0:
                      continue
                  else:
                      skipped_conflict.append(f'{path}\t{choice.ref}\t{choice.sha}')

          evidence = Path('/tmp/heptabao-v24-provenance')
          evidence.mkdir(parents=True,exist_ok=True)
          (evidence/'candidate-branches.tsv').write_text('\n'.join('\t'.join(map(str,c)) for c in candidates)+'\n')
          (evidence/'provenance.tsv').write_text('\n'.join(provenance)+'\n')
          (evidence/'imported.txt').write_text('\n'.join(imported)+'\n')
          (evidence/'merged.txt').write_text('\n'.join(merged)+'\n')
          (evidence/'skipped-conflict.tsv').write_text('\n'.join(skipped_conflict)+'\n')
          (evidence/'skipped-binary.txt').write_text('\n'.join(skipped_binary)+'\n')
          (evidence/'branch-failures.tsv').write_text('\n'.join(branch_failures)+'\n')
          if not imported and not merged:
              raise SystemExit('no conflict-free feature provenance was materialized')
          print(f'branches={len(candidates)} files={len(best)} imported={len(imported)} merged={len(merged)} conflicts={len(skipped_conflict)}')
          PY

      - name: Normalize package registry and documentation
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
          cargo +1.98.0 metadata --no-deps --format-version 1 > /tmp/metadata.json
          python - <<'PY'
          from pathlib import Path
          import json,re
          metadata=json.loads(Path('/tmp/metadata.json').read_text())
          workspace=set(metadata['workspace_members'])
          packages=sorted((p for p in metadata['packages'] if p['id'] in workspace),key=lambda p:p['name'])
          names=[p['name'] for p in packages]
          docs=Path('docs/modules'); docs.mkdir(parents=True,exist_ok=True)
          sections=['Purpose and boundaries','Public API and ownership','State and data model','Invariants and authorization','Failure, retry and reconciliation','Concurrency model','Security considerations','Persistence and compatibility','Observability','Operations','Tests and evidence','Evolution and open boundaries']
          for package in packages:
              guide=docs/f"{package['name']}.md"
              if guide.exists(): continue
              rel=Path(package['manifest_path']).parent.relative_to(Path.cwd())
              body=[f"# {package['name']}",'',f"Package: `{package['name']}`",'',f"Source: `{rel}`",'']
              for section in sections:
                  body += [f"## {section}",'','This package owns only behavior implemented and tested in this source tree. Compatibility, migration, production and independent-admission authority are not implied.','']
              guide.write_text('\n'.join(body),encoding='utf-8')
          count=len(names)
          for filename in ('README.md','docs/CURRENT_DOCUMENTATION.md','docs/modules/README.md'):
              path=Path(filename)
              if not path.exists(): continue
              text=path.read_text(encoding='utf-8')
              text=re.sub(r'current workspace contains \*\*\d+ packages\*\*',f'current workspace contains **{count} packages**',text,flags=re.I)
              text=re.sub(r'workspace contains \*\*\d+ packages\*\*',f'workspace contains **{count} packages**',text,flags=re.I)
              text=re.sub(r'Current workspace package count:\s*\d+',f'Current workspace package count: {count}',text)
              path.write_text(text,encoding='utf-8')
          index=Path('docs/modules/README.md')
          text=index.read_text(encoding='utf-8') if index.exists() else '# Module guides\n'
          missing=[name for name in names if f'`{name}`' not in text and f'/{name}.md' not in text]
          if missing:
              text+='\n## V2.4 provenance-union modules\n\n'+'\n'.join(f'- [`{name}`](./{name}.md)' for name in missing)+'\n'
              index.write_text(text,encoding='utf-8')
          PY
          cargo +1.98.0 generate-lockfile
          cargo +1.98.0 fmt --all

      - name: Remove write transport and qualify
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/v24-provenance-union-materializer.yml
          out="$RUNNER_TEMP/heptabao-v24-provenance"
          mkdir -p "$out"
          cp -a /tmp/heptabao-v24-provenance/. "$out/"
          python scripts/validate_repository_v2.py 2>&1 | tee "$out/repository-validator.log"
          python scripts/validate_compatibility_corpus.py 2>&1 | tee "$out/compatibility-validator.log"
          python -m unittest discover -s tests/repository -p 'test_*.py' 2>&1 | tee "$out/repository-tests.log"
          cargo +1.98.0 fmt --all -- --check 2>&1 | tee "$out/fmt.log"
          timeout --signal=TERM --kill-after=30s 3600s cargo +1.98.0 test --workspace --all-targets --locked 2>&1 | tee "$out/workspace-tests.log"
          cargo +1.98.0 clippy --workspace --all-targets --locked -- -D warnings 2>&1 | tee "$out/clippy.log"
          cargo +1.98.0 doc --workspace --no-deps --locked 2>&1 | tee "$out/rustdoc.log"
          cargo +1.98.0 build --locked -p heptabao-server 2>&1 | tee "$out/server-build.log"

      - name: Publish deterministic candidate
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .github/workflows/v24-provenance-union-materializer.yml
          git config user.name 'HeptaBao V2.4 Provenance Materializer'
          git config user.email '102159240+ProfHepta@users.noreply.github.com'
          git add -A
          test -n "$(git diff --cached --name-only)"
          git commit -m 'feat(v2.4): integrate conflict-free HA identity migration provenance'
          git push --force-with-lease="refs/heads/$OUTPUT_BRANCH:" origin "HEAD:refs/heads/$OUTPUT_BRANCH"

      - name: Upload bounded evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: heptabao-v24-provenance-union
          path: ${{ runner.temp }}/heptabao-v24-provenance/
          if-no-files-found: warn
          retention-days: 3
