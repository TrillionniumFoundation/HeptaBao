name: h02-seeded-behavior-harness

on:
  push:
    branches: ["codex/h02-seeded-behavior-harnesses"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: h02-seeded-behavior-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-harness:
    if: ${{ (github.event_name != 'pull_request' || github.head_ref != 'codex/plan-v1.3-gap-closure-v2') && (github.event_name != 'push' || github.ref != 'refs/heads/codex/plan-v1.3-gap-closure-v2') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact source binding
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected"
          git diff --quiet
          git diff --cached --quiet

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-plan.txt

      - name: Install pinned validation dependencies
        run: python -m pip install --disable-pip-version-check --requirement requirements-plan.txt

      - name: Validate plan, schemas and fail-closed authority
        run: python scripts/validate_h02_seeded_behavior_plan_v1.py

      - name: Execute semantic and negative tests
        run: python -m unittest tests/platform/test_h02_seeded_behavior_harness_v1.py -v

  reference-model:
    if: ${{ (github.event_name != 'pull_request' || github.head_ref != 'codex/plan-v1.3-gap-closure-v2') && (github.event_name != 'push' || github.ref != 'refs/heads/codex/plan-v1.3-gap-closure-v2') }}
    needs: validate-harness
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        domain: [runtime, tls, raft]
        seed:
          - "0x5eed20260828cafe"
          - "0x8badf00d12345678"
          - "0xd15ea5e5cafef00d"
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact source binding
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected"
          git diff --quiet
          git diff --cached --quiet

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Execute deterministic reference model
        shell: bash
        env:
          DOMAIN: ${{ matrix.domain }}
          SEED: ${{ matrix.seed }}
        run: |
          set -euo pipefail
          source_sha="$(git rev-parse HEAD)"
          tree_sha="$(git rev-parse 'HEAD^{tree}')"
          branch="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
          environment_id="github-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${RUNNER_NAME}-${DOMAIN}-${SEED}"
          mkdir -p evidence
          python scripts/h02_seeded_behavior_harness_v1.py run \
            --domain "$DOMAIN" \
            --seed "$SEED" \
            --source-commit "$source_sha" \
            --source-tree "$tree_sha" \
            --branch "$branch" \
            --environment-id "$environment_id" \
            --executor-kind github-hosted \
            --runner-id "github-api-enrichment-pending" \
            --runner-name "$RUNNER_NAME" \
            --output-dir evidence
          evidence_path="$(find evidence -maxdepth 1 -name "${DOMAIN}-*.json" -print -quit)"
          test -n "$evidence_path"
          python scripts/h02_seeded_behavior_harness_v1.py replay --evidence "$evidence_path"
          python - "$evidence_path" <<'PY'
          import json, sys
          value = json.load(open(sys.argv[1], encoding="utf-8"))
          assert value["status"] == "EXECUTED_PASS"
          assert value["environment"]["attested"] is False
          assert value["candidate"]["bound"] is False
          assert value["qualification"] is False
          assert value["selection_effect"] == "NONE"
          assert value["authority_effect"] == "NONE"
          print("reference model passed; attested=false; authority=NONE")
          PY

      - name: Upload unreviewed reference evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: h02-reference-${{ matrix.domain }}-${{ matrix.seed }}
          path: evidence/
          if-no-files-found: error
          retention-days: 30

  authority-sentinel:
    needs: [validate-harness, reference-model]
    if: ${{ ((github.event_name != 'pull_request' || github.head_ref != 'codex/plan-v1.3-gap-closure-v2') && (github.event_name != 'push' || github.ref != 'refs/heads/codex/plan-v1.3-gap-closure-v2')) && (always()) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Classify aggregate result without granting authority
        shell: bash
        env:
          VALIDATE_RESULT: ${{ needs.validate-harness.result }}
          MODEL_RESULT: ${{ needs.reference-model.result }}
        run: |
          set -euo pipefail
          printf 'validate=%s\nmodel=%s\n' "$VALIDATE_RESULT" "$MODEL_RESULT"
          test "$VALIDATE_RESULT" = success
          test "$MODEL_RESULT" = success
          echo "H02 reference models executed; candidate adapters, qualification, selection and authority remain absent."
