    path: PathBuf,
    _file: File,
}

impl Drop for WriterLock {
    fn drop(&mut self) {
        let _ = fs::remove_file(&self.path);
    }
}

pub struct PersistentReplayLedger {
'''
          if marker not in text:
              raise SystemExit('PersistentReplayLedger marker missing')
          text=text.replace(marker,insertion,1)
          text=text.replace('    _lock: File,\n','    _lock: WriterLock,\n',1)
          text=text.replace(
              'fn create_lock(path: &Path) -> Result<File, AuthError> {',
              'fn create_lock(path: &Path) -> Result<WriterLock, AuthError> {',
              1,
          )
          old='''    Ok(file)
}

fn open_ledger(path: &Path) -> Result<File, AuthError> {
    let mut options = OpenOptions::new();
    options.read(true).write(true).create(true);
    #[cfg(unix)]
    {
        use std::os::unix::fs::OpenOptionsExt;
        options.mode(0o600);
    }
    options.open(path).map_err(|_| AuthError::Io)
}
