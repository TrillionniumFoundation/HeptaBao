            git commit -m 'fix(auth): harden replay ledger lock and file admission'
            new_sha="$(git rev-parse HEAD)"
            if git ls-remote --exit-code origin "refs/heads/$OUTPUT_BRANCH" >/dev/null 2>&1; then
