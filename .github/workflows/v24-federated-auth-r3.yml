          new='''    Ok(WriterLock {
        path: path.to_path_buf(),
        _file: file,
    })
}

fn open_ledger(path: &Path) -> Result<File, AuthError> {
    if path.exists() {
        let metadata = fs::symlink_metadata(path).map_err(|_| AuthError::Io)?;
        if metadata.file_type().is_symlink() || !metadata.is_file() {
            return Err(AuthError::InvalidRoot);
        }
        #[cfg(unix)]
        {
            use std::os::unix::fs::PermissionsExt;
            if metadata.permissions().mode() & 0o077 != 0 {
                return Err(AuthError::InvalidRoot);
            }
        }
    }
    let mut options = OpenOptions::new();
    options.read(true).write(true).create(true);
    #[cfg(unix)]
    {
        use std::os::unix::fs::OpenOptionsExt;
        options.mode(0o600);
    }
    #[cfg(target_os = "linux")]
    {
        use std::os::unix::fs::OpenOptionsExt;
        options.custom_flags(0o400000 | 0o2000000);
    }
    options.open(path).map_err(|_| AuthError::Io)
}
