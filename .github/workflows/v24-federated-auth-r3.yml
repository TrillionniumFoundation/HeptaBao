name: HeptaBao V2.4 federated auth source repair r3

on:
  push:
    branches:
      - ops/v24-federated-auth-r3-20260909

permissions:
  contents: write

concurrency:
  group: heptabao-v24-federated-auth-r3
  cancel-in-progress: false

env:
  EXACT_PARENT: 633848024e5315f3def23c035a1dec53f83a62b3
  INPUT_BRANCH: codex/openbao-replacement-v2.4-federated-auth-source-20260909
  OUTPUT_BRANCH: codex/openbao-replacement-v2.4-federated-auth-source-r3-20260909

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout repair controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Wait for package-qualified r2 source
        shell: bash
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 5400))
          while [ "$SECONDS" -lt "$deadline" ]; do
            git fetch --no-tags origin "+refs/heads/$INPUT_BRANCH:refs/remotes/origin/$INPUT_BRANCH" || true
            if git show-ref --verify --quiet "refs/remotes/origin/$INPUT_BRANCH"; then
              source_sha="$(git rev-parse "refs/remotes/origin/$INPUT_BRANCH")"
              git merge-base --is-ancestor "$EXACT_PARENT" "$source_sha"
              printf 'SOURCE_SHA=%s\n' "$source_sha" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 30
          done
          echo 'federated-auth r2 source did not materialize' >&2
          exit 1

      - name: Harden replay ledger in isolated source worktree
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
          work="$RUNNER_TEMP/heptabao-fed-auth-r3"
          git worktree add --detach "$work" "$SOURCE_SHA"
          (
            cd "$work"
            python - <<'PY'
          from pathlib import Path

          path=Path('crates/heptabao-federated-auth/src/lib.rs')
          text=path.read_text(encoding='utf-8')
          marker='''pub struct PersistentReplayLedger {
'''
          insertion='''#[derive(Debug)]
