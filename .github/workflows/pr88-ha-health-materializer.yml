name: PR88 HA health and rustfmt materializer

on:
  push:
    branches:
      - ops/pr88-health-format-materializer-20260911-gpt56

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]' && github.actor != 'actions'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout exact materializer head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - name: Install Rust 1.98
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy

      - name: Apply fail-closed HA health semantics
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one exact match, found {count}')
              return text.replace(old, new, 1)

          path = Path('crates/heptabao-server/src/service.rs')
          text = path.read_text(encoding='utf-8')

          text = replace_once(
              text,
              '            let (ha_enabled, standby, _, _) = self.ha_observation();\n',
              '            let (ha_enabled, standby, ha_active, _, _) = self.ha_observation();\n',
              'health observation binding',
          )
          text = replace_once(
              text,
              '''            let status = if !initialized {\n                501\n            } else if sealed || self.recovery_required {\n                503\n            } else if ha_enabled && standby {\n                429\n            } else {\n                200\n            };\n''',
              '''            let status = health_status(\n                initialized,\n                sealed,\n                self.recovery_required,\n                ha_enabled,\n                standby,\n                ha_active,\n            );\n''',
              'health status classifier',
          )
          text = replace_once(
              text,
              '"ha_enabled":ha_enabled,"recovery_required":self.recovery_required',
              '"ha_enabled":ha_enabled,"ha_active":ha_active,"recovery_required":self.recovery_required',
              'health body authority field',
          )
          text = replace_once(
              text,
              '''    fn ha_observation(&self) -> (bool, bool, Option<u64>, Option<u64>) {\n        let Some(ha) = self.ha.as_ref() else {\n            return (false, false, None, None);\n        };\n        let Ok(ha) = ha.lock() else {\n            return (true, true, None, None);\n        };\n        let local = ha.local_id().ok();\n        let leader = ha.leader().ok().flatten();\n        (true, leader.is_some() && leader != local, leader, local)\n    }\n''',
              '''    fn ha_observation(&self) -> (bool, bool, bool, Option<u64>, Option<u64>) {\n        let Some(ha) = self.ha.as_ref() else {\n            return (false, false, true, None, None);\n        };\n        let Ok(ha) = ha.lock() else {\n            return (true, false, false, None, None);\n        };\n        let local = match ha.local_id() {\n            Ok(local) => Some(local),\n            Err(_) => return (true, false, false, None, None),\n        };\n        let leader = match ha.leader() {\n            Ok(leader) => leader,\n            Err(_) => return (true, false, false, None, local),\n        };\n        let standby = leader.is_some() && leader != local;\n        let active = leader.is_some()\n            && leader == local\n            && ha.ensure_linearizable().is_ok();\n        (true, standby, active, leader, local)\n    }\n''',
              'HA observation implementation',
          )
          text = replace_once(
              text,
              '        let (ha_enabled, _, leader, local) = self.ha_observation();\n',
              '        let (ha_enabled, _, ha_active, leader, local) = self.ha_observation();\n',
              'leader observation binding',
          )
          text = replace_once(
              text,
              '            "is_self": leader.is_some() && leader == local,\n',
              '            "is_self": ha_active && leader.is_some() && leader == local,\n',
              'leader response authority binding',
          )

          insertion = '''\nfn health_status(\n    initialized: bool,\n    sealed: bool,\n    recovery_required: bool,\n    ha_enabled: bool,\n    standby: bool,\n    ha_active: bool,\n) -> u16 {\n    if !initialized {\n        501\n    } else if sealed || recovery_required {\n        503\n    } else if ha_enabled && standby {\n        429\n    } else if ha_enabled && !ha_active {\n        503\n    } else {\n        200\n    }\n}\n\n'''
          text = replace_once(
              text,
              '}\n\nfn seal_associated_data(\n',
              '}' + insertion + 'fn seal_associated_data(\n',
              'health classifier insertion',
          )

          tests = '''\n#[cfg(test)]\nmod ha_health_status_tests {\n    use super::health_status;\n\n    #[test]\n    fn health_never_reports_active_without_current_linearizable_authority() {\n        assert_eq!(health_status(true, false, false, false, false, true), 200);\n        assert_eq!(health_status(true, false, false, true, false, true), 200);\n        assert_eq!(health_status(true, false, false, true, true, false), 429);\n        assert_eq!(health_status(true, false, false, true, false, false), 503);\n        assert_eq!(health_status(true, true, false, true, false, true), 503);\n        assert_eq!(health_status(true, false, true, true, false, true), 503);\n        assert_eq!(health_status(false, false, false, true, false, false), 501);\n    }\n}\n\n'''
          text = replace_once(
              text,
              '#[cfg(test)]\n#[path = "service_tests.rs"]\nmod tests;\n',
              tests + '#[cfg(test)]\n#[path = "service_tests.rs"]\nmod tests;\n',
              'HA health regression tests',
          )
          path.write_text(text, encoding='utf-8')

          ha_path = Path('crates/heptabao-server/src/ha.rs')
          ha = ha_path.read_text(encoding='utf-8')
          ha = replace_once(
              ha,
              '    CommitReceipt, ProcessRaftNode, RaftPeerRpc, RaftRpcKind, RaftRpcService, RemoteNetworkFactory,\n',
              '    CommitReceipt, ProcessRaftNode, RaftPeerRpc, RaftRpcKind, RemoteNetworkFactory,\n',
              'unused raft service import',
          )
          ha = replace_once(
              ha,
              'const REPLICATION_KEY_BYTES: usize = 32;\n',
              'const REPLICATION_KEY_BYTES: usize = 32;\n\ntype MutualTlsConfigs = (Arc<ClientConfig>, Arc<ServerConfig>, [u8; 32]);\n',
              'mutual TLS alias insertion',
          )
          ha = replace_once(
              ha,
              ') -> Result<(Arc<ClientConfig>, Arc<ServerConfig>, [u8; 32]), String> {\n',
              ') -> Result<MutualTlsConfigs, String> {\n',
              'mutual TLS return type',
          )
          ha_path.write_text(ha, encoding='utf-8')
          PY

      - name: Format and validate bounded HA slice
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.98.0 fmt --all
          git diff --check
          cargo +1.98.0 test --locked -p heptabao-server -p heptabao-raft-runtime --all-targets
          cargo +1.98.0 clippy --locked -p heptabao-server -p heptabao-raft-runtime --all-targets -- -D warnings

      - name: Publish exact repaired descendant
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/pr88-ha-health-materializer.yml
          git diff --check
          while IFS= read -r changed; do
            case "$changed" in
              .github/workflows/pr88-ha-health-materializer.yml|crates/heptabao-server/src/*.rs|crates/heptabao-raft-runtime/src/process/node.rs) ;;
              *) echo "unexpected materialized path: $changed" >&2; exit 1 ;;
            esac
          done < <(git diff --name-only)
          git config user.name heptabao-materializer
          git config user.email actions@users.noreply.github.com
          git add -u
          git commit -m "fix(ha): fail closed health without linearizable authority"
          git push origin "HEAD:${GITHUB_REF_NAME}"
