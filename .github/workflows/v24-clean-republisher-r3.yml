name: HeptaBao V2.4 full hardened clean republisher r3

on:
  push:
    branches:
      - ops/v24-clean-republisher-r3-20260909

permissions:
  contents: write

concurrency:
  group: heptabao-v24-clean-republisher-r3
  cancel-in-progress: false

env:
  EXACT_PARENT: 633848024e5315f3def23c035a1dec53f83a62b3
  INPUT_BRANCH: codex/openbao-replacement-v2.4-converged-candidate-r4-20260909
  OUTPUT_BRANCH: codex/openbao-replacement-v2.4-clean-candidate-r4-20260909

jobs:
  republish:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Checkout republisher controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Wait for full hardened converged source
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/heptabao-v24-clean-r4"
          mkdir -p "$out"
          deadline=$((SECONDS + 16200))
          while [ "$SECONDS" -lt "$deadline" ]; do
            git fetch --no-tags origin "+refs/heads/$INPUT_BRANCH:refs/remotes/origin/$INPUT_BRANCH" || true
            if git show-ref --verify --quiet "refs/remotes/origin/$INPUT_BRANCH"; then
              input_sha="$(git rev-parse "refs/remotes/origin/$INPUT_BRANCH")"
              git merge-base --is-ancestor "$EXACT_PARENT" "$input_sha"
              input_tree="$(git rev-parse "$input_sha^{tree}")"
              printf 'INPUT_SHA=%s\nINPUT_TREE=%s\n' "$input_sha" "$input_tree" >> "$GITHUB_ENV"
              printf 'input=%s\ntree=%s\n' "$input_sha" "$input_tree" > "$out/input-binding.txt"
              exit 0
            fi
            sleep 30
          done
          echo 'full hardened converged source did not materialize' >&2
          exit 1

      - name: Rebuild exact tree as one workflow-free source commit
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/heptabao-v24-clean-r4-work"
          out="$RUNNER_TEMP/heptabao-v24-clean-r4"
          git worktree add --detach "$work" "$INPUT_SHA"
          (
            cd "$work"
            test "$(git rev-parse 'HEAD^{tree}')" = "$INPUT_TREE"
            git ls-tree -r --name-only HEAD > "$out/input-tree-paths.txt"
            if grep -E '(^|/)(v24-.*(materializer|orchestrator|republisher|qualifier|opener|cleanup|convergence)\.ya?ml|payload/|part-[0-9]+$)' "$out/input-tree-paths.txt"; then
              echo 'input tree contains a controller transport or payload' >&2
              exit 1
            fi
            changed="$(git diff --name-only "$EXACT_PARENT..HEAD")"
            test -n "$changed"
            if grep -E '^\.github/workflows/' <<<"$changed"; then
              echo 'input source changes executable workflow files' >&2
              exit 1
            fi
            git config user.name 'HeptaBao V2.4 Full Hardened Clean Republisher'
            git config user.email '102159240+ProfHepta@users.noreply.github.com'
            git reset --soft "$EXACT_PARENT"
            git commit -m 'feat(v2.4): converge full hardened repository blocker repairs'
            clean_sha="$(git rev-parse HEAD)"
            clean_tree="$(git rev-parse 'HEAD^{tree}')"
            test "$(git rev-parse HEAD^)" = "$EXACT_PARENT"
            test "$clean_tree" = "$INPUT_TREE"
            printf 'input=%s\ninput_tree=%s\nclean=%s\nparent=%s\nclean_tree=%s\n' \
              "$INPUT_SHA" "$INPUT_TREE" "$clean_sha" "$(git rev-parse HEAD^)" "$clean_tree" > "$out/tree-binding.txt"
            printf 'CLEAN_SHA=%s\nCLEAN_TREE=%s\n' "$clean_sha" "$clean_tree" >> "$GITHUB_ENV"
          )

      - name: Qualify clean source-only commit
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
          work="$RUNNER_TEMP/heptabao-v24-clean-r4-work"
          out="$RUNNER_TEMP/heptabao-v24-clean-r4"
          (
            cd "$work"
            test "$(git rev-parse HEAD)" = "$CLEAN_SHA"
            test "$(git rev-parse 'HEAD^{tree}')" = "$CLEAN_TREE"
            python scripts/validate_repository_v2.py 2>&1 | tee "$out/repository-validator.log"
            python scripts/validate_compatibility_corpus.py 2>&1 | tee "$out/compatibility-validator.log"
            python -m unittest discover -s tests/repository -p 'test_*.py' 2>&1 | tee "$out/repository-tests.log"
            cargo +1.98.0 fmt --all -- --check 2>&1 | tee "$out/fmt.log"
            timeout --signal=TERM --kill-after=30s 7200s cargo +1.98.0 test --workspace --all-targets --locked 2>&1 | tee "$out/workspace-tests.log"
            cargo +1.98.0 clippy --workspace --all-targets --locked -- -D warnings 2>&1 | tee "$out/clippy.log"
            cargo +1.98.0 doc --workspace --no-deps --locked 2>&1 | tee "$out/rustdoc.log"
            cargo +1.98.0 build --locked -p heptabao-server 2>&1 | tee "$out/server-build.log"
            test -z "$(git status --porcelain=v1 --untracked-files=all)"
            cargo +1.98.0 metadata --locked --no-deps --format-version 1 > "$out/cargo-metadata.json"
            python - "$out/cargo-metadata.json" <<'PY'
          import json, sys
          metadata=json.load(open(sys.argv[1]))
          workspace=set(metadata['workspace_members'])
          packages=sorted(p['name'] for p in metadata['packages'] if p['id'] in workspace)
          assert len(packages) == 45, packages
          PY
            if git ls-remote --exit-code origin "refs/heads/$OUTPUT_BRANCH" >/dev/null 2>&1; then
              observed="$(git ls-remote origin "refs/heads/$OUTPUT_BRANCH" | cut -f1)"
              test "$observed" = "$CLEAN_SHA"
            else
              git push --force-with-lease="refs/heads/$OUTPUT_BRANCH:" origin "$CLEAN_SHA:refs/heads/$OUTPUT_BRANCH"
            fi
          )
          git worktree remove --force "$work"

      - name: Upload bounded clean evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: heptabao-v24-clean-r4
          path: ${{ runner.temp }}/heptabao-v24-clean-r4/
          if-no-files-found: warn
          retention-days: 21
