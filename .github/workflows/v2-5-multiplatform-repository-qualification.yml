name: HeptaBao V2.5 multi-platform repository qualification

on:
  push:
    branches:
      - codex/openbao-replacement-v2.4-authoritative-closure-20260909
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  repository-linux-x86-64:
    name: repository / ubuntu-24.04
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Checkout exact candidate without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Bind exact source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          printf 'runner=ubuntu-24.04\ncommit=%s\ntree=%s\n' \
            "$(git rev-parse HEAD)" \
            "$(git rev-parse 'HEAD^{tree}')"

      - name: Install pinned Python plan dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --requirement requirements-plan.txt

      - name: Install exact Rust 1.98 toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
          cargo +1.98.0 --version
          rustc +1.98.0 --version

      - name: Validate repository and V2.5 admission boundaries
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_repository_v2.py
          python scripts/validate_compatibility_corpus.py
          python -m unittest discover -s tests/repository -p 'test_*.py'

      - name: Check formatting and all targets
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.98.0 fmt --all -- --check
          cargo +1.98.0 test --workspace --all-targets --locked -- --test-threads=1

      - name: Run strict Clippy
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.98.0 clippy --workspace --all-targets --locked -- -D warnings

      - name: Build documentation and server
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.98.0 doc --workspace --no-deps --locked
          cargo +1.98.0 build --locked -p heptabao-server

      - name: Verify final clean tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
  repository-linux-arm64:
    name: repository / ubuntu-24.04-arm
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 150
    steps:
      - name: Checkout exact candidate without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Bind exact source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          printf 'runner=ubuntu-24.04-arm\ncommit=%s\ntree=%s\n' \
            "$(git rev-parse HEAD)" \
            "$(git rev-parse 'HEAD^{tree}')"

      - name: Install pinned Python plan dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --requirement requirements-plan.txt

      - name: Install exact Rust 1.98 toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
          cargo +1.98.0 --version
          rustc +1.98.0 --version

      - name: Validate repository and V2.5 admission boundaries
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_repository_v2.py
          python scripts/validate_compatibility_corpus.py
          python -m unittest discover -s tests/repository -p 'test_*.py'

      - name: Probe durable filesystem primitives
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import fcntl
          import os
          import pathlib
          import tempfile

          root = pathlib.Path(tempfile.mkdtemp(prefix="heptabao-fs-probe-"))
          flags = os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW | os.O_CLOEXEC
          print({
              "root": str(root),
              "machine": os.uname().machine,
              "O_DIRECTORY": os.O_DIRECTORY,
              "O_NOFOLLOW": os.O_NOFOLLOW,
              "O_CLOEXEC": os.O_CLOEXEC,
              "combined": flags,
          })
          fd = os.open(root, flags)
          print("open-directory: PASS", fd)
          for label, operation in (
              ("flock-directory", lambda: fcntl.flock(fd, fcntl.LOCK_EX | fcntl.LOCK_NB)),
              ("fsync-directory", lambda: os.fsync(fd)),
          ):
              try:
                  operation()
                  print(f"{label}: PASS")
              except OSError as error:
                  print(f"{label}: FAIL errno={error.errno} repr={error!r}")
          reopened = os.open(f"/proc/self/fd/{fd}", os.O_RDONLY | os.O_CLOEXEC)
          try:
              try:
                  os.fsync(reopened)
                  print("fsync-proc-reopen: PASS")
              except OSError as error:
                  print(f"fsync-proc-reopen: FAIL errno={error.errno} repr={error!r}")
          finally:
              os.close(reopened)
          temporary = pathlib.Path(f"/proc/self/fd/{fd}") / "probe.tmp"
          target = pathlib.Path(f"/proc/self/fd/{fd}") / "probe.dat"
          with open(temporary, "xb") as handle:
              handle.write(b"probe")
              handle.flush()
              os.fsync(handle.fileno())
          os.replace(temporary, target)
          try:
              os.fsync(fd)
              print("atomic-file-plus-parent-fsync: PASS")
          except OSError as error:
              print(f"atomic-file-plus-parent-fsync: FAIL errno={error.errno} repr={error!r}")
          os.close(fd)
          PY

      - name: Check formatting and all targets
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.98.0 fmt --all -- --check
          cargo +1.98.0 test --workspace --all-targets --locked -- --test-threads=1

      - name: Run strict Clippy
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.98.0 clippy --workspace --all-targets --locked -- -D warnings

      - name: Build documentation and server
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.98.0 doc --workspace --no-deps --locked
          cargo +1.98.0 build --locked -p heptabao-server

      - name: Verify final clean tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
