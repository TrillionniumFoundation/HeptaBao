name: HeptaBao V2.4 controller cleanup

on:
  push:
    branches:
      - ops/v24-controller-cleanup-r1-20260909

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: heptabao-v24-controller-cleanup-r1
  cancel-in-progress: false

env:
  FINAL_BRANCH: codex/openbao-replacement-v2.4-final-candidate-20260909

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout cleanup controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Wait for an open draft PR on the exact final branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 9000))
          owner="${GITHUB_REPOSITORY%%/*}"
          while [ "$SECONDS" -lt "$deadline" ]; do
            row="$(gh api "/repos/$GITHUB_REPOSITORY/pulls?state=open&head=${owner}:${FINAL_BRANCH}&base=main&per_page=100" --jq '.[0] | select(.draft == true) | [.number,.head.sha] | @tsv' || true)"
            if [ -n "$row" ]; then
              printf '%s\n' "$row" > "$RUNNER_TEMP/final-pr.tsv"
              exit 0
            fi
            sleep 60
          done
          echo 'no open draft final PR; controller cleanup is not authorized' >&2
          exit 1

      - name: Delete only the exact V2.4 controller refs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/heptabao-v24-cleanup"
          cp "$RUNNER_TEMP/final-pr.tsv" "$RUNNER_TEMP/heptabao-v24-cleanup/"
          controllers=(
            ops/v24-feature-lineage-materialize-r1-20260909
            ops/v24-feature-lineage-materialize-r2-20260909
            ops/v24-provenance-union-r1-20260909
            ops/v24-provenance-select-r1-20260909
            ops/v24-plugin-toctou-fix-r1-20260909
            ops/v24-plugin-toctou-fix-r2-20260909
            ops/v24-migration-journal-r1-20260909
            ops/v24-migration-journal-r2-20260909
            ops/v24-federated-auth-r1-20260909
            ops/v24-federated-auth-r2-20260909
            ops/v24-ha-service-r1-20260909
            ops/v24-ha-service-r2-20260909
            ops/v24-compat-capture-r1-20260909
            ops/v24-compat-capture-r2-20260909
            ops/v24-convergence-orchestrator-r1-20260909
            ops/v24-source-only-recovery-r1-20260909
            ops/v24-inplace-integration-r1-20260909
            ops/v24-source-convergence-r1-20260909
            ops/v24-source-convergence-r2-20260909
            ops/v24-final-qualifier-r1-20260909
            ops/v24-final-pr-opener-r1-20260909
            ops/v24-main-integrity-audit-r1-20260909
            ops/v24-controller-cleanup-r1-20260909
          )
          : > "$RUNNER_TEMP/heptabao-v24-cleanup/deleted.txt"
          : > "$RUNNER_TEMP/heptabao-v24-cleanup/absent.txt"
          for branch in "${controllers[@]}"; do
            case "$branch" in
              ops/v24-*-20260909) ;;
              *) echo "ref outside exact cleanup allowlist shape: $branch" >&2; exit 1 ;;
            esac
            if git ls-remote --exit-code origin "refs/heads/$branch" >/dev/null 2>&1; then
              git push origin --delete "$branch"
              echo "$branch" >> "$RUNNER_TEMP/heptabao-v24-cleanup/deleted.txt"
            else
              echo "$branch" >> "$RUNNER_TEMP/heptabao-v24-cleanup/absent.txt"
            fi
          done

      - name: Upload bounded cleanup evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: heptabao-v24-controller-cleanup
          path: ${{ runner.temp }}/heptabao-v24-cleanup/
          if-no-files-found: warn
          retention-days: 14
