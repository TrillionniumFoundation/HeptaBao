name: Codex OpenBao replacement closure source export

on:
  push:
    branches:
      - codex/openbao-replacement-full-closure-20260908
      - codex/openbao-2-6-production-replacement-closure-20260911-r1
      - codex/openbao-2.6-production-gap-closure-20260911
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact branch head without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bundle exact tracked source
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          output="$RUNNER_TEMP/heptabao-openbao-replacement-source"
          mkdir -p "$output"
          git bundle create "$output/heptabao-openbao-replacement.bundle" HEAD
          git bundle verify "$output/heptabao-openbao-replacement.bundle"
          printf 'repository=TrillionniumFoundation/HeptaBao\ncommit=%s\ntree=%s\n' \
            "$(git rev-parse HEAD)" "$(git rev-parse 'HEAD^{tree}')" > "$output/source-binding.txt"
          (cd "$output" && sha256sum heptabao-openbao-replacement.bundle > heptabao-openbao-replacement.bundle.sha256)
          rustup toolchain install 1.98.0 --profile minimal
          cargo +1.98.0 vendor --locked "$RUNNER_TEMP/heptabao-locked-vendor" > "$output/vendor-config.toml"
          tar -C "$RUNNER_TEMP" -czf "$output/locked-vendor.tar.gz" heptabao-locked-vendor
          (cd "$output" && sha256sum locked-vendor.tar.gz > locked-vendor.tar.gz.sha256)
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Transport pinned official Oracle archive without executing it
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, urllib.request
          from pathlib import Path
          from urllib.parse import urlsplit
          expected = "8dc11cc5fca0b539a9e352727dacb4e2d304daffcf9a66e0718ac325a20d05aa"
          class HttpsOnly(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  if urlsplit(newurl).scheme != "https":
                      raise ValueError("non-HTTPS redirect rejected")
                  return super().redirect_request(req, fp, code, msg, headers, newurl)
          opener = urllib.request.build_opener(urllib.request.ProxyHandler({}), HttpsOnly())
          request = urllib.request.Request("https://api.github.com/repos/openbao/openbao/releases/tags/v2.6.2", headers={"User-Agent":"HeptaBao-Oracle-Transport", "Accept":"application/vnd.github+json"})
          with opener.open(request, timeout=30) as response:
              raw = response.read(1024 * 1024 + 1)
          if len(raw) > 1024 * 1024:
              raise ValueError("release metadata exceeds bound")
          release = json.loads(raw)
          if release["tag_name"] != "v2.6.2" or release["draft"] or release["prerelease"]:
              raise ValueError("wrong stable Oracle release")
          assets = [a for a in release["assets"] if a.get("digest") == "sha256:" + expected]
          if len(assets) != 1:
              raise ValueError("pinned archive not uniquely present in official release")
          asset = assets[0]
          url = asset["browser_download_url"]
          if not url.startswith("https://github.com/openbao/openbao/releases/download/v2.6.2/") or not url.endswith(".tar.gz") or not 0 < asset["size"] <= 256 * 1024 * 1024:
              raise ValueError("unexpected Oracle archive identity or size")
          output = Path(os.environ["RUNNER_TEMP"]) / "heptabao-openbao-replacement-source" / "oracle-binary"
          output.mkdir(mode=0o700)
          archive = output / "official-openbao-2.6.2.tar.gz"
          digest, size = hashlib.sha256(), 0
          with opener.open(url, timeout=60) as response, archive.open("xb") as target:
              while block := response.read(1024 * 1024):
                  size += len(block)
                  if size > asset["size"]:
                      raise ValueError("archive exceeds official size")
                  digest.update(block)
                  target.write(block)
          if size != asset["size"] or digest.hexdigest() != expected:
              archive.unlink()
              raise ValueError("Oracle archive digest mismatch")
          receipt = {"schema":"heptabao.oracle-archive-transport.v1", "version":"2.6.2", "archive_sha256":expected, "archive_bytes":size, "official_release_id":release["id"], "official_asset_id":asset["id"], "official_asset_name":asset["name"], "provenance_url":release["html_url"], "executed":False, "independent_attestation":False, "compatibility_claim":False, "production_authority":False, "scope":"public official binary archive transport only; not source transfer or admission"}
          (output / "transport-receipt.json").write_text(json.dumps(receipt, sort_keys=True) + "\n")
          PY
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Upload bounded exact-source artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: heptabao-openbao-replacement-source
          path: ${{ runner.temp }}/heptabao-openbao-replacement-source/
          if-no-files-found: error
          retention-days: 3
