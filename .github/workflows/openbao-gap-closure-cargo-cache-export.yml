name: HeptaBao exact gap-closure cargo cache export

on:
  push:
    branches:
      - exec/openbao-gap-closure-cargo-cache-20260908

permissions:
  contents: read

concurrency:
  group: openbao-gap-closure-cargo-cache-${{ github.ref }}
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout immutable source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Verify exact parent source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "8c5f9151585309f79b62be47c3bbc2ca8002b126"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Install exact Rust toolchain and fetch locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal
          cargo +1.98.0 fetch --locked
          cargo +1.98.0 metadata --locked --format-version 1 > "$RUNNER_TEMP/metadata.json"
      - name: Package bounded registry cache
        shell: bash
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/heptabao-gap-closure-cargo-cache"
          mkdir -p "$output"
          tar -C "$CARGO_HOME" -czf "$output/cargo-home-registry.tar.gz" registry
          cp Cargo.lock "$output/Cargo.lock"
          cp "$RUNNER_TEMP/metadata.json" "$output/metadata.json"
          printf 'repository=TrillionniumFoundation/HeptaBao\nsource_parent=8c5f9151585309f79b62be47c3bbc2ca8002b126\nworkflow_commit=%s\n' "$(git rev-parse HEAD)" > "$output/source-binding.txt"
          (cd "$output" && sha256sum cargo-home-registry.tar.gz Cargo.lock metadata.json source-binding.txt > SHA256SUMS)
      - name: Upload exact bounded cache
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: heptabao-gap-closure-cargo-cache
          path: ${{ runner.temp }}/heptabao-gap-closure-cargo-cache/
          if-no-files-found: error
          retention-days: 3
