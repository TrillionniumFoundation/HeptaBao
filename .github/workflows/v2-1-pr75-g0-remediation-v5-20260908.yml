name: HeptaBao V2.1 PR75 G0 remediation v5

on:
  push:
    branches:
      - exec/v2.1-pr75-g0-remediation-20260908

permissions:
  contents: write

jobs:
  remediate:
    if: "${{ github.event.head_commit.message == 'ci(v2.1): run exact G0 remediation v5' }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout bounded execution package
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Install Python 3.13
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-plan.txt
      - name: Materialize validate and publish exact candidate
        shell: bash
        run: bash tools/run-v21-pr75-g0-remediation-v5.sh
