name: plan-v1.3-gap-closure

on:
  push:
    branches:
      - "main"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plan-v1.3-gap-closure-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  plan-and-python:
    if: ${{ (github.event_name != 'pull_request' || github.head_ref != 'codex/plan-v1.3-gap-closure-v2') && (github.event_name != 'push' || github.ref != 'refs/heads/codex/plan-v1.3-gap-closure-v2') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind exact immutable source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          mkdir -p "$RUNNER_TEMP/v1.3.1"
          printf 'repository=%s\nref=%s\ncommit=%s\ntree=%s\n' \
            "$GITHUB_REPOSITORY" "$GITHUB_REF" "$SOURCE_SHA" "$(git rev-parse 'HEAD^{tree}')" \
            | tee "$RUNNER_TEMP/v1.3.1/source-binding.txt"
      - name: Install exact Python dependencies
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-plan.txt
      - run: python3 -m pip install --disable-pip-version-check --requirement requirements-plan.txt
      - name: Validate all inherited and V1.3.1 contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate_plan_v2.py
          python3 scripts/validate_plan_v2_extensions.py
          python3 scripts/validate_plan_v1_2.py
          python3 scripts/validate_plan_v1_2_1.py
          python3 scripts/validate_plan_v1_2_2.py
          python3 scripts/validate_plan_v1_3.py
          python3 scripts/validate_plan_v1_3_1.py
          python3 scripts/validate_h01_h02_next_v1.py
          python3 scripts/validate_h02_candidate_adapters_v1.py
          python3 scripts/validate_h02_openraft_inmemory_cluster_v1.py
          python3 scripts/validate_h02_openraft_fault_lab_v1.py
          python3 scripts/validate_h02_blocker_closure_v1.py
          python3 scripts/validate_h02_exact_head_matrix_contract_v1.py
      - name: Execute every Python regression suite
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests/oracle -p 'test_*.py' -v
          python3 -m unittest discover -s tests/platform -p 'test_*.py' -v
          python3 -m unittest discover -s tests/plan -p 'test_*.py' -v
      - name: Upload plan evidence before final aggregation
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: v1.3.1-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/v1.3.1/
          if-no-files-found: error
          retention-days: 30

  root-rust:
    if: ${{ (github.event_name != 'pull_request' || github.head_ref != 'codex/plan-v1.3-gap-closure-v2') && (github.event_name != 'push' || github.ref != 'refs/heads/codex/plan-v1.3-gap-closure-v2') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install exact Rust 1.98
        shell: bash
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy
      - name: Format test and lint complete root workspace
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          cargo +1.98.0 fmt --all -- --check
          cargo +1.98.0 test --locked --workspace --all-targets
          cargo +1.98.0 clippy --locked --workspace --all-targets -- -D warnings
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

  p0-transport-exact-head:
    if: ${{ (github.event_name != 'pull_request' || github.head_ref != 'codex/plan-v1.3-gap-closure-v2') && (github.event_name != 'push' || github.ref != 'refs/heads/codex/plan-v1.3-gap-closure-v2') }}
    needs: root-rust
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install exact Rust 1.98
        shell: bash
        run: rustup toolchain install 1.98.0 --profile minimal
      - name: Execute bounded socket, audit and response matrix
        shell: bash
        env:
          HEPTABAO_P0_BIND: 127.0.0.1:0
          HEPTABAO_P0_DEV_TOKEN: v1-3-1-development-root-token-000001
          HEPTABAO_P0_DEV_UNSEAL_KEY: v1-3-1-development-unseal-key-00001
          HEPTABAO_P0_AUDIT_PATH: ${{ runner.temp }}/heptabao-p0-v1.3.1-audit.log
        run: |
          set -euo pipefail
          stderr="$RUNNER_TEMP/p0-v1.3.1.stderr"
          cargo +1.98.0 run --quiet --locked -p heptabao-p0-server 2>"$stderr" &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true' EXIT
          python3 - "$stderr" "$HEPTABAO_P0_AUDIT_PATH" <<'PY'
          import re
          import socket
          import sys
          import time
          from pathlib import Path

          stderr_path = Path(sys.argv[1])
          audit_path = Path(sys.argv[2])
          address = None
          for _ in range(600):
              text = stderr_path.read_text(encoding="utf-8", errors="replace") if stderr_path.exists() else ""
              match = re.search(r"listening on (127\.0\.0\.1:\d+)", text)
              if match:
                  address = match.group(1)
                  break
              time.sleep(0.1)
          assert address is not None, stderr_path.read_text(encoding="utf-8", errors="replace")
          host, port_text = address.rsplit(":", 1)
          port = int(port_text)

          def exchange(raw: bytes, timeout: float = 10.0) -> bytes:
              with socket.create_connection((host, port), timeout=timeout) as stream:
                  stream.settimeout(timeout)
                  stream.sendall(raw)
                  chunks = []
                  while True:
                      block = stream.recv(8192)
                      if not block:
                          break
                      chunks.append(block)
                  return b"".join(chunks)

          def parse_response(raw: bytes):
              head, body = raw.split(b"\r\n\r\n", 1)
              lines = head.split(b"\r\n")
              status = int(lines[0].split(b" ", 2)[1])
              headers = {}
              for line in lines[1:]:
                  name, value = line.split(b":", 1)
                  headers[name.strip().lower()] = value.strip()
              assert int(headers[b"content-length"]) == len(body), raw
              return status, headers, body

          def request(method: str, target: str, body: bytes = b"", token=None, request_id=None):
              headers = [f"{method} {target} HTTP/1.1", f"Host: {address}"]
              if token is not None:
                  headers.append(f"X-Vault-Token: {token}")
              if request_id is not None:
                  headers.append(f"X-HeptaBao-Request-Id: {request_id}")
              if body:
                  headers.append(f"Content-Length: {len(body)}")
              raw = ("\r\n".join(headers) + "\r\n\r\n").encode() + body
              return parse_response(exchange(raw))

          assert request("GET", "/v1/sys/health")[0] == 501
          assert request("POST", "/v1/sys/init", b"{}")[0] == 200
          unseal_body = b'{"key":"v1-3-1-development-unseal-key-00001"}'
          assert request("POST", "/v1/sys/unseal", unseal_body)[0] == 200
          token = "v1-3-1-development-root-token-000001"
          status, headers, body = request(
              "POST", "/v1/secret/exact-head", b'{"value":"development-only"}', token=token
          )
          assert status == 204
          assert headers[b"content-length"] == b"0"
          assert body == b""
          status, _, body = request("GET", "/v1/secret/exact-head", token=token)
          assert status == 200 and b"development-only" in body

          bad_host = parse_response(exchange(
              b"GET /v1/sys/health HTTP/1.1\r\nHost: attacker.invalid\r\n\r\n"
          ))
          assert bad_host[0] == 400
          duplicate_host = parse_response(exchange(
              (f"GET /v1/sys/health HTTP/1.1\r\nHost: {address}\r\nhost: {address}\r\n\r\n").encode()
          ))
          assert duplicate_host[0] == 400

          request_id = "client-request-id-000000000001"
          assert request("GET", "/v1/sys/health", request_id=request_id)[0] == 200
          assert request("GET", "/v1/sys/health", request_id=request_id)[0] == 409

          held = []
          try:
              for _ in range(32):
                  stream = socket.create_connection((host, port), timeout=3)
                  stream.sendall(b"G")
                  held.append(stream)
              time.sleep(0.5)
              saturated = request("GET", "/v1/sys/health")
              assert saturated[0] == 429, saturated
          finally:
              for stream in held:
                  stream.close()
          time.sleep(0.5)

          started = time.monotonic()
          with socket.create_connection((host, port), timeout=3) as stream:
              stream.settimeout(8)
              stream.sendall(f"GET /v1/sys/health HTTP/1.1\r\nHost:".encode())
              chunks = []
              while True:
                  block = stream.recv(8192)
                  if not block:
                      break
                  chunks.append(block)
          elapsed = time.monotonic() - started
          slow = parse_response(b"".join(chunks))
          assert slow[0] == 408, slow
          assert elapsed < 8, elapsed

          for _ in range(100):
              if audit_path.exists() and audit_path.stat().st_size:
                  break
              time.sleep(0.05)
          audit = audit_path.read_text(encoding="utf-8")
          for marker in [
              "host-listener-mismatch",
              "protocol-duplicate-header",
              "client-request-id-replayed",
              "connection-capacity-exhausted",
              "request-read-deadline-exceeded",
          ]:
              assert marker in audit, (marker, audit)
          print("P0 transport exact-head contract PASS")
          PY
          test -s "$HEPTABAO_P0_AUDIT_PATH"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

  h02-exact-head:
    if: ${{ (github.event_name != 'pull_request' || github.head_ref != 'codex/plan-v1.3-gap-closure-v2') && (github.event_name != 'push' || github.ref != 'refs/heads/codex/plan-v1.3-gap-closure-v2') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      TOOLCHAINS: "1.88.0 1.98.0"
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install exact Python dependencies
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-plan.txt
      - run: python3 -m pip install --disable-pip-version-check --requirement requirements-plan.txt
      - name: Install effective Rust toolchains
        shell: bash
        run: |
          set -euo pipefail
          for toolchain in $TOOLCHAINS; do
            rustup toolchain install "$toolchain" --profile minimal --component rustfmt,clippy
          done
      - name: Bind compile test and lint immutable OpenRaft graph
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          manifest=probes/h02/openraft-tokio/Cargo.toml
          cargo +1.88.0 metadata --locked --format-version 1 --manifest-path "$manifest" \
            >"$RUNNER_TEMP/openraft-v1.3.1-metadata.json"
          cargo +1.98.0 fmt --manifest-path "$manifest" --all -- --check
          for toolchain in $TOOLCHAINS; do
            export CARGO_TARGET_DIR="$RUNNER_TEMP/openraft-v1.3.1-compile-$toolchain"
            cargo +"$toolchain" test --locked --all-targets --manifest-path "$manifest"
            cargo +"$toolchain" clippy --locked --all-targets --manifest-path "$manifest" -- -D warnings
          done
      - name: Execute all 24 application entries without early abort
        shell: bash
        run: |
          set +e
          result_root="$RUNNER_TEMP/openraft-v1.3.1"
          mkdir -p "$result_root"
          python3 scripts/h02_exact_head_matrix_v1.py \
            --repository "$GITHUB_REPOSITORY" \
            --ref "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" \
            --commit "$SOURCE_SHA" \
            --tree "$(git rev-parse 'HEAD^{tree}')" \
            --manifest probes/h02/openraft-tokio/Cargo.toml \
            --output-dir "$result_root/matrix" \
            --cargo-target-root "$result_root/targets" \
            --entry-timeout-seconds 240 \
            >"$result_root/runner.log" 2>&1
          printf '%s\n' "$?" >"$result_root/runner.exit"
          exit 0
      - name: Upload all outcomes before final gate
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: v1.3.1-openraft-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/openraft-v1.3.1/
          if-no-files-found: error
          retention-days: 30
      - name: Require complete schema-valid PASS matrix
        shell: bash
        run: |
          set -euo pipefail
          result_root="$RUNNER_TEMP/openraft-v1.3.1"
          test "$(cat "$result_root/runner.exit")" = 0
          python3 - "$result_root/matrix/matrix-summary.json" <<'PY'
          import json
          import sys
          summary = json.load(open(sys.argv[1], encoding="utf-8"))
          assert summary["result"] == "PASS", summary
          assert summary["matrix"]["executed_entry_count"] == 24, summary
          assert summary["matrix"]["missing_entry_ids"] == [], summary
          assert summary["matrix"]["unexpected_entry_ids"] == [], summary
          assert summary["matrix"]["duplicate_entry_ids"] == [], summary
          assert summary["counts"] == {
              "pass": 24,
              "fail": 0,
              "blocked": 0,
              "unknown": 0,
              "unexecuted": 0,
          }, summary
          assert summary["qualification"] is False
          assert summary["compatibility_claim"] is False
          assert summary["selection_effect"] == "NONE"
          assert summary["authority_effect"] == "NONE"
          PY
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

  authority-sentinel:
    needs: [plan-and-python, root-rust, p0-transport-exact-head, h02-exact-head]
    if: ${{ ((github.event_name != 'pull_request' || github.head_ref != 'codex/plan-v1.3-gap-closure-v2') && (github.event_name != 'push' || github.ref != 'refs/heads/codex/plan-v1.3-gap-closure-v2')) && (always()) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: Require all technical lanes and retain closed authority
        env:
          PLAN_RESULT: ${{ needs.plan-and-python.result }}
          ROOT_RESULT: ${{ needs.root-rust.result }}
          P0_RESULT: ${{ needs.p0-transport-exact-head.result }}
          H02_RESULT: ${{ needs.h02-exact-head.result }}
        shell: bash
        run: |
          set -euo pipefail
          test "$PLAN_RESULT" = success
          test "$ROOT_RESULT" = success
          test "$P0_RESULT" = success
          test "$H02_RESULT" = success
          python3 scripts/validate_plan_v1_3_1.py
          echo "V1.3.1 repository technical gates PASS; independent/external closure remains required; qualification=false authority=NONE"
