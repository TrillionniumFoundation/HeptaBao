name: Codex materialize durable response wrapping

on:
  push:
    branches: [codex/openbao-replacement-wrapping-20260908]

permissions:
  contents: write

concurrency:
  group: codex-openbao-replacement-response-wrapping
  cancel-in-progress: false

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Apply reviewed wrapping tranche
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum crates/heptabao-server/src/http.rs | cut -d' ' -f1)" = "f0aaf2208c1982c573c20241caba8633bd38de7d1230deebe6cce4129df7887c"
          test "$(sha256sum crates/heptabao-server/src/service.rs | cut -d' ' -f1)" = "eeab70788fb190d714cc61dc23a239ac940684b7fccce2306f29d1d839263a4a"
          test ! -e crates/heptabao-server/src/wrapping.rs
          cat .g1/codex-openbao-replacement/wrapping-tranche/part-* > "$RUNNER_TEMP/wrapping.patch.gz.b64"
          test "$(sha256sum "$RUNNER_TEMP/wrapping.patch.gz.b64" | cut -d' ' -f1)" = "d17804bddf163ee21c76a8f138dc27b3d463835edb4b9934b9a5527aa41dc494"
          base64 --decode "$RUNNER_TEMP/wrapping.patch.gz.b64" > "$RUNNER_TEMP/wrapping.patch.gz"
          gzip --test "$RUNNER_TEMP/wrapping.patch.gz"
          gzip --decompress --stdout "$RUNNER_TEMP/wrapping.patch.gz" > "$RUNNER_TEMP/wrapping.patch"
          test "$(sha256sum "$RUNNER_TEMP/wrapping.patch" | cut -d' ' -f1)" = "c8b7dc6cc442401cc2cf6a395a9a0565c618ea6ec41107e905be41996b0afd0a"
          git apply --check --verbose "$RUNNER_TEMP/wrapping.patch"
          git apply --verbose "$RUNNER_TEMP/wrapping.patch"

          python - <<'PY'
          from pathlib import Path

          service = Path("crates/heptabao-server/src/service.rs")
          text = service.read_text(encoding="utf-8")
          fingerprint = text.find("fn request_fingerprint(")
          if fingerprint < 0:
              raise SystemExit("request_fingerprint function not found")
          line = text.rfind("\n", 0, fingerprint) + 1
          indent_end = line
          while indent_end < len(text) and text[indent_end] in " \t":
              indent_end += 1
          indent = text[line:indent_end]
          text = text[:line] + f"{indent}#[cfg(test)]\n" + text[line:]

          for name in (
              "fn handle_at_with_wrap_ttl(",
              "fn handle_inner(",
              "fn wrapping_token_route(",
          ):
              offset = text.find(name)
              if offset < 0:
                  raise SystemExit(f"service function not found: {name}")
              line = text.rfind("\n", 0, offset) + 1
              indent_end = line
              while indent_end < len(text) and text[indent_end] in " \t":
                  indent_end += 1
              indent = text[line:indent_end]
              expect = (
                  f"{indent}#[expect(\n"
                  f"{indent}    clippy::too_many_arguments,\n"
                  f"{indent}    reason = \"security-relevant request fields remain explicit at this bounded service boundary\"\n"
                  f"{indent})]\n"
              )
              text = text[:line] + expect + text[line:]
          service.write_text(text, encoding="utf-8")

          regression = Path("tests/repository/test_durable_runtime_v2_1.py")
          value = regression.read_text(encoding="utf-8")
          old = '            self.assertIn(".open(", body)\n'
          new = (
              '            self.assertTrue(\n'
              '                ".open(" in body or "read_bounded(" in body,\n'
              '                f"{function} must authenticate bytes directly or through the bounded reader",\n'
              '            )\n'
          )
          if value.count(old) != 1:
              raise SystemExit("unexpected durable runtime assertion")
          regression.write_text(value.replace(old, new), encoding="utf-8")

          smoke = Path("qa/single-node/smoke.py")
          value = smoke.read_text(encoding="utf-8")
          old = '        check("unsupported_wrapping_withholds_secret", instance.call("GET", "secret/data/item", extra_headers={"X-Vault-Wrap-TTL": "60s"})[0] == 501)\n'
          new = (
              '        status, wrapped = instance.call("GET", "secret/data/item", extra_headers={"X-Vault-Wrap-TTL": "60s"})\n'
              '        check("response_wrapping_withholds_secret", status == 200 and bool(wrapped.get("wrap_info", {}).get("token")) and "data" not in wrapped)\n'
          )
          if value.count(old) != 1:
              raise SystemExit("unexpected wrapping smoke assertion")
          value = value.replace(old, new)

          old_line = '        print("single-node smoke failed: " + type(error).__name__, file=sys.stderr)\n'
          diagnostic = (
              '        message = str(error)\n'
              '        safe = message.startswith(("failed scenario: ", "server exited during startup", "TLS listener did not become ready"))\n'
              '        print("single-node smoke failed: " + (message if safe else type(error).__name__), file=sys.stderr)\n'
          )
          if value.count(old_line) != 1:
              raise SystemExit("unexpected smoke diagnostic line")
          smoke.write_text(value.replace(old_line, diagnostic), encoding="utf-8")
          PY
          git diff --check

      - name: Qualify exact source
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy
          python -m pip install --disable-pip-version-check --requirement requirements-plan.txt
          cargo +1.98.0 fmt --all
          cargo +1.98.0 fmt --all -- --check
          cargo +1.98.0 test --locked -p heptabao-server
          cargo +1.98.0 clippy --locked -p heptabao-server --all-targets -- -D warnings
          cargo +1.98.0 build --locked -p heptabao-server
          python scripts/validate_repository_v2.py
          for test_name in test_repository_v2.py test_durable_runtime_v2_1.py test_authorized_durable_runtime_v2_1.py test_security_hashing_v2_1.py; do
            python -m unittest discover -s tests/repository -p "$test_name" -v
          done
          work_dir="$RUNNER_TEMP/heptabao-response-wrapping-smoke"
          rm -rf "$work_dir"
          python qa/single-node/smoke.py --binary "$PWD/target/debug/heptabao-server" --work-dir "$work_dir"
          cargo +1.98.0 test --locked --workspace --all-targets
          cargo +1.98.0 clippy --locked --workspace --all-targets -- -D warnings
          cargo +1.98.0 doc --locked --workspace --no-deps
          git diff --check

      - name: Publish qualified source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .g1/codex-openbao-replacement/wrapping-tranche
          rmdir .g1/codex-openbao-replacement 2>/dev/null || true
          rm .github/workflows/codex-response-wrapping-materialize.yml
          git config user.name "HeptaBao Codex Closure"
          git config user.email "102159240+ProfHepta@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(server): add durable single-use response wrapping"
          git push origin HEAD:codex/openbao-replacement-wrapping-20260908
