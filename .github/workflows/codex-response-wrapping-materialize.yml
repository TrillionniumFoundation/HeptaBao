name: Codex materialize durable response wrapping

on:
  push:
    branches:
      - codex/openbao-replacement-wrapping-20260908

permissions:
  contents: write

concurrency:
  group: codex-openbao-replacement-response-wrapping
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Verify source baseline and assemble payload
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum crates/heptabao-server/src/http.rs | cut -d' ' -f1)" = "f0aaf2208c1982c573c20241caba8633bd38de7d1230deebe6cce4129df7887c"
          test "$(sha256sum crates/heptabao-server/src/engines.rs | cut -d' ' -f1)" = "a13c88cec6799c60ec7a0e8c8f46c40535827ef8da8b7553326a05714c69f887"
          test "$(sha256sum crates/heptabao-server/src/lib.rs | cut -d' ' -f1)" = "e494b6d8ad65b944074f3c8201a4deef19b8b4fd43ef1a786b35497da98df70d"
          test "$(sha256sum crates/heptabao-server/src/service.rs | cut -d' ' -f1)" = "eeab70788fb190d714cc61dc23a239ac940684b7fccce2306f29d1d839263a4a"
          test "$(sha256sum crates/heptabao-server/src/service_tests.rs | cut -d' ' -f1)" = "b102997973a3cef762ae8cd6681a5f7c8ea3a5310c0f9f95af28e77782f2eaf6"
          test ! -e crates/heptabao-server/src/wrapping.rs
          sha256sum --check <(head -n 1 .g1/codex-openbao-replacement/wrapping-tranche/payload.sha256)
          cat .g1/codex-openbao-replacement/wrapping-tranche/part-* > "$RUNNER_TEMP/wrapping.patch.gz.b64"
          test "$(sha256sum "$RUNNER_TEMP/wrapping.patch.gz.b64" | cut -d' ' -f1)" = "d17804bddf163ee21c76a8f138dc27b3d463835edb4b9934b9a5527aa41dc494"
          base64 --decode "$RUNNER_TEMP/wrapping.patch.gz.b64" > "$RUNNER_TEMP/wrapping.patch.gz"
          gzip --test "$RUNNER_TEMP/wrapping.patch.gz"
          gzip --decompress --stdout "$RUNNER_TEMP/wrapping.patch.gz" > "$RUNNER_TEMP/wrapping.patch"
          test "$(sha256sum "$RUNNER_TEMP/wrapping.patch" | cut -d' ' -f1)" = "c8b7dc6cc442401cc2cf6a395a9a0565c618ea6ec41107e905be41996b0afd0a"
      - name: Apply response-wrapping source and review fixes
        shell: bash
        run: |
          set -euo pipefail
          git apply --check --verbose "$RUNNER_TEMP/wrapping.patch"
          git apply --verbose "$RUNNER_TEMP/wrapping.patch"
          python - <<'PY'
          from pathlib import Path

          service = Path("crates/heptabao-server/src/service.rs")
          text = service.read_text(encoding="utf-8")
          obsolete = '''    fn request_fingerprint(
              &self,
              method: &str,
              path: &str,
              namespace: &str,
              token: &str,
          ) -> String {
              let mut context = hmac::Context::with_key(&self.audit_key);
              context.update(b"heptabao.audit.request-fingerprint.v2");
              for field in [method, namespace, path, token] {
                  context.update(&(field.len() as u64).to_le_bytes());
                  context.update(field.as_bytes());
              }
              STANDARD.encode(context.sign().as_ref())
          }

          '''
          if text.count(obsolete) != 1:
              raise SystemExit("unexpected request_fingerprint source")
          text = text.replace(obsolete, "")
          reason = '''    #[expect(
              clippy::too_many_arguments,
              reason = "security-relevant request fields remain explicit at this bounded service boundary"
          )]
          '''
          for marker in (
              "    pub fn handle_at_with_wrap_ttl(\n",
              "    fn handle_inner(\n",
              "    fn wrapping_token_route(\n",
          ):
              if text.count(marker) != 1:
                  raise SystemExit(f"unexpected service marker: {marker.strip()}")
              text = text.replace(marker, reason + marker, 1)
          service.write_text(text, encoding="utf-8")

          regression = Path("tests/repository/test_durable_runtime_v2_1.py")
          test_text = regression.read_text(encoding="utf-8")
          old = '''            self.assertIn("barrier", body)
              self.assertIn(".open(", body)
          '''
          new = '''            self.assertIn("barrier", body)
              self.assertTrue(
                  ".open(" in body or "read_bounded(" in body,
                  f"{function} must authenticate bytes directly or through the bounded reader",
              )

          bounded_start = source.index("fn read_bounded(")
          bounded_next = source.find("\\nfn ", bounded_start + 4)
          bounded_body = source[bounded_start : bounded_next if bounded_next != -1 else None]
          self.assertIn("symlink_metadata", bounded_body)
          self.assertIn("MAX_FILE_BYTES", bounded_body)
          self.assertIn("read_to_end", bounded_body)
          '''
          if test_text.count(old) != 1:
              raise SystemExit("unexpected durable runtime regression assertion")
          regression.write_text(test_text.replace(old, new), encoding="utf-8")
          PY
          git diff --check
      - name: Install exact Rust toolchain
        shell: bash
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy
      - name: Qualify wrapping state HTTP semantics and restart behavior
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --requirement requirements-plan.txt
          cargo +1.98.0 fmt --all
          cargo +1.98.0 test --locked -p heptabao-server
          cargo +1.98.0 clippy --locked -p heptabao-server --all-targets -- -D warnings
          cargo +1.98.0 build --locked -p heptabao-server
          python scripts/validate_repository_v2.py
          python -m unittest discover -s tests/repository -p 'test_*.py' -v
          work_dir="$RUNNER_TEMP/heptabao-response-wrapping-smoke"
          rm -rf "$work_dir"
          python qa/single-node/smoke.py --binary "$PWD/target/debug/heptabao-server" --work-dir "$work_dir"
          git diff --check
      - name: Publish qualified source commit
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .g1/codex-openbao-replacement/wrapping-tranche
          rmdir .g1/codex-openbao-replacement 2>/dev/null || true
          rm -f .github/workflows/codex-response-wrapping-materialize.yml
          git config user.name "HeptaBao Codex Closure"
          git config user.email "102159240+ProfHepta@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(server): add durable single-use response wrapping"
          git push origin HEAD:codex/openbao-replacement-wrapping-20260908
