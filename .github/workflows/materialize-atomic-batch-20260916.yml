name: Materialize atomic durable batch

on:
  push:
    branches:
      - exec/materialize-atomic-batch-20260916

permissions:
  contents: write

concurrency:
  group: materialize-atomic-batch-20260916
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout target closure branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: codex/next-round-product-closure-20260916
          fetch-depth: 0
          persist-credentials: true

      - name: Verify immutable input head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "136fb1202aa855fd919d5a8a15602837ee77cd97"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Apply reviewed atomic-batch patch
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/atomic-batch.patch.b64" <<'PATCH64'

PATCH64
          base64 --decode "$RUNNER_TEMP/atomic-batch.patch.b64" > "$RUNNER_TEMP/atomic-batch.patch"
          git apply --check "$RUNNER_TEMP/atomic-batch.patch"
          git apply "$RUNNER_TEMP/atomic-batch.patch"
          python scripts/current_source_inventory.py --write
          git diff --check

      - name: Validate repository truth and durable package
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --requirement requirements-plan.txt
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
          python scripts/validate_repository_v2.py
          python scripts/validate_module_closure.py
          python scripts/validate_openbao_replacement_admission.py
          cargo +1.98.0 fmt --all -- --check
          cargo +1.98.0 test --locked -p heptabao-durable-service
          cargo +1.98.0 clippy --locked -p heptabao-durable-service --all-targets -- -D warnings

      - name: Publish one reviewed commit to closure branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/heptabao-durable-service/src/capacity.rs planning/HEPTABAO_CURRENT_SOURCE_INVENTORY_V2.json
          test -n "$(git status --porcelain=v1)"
          git commit -m "feat(durable): add atomic multi-resource batch"
          git push origin HEAD:codex/next-round-product-closure-20260916
