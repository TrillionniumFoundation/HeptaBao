name: Materialize atomic durable batch evidence

on:
  push:
    branches:
      - exec/materialize-atomic-batch-20260916

permissions:
  contents: write

concurrency:
  group: materialize-atomic-batch-20260916
  cancel-in-progress: false

jobs:
  validate-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact target branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: TrillionniumFoundation/HeptaBao
          ref: codex/next-round-product-closure-20260916
          fetch-depth: 0
          persist-credentials: true

      - name: Verify staged atomic-batch head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "625dba05afa562a6cf7f937a35b15888fb17fcf8"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Install exact qualification dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --requirement requirements-plan.txt
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy

      - name: Format validate and test durable batch
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.98.0 fmt --all
          python scripts/current_source_inventory.py --write
          python scripts/validate_repository_v2.py
          python scripts/validate_module_closure.py
          python scripts/validate_openbao_replacement_admission.py
          cargo +1.98.0 fmt --all -- --check
          cargo +1.98.0 test --locked -p heptabao-durable-service
          cargo +1.98.0 clippy --locked -p heptabao-durable-service --all-targets -- -D warnings
          git diff --check

      - name: Publish validated source truth
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/heptabao-durable-service/src/capacity.rs planning/HEPTABAO_CURRENT_SOURCE_INVENTORY_V2.json
          if test -n "$(git status --porcelain=v1)"; then
            git commit -m "test(durable): bind atomic batch source truth"
            git push origin HEAD:codex/next-round-product-closure-20260916
          fi
