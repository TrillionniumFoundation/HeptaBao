          lib=Path('crates/heptabao-compatibility/src/lib.rs')
          text=lib.read_text(encoding='utf-8')
          if 'pub struct SignedEvidenceBindingV24' in text:
              raise SystemExit('signed evidence V2.4 already exists')
          addition=r'''

/// Domain separator for signatures over compatibility evidence bindings.
pub const SIGNED_EVIDENCE_DOMAIN_V2_4: &[u8] =
    b"heptabao-openbao-compatibility-evidence-v2.4\0";

#[derive(Clone, Copy, Debug, Eq, PartialEq)]
pub enum SignerControlV24 {
    RepositoryControlled,
    Independent,
}

#[derive(Clone, Debug, Eq, PartialEq)]
pub struct TrustedSignerV24 {
    pub signer_id: Id,
    pub control: SignerControlV24,
    pub ed25519_public_key: Vec<u8>,
}

impl TrustedSignerV24 {
    pub fn new(
        signer_id: Id,
        control: SignerControlV24,
        ed25519_public_key: Vec<u8>,
    ) -> Result<Self, SignedEvidenceErrorV24> {
        if ed25519_public_key.len() != 32 {
            return Err(SignedEvidenceErrorV24::InvalidPublicKey);
        }
        Ok(Self {
            signer_id,
            control,
            ed25519_public_key,
        })
    }
}

#[derive(Clone, Copy, Debug, Eq, PartialEq)]
pub struct SignedEvidenceBindingV24 {
    pub profile_sha256: [u8; 32],
    pub inventory_sha256: [u8; 32],
    pub oracle_artifact_sha256: [u8; 32],
    pub candidate_artifact_sha256: [u8; 32],
    pub comparison_artifact_sha256: [u8; 32],
}

impl SignedEvidenceBindingV24 {
    pub fn validate(self) -> Result<Self, SignedEvidenceErrorV24> {
        let digests = [
            self.profile_sha256,
            self.inventory_sha256,
            self.oracle_artifact_sha256,
            self.candidate_artifact_sha256,
            self.comparison_artifact_sha256,
        ];
        if digests.iter().any(|digest| *digest == [0; 32])
            || self.oracle_artifact_sha256 == self.candidate_artifact_sha256
        {
            return Err(SignedEvidenceErrorV24::InvalidBinding);
        }
        Ok(self)
    }

    pub fn signing_message(&self, signer_id: &Id) -> Result<Vec<u8>, SignedEvidenceErrorV24> {
        self.validate()?;
        let signer = signer_id.as_str().as_bytes();
        let signer_len = u16::try_from(signer.len())
            .map_err(|_| SignedEvidenceErrorV24::InvalidSigner)?;
        let mut message = Vec::with_capacity(
            SIGNED_EVIDENCE_DOMAIN_V2_4.len() + 2 + signer.len() + 32 * 5,
        );
        message.extend_from_slice(SIGNED_EVIDENCE_DOMAIN_V2_4);
        message.extend_from_slice(&signer_len.to_be_bytes());
        message.extend_from_slice(signer);
        message.extend_from_slice(&self.profile_sha256);
        message.extend_from_slice(&self.inventory_sha256);
        message.extend_from_slice(&self.oracle_artifact_sha256);
        message.extend_from_slice(&self.candidate_artifact_sha256);
        message.extend_from_slice(&self.comparison_artifact_sha256);
        Ok(message)
    }
}

#[derive(Clone, Debug, Eq, PartialEq)]
pub struct EvidenceSignatureV24 {
    pub signer_id: Id,
    pub signature: Vec<u8>,
}

impl EvidenceSignatureV24 {
    pub fn new(signer_id: Id, signature: Vec<u8>) -> Result<Self, SignedEvidenceErrorV24> {
        if signature.len() != 64 {
            return Err(SignedEvidenceErrorV24::InvalidSignature);
        }
        Ok(Self {
            signer_id,
            signature,
        })
    }
}

#[derive(Clone, Debug, Eq, PartialEq)]
pub struct SignedEvidenceAdmissionV24 {
    pub binding: SignedEvidenceBindingV24,
    pub admitted_signers: Vec<Id>,
}

#[derive(Clone, Copy, Debug, Eq, PartialEq)]
pub enum SignedEvidenceErrorV24 {
    InvalidBinding,
    InvalidSigner,
    InvalidPublicKey,
    InvalidSignature,
    DuplicateSigner,
    UnknownSigner,
    RepositoryControlledSigner,
    SignatureVerificationFailed,
    InsufficientIndependentSignatures,
}

impl fmt::Display for SignedEvidenceErrorV24 {
    fn fmt(&self, formatter: &mut fmt::Formatter<'_>) -> fmt::Result {
        formatter.write_str(match self {
            Self::InvalidBinding => "signed compatibility evidence binding is invalid",
            Self::InvalidSigner => "signed compatibility evidence signer is invalid",
            Self::InvalidPublicKey => "signed compatibility evidence public key is invalid",
            Self::InvalidSignature => "signed compatibility evidence signature is invalid",
            Self::DuplicateSigner => "signed compatibility evidence signer is duplicated",
            Self::UnknownSigner => "signed compatibility evidence signer is unknown",
            Self::RepositoryControlledSigner => {
                "repository-controlled signer cannot satisfy independent admission"
            }
            Self::SignatureVerificationFailed => {
                "signed compatibility evidence signature verification failed"
            }
            Self::InsufficientIndependentSignatures => {
                "signed compatibility evidence lacks the required independent signers"
            }
        })
    }
}

impl Error for SignedEvidenceErrorV24 {}

/// Verifies domain-separated Ed25519 signatures over one exact evidence binding.
///
/// This function proves key possession and byte binding. Whether a configured
/// key is actually controlled by an independent organization remains an
/// external governance fact and is deliberately not inferred from signatures.
pub fn admit_signed_evidence_v2_4(
    binding: SignedEvidenceBindingV24,
    trusted_signers: impl IntoIterator<Item = TrustedSignerV24>,
    signatures: impl IntoIterator<Item = EvidenceSignatureV24>,
    minimum_independent_signers: usize,
) -> Result<SignedEvidenceAdmissionV24, SignedEvidenceErrorV24> {
    let binding = binding.validate()?;
    if minimum_independent_signers == 0 || minimum_independent_signers > 16 {
        return Err(SignedEvidenceErrorV24::InsufficientIndependentSignatures);
    }
    let mut trusted = BTreeMap::new();
    for signer in trusted_signers {
        if trusted.insert(signer.signer_id.clone(), signer).is_some() {
            return Err(SignedEvidenceErrorV24::DuplicateSigner);
        }
    }
    let mut admitted = BTreeSet::new();
    for signature in signatures {
        if !admitted.insert(signature.signer_id.clone()) {
            return Err(SignedEvidenceErrorV24::DuplicateSigner);
        }
        let signer = trusted
            .get(&signature.signer_id)
            .ok_or(SignedEvidenceErrorV24::UnknownSigner)?;
        if signer.control != SignerControlV24::Independent {
            return Err(SignedEvidenceErrorV24::RepositoryControlledSigner);
        }
        let message = binding.signing_message(&signature.signer_id)?;
        ring::signature::UnparsedPublicKey::new(
            &ring::signature::ED25519,
            &signer.ed25519_public_key,
        )
        .verify(&message, &signature.signature)
        .map_err(|_| SignedEvidenceErrorV24::SignatureVerificationFailed)?;
    }
    if admitted.len() < minimum_independent_signers {
        return Err(SignedEvidenceErrorV24::InsufficientIndependentSignatures);
    }
    Ok(SignedEvidenceAdmissionV24 {
        binding,
        admitted_signers: admitted.into_iter().collect(),
    })
}

#[cfg(test)]
mod signed_evidence_v2_4_tests {
    use super::*;
    use ring::signature::{Ed25519KeyPair, KeyPair};

    fn binding() -> SignedEvidenceBindingV24 {
        SignedEvidenceBindingV24 {
            profile_sha256: [1; 32],
            inventory_sha256: [2; 32],
            oracle_artifact_sha256: [3; 32],
            candidate_artifact_sha256: [4; 32],
            comparison_artifact_sha256: [5; 32],
        }
    }

    fn signer(seed: u8, id: &str, control: SignerControlV24) -> (TrustedSignerV24, EvidenceSignatureV24) {
        let pair = Ed25519KeyPair::from_seed_unchecked(&[seed; 32]).unwrap();
        let signer_id = Id::parse(id).unwrap();
        let message = binding().signing_message(&signer_id).unwrap();
        let trusted = TrustedSignerV24::new(
            signer_id.clone(),
            control,
            pair.public_key().as_ref().to_vec(),
        )
        .unwrap();
        let signature = EvidenceSignatureV24::new(
            signer_id,
            pair.sign(&message).as_ref().to_vec(),
        )
        .unwrap();
        (trusted, signature)
    }

    #[test]
    fn two_independent_signers_admit_one_exact_binding() {
        let (first, first_signature) = signer(7, "oracle-lab-a", SignerControlV24::Independent);
        let (second, second_signature) = signer(8, "security-lab-b", SignerControlV24::Independent);
        let admission = admit_signed_evidence_v2_4(
            binding(),
            [first, second],
            [first_signature, second_signature],
            2,
        )
        .unwrap();
        assert_eq!(admission.admitted_signers.len(), 2);
    }

    #[test]
    fn repository_signer_and_tampered_binding_fail_closed() {
        let (repository, signature) = signer(
            9,
            "repository-owner",
            SignerControlV24::RepositoryControlled,
        );
        assert_eq!(
            admit_signed_evidence_v2_4(binding(), [repository], [signature], 1),
            Err(SignedEvidenceErrorV24::RepositoryControlledSigner)
        );

        let (independent, signature) = signer(10, "oracle-lab", SignerControlV24::Independent);
        let mut changed = binding();
        changed.candidate_artifact_sha256 = [11; 32];
        assert_eq!(
            admit_signed_evidence_v2_4(changed, [independent], [signature], 1),
            Err(SignedEvidenceErrorV24::SignatureVerificationFailed)
        );
    }

    #[test]
    fn insufficient_or_duplicate_signers_are_rejected() {
        let (trusted, signature) = signer(12, "oracle-lab", SignerControlV24::Independent);
        assert_eq!(
            admit_signed_evidence_v2_4(binding(), [trusted.clone()], [signature.clone()], 2),
            Err(SignedEvidenceErrorV24::InsufficientIndependentSignatures)
        );
        assert_eq!(
            admit_signed_evidence_v2_4(
                binding(),
                [trusted],
                [signature.clone(), signature],
                1,
            ),
            Err(SignedEvidenceErrorV24::DuplicateSigner)
        );
    }
}
