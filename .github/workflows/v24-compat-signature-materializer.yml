              if '[dependencies]' in manifest_text:
                  manifest_text=manifest_text.replace('[dependencies]','[dependencies]\nring = "0.17.14"',1)
              else:
                  manifest_text=manifest_text.rstrip()+'\n\n[dependencies]\nring = "0.17.14"\n'
