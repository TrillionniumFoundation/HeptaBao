on:
  push:
    branches:
      - ops/v24-compat-signature-r1-20260909

permissions:
  contents: write

concurrency:
  group: heptabao-v24-compat-signature-r1
  cancel-in-progress: false

env:
  EXACT_PARENT: 633848024e5315f3def23c035a1dec53f83a62b3
  OUTPUT_BRANCH: codex/openbao-replacement-v2.4-compat-signature-source-20260909

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    steps:
      - name: Checkout exact controller head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Add signed evidence admission to existing compatibility package
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXACT_PARENT"
          python - <<'PY'
          from pathlib import Path
          import re

          manifest=Path('crates/heptabao-compatibility/Cargo.toml')
          manifest_text=manifest.read_text(encoding='utf-8')
