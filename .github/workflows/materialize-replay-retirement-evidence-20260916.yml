name: materialize-replay-retirement-evidence-20260916
on:
  push:
    branches:
      - codex/next-round-product-closure-20260916
permissions:
  contents: write
jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Bind exact parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "75147cb00fde95b893999aec9c5c77426234ee79"
      - name: Regenerate exact-head evidence
        shell: bash
        run: |
          set -euo pipefail
          python scripts/current_source_inventory.py --write
          python scripts/generate_module_closure_docs.py
          python scripts/current_source_inventory.py --check
          python scripts/validate_module_closure.py
          python scripts/validate_current_documentation_semantics.py
          python scripts/validate_runtime_doc_truth.py
          python scripts/validate_replacement_execution.py
          git diff --check
      - name: Remove transport and publish evidence
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/materialize-replay-retirement-evidence-20260916.yml
          git diff --check
          git config user.name "OpenAI evidence materializer"
          git config user.email "noreply@openai.com"
          git add -A
          git commit -m "docs: refresh exact-head replay retirement evidence"
          git push origin HEAD:codex/next-round-product-closure-20260916
