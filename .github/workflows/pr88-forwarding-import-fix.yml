name: PR88 forwarding import fix

on:
  push:
    branches:
      - ops/pr88-forwarding-materializer-20260911-gpt56

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]' && github.actor != 'actions'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true
      - name: Import Zeroize for forwarded token cleanup
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('crates/heptabao-server/src/http.rs')
          text = p.read_text()
          old = 'use zeroize::Zeroizing;\n'
          new = 'use zeroize::{Zeroize, Zeroizing};\n'
          if text.count(old) != 1:
              raise SystemExit(f'zeroize import target mismatch: {text.count(old)}')
          p.write_text(text.replace(old, new, 1))
          PY
          git diff --check
          git config user.name heptabao-materializer
          git config user.email actions@users.noreply.github.com
          git add crates/heptabao-server/src/http.rs
          git commit -m "fix(ha): import token zeroization trait for forwarding"
          git push origin "HEAD:${GITHUB_REF_NAME}"
