name: HeptaBao V2.1 exact head and prospective main merge

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: v2-1-main-exact-merge-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  exact-head:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      SOURCE_KIND: exact-head
      SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - name: Checkout immutable exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact source identity
        shell: bash
        run: |
          set -euo pipefail
          for value in "$SOURCE_SHA" "$HEAD_SHA" "$BASE_SHA"; do
            [[ "$value" =~ ^[0-9a-f]{40}$ ]]
          done
          test "$SOURCE_KIND" = exact-head
          test "$SOURCE_SHA" = "$HEAD_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-plan.txt

      - name: Install validation dependencies and Rust
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --requirement requirements-plan.txt
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy

      - name: Run complete exact-head gates
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_repository_v2.py
          python -m unittest discover -s tests/repository -p 'test_*.py' -v
          python -m unittest discover -s tests/security -p 'test_*.py' -v
          python scripts/validate_workflow_trust.py
          python scripts/validate_module_documentation_v1_4_4.py
          python -m unittest discover -s tests/plan -p 'test_module_documentation_v1_4_4.py' -v
          python -m unittest discover -s tests/plan -p 'test_external_completion_evidence_v1.py' -v
          python -m unittest discover -s tests/platform -p 'test_*.py' -v
          python -m unittest discover -s tests/oracle -p 'test_*.py' -v
          python -m compileall -q scripts tests
          cargo +1.98.0 fmt --all -- --check
          cargo +1.98.0 test --locked --workspace --all-targets
          cargo +1.98.0 clippy --locked --workspace --all-targets -- -D warnings
          cargo +1.98.0 doc --locked --workspace --no-deps
          cargo +1.98.0 build --locked -p heptabao-server
          python -m unittest discover -s qa/openbao-acceptance/tests -v
          python qa/single-node/smoke.py --binary "$PWD/target/debug/heptabao-server" --work-dir "$RUNNER_TEMP/heptabao-single-node-$GITHUB_JOB"
          git diff --exit-code

  prospective-main-merge:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      SOURCE_KIND: prospective-merge
      SOURCE_SHA: ${{ github.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - name: Checkout immutable prospective merge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify prospective merge identity
        shell: bash
        run: |
          set -euo pipefail
          for value in "$SOURCE_SHA" "$HEAD_SHA" "$BASE_SHA"; do
            [[ "$value" =~ ^[0-9a-f]{40}$ ]]
          done
          test "$SOURCE_KIND" = prospective-merge
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          read -r commit parent_one parent_two extra <<<"$(git rev-list --parents -n 1 HEAD)"
          test "$commit" = "$SOURCE_SHA"
          test "$parent_one" = "$BASE_SHA"
          test "$parent_two" = "$HEAD_SHA"
          test -z "${extra:-}"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-plan.txt

      - name: Install validation dependencies and Rust
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --requirement requirements-plan.txt
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy

      - name: Run complete prospective-merge gates
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_repository_v2.py
          python -m unittest discover -s tests/repository -p 'test_*.py' -v
          python -m unittest discover -s tests/security -p 'test_*.py' -v
          python scripts/validate_workflow_trust.py
          python scripts/validate_module_documentation_v1_4_4.py
          python -m unittest discover -s tests/plan -p 'test_module_documentation_v1_4_4.py' -v
          python -m unittest discover -s tests/plan -p 'test_external_completion_evidence_v1.py' -v
          python -m unittest discover -s tests/platform -p 'test_*.py' -v
          python -m unittest discover -s tests/oracle -p 'test_*.py' -v
          python -m compileall -q scripts tests
          cargo +1.98.0 fmt --all -- --check
          cargo +1.98.0 test --locked --workspace --all-targets
          cargo +1.98.0 clippy --locked --workspace --all-targets -- -D warnings
          cargo +1.98.0 doc --locked --workspace --no-deps
          cargo +1.98.0 build --locked -p heptabao-server
          python -m unittest discover -s qa/openbao-acceptance/tests -v
          python qa/single-node/smoke.py --binary "$PWD/target/debug/heptabao-server" --work-dir "$RUNNER_TEMP/heptabao-single-node-$GITHUB_JOB"
          git diff --exit-code
