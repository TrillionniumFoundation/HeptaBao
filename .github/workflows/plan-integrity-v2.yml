name: plan-integrity-v2

on:
  push:
    branches: ["main", "codex/plan-v1.1-h00-execution"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plan-integrity-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semantic-plan-and-governance:
    if: ${{ (github.event_name != 'pull_request' || github.head_ref != 'codex/plan-v1.3-gap-closure-v2') && (github.event_name != 'push' || github.ref != 'refs/heads/codex/plan-v1.3-gap-closure-v2') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify exact source binding
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected"
          git diff --quiet
          git diff --cached --quiet

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: "requirements-plan.txt"

      - name: Install plan validator dependencies
        run: python -m pip install --disable-pip-version-check --requirement requirements-plan.txt

      - name: Validate executable plan semantics
        run: python scripts/validate_plan_v2.py

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal --component clippy,rustfmt
          rustup override set 1.98.0
          rustc --version --verbose
          cargo --version --verbose

      - name: Rust formatting gate
        run: cargo fmt --all --check

      - name: Rust tests
        run: cargo test --workspace --all-targets --locked

      - name: Rust clippy gate
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Confirm no authority was granted
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import yaml
          flags = yaml.safe_load(open('planning/AUTHORITY_FLAGS_V2.yaml', encoding='utf-8'))['flags']
          enabled = [name for name, value in flags.items() if value and name != 'implementation_started']
          if enabled:
              raise SystemExit(f'unexpected enabled authority flags: {enabled}')
          print('authority remains fail-closed')
          PY
