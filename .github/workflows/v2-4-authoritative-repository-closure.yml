name: HeptaBao V2.4 authoritative repository closure

on:
  push:
    branches:
      - codex/openbao-replacement-v2.4-authoritative-closure-20260909
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: heptabao-v2-4-authoritative-closure-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  exact-head:
    name: exact-head / full repository qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Checkout exact candidate without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Bind exact source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          printf 'commit=%s\ntree=%s\n' "$(git rev-parse HEAD)" "$(git rev-parse 'HEAD^{tree}')"

      - name: Install exact Rust 1.98 toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
          cargo +1.98.0 --version
          rustc +1.98.0 --version

      - name: Validate repository truth and compatibility denominator
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_repository_v2.py
          python scripts/validate_compatibility_corpus.py
          python -m unittest discover -s tests/repository -p 'test_*.py'

      - name: Check Rust formatting
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.98.0 fmt --all -- --check

      - name: Test all workspace targets
        shell: bash
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=30s 5400s \
            cargo +1.98.0 test --workspace --all-targets --locked -- --test-threads=1

      - name: Run strict Clippy
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.98.0 clippy --workspace --all-targets --locked -- -D warnings

      - name: Build documentation and server
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.98.0 doc --workspace --no-deps --locked
          cargo +1.98.0 build --locked -p heptabao-server

      - name: Verify final clean tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

  prospective-main:
    name: prospective main merge / repository qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Checkout exact candidate without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Construct prospective main merge
        shell: bash
        run: |
          set -euo pipefail
          candidate="$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$candidate"
          git -c protocol.version=2 fetch --no-tags --prune --depth=1 \
            https://github.com/TrillionniumFoundation/HeptaBao.git \
            +refs/heads/main:refs/remotes/origin/main
          main="$(git rev-parse refs/remotes/origin/main)"
          git checkout --detach "$main"
          git -c user.name='HeptaBao qualification' \
              -c user.email='qualification@invalid.example' \
              merge --no-commit --no-ff "$candidate"
          test -f .git/MERGE_HEAD
          test "$(cat .git/MERGE_HEAD)" = "$candidate"
          printf 'candidate=%s\nmain=%s\nprospective_tree=%s\n' \
            "$candidate" "$main" "$(git write-tree)"

      - name: Install exact Rust 1.98 toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy

      - name: Validate prospective merge
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_repository_v2.py
          python scripts/validate_compatibility_corpus.py
          python -m unittest discover -s tests/repository -p 'test_*.py'
          cargo +1.98.0 fmt --all -- --check
          timeout --signal=TERM --kill-after=30s 5400s \
            cargo +1.98.0 test --workspace --all-targets --locked -- --test-threads=1
          cargo +1.98.0 clippy --workspace --all-targets --locked -- -D warnings
          cargo +1.98.0 doc --workspace --no-deps --locked
          cargo +1.98.0 build --locked -p heptabao-server

      - name: Verify prospective merge remains bounded
        shell: bash
        run: |
          set -euo pipefail
          test -f .git/MERGE_HEAD
          test -z "$(git ls-files --others --exclude-standard)"
