name: HeptaBao V2.4 plugin provider attestation recovery r3

on:
  push:
    branches:
      - ops/v24-plugin-attestation-r3-20260909

permissions:
  contents: write

concurrency:
  group: heptabao-v24-plugin-attestation-r3-recovery-v2
  cancel-in-progress: true

env:
  BASE_SHA: 633848024e5315f3def23c035a1dec53f83a62b3
  INPUT_BRANCH: codex/openbao-replacement-v2.4-plugin-toctou-source-20260909
  OUTPUT_BRANCH: codex/openbao-replacement-v2.4-plugin-host-source-r3-20260909
  RECOVERY_PARENT_SHA: 073e9d01310d21dd1c0bcac6eed62652ba4d30bd
  ORIGINAL_CONTROLLER_SHA: 968aa62a9d7409229883c0a15be1f6afb9775831
  ORIGINAL_WORKFLOW: .github/workflows/v24-plugin-attestation-r3.yml

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout recovery controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Verify immutable provider-attestation source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$RECOVERY_PARENT_SHA"
          test "$(git merge-base "$RECOVERY_PARENT_SHA" "$BASE_SHA")" = "$BASE_SHA"
          test "$(git rev-parse "$ORIGINAL_CONTROLLER_SHA^")" = "$BASE_SHA"
          test "$(git rev-parse "$ORIGINAL_CONTROLLER_SHA:$ORIGINAL_WORKFLOW")" = "506c28f9e3c0cdbd5081f066ba637fc95dc26986"

      - name: Wait for qualified immutable plugin source
        shell: bash
        run: |
          set -euo pipefail
          deadline=$((SECONDS + 9000))
          while [ "$SECONDS" -lt "$deadline" ]; do
            git fetch --no-tags origin "+refs/heads/$INPUT_BRANCH:refs/remotes/origin/plugin-r2" || true
            if git show-ref --verify --quiet refs/remotes/origin/plugin-r2; then
              source_sha="$(git rev-parse refs/remotes/origin/plugin-r2)"
              git merge-base --is-ancestor "$BASE_SHA" "$source_sha"
              printf 'SOURCE_SHA=%s\n' "$source_sha" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 20
          done
          echo 'plugin TOCTOU r2 source did not materialize' >&2
          exit 1

      - name: Execute exact provider-attestation hardening block
        shell: bash
        run: |
          set -euo pipefail
          git show "$ORIGINAL_CONTROLLER_SHA:$ORIGINAL_WORKFLOW" > "$RUNNER_TEMP/original-plugin-r3.yml"
          python - "$RUNNER_TEMP/original-plugin-r3.yml" "$RUNNER_TEMP/harden-plugin-r3.sh" <<'PY'
          from pathlib import Path
          import sys

          lines = Path(sys.argv[1]).read_text(encoding="utf-8").splitlines()
          marker = "      - name: Add provider-attestation admission in isolated worktree"
          start = lines.index(marker)
          run_index = next(i for i in range(start + 1, min(start + 10, len(lines))) if lines[i] == "        run: |")
          body = []
          for line in lines[run_index + 1:]:
              if line.startswith("      - name: "):
                  break
              body.append(line[10:] if line.startswith("          ") else line)
          text = "\n".join(body) + "\n"
          if chr(36) + "{{" in text:
              raise SystemExit("unresolved workflow expression in extracted attestation block")
          Path(sys.argv[2]).write_text(text, encoding="utf-8")
          PY
          chmod 0700 "$RUNNER_TEMP/harden-plugin-r3.sh"
          bash "$RUNNER_TEMP/harden-plugin-r3.sh"
