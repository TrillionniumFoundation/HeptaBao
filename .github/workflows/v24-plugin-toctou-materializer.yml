name: HeptaBao V2.4 plugin TOCTOU materializer

on:
  push:
    branches:
      - ops/v24-plugin-toctou-fix-r1-20260909

permissions:
  contents: write

concurrency:
  group: heptabao-v24-plugin-toctou-r1
  cancel-in-progress: false

env:
  EXACT_PARENT: 633848024e5315f3def23c035a1dec53f83a62b3
  OUTPUT_BRANCH: codex/openbao-replacement-v2.4-plugin-toctou-20260909

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact staging head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Apply immutable executable staging repair
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXACT_PARENT"
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('crates/heptabao-plugin-host/src/lib.rs')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'use std::fs::{self, OpenOptions};',
              'use std::fs::{self, File, OpenOptions};',
          )
          text = text.replace(
              'use std::process::{Command, Stdio};',
              'use std::process::{self, Command, Stdio};',
          )
          text = text.replace(
              'use ring::digest::{Context, SHA256};',
              'use ring::digest::{Context, SHA256};\nuse ring::rand::{SecureRandom, SystemRandom};',
          )

          replacement = r'''#[derive(Debug)]
struct StagedExecutables {
    root: PathBuf,
    sandbox_provider: PathBuf,
    plugin: PathBuf,
}

impl Drop for StagedExecutables {
    fn drop(&mut self) {
        let _ = fs::remove_dir_all(&self.root);
    }
}

fn executable_name(stem: &str, source: &Path) -> String {
    match source.extension().and_then(|extension| extension.to_str()) {
        Some(extension) if !extension.is_empty() => format!("{stem}.{extension}"),
        _ => stem.to_owned(),
    }
}

fn create_private_stage() -> Result<PathBuf, SandboxFailure> {
    let parent = std::env::temp_dir();
    if !parent.is_absolute() || !path_components_are_real(&parent) {
        return Err(SandboxFailure::BeforeEntry);
    }
    let random = SystemRandom::new();
    for _ in 0..32 {
        let mut nonce = [0_u8; 16];
        random
            .fill(&mut nonce)
            .map_err(|_| SandboxFailure::BeforeEntry)?;
        let suffix = nonce
            .iter()
            .map(|byte| format!("{byte:02x}"))
            .collect::<String>();
        let root = parent.join(format!(
            "heptabao-plugin-stage-{}-{suffix}",
            process::id()
        ));
        #[cfg(unix)]
        let created = {
            use std::os::unix::fs::DirBuilderExt;
            let mut builder = fs::DirBuilder::new();
            builder.mode(0o700);
            builder.create(&root)
        };
        #[cfg(not(unix))]
        let created = fs::create_dir(&root);
        match created {
            Ok(()) => return Ok(root),
            Err(error) if error.kind() == io::ErrorKind::AlreadyExists => continue,
            Err(_) => return Err(SandboxFailure::BeforeEntry),
        }
    }
    Err(SandboxFailure::BeforeEntry)
}

fn read_verified_executable(
    path: &Path,
    expected: [u8; 32],
) -> Result<Vec<u8>, SandboxFailure> {
    if !path.is_absolute() || !path_components_are_real(path) {
        return Err(SandboxFailure::BeforeEntry);
    }
    let metadata = fs::symlink_metadata(path).map_err(|_| SandboxFailure::BeforeEntry)?;
    if metadata.file_type().is_symlink()
        || !metadata.is_file()
        || metadata.len() == 0
        || metadata.len() > MAX_EXECUTABLE_BYTES
    {
        return Err(SandboxFailure::BeforeEntry);
    }
    #[cfg(unix)]
    {
        use std::os::unix::fs::PermissionsExt;
        let mode = metadata.permissions().mode();
        if mode & 0o022 != 0 || mode & 0o100 == 0 {
            return Err(SandboxFailure::BeforeEntry);
        }
    }
    let mut options = OpenOptions::new();
    options.read(true);
    #[cfg(target_os = "linux")]
    {
        use std::os::unix::fs::OpenOptionsExt;
        options.custom_flags(0o400000 | 0o2000000);
    }
    let mut file = options
        .open(path)
        .map_err(|_| SandboxFailure::BeforeEntry)?;
    let opened = file.metadata().map_err(|_| SandboxFailure::BeforeEntry)?;
    if !opened.is_file() || opened.len() != metadata.len() {
        return Err(SandboxFailure::BeforeEntry);
    }
    #[cfg(unix)]
    {
        use std::os::unix::fs::MetadataExt;
        if opened.dev() != metadata.dev() || opened.ino() != metadata.ino() {
            return Err(SandboxFailure::BeforeEntry);
        }
    }
    let capacity = usize::try_from(opened.len()).map_err(|_| SandboxFailure::BeforeEntry)?;
    let mut bytes = Vec::with_capacity(capacity);
    let mut digest = Context::new(&SHA256);
    let mut buffer = [0_u8; 16 * 1024];
    let mut observed = 0_u64;
    loop {
        let count = file
            .read(&mut buffer)
            .map_err(|_| SandboxFailure::BeforeEntry)?;
        if count == 0 {
            break;
        }
        observed = observed
            .checked_add(count as u64)
            .ok_or(SandboxFailure::BeforeEntry)?;
        if observed > MAX_EXECUTABLE_BYTES {
            return Err(SandboxFailure::BeforeEntry);
        }
        digest.update(&buffer[..count]);
        bytes.extend_from_slice(&buffer[..count]);
    }
    if observed != opened.len() || digest.finish().as_ref() != expected {
        return Err(SandboxFailure::BeforeEntry);
    }
    Ok(bytes)
}

fn write_staged_executable(path: &Path, bytes: &[u8]) -> Result<File, SandboxFailure> {
    let mut options = OpenOptions::new();
    options.write(true).create_new(true);
    #[cfg(unix)]
    {
        use std::os::unix::fs::OpenOptionsExt;
        options.mode(0o500);
    }
    let mut file = options
        .open(path)
        .map_err(|_| SandboxFailure::BeforeEntry)?;
    file.write_all(bytes)
        .and_then(|()| file.flush())
        .and_then(|()| file.sync_all())
        .map_err(|_| SandboxFailure::BeforeEntry)?;
    #[cfg(unix)]
    {
        use std::os::unix::fs::PermissionsExt;
        fs::set_permissions(path, fs::Permissions::from_mode(0o500))
            .map_err(|_| SandboxFailure::BeforeEntry)?;
    }
    Ok(file)
}

fn stage_executables(manifest: &PluginManifest) -> Result<StagedExecutables, SandboxFailure> {
    let sandbox_source = Path::new(manifest.sandbox().command.as_str());
    let plugin_source = Path::new(manifest.descriptor().command().as_str());
    let sandbox_bytes = read_verified_executable(
        sandbox_source,
        manifest.sandbox().command_sha256,
    )?;
    let plugin_bytes = read_verified_executable(
        plugin_source,
        *manifest.descriptor().checksum(),
    )?;
    let root = create_private_stage()?;
    let sandbox_provider = root.join(executable_name("sandbox-provider", sandbox_source));
    let plugin = root.join(executable_name("plugin", plugin_source));
    let staged = (|| {
        let sandbox_file = write_staged_executable(&sandbox_provider, &sandbox_bytes)?;
        let plugin_file = write_staged_executable(&plugin, &plugin_bytes)?;
        let directory = File::open(&root).map_err(|_| SandboxFailure::BeforeEntry)?;
        directory
            .sync_all()
            .map_err(|_| SandboxFailure::BeforeEntry)?;
        drop(sandbox_file);
        drop(plugin_file);
        Ok(StagedExecutables {
            root: root.clone(),
            sandbox_provider,
            plugin,
        })
    })();
    if staged.is_err() {
        let _ = fs::remove_dir_all(&root);
    }
    staged
}

impl SandboxRunner for CommandSandboxRunner {
    fn admit(&self, manifest: &PluginManifest) -> Result<(), SandboxFailure> {
        let _staged = stage_executables(manifest)?;
        Ok(())
    }

    fn invoke(
        &self,
        manifest: &PluginManifest,
        operation: PluginOperation,
        request: &SecretValue,
        environment: &SecretEnvironment,
    ) -> Result<SecretValue, SandboxFailure> {
        if request.len() > manifest.limits().maximum_request_bytes {
            return Err(SandboxFailure::BeforeEntry);
        }
        if environment
            .iter()
            .any(|(name, _)| !manifest.environment_allowlist().contains(name))
        {
            return Err(SandboxFailure::BeforeEntry);
        }
        let frame = encode_request(
            manifest.descriptor().protocol_version(),
            operation,
            request.expose(),
        )
        .map_err(|_| SandboxFailure::BeforeEntry)?;
        let staged = stage_executables(manifest)?;
        let mut command = Command::new(&staged.sandbox_provider);
        command
            .arg("--heptabao-profile")
            .arg(manifest.sandbox().profile_id.as_str())
            .arg("--heptabao-plugin")
            .arg(&staged.plugin)
            .arg("--heptabao-protocol")
            .arg(manifest.descriptor().protocol_version().to_string())
            .arg("--heptabao-operation")
            .arg(operation.as_str())
            .env_clear()
            .env(
                "HEPTABAO_SANDBOX_PROVIDER",
                manifest.sandbox().provider_id.as_str(),
            )
            .stdin(Stdio::piped())
            .stdout(Stdio::piped())
            .stderr(Stdio::null());
        for (name, value) in environment.iter() {
            command.env(name, value);
        }
        let mut child = command.spawn().map_err(|_| SandboxFailure::BeforeEntry)?;
        let mut stdin = child
            .stdin
            .take()
            .ok_or(SandboxFailure::OutcomeUnknownAfterEntry)?;
        if stdin.write_all(&frame).is_err() || stdin.flush().is_err() {
            let _ = child.kill();
            let _ = child.wait();
            return Err(SandboxFailure::OutcomeUnknownAfterEntry);
        }
        drop(stdin);
        let stdout = child
            .stdout
            .take()
            .ok_or(SandboxFailure::OutcomeUnknownAfterEntry)?;
        let maximum = manifest
            .limits()
            .maximum_response_bytes
            .checked_add(9)
            .ok_or(SandboxFailure::BeforeEntry)?;
        let reader = thread::spawn(move || read_bounded(stdout, maximum));
        let deadline = Instant::now() + Duration::from_millis(manifest.limits().timeout_ms);
        let status = loop {
            match child.try_wait() {
                Ok(Some(status)) => break status,
                Ok(None) if Instant::now() < deadline => thread::sleep(Duration::from_millis(5)),
                Ok(None) | Err(_) => {
                    let _ = child.kill();
                    let _ = child.wait();
                    let _ = reader.join();
                    return Err(SandboxFailure::OutcomeUnknownAfterEntry);
                }
            }
        };
        let output = reader
            .join()
            .map_err(|_| SandboxFailure::OutcomeUnknownAfterEntry)?
            .map_err(|_| SandboxFailure::OutcomeUnknownAfterEntry)?;
        if !status.success() {
            return Err(SandboxFailure::OutcomeUnknownAfterEntry);
        }
        decode_response(&output, manifest.limits().maximum_response_bytes)
            .map_err(|_| SandboxFailure::OutcomeUnknownAfterEntry)
    }
}

fn verify_file(path: &Path, expected: [u8; 32]) -> Result<(), SandboxFailure> {
    read_verified_executable(path, expected).map(|_| ())
}

fn path_components_are_real'''

          pattern = re.compile(
              r'impl SandboxRunner for CommandSandboxRunner \{.*?\n\}\n\nfn verify_file\(.*?\n\}\n\nfn path_components_are_real',
              re.S,
          )
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'plugin-host replacement matched {count} regions')
          if 'Command::new(manifest.sandbox().command.as_str())' in text:
