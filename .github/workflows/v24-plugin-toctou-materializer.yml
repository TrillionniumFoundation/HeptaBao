          guide = Path('docs/modules/heptabao-plugin-host.md')
          guide_text = guide.read_text(encoding='utf-8')
          note = '''\n## Immutable executable staging\n\nBefore invocation, the host reads each owner-controlled executable through a no-follow descriptor, validates metadata and SHA-256 over the same opened bytes, and writes those verified bytes into an atomically created owner-private staging directory. The child process executes only the staged sandbox provider and receives only the staged plugin path. Source-path replacement after validation therefore cannot change the invoked bytes. The stage is synchronized before spawn and removed on drop.\n'''
          if '## Immutable executable staging' not in guide_text:
              guide.write_text(guide_text.rstrip() + '\n' + note, encoding='utf-8')
          PY

      - name: Remove write transport and qualify repair
