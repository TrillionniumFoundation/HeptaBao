name: OpenBao 2.6 TOTP corpus fixture

on:
  push:
    branches:
      - ops/openbao-26-totp-corpus-20260911-r1

permissions:
  contents: write

concurrency:
  group: openbao-26-totp-corpus-20260911-r1
  cancel-in-progress: true

env:
  OUTPUT_BRANCH: tmp/openbao-26-totp-corpus-source-20260911-r1

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact controller head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Materialize reviewed TOTP corpus fixture
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: patch anchor mismatch')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          p = Path('qa/openbao-acceptance/acceptance.py')
          text = p.read_text(encoding='utf-8')
          old = '    "transit": ["mount", "create_key", "read_key", "encrypt_v1", "decrypt_v1", "rotate",\n                "read_rotated_key", "encrypt_v2", "decrypt_v2", "decrypt_old_after_rotation"],\n}'
          new = '    "transit": ["mount", "create_key", "read_key", "encrypt_v1", "decrypt_v1", "rotate",\n                "read_rotated_key", "encrypt_v2", "decrypt_v2", "decrypt_old_after_rotation"],\n    "totp": ["roundtrip"],\n}'
          if text.count(old) != 1:
              raise SystemExit('acceptance CASES anchor mismatch')
          text = text.replace(old, new, 1)

          old = '        self.kv, self.transit, self.policy = (f"hbqa-{run_id}-{suffix}" for suffix in ("kv", "transit", "reader"))'
          new = '        self.kv, self.transit, self.totp, self.policy = (\n            f"hbqa-{run_id}-{suffix}" for suffix in ("kv", "transit", "totp", "reader")\n        )'
          if text.count(old) != 1:
              raise SystemExit('acceptance synthetic names anchor mismatch')
          text = text.replace(old, new, 1)

          old = '        payload = {"type": "kv" if kind == "kv" else "transit", "description": self.marker}\n        if kind == "kv":'
          new = '        if kind not in {"kv", "transit", "totp"}:\n            raise BaoError("unsupported_fixture_mount_kind")\n        payload = {"type": kind, "description": self.marker}\n        if kind == "kv":'
          if text.count(old) != 1:
              raise SystemExit('acceptance mount anchor mismatch')
          text = text.replace(old, new, 1)

          anchor = '    def cleanup(self):\n'
          if text.count(anchor) != 1:
              raise SystemExit('acceptance cleanup anchor mismatch')
          function = (
              '    def totp_cases(self):\n'
              '        self.mount("totp", self.totp)\n'
              '        path = "/v1/" + self.totp\n'
              '        key_name = "fixture"\n'
              '        imported = {\n'
              '            "key": "JBSWY3DPEHPK3PXP",\n'
              '            "issuer": "HeptaBao-QA",\n'
              '            "account_name": "synthetic@example.invalid",\n'
              '            "algorithm": "SHA1",\n'
              '            "digits": 6,\n'
              '            "period": 30,\n'
              '            "skew": 1,\n'
              '        }\n'
              '        created = self.call("totp.roundtrip", "POST", path + "/keys/" + key_name, imported)\n'
              '        if created.status not in (200, 204):\n'
              '            self.check("totp.roundtrip", created, (200, 204), key_created=False)\n'
              '            return\n'
              '        code_response = self.client.request("GET", path + "/code/" + key_name)\n'
              '        code = code_response.data().get("code") if code_response.status == 200 else None\n'
              '        validation = self.client.request(\n'
              '            "POST", path + "/code/" + key_name, {"code": code} if isinstance(code, str) else {"code": ""}\n'
              '        )\n'
              '        self.requests["totp.roundtrip"] = {\n'
              '            "method": "MULTI",\n'
              '            "path_template": path.replace(self.run_id, "{run_id}") + "/{keys,code}/fixture",\n'
              '        }\n'
              '        self.check(\n'
              '            "totp.roundtrip", validation, 200,\n'
              '            key_created=created.status in (200, 204),\n'
              '            code_generated=isinstance(code, str) and len(code) == 6 and code.isdigit(),\n'
              '            validation_true=validation.data().get("valid") is True,\n'
              '        )\n\n'
          )
          text = text.replace(anchor, function + anchor, 1)

          old = '            for module in ("kv", "token", "transit"):'
          new = '            for module in ("kv", "token", "transit", "totp"):'
          if text.count(old) != 1:
              raise SystemExit('acceptance module loop anchor mismatch')
          text = text.replace(old, new, 1)
          old = '    parser.add_argument("--modules", default="kv,token,transit")'
          new = '    parser.add_argument("--modules", default="kv,token,transit,totp")'
          if text.count(old) != 1:
              raise SystemExit('acceptance default modules anchor mismatch')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')

          cp = Path('qa/openbao-acceptance/complete_surface_corpus_v1.json')
          corpus = json.loads(cp.read_text(encoding='utf-8'))
          summary = corpus['coverage_summary']
          if (summary['implemented_surface_count'], summary['defined_not_implemented_surface_count'], summary['fixture_case_count']) != (6, 54, 38):
              raise SystemExit('compatibility summary baseline mismatch')
          summary['implemented_surface_count'] = 7
          summary['defined_not_implemented_surface_count'] = 53
          summary['fixture_case_count'] = 39
          row = next(entry for entry in corpus['surfaces'] if entry['surface_id'] == 'HB-SURFACE-SECRET-TOTP')
          if row['fixture_state'] != 'DEFINED_NOT_IMPLEMENTED' or row['fixture_case_ids']:
              raise SystemExit('TOTP surface baseline mismatch')
          row['fixture_state'] = 'IMPLEMENTED_SCOPED'
          row['fixture_case_ids'] = ['totp.roundtrip']
          cp.write_text(json.dumps(corpus, indent=2) + '\n', encoding='utf-8')

          replace_once('scripts/validate_compatibility_corpus.py', '60 surfaces, 38 scoped cases, 0 exact-head independent surfaces', '60 surfaces, 39 scoped cases, 0 exact-head independent surfaces')
          replace_once('tests/repository/test_compatibility_corpus_v2_3.py', 'self.assertEqual(38, len(mapped))', 'self.assertEqual(39, len(mapped))')
          PY
          git diff --check

      - name: Validate corpus and repository
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --requirement requirements-plan.txt
          python scripts/validate_compatibility_corpus.py
          python -m unittest tests.repository.test_compatibility_corpus_v2_3 -v
          python scripts/validate_repository_v2.py
          python -m unittest discover -s tests/repository -p 'test_*.py' -v

      - name: Publish source-only corpus candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'OpenBao 2.6 Corpus Closure'
          git config user.email '102159240+ProfHepta@users.noreply.github.com'
          git add qa/openbao-acceptance/acceptance.py qa/openbao-acceptance/complete_surface_corpus_v1.json scripts/validate_compatibility_corpus.py tests/repository/test_compatibility_corpus_v2_3.py
          git commit -m 'test(compat): add OpenBao TOTP differential fixture'
          git branch -f "$OUTPUT_BRANCH" HEAD
          git push --force-with-lease origin "$OUTPUT_BRANCH"
