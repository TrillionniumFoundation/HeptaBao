name: OpenBao 2.6 TOTP corpus fixture

on:
  push:
    branches:
      - ops/openbao-26-totp-corpus-20260911-r1

permissions:
  contents: write

concurrency:
  group: openbao-26-totp-corpus-20260911-r1
  cancel-in-progress: true

env:
  OUTPUT_BRANCH: tmp/openbao-26-totp-corpus-source-20260911-r1

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact controller head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Apply reviewed TOTP corpus patch
        shell: bash
        env:
          PATCH_B64: 
      - name: Decode and apply patch
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$PATCH_B64" | base64 --decode > "$RUNNER_TEMP/totp.patch"
          git apply --check "$RUNNER_TEMP/totp.patch"
          git apply "$RUNNER_TEMP/totp.patch"
          git diff --check
      - name: Validate corpus and repository
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --requirement requirements-plan.txt
          python scripts/validate_compatibility_corpus.py
          python -m unittest tests.repository.test_compatibility_corpus_v2_3 -v
          python scripts/validate_repository_v2.py
          python -m unittest discover -s tests/repository -p 'test_*.py' -v
      - name: Publish source-only corpus candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'OpenBao 2.6 Corpus Closure'
          git config user.email '102159240+ProfHepta@users.noreply.github.com'
          git add qa/openbao-acceptance/acceptance.py qa/openbao-acceptance/complete_surface_corpus_v1.json scripts/validate_compatibility_corpus.py tests/repository/test_compatibility_corpus_v2_3.py
          git commit -m 'test(compat): add OpenBao TOTP differential fixture'
          git branch -f "$OUTPUT_BRANCH" HEAD
          git push --force-with-lease origin "$OUTPUT_BRANCH"
