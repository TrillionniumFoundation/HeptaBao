name: phase5-core-pipeline-effect-materializer-20260916
on:
  push:
    branches:
      - codex/phase5-60-surface-closure-20260916
permissions:
  contents: write
jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Bind exact parent
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "e70b5f96c844b277657401a66d7b58886519bdf5"
      - name: Install Rust 1.98
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
      - name: Materialize request effect classes and tests
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          service = Path('crates/heptabao-server/src/service.rs')
          s = service.read_text()
          anchor = '''struct RequestView<'a> {\n    method: &'a str,\n    path: &'a str,\n    namespace: &'a str,\n    token: &'a str,\n    body: &'a Value,\n    now: u64,\n    allow_forward: bool,\n    wrap_ttl_seconds: Option<u64>,\n}\n\n'''
          insert = anchor + '''#[derive(Clone, Copy, Debug, PartialEq, Eq)]\nenum RequestEffectClass {\n    PureRead,\n    DurableMutation,\n    SideEffectingRead,\n}\n\nimpl RequestEffectClass {\n    fn observe(method: &str, before_generation: Option<u64>, after_generation: Option<u64>) -> Self {\n        if matches!(method, "GET" | "HEAD" | "LIST" | "SCAN") {\n            if before_generation == after_generation {\n                Self::PureRead\n            } else {\n                Self::SideEffectingRead\n            }\n        } else {\n            Self::DurableMutation\n        }\n    }\n\n    const fn requires_authoritative_recovery_on_result_audit_failure(self) -> bool {\n        !matches!(self, Self::PureRead)\n    }\n}\n\n'''
          if s.count(anchor) != 1:
              raise SystemExit(f'RequestView anchor count={s.count(anchor)}')
          s = s.replace(anchor, insert, 1)

          old = '''        let response = self.handle_inner(RequestView {\n            method,\n            path,\n            namespace,\n            token,\n            body: &body,\n            now,\n            allow_forward,\n            wrap_ttl_seconds,\n        });\n        erase_json(&mut body);\n        if self\n            .audit_event("response", &fingerprint, now, Some(response.status))\n            .is_err()\n        {\n            self.recovery_required = true;\n            return Response::error(\n                503,\n                "response audit failed; outcome unknown; authoritative recovery required",\n            );\n        }\n        response\n'''
          new = '''        let durable_generation_before = self.durable.as_ref().map(DurableService::generation);\n        let response = self.handle_inner(RequestView {\n            method,\n            path,\n            namespace,\n            token,\n            body: &body,\n            now,\n            allow_forward,\n            wrap_ttl_seconds,\n        });\n        let effect_class = RequestEffectClass::observe(\n            method,\n            durable_generation_before,\n            self.durable.as_ref().map(DurableService::generation),\n        );\n        erase_json(&mut body);\n        if self\n            .audit_event("response", &fingerprint, now, Some(response.status))\n            .is_err()\n        {\n            if effect_class.requires_authoritative_recovery_on_result_audit_failure() {\n                self.recovery_required = true;\n                return Response::error(\n                    503,\n                    "response audit failed; outcome unknown; authoritative recovery required",\n                );\n            }\n            return Response::error(503, "response audit failed; read result withheld");\n        }\n        response\n'''
          if s.count(old) != 1:
              raise SystemExit(f'handle_at_mode response block count={s.count(old)}')
          service.write_text(s.replace(old, new, 1))

          tests = Path('crates/heptabao-server/src/service_tests.rs')
          t = tests.read_text()
          anchor = '''#[test]\nfn result_audit_failure_withholds_plaintext_and_preserves_consumed_token_after_reopen()\n-> Result<(), Box<dyn std::error::Error>> {\n'''
          addition = '''#[test]\nfn request_effect_class_distinguishes_reads_mutations_and_side_effecting_reads() {\n    assert_eq!(\n        RequestEffectClass::observe("GET", Some(7), Some(7)),\n        RequestEffectClass::PureRead\n    );\n    assert_eq!(\n        RequestEffectClass::observe("LIST", Some(7), Some(8)),\n        RequestEffectClass::SideEffectingRead\n    );\n    assert_eq!(\n        RequestEffectClass::observe("POST", Some(7), Some(7)),\n        RequestEffectClass::DurableMutation\n    );\n}\n\n#[test]\nfn pure_read_result_audit_failure_withholds_result_without_recovery_fence()\n-> Result<(), Box<dyn std::error::Error>> {\n    let root = Root::new();\n    let mut service = root.service()?;\n    let (key, token) = bootstrap(&mut service)?;\n    assert_eq!(\n        call(\n            &mut service,\n            "PUT",\n            "secret/data/pure-read",\n            &token,\n            json!({"data":{"value":"withhold-pure-read-plaintext"}})\n        )\n        .status,\n        200\n    );\n    let generation = service\n        .durable\n        .as_ref()\n        .ok_or("missing durable service")?\n        .generation();\n    let fingerprint =\n        service.request_fingerprint("GET", "secret/data/pure-read", "", &token);\n    let event = AuditUnsigned {\n        schema: 2,\n        sequence: service.audit_sequence + 1,\n        previous: STANDARD.encode(service.audit_previous),\n        time: 100,\n        kind: "request".into(),\n        path_digest: fingerprint,\n        status: None,\n    };\n    let payload = serde_json::to_vec(&event)?;\n    let mac = STANDARD.encode(hmac::sign(&service.audit_key, &payload).as_ref());\n    let next = serde_json::to_vec(&AuditRecord { event, mac })?.len() + 1;\n    service.audit_capacity = service.audit.metadata()?.len() + next as u64;\n\n    let result = call(\n        &mut service,\n        "GET",\n        "secret/data/pure-read",\n        &token,\n        json!({}),\n    );\n    assert_eq!(result.status, 503);\n    assert!(!result.body.to_string().contains("withhold-pure-read-plaintext"));\n    assert!(!service.recovery_required);\n    assert_eq!(\n        service\n            .durable\n            .as_ref()\n            .ok_or("missing durable service")?\n            .generation(),\n        generation\n    );\n    drop(service);\n\n    let mut service = root.service()?;\n    assert_eq!(\n        call(&mut service, "PUT", "sys/unseal", "", json!({"key":key})).status,\n        200\n    );\n    assert_eq!(\n        call(\n            &mut service,\n            "GET",\n            "secret/data/pure-read",\n            &token,\n            json!({}),\n        )\n        .body["data"]["data"]["value"],\n        "withhold-pure-read-plaintext"\n    );\n    Ok(())\n}\n\n'''
          if t.count(anchor) != 1:
              raise SystemExit(f'audit test anchor count={t.count(anchor)}')
          tests.write_text(t.replace(anchor, addition + anchor, 1))
          PY
          cargo +1.98.0 fmt --all
          cargo +1.98.0 test --locked -p heptabao-server request_effect_class_distinguishes_reads_mutations_and_side_effecting_reads -- --exact
          cargo +1.98.0 test --locked -p heptabao-server pure_read_result_audit_failure_withholds_result_without_recovery_fence -- --exact
          cargo +1.98.0 test --locked -p heptabao-server result_audit_failure_withholds_plaintext_and_preserves_consumed_token_after_reopen -- --exact
          cargo +1.98.0 test --locked -p heptabao-server
          cargo +1.98.0 clippy --locked -p heptabao-server --all-targets -- -D warnings
          git diff --check
      - name: Remove transport and publish runtime closure
        run: |
          set -euo pipefail
          rm .github/workflows/phase5-core-pipeline-effect-materializer-20260916.yml
          git diff --check
          git config user.name "OpenAI phase5 core pipeline integrator"
          git config user.email "noreply@openai.com"
          git add -A
          git commit -m "feat(runtime): distinguish request effect classes"
          git push origin HEAD:codex/phase5-60-surface-closure-20260916
