          if old not in text: raise SystemExit('journal length marker missing')
          text=text.replace(old,new,1)
          text=text.replace(
              'fn create_lock(path: &Path) -> Result<File, JournalError> {',
              'fn create_lock(path: &Path) -> Result<WriterLock, JournalError> {',
              1,
