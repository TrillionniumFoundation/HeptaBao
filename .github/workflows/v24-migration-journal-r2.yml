    path: PathBuf,
    _file: File,
}

impl Drop for WriterLock {
    fn drop(&mut self) {
        let _ = fs::remove_file(&self.path);
    }
}

#[derive(Debug)]
pub struct MigrationJournal {
'''
          if marker not in text: raise SystemExit('MigrationJournal marker missing')
          text=text.replace(marker,insertion,1)
          text=text.replace('    _lock: File,\n','    _lock: WriterLock,\n',1)
          old='''        if length < TAG_BYTES || length > MAX_RECORD_BYTES || bytes.len() - offset - 4 < length {
            break;
        }
