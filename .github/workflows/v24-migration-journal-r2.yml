          text=text.replace(old,new,1)
          old='''        assert!(matches!(MigrationJournal::open(&root, key), Err(JournalError::Tampered) | Err(JournalError::InvalidRecord)));
        let _ = fs::remove_file(root.join("writer.lock"));
