name: HeptaBao total-gap exact source and cargo cache export

on:
  push:
    branches:
      - exec/total-gap-source-cache-export-20260908

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout immutable source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify exact total-gap ancestry and bounded delta
        shell: bash
        run: |
          set -euo pipefail
          base="633848024e5315f3def23c035a1dec53f83a62b3"
          git merge-base --is-ancestor "$base" HEAD
          test "$(git diff --name-only "$base"...HEAD)" = ".github/workflows/total-gap-source-cache-export.yml"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Install Rust and fetch locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
          cargo +1.98.0 fetch --locked
          cargo +1.98.0 metadata --locked --format-version 1 > "$RUNNER_TEMP/metadata.json"
      - name: Bundle exact source and dependency registry
        shell: bash
        run: |
          set -euo pipefail
          base="633848024e5315f3def23c035a1dec53f83a62b3"
          source_out="$RUNNER_TEMP/heptabao-total-gap-source"
          cache_out="$RUNNER_TEMP/heptabao-total-gap-cargo-cache"
          mkdir -p "$source_out" "$cache_out"
          git branch --force exact-total-gap "$base"
          git bundle create "$source_out/heptabao-total-gap.bundle" exact-total-gap
          git bundle verify "$source_out/heptabao-total-gap.bundle"
          printf 'repository=TrillionniumFoundation/HeptaBao\ncommit=%s\ntree=%s\n' "$base" "$(git rev-parse "$base^{tree}")" > "$source_out/source-binding.txt"
          (cd "$source_out" && sha256sum heptabao-total-gap.bundle source-binding.txt > SHA256SUMS)
          tar -C "$CARGO_HOME" -czf "$cache_out/cargo-home-registry.tar.gz" registry
          cp Cargo.lock "$cache_out/Cargo.lock"
          cp "$RUNNER_TEMP/metadata.json" "$cache_out/metadata.json"
          printf 'repository=TrillionniumFoundation/HeptaBao\nsource=%s\n' "$base" > "$cache_out/source-binding.txt"
          (cd "$cache_out" && sha256sum cargo-home-registry.tar.gz Cargo.lock metadata.json source-binding.txt > SHA256SUMS)
      - name: Upload exact source
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: heptabao-total-gap-source
          path: ${{ runner.temp }}/heptabao-total-gap-source/
          if-no-files-found: error
          retention-days: 3
      - name: Upload exact cargo cache
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: heptabao-total-gap-cargo-cache
          path: ${{ runner.temp }}/heptabao-total-gap-cargo-cache/
          if-no-files-found: error
          retention-days: 3
