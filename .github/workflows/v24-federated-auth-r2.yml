          if marker not in text: raise SystemExit('test insertion point missing')
          text=text.replace(marker,test,1)
          path.write_text(text,encoding='utf-8')
          guide=Path('docs/modules/heptabao-federated-auth.md')
          g=guide.read_text(encoding='utf-8')
          if 'strict JOSE header allowlist' not in g:
              g += '\nThe verifier uses a strict JOSE header allowlist, rejects trailing JSON, and binds durable replay identity to issuer, subject, namespace and `jti` rather than signature bytes.\n'
              guide.write_text(g,encoding='utf-8')
          PY
          rm -f .github/workflows/v24-federated-auth-r2.yml
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
          cargo +1.98.0 generate-lockfile
          cargo +1.98.0 fmt --all
          cargo +1.98.0 test --locked -p heptabao-federated-auth --all-targets
          cargo +1.98.0 clippy --locked -p heptabao-federated-auth --all-targets -- -D warnings
          python -m unittest tests.repository.test_federated_auth_v2_4

      - name: Publish package-qualified source when absent
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code origin "refs/heads/$OUTPUT_BRANCH" >/dev/null 2>&1; then
            echo 'qualified source branch already exists; preserving first writer'
            exit 0
          fi
          git config user.name 'HeptaBao V2.4 Federated Auth Repair'
          git config user.email '102159240+ProfHepta@users.noreply.github.com'
          git add -A
          git commit -m 'fix(auth): enforce strict JOSE and stable replay identity'
          git push --force-with-lease="refs/heads/$OUTPUT_BRANCH:" origin "HEAD:refs/heads/$OUTPUT_BRANCH"
