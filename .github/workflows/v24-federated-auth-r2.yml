name: HeptaBao V2.4 federated auth source recovery r2

on:
  push:
    branches:
      - ops/v24-federated-auth-r2-20260909

permissions:
  contents: write

concurrency:
  group: heptabao-v24-federated-auth-r2-recovery
  cancel-in-progress: false

env:
  BASE_SHA: 633848024e5315f3def23c035a1dec53f83a62b3
  MATERIALIZER_BRANCH: ops/v24-federated-auth-r1-20260909
  MATERIALIZER_SHA: db77577dca611f4c6ad3f19b7a3627b5b230f817
  MATERIALIZER_WORKFLOW: .github/workflows/v24-federated-auth-materializer.yml
  PATCH_CONTROLLER_SHA: b1ee8bf53241e64b034509d3c2ac49ea97544cf9
  PATCH_WORKFLOW: .github/workflows/v24-federated-auth-r2.yml
  OUTPUT_BRANCH: codex/openbao-replacement-v2.4-federated-auth-source-20260909

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout recovery controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Verify immutable controller inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$PATCH_CONTROLLER_SHA"
          test "$(git merge-base "$PATCH_CONTROLLER_SHA" "$BASE_SHA")" = "$BASE_SHA"
          test "$(git rev-parse "$PATCH_CONTROLLER_SHA:$PATCH_WORKFLOW")" = "9a08601b46bf768c81a1d2a3161d11d287e22ce6"
          git fetch --no-tags origin "+refs/heads/$MATERIALIZER_BRANCH:refs/remotes/origin/federated-materializer"
          test "$(git rev-parse refs/remotes/origin/federated-materializer)" = "$MATERIALIZER_SHA"
          test "$(git rev-parse "$MATERIALIZER_SHA^")" = "$BASE_SHA"
          test "$(git rev-parse "$MATERIALIZER_SHA:$MATERIALIZER_WORKFLOW")" = "41eb01743dcb22607a3f5a43e1f0c4e4292d3bc7"
          test "$(git diff --name-only "$BASE_SHA..$MATERIALIZER_SHA")" = "$MATERIALIZER_WORKFLOW"

      - name: Recover and qualify federated auth source
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/heptabao-federated-auth-r2"
          git worktree add --detach "$work" "$BASE_SHA"
          git show "$MATERIALIZER_SHA:$MATERIALIZER_WORKFLOW" > "$RUNNER_TEMP/materializer.yml"
          git show "$PATCH_CONTROLLER_SHA:$PATCH_WORKFLOW" > "$RUNNER_TEMP/patch.yml"
          python - "$RUNNER_TEMP/materializer.yml" "      - name: Materialize federated auth package" "$RUNNER_TEMP/materialize.sh" <<'PY'
          from pathlib import Path
          import sys

          source = Path(sys.argv[1]).read_text(encoding="utf-8").splitlines()
          marker = sys.argv[2]
          start = source.index(marker)
          run_index = next(i for i in range(start + 1, min(start + 10, len(source))) if source[i] == "        run: |")
          body = []
          for line in source[run_index + 1:]:
              if line.startswith("      - name: "):
                  break
              body.append(line[10:] if line.startswith("          ") else line)
          text = "\n".join(line for line in body if "git rev-parse HEAD^" not in line) + "\n"
          denied = ("curl ", "wget ", "git push", "GITHUB_TOKEN", "secrets.", chr(36) + "{{", "rm -rf", "sudo ")
          for token in denied:
              if token in text:
                  raise SystemExit(f"denied materializer token: {token}")
          Path(sys.argv[3]).write_text(text, encoding="utf-8")
          PY
          python - "$RUNNER_TEMP/patch.yml" "      - name: Harden JOSE and durable replay semantics" "$RUNNER_TEMP/harden.sh" <<'PY'
          from pathlib import Path
          import sys

          source = Path(sys.argv[1]).read_text(encoding="utf-8").splitlines()
          marker = sys.argv[2]
          start = source.index(marker)
          run_index = next(i for i in range(start + 1, min(start + 10, len(source))) if source[i] == "        run: |")
          body = []
          for line in source[run_index + 1:]:
              if line.startswith("      - name: "):
                  break
              body.append(line[10:] if line.startswith("          ") else line)
          text = "\n".join(body) + "\n"
          denied = ("curl ", "wget ", "git push", "GITHUB_TOKEN", "secrets.", chr(36) + "{{", "rm -rf", "sudo ")
          for token in denied:
              if token in text:
                  raise SystemExit(f"denied hardening token: {token}")
          Path(sys.argv[3]).write_text(text, encoding="utf-8")
          PY
          chmod 0700 "$RUNNER_TEMP/materialize.sh" "$RUNNER_TEMP/harden.sh"
          (
            cd "$work"
            env -i PATH="$PATH" HOME="$HOME" RUNNER_TEMP="$RUNNER_TEMP" EXACT_PARENT="$BASE_SHA" bash "$RUNNER_TEMP/materialize.sh"
            bash "$RUNNER_TEMP/harden.sh"
            git config user.name 'HeptaBao Federated Auth Recovery'
            git config user.email '102159240+ProfHepta@users.noreply.github.com'
            git add -A
            test -n "$(git status --porcelain)"
            git commit -m 'feat(auth): materialize qualified federated identity boundary'
            new_sha="$(git rev-parse HEAD)"
            if git ls-remote --exit-code origin "refs/heads/$OUTPUT_BRANCH" >/dev/null 2>&1; then
              observed="$(git ls-remote origin "refs/heads/$OUTPUT_BRANCH" | cut -f1)"
              test "$observed" = "$new_sha"
            else
              git push --force-with-lease="refs/heads/$OUTPUT_BRANCH:" origin "$new_sha:refs/heads/$OUTPUT_BRANCH"
            fi
          )
          git worktree remove --force "$work"
