name: HeptaBao V2.4 federated auth source repair r2

on:
  push:
    branches:
      - ops/v24-federated-auth-r2-20260909

permissions:
  contents: write

concurrency:
  group: heptabao-v24-federated-auth-r2
  cancel-in-progress: false

env:
  EXACT_PARENT: 633848024e5315f3def23c035a1dec53f83a62b3
  SOURCE_BRANCH: ops/v24-federated-auth-r1-20260909
  SOURCE_WORKFLOW: .github/workflows/v24-federated-auth-materializer.yml
  OUTPUT_BRANCH: codex/openbao-replacement-v2.4-federated-auth-source-20260909

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    steps:
      - name: Checkout exact repair controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Recover exact authored package source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXACT_PARENT"
          git fetch --no-tags origin "$SOURCE_BRANCH:refs/remotes/origin/source-materializer"
          first_commit="$(git rev-list --ancestry-path --reverse "$EXACT_PARENT..refs/remotes/origin/source-materializer" | head -1)"
          test -n "$first_commit"
          test "$(git rev-parse "$first_commit^")" = "$EXACT_PARENT"
          test "$(git diff --name-only "$EXACT_PARENT..$first_commit")" = "$SOURCE_WORKFLOW"
          git show "$first_commit:$SOURCE_WORKFLOW" > "$RUNNER_TEMP/source.yml"
          python - "$RUNNER_TEMP/source.yml" "$RUNNER_TEMP/materialize.sh" <<'PY'
          from pathlib import Path
          import sys
          lines=Path(sys.argv[1]).read_text(encoding='utf-8').splitlines()
          marker='      - name: Materialize federated auth package'
          start=lines.index(marker)
          run_index=next(i for i in range(start+1,start+8) if lines[i]=='        run: |')
          body=[]
          for line in lines[run_index+1:]:
              if line.startswith('      - name: '): break
              if line and not line.startswith('          '): raise SystemExit('invalid indentation')
              body.append(line[10:] if line else '')
          text='\n'.join(line for line in body if 'git rev-parse HEAD^' not in line)+'\n'
          for token in ('curl ','wget ','git push','GITHUB_TOKEN','secrets.','${{','rm -rf','sudo '):
              if token in text: raise SystemExit(f'denied token: {token}')
          Path(sys.argv[2]).write_text(text,encoding='utf-8')
          PY
          chmod 0700 "$RUNNER_TEMP/materialize.sh"
          env -i PATH="$PATH" HOME="$HOME" RUNNER_TEMP="$RUNNER_TEMP" EXACT_PARENT="$EXACT_PARENT" bash "$RUNNER_TEMP/materialize.sh"

      - name: Harden JOSE and durable replay semantics
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path=Path('crates/heptabao-federated-auth/src/lib.rs')
          text=path.read_text(encoding='utf-8')
          old='''        if let Some(typ) = take_optional_string(&mut header, "typ")? {
            if typ != "JWT" {
                return Err(AuthError::MalformedToken);
            }
        }
        let key = self.keys.get(&key_id).ok_or(AuthError::UnknownKeyId)?;
'''
          new='''        if let Some(typ) = take_optional_string(&mut header, "typ")? {
            if typ != "JWT" {
                return Err(AuthError::MalformedToken);
            }
        }
        if !header.is_empty() {
            return Err(AuthError::MalformedToken);
        }
        let key = self.keys.get(&key_id).ok_or(AuthError::UnknownKeyId)?;
'''
          if old not in text: raise SystemExit('JOSE header insertion point missing')
          text=text.replace(old,new,1)
          old='''        let fingerprint = digest_bytes(token.as_bytes());
        replay.record_once(fingerprint, expires_at, now)?;
        Ok(VerifiedPrincipal {
'''
          new='''        let mut replay_identity = Vec::with_capacity(
            issuer.len()
                + subject.len()
                + token_id.len()
                + namespace.as_ref().map_or(0, String::len)
                + 4,
        );
        for value in [
            issuer.as_str(),
            subject.as_str(),
            namespace.as_deref().unwrap_or(""),
            token_id.as_str(),
        ] {
            replay_identity.extend_from_slice(value.as_bytes());
            replay_identity.push(0);
        }
        replay.record_once(digest_bytes(&replay_identity), expires_at, now)?;
        Ok(VerifiedPrincipal {
'''
          if old not in text: raise SystemExit('replay insertion point missing')
          text=text.replace(old,new,1)
          old='''fn parse_unique_object(bytes: &[u8]) -> Result<BTreeMap<String, Value>, AuthError> {
