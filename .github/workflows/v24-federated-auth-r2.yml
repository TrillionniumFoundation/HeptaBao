name: HeptaBao V2.4 federated auth source recovery r2

on:
  push:
    branches: [ops/v24-federated-auth-r2-20260909]

permissions:
  contents: write

concurrency:
  group: heptabao-v24-federated-auth-r2-final
  cancel-in-progress: true

env:
  BASE_SHA: 633848024e5315f3def23c035a1dec53f83a62b3
  MATERIALIZER_SHA: db77577dca611f4c6ad3f19b7a3627b5b230f817
  MATERIALIZER_WORKFLOW: .github/workflows/v24-federated-auth-materializer.yml
  ORIGINAL_PATCH_SHA: 4a217be15255fbed544f0c059a752f8bb390273d
  PATCH_WORKFLOW: .github/workflows/v24-federated-auth-r2.yml
  OUTPUT_BRANCH: codex/openbao-replacement-v2.4-federated-auth-source-20260909

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout controller history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Verify immutable source objects
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor "$BASE_SHA" HEAD
          test "$(git rev-parse "$MATERIALIZER_SHA^")" = "$BASE_SHA"
          test "$(git rev-parse "$MATERIALIZER_SHA:$MATERIALIZER_WORKFLOW")" = "41eb01743dcb22607a3f5a43e1f0c4e4292d3bc7"
          test "$(git rev-parse "$ORIGINAL_PATCH_SHA^")" = "$BASE_SHA"
          test "$(git rev-parse "$ORIGINAL_PATCH_SHA:$PATCH_WORKFLOW")" = "aaa7ef0f18f7394de98dc5f8d655d7bea6dd21d7"

      - name: Recover, fix and qualify source
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/heptabao-federated-auth-final"
          git worktree add --detach "$work" "$BASE_SHA"
          git show "$MATERIALIZER_SHA:$MATERIALIZER_WORKFLOW" > "$RUNNER_TEMP/materializer.yml"
          git show "$ORIGINAL_PATCH_SHA:$PATCH_WORKFLOW" > "$RUNNER_TEMP/patch.yml"
          python - "$RUNNER_TEMP/materializer.yml" "      - name: Materialize federated auth package" "$RUNNER_TEMP/materialize.sh" <<'PY'
          from pathlib import Path
          import sys

          lines = Path(sys.argv[1]).read_text(encoding="utf-8").splitlines()
          start = lines.index(sys.argv[2])
          run = next(i for i in range(start + 1, min(start + 10, len(lines))) if lines[i] == "        run: |")
          body = []
          for line in lines[run + 1:]:
              if line.startswith("      - name: "):
                  break
              body.append(line[10:] if line.startswith("          ") else line)
          text = "\n".join(x for x in body if "git rev-parse HEAD^" not in x) + "\n"
          for token in ("curl ", "wget ", "git push", "GITHUB_TOKEN", "secrets.", chr(36) + "{{", "rm -rf", "sudo "):
              if token in text:
                  raise SystemExit(f"denied materializer token: {token}")
          Path(sys.argv[3]).write_text(text, encoding="utf-8")
          PY
          python - "$RUNNER_TEMP/patch.yml" "      - name: Harden JOSE and durable replay semantics" "$RUNNER_TEMP/harden.sh" <<'PY'
          from pathlib import Path
          import sys

          lines = Path(sys.argv[1]).read_text(encoding="utf-8").splitlines()
          start = lines.index(sys.argv[2])
          run = next(i for i in range(start + 1, min(start + 10, len(lines))) if lines[i] == "        run: |")
          body = []
          for line in lines[run + 1:]:
              if line.startswith("      - name: "):
                  break
              body.append(line[10:] if line.startswith("          ") else line)
          text = "\n".join(body) + "\n"
          original = "cargo +1.98.0 clippy --locked -p heptabao-federated-auth --all-targets -- -D warnings\n"
          replacement = "cargo +1.98.0 clippy --fix --allow-dirty --allow-staged --locked -p heptabao-federated-auth --all-targets\ncargo +1.98.0 fmt --all\ncargo +1.98.0 test --locked -p heptabao-federated-auth --all-targets\ncargo +1.98.0 clippy --locked -p heptabao-federated-auth --all-targets -- -D warnings\n"
          if text.count(original) != 1:
              raise SystemExit("expected one terminal federated-auth Clippy gate")
          text = text.replace(original, replacement, 1)
          for token in ("curl ", "wget ", "git push", "GITHUB_TOKEN", "secrets.", chr(36) + "{{", "rm -rf", "sudo "):
              if token in text:
                  raise SystemExit(f"denied hardening token: {token}")
          Path(sys.argv[3]).write_text(text, encoding="utf-8")
          PY
          chmod 0700 "$RUNNER_TEMP/materialize.sh" "$RUNNER_TEMP/harden.sh"
          (
            cd "$work"
            env -i PATH="$PATH" HOME="$HOME" RUNNER_TEMP="$RUNNER_TEMP" EXACT_PARENT="$BASE_SHA" bash "$RUNNER_TEMP/materialize.sh"
            python - <<'PY'
          from pathlib import Path
          manifest = Path("crates/heptabao-federated-auth/Cargo.toml")
          text = manifest.read_text(encoding="utf-8")
          needle = "license.workspace = true\n"
          if text.count(needle) != 1:
              raise SystemExit("expected one unresolved workspace license inheritance")
          manifest.write_text(text.replace(needle, "", 1), encoding="utf-8")
          PY
            bash "$RUNNER_TEMP/harden.sh"
            git config user.name 'HeptaBao Federated Auth Recovery'
            git config user.email '102159240+ProfHepta@users.noreply.github.com'
            git add -A
            test -n "$(git status --porcelain)"
            git commit -m 'feat(auth): materialize qualified federated identity boundary'
            new_sha="$(git rev-parse HEAD)"
            if git ls-remote --exit-code origin "refs/heads/$OUTPUT_BRANCH" >/dev/null 2>&1; then
              test "$(git ls-remote origin "refs/heads/$OUTPUT_BRANCH" | cut -f1)" = "$new_sha"
            else
              git push --force-with-lease="refs/heads/$OUTPUT_BRANCH:" origin "$new_sha:refs/heads/$OUTPUT_BRANCH"
            fi
          )
          git worktree remove --force "$work"
