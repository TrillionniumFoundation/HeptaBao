    UniqueObject::deserialize(&mut deserializer)
        .map(|object| object.0)
        .map_err(|error| {
            if error.to_string().contains("duplicate JSON member") {
                AuthError::DuplicateJsonKey
            } else {
                AuthError::InvalidJson
            }
        })
}
'''
          new='''fn parse_unique_object(bytes: &[u8]) -> Result<BTreeMap<String, Value>, AuthError> {
