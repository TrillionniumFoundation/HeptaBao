name: HeptaBao V2 inherited-gate materializer

on:
  push:
    branches:
      - codex/ci-trust-boundary-closure-20260907

permissions:
  contents: write

jobs:
  materialize:
    if: github.event.head_commit.message == 'ci(v2): materialize generation-aware inherited gates'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout exact staging commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify exact staging identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '${{ github.sha }}'
          test "$(git rev-parse HEAD^)" = '93debe12f08c90816d12e331c04c1bf56b683d6b'
          test "$(git diff --name-only HEAD^ HEAD)" = '.github/workflows/v2-inherited-gates-materializer-20260907.yml'
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Materialize generation-aware inherited gates
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          repo = Path('.')
          current = '''          if [[ -f planning/HEPTABAO_CANONICAL_PROJECT_STATE_V2_0.yaml ]]; then
            python scripts/validate_repository_v2.py
            python -m unittest discover -s tests/repository -p 'test_*.py' -v
            python scripts/validate_module_documentation_v1_4_4.py
            python -m unittest discover -s tests/plan -p 'test_module_documentation_v1_4_4.py' -v
            python -m unittest discover -s tests/plan -p 'test_external_completion_evidence_v1.py' -v
            python -m unittest discover -s tests/platform -p 'test_*.py' -v
            python -m unittest discover -s tests/oracle -p 'test_*.py' -v
          else
          {legacy}          fi
          '''

          replacements = {
              '.github/workflows/plan-v1.4.5-security-invariant-closure.yml': (
                  '''          python scripts/validate_plan_v1_4_5.py
          python -m unittest discover -s tests/plan -p 'test_plan_v1_4_5.py' -v
          python scripts/validate_module_documentation_v1_4_4.py
          python -m unittest discover -s tests/plan -p 'test_module_documentation_v1_4_4.py' -v
          python -m unittest discover -s tests/platform -p 'test_*.py' -v
          python -m unittest discover -s tests/oracle -p 'test_*.py' -v
          ''',
                  '''            python scripts/validate_plan_v1_4_5.py
            python -m unittest discover -s tests/plan -p 'test_plan_v1_4_5.py' -v
            python scripts/validate_module_documentation_v1_4_4.py
            python -m unittest discover -s tests/plan -p 'test_module_documentation_v1_4_4.py' -v
            python -m unittest discover -s tests/platform -p 'test_*.py' -v
            python -m unittest discover -s tests/oracle -p 'test_*.py' -v
          ''',
              ),
              '.github/workflows/plan-v1.4.6-authoritative-recovery-closure.yml': (
                  '''          python scripts/validate_plan_v1_4_6.py
          python -m unittest discover -s tests/plan -p 'test_plan_v1_4_6.py' -v
          python scripts/validate_plan_v1_4_5.py
          python -m unittest discover -s tests/plan -p 'test_plan_v1_4_5.py' -v
          python scripts/validate_module_documentation_v1_4_4.py
          python -m unittest discover -s tests/plan -p 'test_module_documentation_v1_4_4.py' -v
          ''',
                  '''            python scripts/validate_plan_v1_4_6.py
            python -m unittest discover -s tests/plan -p 'test_plan_v1_4_6.py' -v
            python scripts/validate_plan_v1_4_5.py
            python -m unittest discover -s tests/plan -p 'test_plan_v1_4_5.py' -v
            python scripts/validate_module_documentation_v1_4_4.py
            python -m unittest discover -s tests/plan -p 'test_module_documentation_v1_4_4.py' -v
          ''',
              ),
              '.github/workflows/plan-v1.4.7-post-merge-truth-and-external-admission.yml': (
                  '''          python scripts/validate_plan_v1_4_7.py
          python -m unittest discover -s tests/plan -p 'test_*v1_4_7.py' -v
          python -m unittest discover -s tests/plan -p 'test_external_completion_evidence_v1.py' -v
          python scripts/validate_plan_v1_4_6.py
          python -m unittest discover -s tests/plan -p 'test_plan_v1_4_6.py' -v
          python scripts/validate_plan_v1_4_5.py
          python -m unittest discover -s tests/plan -p 'test_plan_v1_4_5.py' -v
          python scripts/validate_module_documentation_v1_4_4.py
          python -m unittest discover -s tests/plan -p 'test_module_documentation_v1_4_4.py' -v
          python -m unittest discover -s tests/platform -p 'test_*.py' -v
          python -m unittest discover -s tests/oracle -p 'test_*.py' -v
          ''',
                  '''            python scripts/validate_plan_v1_4_7.py
            python -m unittest discover -s tests/plan -p 'test_*v1_4_7.py' -v
            python -m unittest discover -s tests/plan -p 'test_external_completion_evidence_v1.py' -v
            python scripts/validate_plan_v1_4_6.py
            python -m unittest discover -s tests/plan -p 'test_plan_v1_4_6.py' -v
            python scripts/validate_plan_v1_4_5.py
            python -m unittest discover -s tests/plan -p 'test_plan_v1_4_5.py' -v
            python scripts/validate_module_documentation_v1_4_4.py
            python -m unittest discover -s tests/plan -p 'test_module_documentation_v1_4_4.py' -v
            python -m unittest discover -s tests/platform -p 'test_*.py' -v
            python -m unittest discover -s tests/oracle -p 'test_*.py' -v
          ''',
              ),
          }

          for name, (old, legacy) in replacements.items():
              path = repo / name
              text = path.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'{name}: validation anchor count={text.count(old)}')
              path.write_text(text.replace(old, current.format(legacy=legacy), 1), encoding='utf-8')
          PY
          rm .github/workflows/v2-inherited-gates-materializer-20260907.yml
          git diff --check

      - name: Install exact validation dependencies
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-plan.txt

      - name: Validate repository and workflow trust
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --requirement requirements-plan.txt
          python scripts/validate_repository_v2.py
          python -m unittest discover -s tests/repository -p 'test_*.py' -v
          python -m unittest discover -s tests/security -p 'test_*.py' -v
          python scripts/validate_workflow_trust.py
          python scripts/validate_module_documentation_v1_4_4.py
          python -m unittest discover -s tests/plan -p 'test_module_documentation_v1_4_4.py' -v
          python -m unittest discover -s tests/plan -p 'test_external_completion_evidence_v1.py' -v
          python -m unittest discover -s tests/platform -p 'test_*.py' -v
          python -m unittest discover -s tests/oracle -p 'test_*.py' -v
          python -m compileall -q scripts tests

      - name: Install exact Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy

      - name: Validate complete Rust workspace
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.98.0 fmt --all -- --check
          cargo +1.98.0 test --locked --workspace --all-targets
          cargo +1.98.0 clippy --locked --workspace --all-targets -- -D warnings
          cargo +1.98.0 doc --locked --workspace --no-deps
          git diff --check

      - name: Publish clean validated head
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .github/workflows/v2-inherited-gates-materializer-20260907.yml
          git config user.name 'HeptaBao V2 gate materializer'
          git config user.email 'heptabao-v2-gates@users.noreply.github.com'
          git add .github/workflows/plan-v1.4.5-security-invariant-closure.yml
          git add .github/workflows/plan-v1.4.6-authoritative-recovery-closure.yml
          git add .github/workflows/plan-v1.4.7-post-merge-truth-and-external-admission.yml
          git add -u .github/workflows/v2-inherited-gates-materializer-20260907.yml
          git commit -m 'ci(v2): make inherited gates generation-aware'
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          git push origin HEAD:refs/heads/codex/ci-trust-boundary-closure-20260907
