name: Temporary apply OpenBao P0 review fixes

on:
  push:
    branches:
      - codex/openbao-replacement-full-closure-20260908

permissions:
  contents: write

concurrency:
  group: temporary-openbao-p0-apply
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact staging commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify, apply, validate, and self-delete
        shell: bash
        run: |
          set -euo pipefail
          branch=codex/openbao-replacement-full-closure-20260908
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

          patch="$RUNNER_TEMP/openbao-p0-review-fixes.patch"
          cat .tmp/openbao-p0-patch-* | base64 --decode > "$patch"
          printf '%s  %s\n' \
            bc77053c1e949ec419be0c6badb37782ac9dfe08aa4791eb426edb325dd349c0 \
            "$patch" | sha256sum --check --strict

          git apply --check "$patch"
          git apply --index "$patch"
          rm -f .tmp/openbao-p0-patch-* .github/workflows/tmp-apply-openbao-p0-20260908.yml
          git add -A
          git diff --cached --check

          for path in \
            .github/workflows/codex-openbao-replacement-ci.yml \
            crates/heptabao-server/src/http.rs \
            crates/heptabao-server/src/service.rs \
            crates/heptabao-server/src/service_tests.rs \
            qa/single-node/smoke.py
          do
            git diff --cached --name-only | grep -Fx "$path"
          done
          test ! -e .github/workflows/tmp-apply-openbao-p0-20260908.yml
          test -z "$(find .tmp -maxdepth 1 -name 'openbao-p0-patch-*' -print -quit 2>/dev/null || true)"

          python -m py_compile qa/single-node/smoke.py
          python -m pip install --disable-pip-version-check --requirement requirements-plan.txt
          python scripts/validate_repository_v2.py
          python -m unittest discover -s tests/repository -p 'test_*.py' -v

          git fetch origin "$branch"
          test "$(git rev-parse "refs/remotes/origin/$branch")" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(server): audit wire rejections and stage initialization'
          git push origin "HEAD:refs/heads/$branch"
