name: PR88 bootstrap leader barrier materializer

on:
  push:
    branches:
      - ops/pr88-bootstrap-leader-barrier-20260911-gpt56

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]' && github.actor != 'actions'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true
      - name: Install Rust 1.98
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
      - name: Add bootstrap leader barrier
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('crates/heptabao-server/src/ha.rs')
          text = p.read_text()
          old = '''        if !existing && config.bootstrap {\n            runtime\n                .block_on(node.initialize_single())\n                .map_err(|error| error.to_string())?;\n            for peer_id in peer_ids.iter().copied().filter(|id| *id != config.node_id) {\n'''
          new = '''        if !existing && config.bootstrap {\n            runtime\n                .block_on(node.initialize_single())\n                .map_err(|error| error.to_string())?;\n            runtime.block_on(async {\n                let deadline = tokio::time::Instant::now() + Duration::from_secs(5);\n                loop {\n                    if node.current_leader().await == Some(config.node_id) {\n                        break Ok::<(), String>(());\n                    }\n                    if tokio::time::Instant::now() >= deadline {\n                        break Err("HA bootstrap did not elect the local node before membership expansion".into());\n                    }\n                    tokio::time::sleep(Duration::from_millis(20)).await;\n                }\n            })?;\n            for peer_id in peer_ids.iter().copied().filter(|id| *id != config.node_id) {\n'''
          if text.count(old) != 1:
              raise SystemExit('bootstrap barrier patch target mismatch')
          p.write_text(text.replace(old, new, 1))
          PY
          cargo +1.98.0 fmt --all
          git diff --check
      - name: Validate HA slice
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.98.0 test --locked -p heptabao-server -p heptabao-raft-runtime --all-targets
          cargo +1.98.0 clippy --locked -p heptabao-server -p heptabao-raft-runtime --all-targets -- -D warnings
      - name: Publish source-only descendant
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/pr88-bootstrap-leader-materializer.yml
          git diff --check
          paths="$(git diff --name-only | sort | tr '\n' ' ')"
          test "$paths" = ".github/workflows/pr88-bootstrap-leader-materializer.yml crates/heptabao-server/src/ha.rs "
          git config user.name heptabao-materializer
          git config user.email actions@users.noreply.github.com
          git add -u
          git commit -m "fix(ha): wait for bootstrap leader before membership expansion"
          git push origin "HEAD:${GITHUB_REF_NAME}"
