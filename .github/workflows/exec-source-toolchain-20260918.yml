name: Export fixed prospective-merge source (read only, not qualification)
on:
  push:
    branches: [exec/heptabao-verified-inputs-20260918]
permissions:
  contents: read
jobs:
  export:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 894b45639a96dfe5201a035089d5d96682a1f92a
          fetch-depth: 0
          persist-credentials: false
      - name: Export fixed merge and head without running their code
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 894b45639a96dfe5201a035089d5d96682a1f92a
          test "$(git rev-parse HEAD^1)" = 55f27e4258ea3f71ab7872cd7a44e8cbd4da1f18
          test "$(git rev-parse HEAD^2)" = 03bc0c0fa719ef1d7804b9aa1c775dd7c5886047
          test "$(git rev-parse HEAD^{tree})" = 1ab62ba7f88b74e1cf68aed36be556167bbcb778
          test "$(git rev-parse HEAD^2^{tree})" = 1ab62ba7f88b74e1cf68aed36be556167bbcb778
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          out="$RUNNER_TEMP/exact-merge-source"
          mkdir -m 700 "$out"
          git bundle create "$out/source.bundle" HEAD
          git bundle verify "$out/source.bundle"
          printf 'merge=%s\nparents=%s\ntree=%s\n' "$(git rev-parse HEAD)" "$(git show -s --format=%P HEAD)" "$(git rev-parse HEAD^{tree})" > "$out/source-binding.txt"
          cd "$out"
          shasum -a 256 source.bundle > SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: exact-merge-source
          path: ${{ runner.temp }}/exact-merge-source/
          if-no-files-found: error
          retention-days: 3
