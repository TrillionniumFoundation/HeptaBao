name: exec-full-replacement-phase1-20260917

on:
  push:
    branches:
      - exec/full-replacement-phase1-20260917

permissions:
  contents: write

jobs:
  materialize-reviewed-phase1:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout immutable execution input
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: exec/full-replacement-phase1-20260917
          fetch-depth: 0
          persist-credentials: true

      - name: Reconstruct and fence reviewed patch
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .github/exec-data/full-replacement-phase1/part-00 \
            .github/exec-data/full-replacement-phase1/part-01 \
            .github/exec-data/full-replacement-phase1/part-02 \
            .github/exec-data/full-replacement-phase1/part-03 \
            .github/exec-data/full-replacement-phase1/part-04 \
            .github/exec-data/full-replacement-phase1/part-05 \
            .github/exec-data/full-replacement-phase1/part-06a \
            .github/exec-data/full-replacement-phase1/part-06b \
            .github/exec-data/full-replacement-phase1/part-07 \
            > "$RUNNER_TEMP/phase1.b64"
          base64 -d "$RUNNER_TEMP/phase1.b64" | gzip -dc > "$RUNNER_TEMP/phase1.diff"
          test "$(sha256sum "$RUNNER_TEMP/phase1.diff" | awk '{print $1}')" = "151f98a3553351e24f644473b17be633053d1c3ffa9d3f97cc4f2ed6c01a8e5e"
          git fetch origin codex/full-replacement-closure-20260917
          git checkout -B product origin/codex/full-replacement-closure-20260917
          test "$(git rev-parse HEAD)" = "f29f5ac424d1e8622f510e056088478682151f8f"
          git apply --check "$RUNNER_TEMP/phase1.diff"
          git apply "$RUNNER_TEMP/phase1.diff"
          git diff --check

      - name: Install exact Python dependencies and Rust 1.98
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --requirement requirements-plan.txt
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy

      - name: Validate repository and documentation truth
        shell: bash
        run: |
          set -euo pipefail
          python scripts/current_source_inventory.py --check
          python scripts/validate_repository_v2.py
          python scripts/validate_current_documentation_semantics.py
          python scripts/validate_module_closure.py
          python -m unittest discover -s tests/repository -p 'test_*.py' -v
          python -m unittest discover -s tests/security -p 'test_*.py' -v
          python scripts/validate_workflow_trust.py

      - name: Run complete native gate
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.98.0 fmt --all -- --check
          cargo +1.98.0 test --locked --workspace --all-targets
          cargo +1.98.0 clippy --locked --workspace --all-targets -- -D warnings
          cargo +1.98.0 doc --locked --workspace --no-deps
          cargo +1.98.0 build --locked -p heptabao-server
          git diff --check

      - name: Publish ordinary product-source commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "f29f5ac424d1e8622f510e056088478682151f8f"
          git config user.name "OpenAI full replacement integrator"
          git config user.email "noreply@openai.com"
          git add -A
          git commit -m "feat(runtime): align HA capacity and current lifecycle truth"
          git push origin HEAD:codex/full-replacement-closure-20260917
