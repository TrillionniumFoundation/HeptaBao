name: materialize-replay-retirement-evidence-v2-20260916
on:
  push:
    branches:
      - codex/next-round-product-closure-20260916
permissions:
  contents: write
jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Bind exact parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "35e14fc7a081c183d1b1cacead8c7acfbd39256f"
      - name: Repair generator and regenerate exact-head evidence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/generate_module_closure_docs.py')
          s = p.read_text()
          old = "The acceptance status for this dossier is **source-bound, execution-pending** until the exact-head command and applicable integration profile produce a receipt bound to the same commit. {('The absence of a discovered test is itself an open acceptance gap.' if not test_anchor else '')}"
          new = "The acceptance status for this dossier is **source-bound, execution-pending** until the exact-head command and applicable integration profile produce a receipt bound to the same commit.{(' The absence of a discovered test is itself an open acceptance gap.' if not test_anchor else '')}"
          if s.count(old) != 1:
              raise SystemExit(f'acceptance-gap template count={s.count(old)}')
          p.write_text(s.replace(old, new, 1))
          PY
          python scripts/current_source_inventory.py --write
          python scripts/generate_module_closure_docs.py
          python scripts/current_source_inventory.py --check
          python scripts/validate_module_closure.py
          python scripts/validate_current_documentation_semantics.py
          python scripts/validate_runtime_doc_truth.py
          python scripts/validate_replacement_execution.py
          git diff --check
      - name: Remove transport and publish evidence
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/materialize-replay-retirement-evidence-20260916.yml
          rm -f .github/workflows/materialize-replay-retirement-evidence-v2-20260916.yml
          git diff --check
          git config user.name "OpenAI evidence materializer"
          git config user.email "noreply@openai.com"
          git add -A
          git commit -m "docs: refresh exact-head replay retirement evidence"
          git push origin HEAD:codex/next-round-product-closure-20260916
