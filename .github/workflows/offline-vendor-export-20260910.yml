name: HeptaBao exact-head offline vendor export 20260910

on:
  push:
    branches:
      - ops/heptabao-offline-vendor-export-20260910

permissions:
  contents: read

concurrency:
  group: heptabao-offline-vendor-export-20260910
  cancel-in-progress: false

env:
  PRODUCT_SHA: 6300d63abfbffc25af12b8254882436eef15ef1c

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 3
          persist-credentials: false

      - name: Bind product source and vendor locked dependencies
        shell: bash
        run: |
          set -euo pipefail
          git cat-file -e "$PRODUCT_SHA^{commit}"
          test "$(git diff --name-only "$PRODUCT_SHA" HEAD)" = ".github/workflows/offline-vendor-export-20260910.yml"
          rustup toolchain install 1.98.0 --profile minimal
          git worktree add --detach "$RUNNER_TEMP/product" "$PRODUCT_SHA"
          cargo +1.98.0 vendor \
            --manifest-path "$RUNNER_TEMP/product/Cargo.toml" \
            --locked "$RUNNER_TEMP/vendor" > "$RUNNER_TEMP/vendor-config.toml"
          printf 'source_commit=%s\nsource_tree=%s\nrustc=%s\n' \
            "$PRODUCT_SHA" \
            "$(git rev-parse "$PRODUCT_SHA^{tree}")" \
            "$(rustc +1.98.0 --version)" > "$RUNNER_TEMP/source-binding.txt"
          tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/heptabao-vendor-6300d63.tar.gz" \
            vendor vendor-config.toml source-binding.txt
          sha256sum "$RUNNER_TEMP/heptabao-vendor-6300d63.tar.gz" \
            > "$RUNNER_TEMP/heptabao-vendor-6300d63.tar.gz.sha256"

      - name: Upload bounded offline vendor bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: heptabao-offline-vendor-6300d63
          path: |
            ${{ runner.temp }}/heptabao-vendor-6300d63.tar.gz
            ${{ runner.temp }}/heptabao-vendor-6300d63.tar.gz.sha256
            ${{ runner.temp }}/source-binding.txt
          if-no-files-found: error
          retention-days: 3
