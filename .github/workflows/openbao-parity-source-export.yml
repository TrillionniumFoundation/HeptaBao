name: Temporary pinned black-box comparison input
on:
  push:
    branches: [ops/openbao-parity-source-20260913]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fetch official release using the repository reviewed launcher pin
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/openbao-comparison-input"
          mkdir -p "$out"
          curl --fail --location --proto '=https' --tlsv1.2 --max-time 120 \
            https://github.com/openbao/openbao/releases/download/v2.6.2/openbao_2.6.2_linux_amd64.tar.gz \
            -o "$out/openbao_2.6.2_linux_amd64.tar.gz"
          cd "$out"
          sha256sum openbao_2.6.2_linux_amd64.tar.gz
          echo '8dc11cc5fca0b539a9e352727dacb4e2d304daffcf9a66e0718ac325a20d05aa  openbao_2.6.2_linux_amd64.tar.gz' > SHA256SUMS
          sha256sum -c SHA256SUMS
          printf '%s\n' 'OpenBao v2.6.2, archive pin from qa/openbao-acceptance/official_openbao_launcher.py at 26c40c833b071e154e21b437236f90ed8a1043bd.' 'Repository-controlled synthetic black-box comparison only; not independent Oracle qualification.' > SCOPE.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: openbao-2.6.2-black-box-input
          path: ${{ runner.temp }}/openbao-comparison-input/
          retention-days: 3
          if-no-files-found: error
