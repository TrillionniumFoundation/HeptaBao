name: Temporary pinned parity source export
on:
  push:
    branches: [ops/openbao-parity-source-20260913]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 05b47e81601b2ef7cf19eb5623763d0f72851617
          fetch-depth: 0
          persist-credentials: false
      - name: Export exact public source and dependencies, without runtime execution
        shell: bash
        env:
          CARGO_HOME: /tmp/heptabao-parity-cargo
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 05b47e81601b2ef7cf19eb5623763d0f72851617
          out="$RUNNER_TEMP/heptabao-parity-inputs"
          mkdir -p "$out"
          git bundle create "$out/source.bundle" HEAD
          git archive --format=tar HEAD | gzip -n > "$out/source.tar.gz"
          git rev-parse HEAD HEAD^{tree} > "$out/source-binding.txt"
          git status --porcelain=v1 --untracked-files=all > "$out/source-status.txt"
          rustup toolchain install 1.98.0 --profile minimal
          cargo +1.98.0 vendor --locked "$RUNNER_TEMP/parity-vendor" > "$out/vendor-config.toml"
          tar -C "$RUNNER_TEMP" -czf "$out/vendor.tar.gz" parity-vendor
          cd "$out"
          sha256sum source.bundle source.tar.gz vendor.tar.gz vendor-config.toml source-binding.txt > SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: heptabao-parity-source-05b47e81
          path: ${{ runner.temp }}/heptabao-parity-inputs/
          retention-days: 3
          if-no-files-found: error
