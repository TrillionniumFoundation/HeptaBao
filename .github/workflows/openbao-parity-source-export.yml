name: Temporary pinned parity source export
on:
  push:
    branches: [ops/openbao-parity-source-20260913]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 26c40c833b071e154e21b437236f90ed8a1043bd
          fetch-depth: 0
          persist-credentials: false
      - name: Export existing exact identity source, without runtime execution
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 26c40c833b071e154e21b437236f90ed8a1043bd
          out="$RUNNER_TEMP/heptabao-identity-inputs"
          mkdir -p "$out"
          git bundle create "$out/identity.bundle" HEAD
          git rev-parse HEAD HEAD^{tree} > "$out/source-binding.txt"
          cd "$out"
          sha256sum identity.bundle source-binding.txt > SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: heptabao-identity-source-26c40c83
          path: ${{ runner.temp }}/heptabao-identity-inputs/
          retention-days: 3
          if-no-files-found: error
