name: PR88 single ReadIndex request path materializer

on:
  push:
    branches: [ops/pr88-single-readindex-20260911-gpt56]

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]' && github.actor != 'actions'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true
      - run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
      - name: Make sync_from_ha the sole request ReadIndex gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path('crates/heptabao-server/src/service.rs')
          s=p.read_text()
          old='''        if self.ha.is_some() {\n            let (_, standby, ha_active, _, _) = self.ha_observation();\n            if standby {\n                if !allow_forward {\n                    return Response::error(503, "forwarded request reached a standby node");\n                }\n                let Some(ha) = self.ha.as_ref().cloned() else {\n                    return Response::error(503, "HA forwarding is unavailable");\n                };\n                return match ha.lock() {\n                    Ok(ha) => ha\n                        .forward_request(method, path, namespace, token, body)\n                        .unwrap_or_else(|_| Response::error(503, "HA leader forwarding failed")),\n                    Err(_) => Response::error(503, "HA process lock is unavailable"),\n                };\n            }\n            if !ha_active {\n                return Response::error(503, "HA node has no current linearizable authority");\n            }\n            if let Err(error) = self.sync_from_ha() {\n                return error;\n            }\n        }\n'''
          new='''        if let Some(ha) = self.ha.as_ref().cloned() {\n            let (leader, local) = match ha.lock() {\n                Ok(ha) => {\n                    let leader = match ha.leader() {\n                        Ok(value) => value,\n                        Err(_) => return Response::error(503, "HA leader state is unavailable"),\n                    };\n                    let local = match ha.local_id() {\n                        Ok(value) => value,\n                        Err(_) => return Response::error(503, "HA local identity is unavailable"),\n                    };\n                    (leader, local)\n                }\n                Err(_) => return Response::error(503, "HA process lock is unavailable"),\n            };\n            if leader != Some(local) {\n                let Some(_) = leader else {\n                    return Response::error(503, "HA cluster has no elected leader");\n                };\n                if !allow_forward {\n                    return Response::error(503, "forwarded request reached a standby node");\n                }\n                return match ha.lock() {\n                    Ok(ha) => ha\n                        .forward_request(method, path, namespace, token, body)\n                        .unwrap_or_else(|_| Response::error(503, "HA leader forwarding failed")),\n                    Err(_) => Response::error(503, "HA process lock is unavailable"),\n                };\n            }\n            if let Err(error) = self.sync_from_ha() {\n                return error;\n            }\n        }\n'''
          if s.count(old)!=1:
              raise SystemExit(f'request HA block mismatch: {s.count(old)}')
          p.write_text(s.replace(old,new,1))
          PY
          cargo +1.98.0 fmt --all
          git diff --check
      - name: Validate HA request slice
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.98.0 test --locked -p heptabao-server -p heptabao-raft-runtime -p heptabao-ha-service --all-targets
          cargo +1.98.0 clippy --locked -p heptabao-server -p heptabao-raft-runtime -p heptabao-ha-service --all-targets -- -D warnings
      - name: Publish source-only descendant
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/pr88-single-readindex-materializer.yml
          git diff --check
          git config user.name heptabao-materializer
          git config user.email actions@users.noreply.github.com
          git add -u
          git commit -m "fix(ha): use one linearizable gate per request"
          git push origin "HEAD:${GITHUB_REF_NAME}"
