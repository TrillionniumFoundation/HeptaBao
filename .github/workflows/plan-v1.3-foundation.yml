name: plan-v1.3-foundation

on:
  push:
    branches: ["codex/plan-v1.3-foundation-closure-v1"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plan-v1.3-foundation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  plan-and-python:
    if: ${{ (github.event_name != 'pull_request' || github.head_ref != 'codex/plan-v1.3-gap-closure-v2') && (github.event_name != 'push' || github.ref != 'refs/heads/codex/plan-v1.3-gap-closure-v2') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind immutable source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          printf 'repository=%s\ncommit=%s\ntree=%s\n' \
            "$GITHUB_REPOSITORY" "$SOURCE_SHA" "$(git rev-parse 'HEAD^{tree}')" \
            | tee "$RUNNER_TEMP/v1.3-source-binding.txt"
      - name: Install exact Python dependencies
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-plan.txt
      - run: python3 -m pip install --disable-pip-version-check --requirement requirements-plan.txt
      - name: Validate all plan generations and V1.3 contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate_plan_v2.py
          python3 scripts/validate_plan_v2_extensions.py
          python3 scripts/validate_plan_v1_2.py
          python3 scripts/validate_plan_v1_2_1.py
          python3 scripts/validate_plan_v1_2_2.py
          python3 scripts/validate_plan_v1_3.py
          python3 scripts/validate_h01_h02_next_v1.py
          python3 scripts/validate_h02_candidate_adapters_v1.py
          python3 scripts/validate_h02_openraft_inmemory_cluster_v1.py
          python3 scripts/validate_h02_openraft_fault_lab_v1.py
          python3 scripts/validate_h02_blocker_closure_v1.py
          python3 scripts/validate_h02_exact_head_matrix_contract_v1.py
      - name: Run every Python regression suite
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests/oracle -p 'test_*.py' -v
          python3 -m unittest discover -s tests/platform -p 'test_*.py' -v
          python3 -m unittest discover -s tests/plan -p 'test_*.py' -v
      - name: Retain V1.3 development evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plan-v1.3-python-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/v1.3-source-binding.txt
          if-no-files-found: error
          retention-days: 30

  root-rust:
    if: ${{ (github.event_name != 'pull_request' || github.head_ref != 'codex/plan-v1.3-gap-closure-v2') && (github.event_name != 'push' || github.ref != 'refs/heads/codex/plan-v1.3-gap-closure-v2') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust 1.98
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy
      - name: Format test and lint workspace
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          cargo +1.98.0 fmt --all -- --check
          cargo +1.98.0 test --locked --workspace --all-targets
          cargo +1.98.0 clippy --locked --workspace --all-targets -- -D warnings
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

  p0-socket-smoke:
    if: ${{ (github.event_name != 'pull_request' || github.head_ref != 'codex/plan-v1.3-gap-closure-v2') && (github.event_name != 'push' || github.ref != 'refs/heads/codex/plan-v1.3-gap-closure-v2') }}
    needs: root-rust
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust 1.98
        run: rustup toolchain install 1.98.0 --profile minimal
      - name: Execute loopback-only P0 socket contract
        shell: bash
        env:
          HEPTABAO_P0_BIND: 127.0.0.1:0
          HEPTABAO_P0_DEV_TOKEN: v1-3-development-root-token-00000001
          HEPTABAO_P0_DEV_UNSEAL_KEY: v1-3-development-unseal-key-0000001
          HEPTABAO_P0_AUDIT_PATH: ${{ runner.temp }}/heptabao-p0-audit.log
        run: |
          set -euo pipefail
          stderr="$RUNNER_TEMP/p0.stderr"
          cargo +1.98.0 run --quiet --locked -p heptabao-p0-server 2>"$stderr" &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true' EXIT
          python3 - "$stderr" <<'PY'
          import re
          import socket
          import sys
          import time
          from pathlib import Path

          path = Path(sys.argv[1])
          address = None
          for _ in range(300):
              text = path.read_text(encoding="utf-8", errors="replace") if path.exists() else ""
              match = re.search(r"listening on (127\.0\.0\.1:\d+)", text)
              if match:
                  address = match.group(1)
                  break
              time.sleep(0.1)
          assert address is not None, path.read_text(encoding="utf-8", errors="replace")
          host, port_text = address.rsplit(":", 1)
          port = int(port_text)

          def exchange(raw: bytes) -> bytes:
              with socket.create_connection((host, port), timeout=5) as stream:
                  stream.sendall(raw)
                  chunks = []
                  while True:
                      block = stream.recv(8192)
                      if not block:
                          break
                      chunks.append(block)
                  return b"".join(chunks)

          def request(method: str, target: str, body: bytes = b"", token: str | None = None) -> bytes:
              headers = [f"{method} {target} HTTP/1.1", f"Host: {address}"]
              if token:
                  headers.append(f"X-Vault-Token: {token}")
              if body:
                  headers.append(f"Content-Length: {len(body)}")
              return exchange(("\r\n".join(headers) + "\r\n\r\n").encode() + body)

          health = request("GET", "/v1/sys/health")
          assert health.startswith(b"HTTP/1.1 501 "), health
          assert b'"sealed":true' in health and b'"production_supported":false' in health
          initialized = request("POST", "/v1/sys/init", b"{}")
          assert initialized.startswith(b"HTTP/1.1 200 ") and b"development_credentials_returned" in initialized
          unseal = request("POST", "/v1/sys/unseal", b'{"key":"v1-3-development-unseal-key-0000001"}')
          assert unseal.startswith(b"HTTP/1.1 200 ") and b'"sealed":false' in unseal
          token = "v1-3-development-root-token-00000001"
          write = request("POST", "/v1/secret/exact-head", b'{"value":"development-only"}', token)
          assert write.startswith(b"HTTP/1.1 204 "), write
          read = request("GET", "/v1/secret/exact-head", token=token)
          assert read.startswith(b"HTTP/1.1 200 ") and b"development-only" in read
          bad_host = exchange(b"GET /v1/sys/health HTTP/1.1\r\nHost: attacker.invalid\r\n\r\n")
          assert bad_host.startswith(b"HTTP/1.1 400 "), bad_host
          print("P0 exact-head loopback socket contract PASS")
          PY
          test -s "$HEPTABAO_P0_AUDIT_PATH"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

  openraft-exact-head:
    if: ${{ (github.event_name != 'pull_request' || github.head_ref != 'codex/plan-v1.3-gap-closure-v2') && (github.event_name != 'push' || github.ref != 'refs/heads/codex/plan-v1.3-gap-closure-v2') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      TOOLCHAINS: "1.88.0 1.98.0"
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install validation dependencies
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python3 -m pip install --disable-pip-version-check --requirement requirements-plan.txt
      - name: Install effective Rust toolchains
        shell: bash
        run: |
          set -euo pipefail
          for toolchain in $TOOLCHAINS; do
            rustup toolchain install "$toolchain" --profile minimal --component rustfmt,clippy
          done
      - name: Bind and compile one immutable graph
        shell: bash
        run: |
          set -euo pipefail
          manifest=probes/h02/openraft-tokio/Cargo.toml
          cargo +1.88.0 metadata --locked --format-version 1 --manifest-path "$manifest" >"$RUNNER_TEMP/openraft-metadata.json"
          cargo +1.98.0 fmt --manifest-path "$manifest" --all -- --check
          for toolchain in $TOOLCHAINS; do
            export CARGO_TARGET_DIR="$RUNNER_TEMP/openraft-compile-$toolchain"
            cargo +"$toolchain" test --locked --all-targets --manifest-path "$manifest"
            cargo +"$toolchain" clippy --locked --all-targets --manifest-path "$manifest" -- -D warnings
          done
      - name: Execute and retain all 24 application entries
        shell: bash
        run: |
          set +e
          mkdir -p "$RUNNER_TEMP/openraft-v1.3"
          python3 scripts/h02_exact_head_matrix_v1.py \
            --repository "$GITHUB_REPOSITORY" \
            --ref "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" \
            --commit "$SOURCE_SHA" \
            --tree "$(git rev-parse 'HEAD^{tree}')" \
            --manifest probes/h02/openraft-tokio/Cargo.toml \
            --output-dir "$RUNNER_TEMP/openraft-v1.3/matrix" \
            --cargo-target-root "$RUNNER_TEMP/openraft-v1.3/targets" \
            --entry-timeout-seconds 240 \
            >"$RUNNER_TEMP/openraft-v1.3/runner.log" 2>&1
          printf '%s\n' "$?" >"$RUNNER_TEMP/openraft-v1.3/runner.exit"
          exit 0
      - name: Upload every outcome before final gate
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openraft-v1.3-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/openraft-v1.3/
          if-no-files-found: error
          retention-days: 30
      - name: Require complete matrix PASS
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat "$RUNNER_TEMP/openraft-v1.3/runner.exit")" = 0
          python3 - "$RUNNER_TEMP/openraft-v1.3/matrix/matrix-summary.json" <<'PY'
          import json
          import sys
          summary = json.load(open(sys.argv[1], encoding="utf-8"))
          assert summary["result"] == "PASS", summary
          assert summary["matrix"]["executed_entry_count"] == 24, summary
          assert summary["counts"] == {"pass": 24, "fail": 0, "blocked": 0, "unknown": 0, "unexecuted": 0}, summary
          assert summary["qualification"] is False
          assert summary["compatibility_claim"] is False
          assert summary["selection_effect"] == "NONE"
          assert summary["authority_effect"] == "NONE"
          PY
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

  authority-sentinel:
    needs: [plan-and-python, root-rust, p0-socket-smoke, openraft-exact-head]
    if: ${{ ((github.event_name != 'pull_request' || github.head_ref != 'codex/plan-v1.3-gap-closure-v2') && (github.event_name != 'push' || github.ref != 'refs/heads/codex/plan-v1.3-gap-closure-v2')) && (always()) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          persist-credentials: false
      - name: Require every technical lane and closed authority
        env:
          PLAN: ${{ needs.plan-and-python.result }}
          ROOT_RUST: ${{ needs.root-rust.result }}
          P0: ${{ needs.p0-socket-smoke.result }}
          H02: ${{ needs.openraft-exact-head.result }}
        shell: bash
        run: |
          set -euo pipefail
          test "$PLAN" = success
          test "$ROOT_RUST" = success
          test "$P0" = success
          test "$H02" = success
          python3 scripts/validate_plan_v1_3.py
          echo "V1.3 technical gates PASS; qualification=false compatibility=false selection=NONE authority=NONE"
