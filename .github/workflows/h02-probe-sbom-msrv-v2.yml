name: h02-probe-sbom-msrv-v2
'on':
  workflow_dispatch: null
  pull_request:
    paths:
    - .github/workflows/h02-probe-sbom-msrv-v2.yml
    - planning/HEPTABAO_H02_CANDIDATE_PROBE_MATRIX_V2.yaml
    - planning/HEPTABAO_H02_CANDIDATE_PROBE_MATRIX_V1.yaml
    - planning/HEPTABAO_H02_OPENRAFT_FULL_PROBE_PROFILE_V1.yaml
    - scripts/h02_dependency_probe_v2.py
    - scripts/validate_h02_dependency_probe_v2.py
    - scripts/h02_dependency_probe_v1.py
    - scripts/h02_openraft_fault_lab_evidence_v2.py
    - scripts/h02_linearizability_checker_v1.py
    - scripts/yaml12_loader.py
    - schemas/heptabao_dependency_probe_evidence_v2.schema.json
    - schemas/heptabao_dependency_probe_evidence_v1.schema.json
    - tests/platform/test_h02_dependency_probe_v2.py
    - tests/platform/test_h02_dependency_probe_v1.py
    - tests/platform/fixtures/h02_mechanical_hosted_37247651462.json
    - probes/h02/**
    - requirements-plan.txt
    - scripts/validate_workflow_trust.py
    - scripts/validate_workflow_trust_v1.py
    - scripts/workflow_trust_v2.py
    - scripts/workflow_trust_action_registry_v2.json
    - scripts/validate_acceptance_immutability.py
permissions:
  contents: read
concurrency:
  group: h02-probe-sbom-msrv-v2-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.13'
    - run: python -m pip install --disable-pip-version-check --requirement requirements-plan.txt
    - run: |-
        python scripts/validate_h02_dependency_probe_v2.py
        python -m unittest discover -s tests/platform -p "test_h02_dependency_probe_v2.py" -v
  mechanical:
    needs: validate-plan
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
      with:
        python-version: '3.13'
    - run: python -m pip install --disable-pip-version-check --requirement requirements-plan.txt
    - name: Install exact compilers and retain failures
      shell: bash
      run: |
        set -u
        mkdir -p "$RUNNER_TEMP/h02-mechanical-v2-setup"
        for compiler in 1.71.0 1.88.0 1.99.0; do
          rc=0
          rustup toolchain install "$compiler" --profile minimal >"$RUNNER_TEMP/h02-mechanical-v2-setup/$compiler.log" 2>&1 || rc=$?
          printf '%s\n' "$rc" >"$RUNNER_TEMP/h02-mechanical-v2-setup/$compiler.exit"
        done
        exit 0
    - name: Execute all eight real mechanical probes serially
      if: ${{ always() }}
      shell: bash
      run: |
        set -euo pipefail
        python scripts/h02_dependency_probe_v2.py \
          --source-root "$GITHUB_WORKSPACE" \
          --expected-commit "${{ github.event.pull_request.head.sha || github.sha }}" \
          --evidence-root "$RUNNER_TEMP/h02-mechanical-v2-evidence" \
          --execution-root "$RUNNER_TEMP/h02-mechanical-v2-work" \
          --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --runner-name "$RUNNER_NAME"
    - name: Verify retained receipts and raw artifacts
      if: ${{ always() }}
      shell: bash
      run: |
        set -euo pipefail
        python scripts/validate_h02_dependency_probe_v2.py \
          --evidence-root "$RUNNER_TEMP/h02-mechanical-v2-evidence" \
          --execution-root "$RUNNER_TEMP/h02-mechanical-v2-work" \
          --producer-source-root "$GITHUB_WORKSPACE" \
          --source-commit "$(git rev-parse HEAD)" --source-tree "$(git rev-parse 'HEAD^{tree}')" \
          --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --runner-name "$RUNNER_NAME"
    - name: Retain all outcomes before final gate
      if: ${{ always() }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: h02-mechanical-v2-${{ github.run_id }}-${{ github.run_attempt }}
        path: |
          ${{ runner.temp }}/h02-mechanical-v2-evidence/
          ${{ runner.temp }}/h02-mechanical-v2-setup/
        if-no-files-found: error
        retention-days: 30
    - name: Require mechanical passes without behavioral qualification
      if: ${{ always() }}
      shell: bash
      run: |
        set -euo pipefail
        python scripts/validate_h02_dependency_probe_v2.py \
          --evidence-root "$RUNNER_TEMP/h02-mechanical-v2-evidence" \
          --execution-root "$RUNNER_TEMP/h02-mechanical-v2-work" \
          --producer-source-root "$GITHUB_WORKSPACE" \
          --source-commit "$(git rev-parse HEAD)" --source-tree "$(git rev-parse 'HEAD^{tree}')" \
          --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" --runner-name "$RUNNER_NAME" \
          --require-pass
