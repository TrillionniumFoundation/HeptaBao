name: Temporary exact source export

on:
  push:
    branches: [codex/openbao-analysis-export-20260908]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Export exact convergence inputs
        shell: bash
        run: |
          set -euo pipefail
          git archive --format=tar.gz --prefix=HeptaBao/ --output=heptabao-full-closure.tar.gz 82248057743b43c45e663299d41236897e9115d4
          git diff --binary 82248057743b43c45e663299d41236897e9115d4..a5f7f633ca54115c99824392eab45ecd68a906ff > security-closure.patch
          git show origin/codex/openbao-replacement-wrapping-20260908:.g1/codex-openbao-replacement/wrapping-tranche/part-00 > wrapping.patch.gz.b64
          base64 --decode wrapping.patch.gz.b64 > wrapping.patch.gz
          gzip --test wrapping.patch.gz
          gzip --decompress --stdout wrapping.patch.gz > wrapping.patch
          sha256sum heptabao-full-closure.tar.gz security-closure.patch wrapping.patch > convergence-inputs.sha256
      - name: Upload exact source and patches
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: heptabao-convergence-inputs-${{ github.run_id }}
          path: |
            heptabao-full-closure.tar.gz
            security-closure.patch
            wrapping.patch
            convergence-inputs.sha256
          if-no-files-found: error
          retention-days: 1
