name: Codex identity merge and lineage once

on:
  push:
    branches:
      - codex/openbao-complete-replacement-20260912
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: codex/openbao-complete-replacement-20260912
          fetch-depth: 0
          persist-credentials: true

      - name: Apply identity merge implementation
        shell: bash
        run: |
          set -euo pipefail
          python .codex/apply_identity_merge.py
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
          cargo +1.98.0 fmt --all
          python scripts/current_source_inventory.py --write
          python scripts/validate_repository_v2.py
          python scripts/validate_compatibility_corpus.py
          git diff --check
          cargo +1.98.0 test -p heptabao-server --locked
          cargo +1.98.0 clippy -p heptabao-server --all-targets --locked -- -D warnings
          git rm .github/workflows/codex-identity-merge-once.yml .codex/apply_identity_merge.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/heptabao-server/src/engines/identity.rs planning/HEPTABAO_CURRENT_SOURCE_INVENTORY_V2.json
          git commit -m "feat(identity): implement entity merge and lineage"
          git push origin HEAD:codex/openbao-complete-replacement-20260912
