name: Transfer reviewed Git objects (no ref update or qualification)
on:
  push:
    branches: [exec/heptabao-object-transfer-20260919]
permissions:
  contents: write
jobs:
  transfer:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Transfer exact reviewed objects without changing a product ref
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          import base64, hashlib, json, lzma, os, pathlib, subprocess, urllib.request
          BASE = '676a3e68af340b2cb7439dbc99c69dee550e5db9'
          BASE_TREE = 'cc714bf471a270caf8b9a4e26047c4caae11bb34'
          TREE = '5a8f2744cc803994f946dfab637119c1c3e2eed7'
          PATCH_HASH = '9555aba88ecdf7794a26317ad0612361b0ab42e9836b81783659cd01d56fda65'
          PARTS = [('7a433add69ca4ca9f2ef24dd087508c5b29ef98c', 7000),
                   ('94f267f6468d29a00ed281bc796d265baab1cb90', 7000),
                   ('563847755eef8f5b8788d00dd7980c3f9a26199c', 6876)]
          assert os.environ['GITHUB_REPOSITORY'] == 'TrillionniumFoundation/HeptaBao'
          assert os.environ['GITHUB_REF'] == 'refs/heads/exec/heptabao-object-transfer-20260919'
          def api(endpoint, data=None):
              if data is None:
                  assert endpoint in {'git/blobs/' + sha for sha, _ in PARTS}
              else:
                  assert endpoint in ('git/blobs', 'git/trees')
              request = urllib.request.Request(
                  'https://api.github.com/repos/TrillionniumFoundation/HeptaBao/' + endpoint,
                  data=None if data is None else json.dumps(data).encode(),
                  method='GET' if data is None else 'POST',
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                           'Accept': 'application/vnd.github+json',
                           'X-GitHub-Api-Version': '2022-11-28',
                           'Content-Type': 'application/json'})
              with urllib.request.urlopen(request, timeout=60) as response:
                  return json.load(response)
          compressed = bytearray()
          for sha, size in PARTS:
              transport = api('git/blobs/' + sha)
              assert transport['sha'] == sha and transport['encoding'] == 'base64'
              raw = base64.b64decode(''.join(transport['content'].split()), validate=True)
              assert len(raw) == size
              assert hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest() == sha
              compressed.extend(raw)
          assert len(compressed) == 20876
          assert hashlib.sha256(compressed).hexdigest() == '6f1abc14ace10b09871dab85e475b15bfb715be3f6ca518ca85f4839498cff08'
          decoder = lzma.LZMADecompressor(format=lzma.FORMAT_XZ, memlimit=128 * 1024 * 1024)
          patch = decoder.decompress(compressed, max_length=87870)
          assert decoder.eof and not decoder.unused_data
          assert len(patch) == 87869 and hashlib.sha256(patch).hexdigest() == PATCH_HASH
          def git(*args, input=None):
              return subprocess.check_output(['git', *args], input=input).decode().strip()
          git('checkout', '--detach', BASE)
          assert git('rev-parse', 'HEAD^{tree}') == BASE_TREE
          assert not git('status', '--porcelain')
          git('apply', '--index', '--whitespace=error', '-', input=patch)
          assert git('write-tree') == TREE
          files = git('diff', '--cached', '--name-only').splitlines()
          assert len(files) == 31
          assert all(p.startswith(('crates/', 'docs/', 'planning/', 'qa/', 'tests/')) for p in files)
          entries = []
          for path in files:
              assert '..' not in pathlib.PurePosixPath(path).parts
              meta = git('ls-files', '-s', '--', path).split()
              assert len(meta) >= 4 and meta[0] in ('100644', '100755') and meta[2] == '0'
              raw = pathlib.Path(path).read_bytes()
              assert hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest() == meta[1]
              blob = api('git/blobs', {'content': base64.b64encode(raw).decode(), 'encoding': 'base64'})
              assert blob['sha'] == meta[1]
              entries.append({'path': path, 'mode': meta[0], 'type': 'blob', 'sha': blob['sha']})
          tree = api('git/trees', {'base_tree': BASE_TREE, 'tree': entries})
          assert tree['sha'] == TREE
          result = {'tree': TREE, 'base': BASE, 'patch_sha256': PATCH_HASH,
                    'changed_files': len(files), 'product_ref_updated': False,
                    'candidate_executed': False, 'qualification': False}
          print(json.dumps(result, sort_keys=True))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write('Git objects only; no reference update or qualification.\n\n```json\n' + json.dumps(result, indent=2) + '\n```\n')
          PYTHON
