name: HeptaBao V2 continuous assurance

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - integration/v1.4.4-technical-candidate
      - codex/ci-trust-boundary-closure-20260907
  push:
    branches:
      - codex/v2.0-product-closure-20260907

permissions:
  contents: read

concurrency:
  group: v2-assurance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-and-rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout immutable source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-plan.txt
      - name: Install repository validation dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --requirement requirements-plan.txt
      - name: Verify immutable clean source
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          test ! -e .exec/v2-g4-overlay.part-00
          test ! -e .exec/v2-g4-overlay.part-01
          test ! -e .exec/v2-g4-overlay.part-02
          test ! -e .exec/v2-g4-overlay.part-03
          test ! -e .exec/v2-g4-overlay.part-04-sub-0
          test ! -e .exec/v2-g4-overlay.part-04-sub-1
          test ! -e .exec/v2-g4-overlay.part-04-sub-2
          test ! -e .exec/v2-g4-overlay.part-04-sub-3
          test ! -e .exec/v2-g4-overlay.part-04-sub-4
          test ! -e .exec/v2-g4-overlay.part-04-sub-5
          test ! -e .exec/v2-g4-overlay.part-05
          test ! -e .exec/v2-g4-overlay.part-06
          test ! -e .exec/v2-g4-overlay.part-07
          test ! -e .exec/v2-g4-overlay.part-08
      - name: Validate current repository truth
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_repository_v2.py
          python -m unittest discover -s tests/repository -p 'test_*.py' -v
      - name: Validate workflow, platform and Oracle boundaries
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests/security -p 'test_*.py' -v
          python scripts/validate_workflow_trust.py
          python -m unittest discover -s tests/platform -p 'test_*.py' -v
          python -m unittest discover -s tests/oracle -p 'test_*.py' -v
      - name: Preserve generation-appropriate current-source gates
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_module_documentation_v1_4_4.py
          python -m unittest discover -s tests/plan -p 'test_module_documentation_v1_4_4.py' -v
          python -m unittest discover -s tests/plan -p 'test_external_completion_evidence_v1.py' -v
          python -m compileall -q scripts tests
      - name: Install declared Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
      - name: Validate unchanged Rust workspace
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.98.0 fmt --all -- --check
          cargo +1.98.0 test --locked --workspace --all-targets
          cargo +1.98.0 clippy --locked --workspace --all-targets -- -D warnings
          cargo +1.98.0 doc --locked --workspace --no-deps
          git diff --exit-code
