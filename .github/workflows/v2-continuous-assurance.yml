name: HeptaBao V2 exact source materializer

on:
  push:
    branches:
      - codex/v2.0-product-closure-20260907

permissions:
  contents: write

concurrency:
  group: v2-exact-materializer-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    if: "${{ github.event.head_commit.message == 'ci(v2): materialize exact G4 source' }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact staging commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Verify staging identity and materialize exact source
        shell: bash
        env:
          SAFE_WORKFLOW_B64: 
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "TrillionniumFoundation/HeptaBao"
          test "$GITHUB_REF" = "refs/heads/codex/v2.0-product-closure-20260907"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          read -r commit parent extra <<<"$(git rev-list --parents -n 1 HEAD)"
          test "$commit" = "$GITHUB_SHA"
          test "$parent" = "020afe878c708a8c7d1091df4ae3b81a28ef0507"
          test -z "${extra:-}"
          cat \
            .exec/v2-g4-overlay.part-00 \
            .exec/v2-g4-overlay.part-01 \
            .exec/v2-g4-overlay.part-02 \
            .exec/v2-g4-overlay.part-03 \
            .exec/v2-g4-overlay.part-04-sub-0 \
            .exec/v2-g4-overlay.part-04-sub-1 \
            .exec/v2-g4-overlay.part-04-sub-2 \
            .exec/v2-g4-overlay.part-04-sub-3 \
            .exec/v2-g4-overlay.part-04-sub-4 \
            .exec/v2-g4-overlay.part-04-sub-5 \
            .exec/v2-g4-overlay.part-05 \
            .exec/v2-g4-overlay.part-06 \
            .exec/v2-g4-overlay.part-07 \
            .exec/v2-g4-overlay.part-08 \
            > "$RUNNER_TEMP/v2-g4-overlay.b64"
          base64 --decode "$RUNNER_TEMP/v2-g4-overlay.b64" > "$RUNNER_TEMP/v2-g4-overlay.tar.gz"
          echo "99bc43d60c030cbb119355fc8a77baa4a66470ed58d652dabe630bc951923756  $RUNNER_TEMP/v2-g4-overlay.tar.gz" | sha256sum --check
          tar --extract --gzip --file "$RUNNER_TEMP/v2-g4-overlay.tar.gz" --directory . --no-same-owner --no-same-permissions
          rm -f .exec/v2-g4-overlay.part-*
          python - <<'PYFIX'
          from pathlib import Path
          path = Path("crates/heptabao-kms-contracts/src/lib.rs")
          source = path.read_text(encoding="utf-8")
          old = "assert_eq!(4, destroyed.generation);"
          if source.count(old) != 1:
              raise SystemExit("KMS generation assertion anchor mismatch")
          path.write_text(source.replace(old, "assert_eq!(5, destroyed.generation);"), encoding="utf-8")
          PYFIX
          printf '%s' "$SAFE_WORKFLOW_B64" | base64 --decode > .github/workflows/v2-continuous-assurance.yml
          grep -Fq 'contents: read' .github/workflows/v2-continuous-assurance.yml
          test "$(grep -Fc 'contents: write' .github/workflows/v2-continuous-assurance.yml)" = 0
          test "$(grep -Fc 'persist-credentials: true' .github/workflows/v2-continuous-assurance.yml)" = 0
      - name: Install validation toolchains
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --requirement requirements-plan.txt
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
      - name: Validate repository, security and documentation truth
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_repository_v2.py
          python -m unittest discover -s tests/repository -p 'test_*.py' -v
          python -m unittest discover -s tests/security -p 'test_*.py' -v
          python scripts/validate_workflow_trust.py
          python scripts/validate_module_documentation_v1_4_4.py
          python -m unittest discover -s tests/plan -p 'test_module_documentation_v1_4_4.py' -v
          python -m unittest discover -s tests/plan -p 'test_external_completion_evidence_v1.py' -v
          python -m unittest discover -s tests/platform -p 'test_*.py' -v
          python -m unittest discover -s tests/oracle -p 'test_*.py' -v
          python -m compileall -q scripts tests
      - name: Validate complete Rust workspace
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.98.0 fmt --all
          cargo +1.98.0 test --locked --workspace --all-targets
          cargo +1.98.0 clippy --locked --workspace --all-targets -- -D warnings
          cargo +1.98.0 doc --locked --workspace --no-deps
          git diff --check
      - name: Commit verified materialized source
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .exec/v2-g4-overlay.part-00
          grep -Fq 'contents: read' .github/workflows/v2-continuous-assurance.yml
          git config user.name "HeptaBao convergence controller"
          git config user.email "heptabao-convergence@users.noreply.github.com"
          git add --all
          git commit -m "feat(v2): materialize G4 source and restore read-only assurance"
          git push origin HEAD:codex/v2.0-product-closure-20260907
