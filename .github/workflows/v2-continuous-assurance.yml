name: HeptaBao V2 continuous assurance

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - integration/v1.4.4-technical-candidate
      - codex/ci-trust-boundary-closure-20260907
  push:
    branches:
      - codex/v2.0-product-closure-20260907

permissions:
  contents: read

concurrency:
  group: v2-assurance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-and-rust:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout immutable source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-plan.txt
      - name: Install repository validation dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --requirement requirements-plan.txt
      - name: Validate repository truth
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_repository_v2.py
      - name: Run repository validator regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests/repository -p 'test_*.py' -v
      - name: Install declared Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
      - name: Materialize and emit canonical Rust formatting
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.98.0 fmt --all
          python scripts/emit_rustfmt_base64.py
      - name: Run all Rust targets
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.98.0 test --locked --workspace --all-targets
      - name: Run strict Rust lint
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.98.0 clippy --locked --workspace --all-targets -- -D warnings
      - name: Build Rust documentation
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.98.0 doc --locked --workspace --no-deps
