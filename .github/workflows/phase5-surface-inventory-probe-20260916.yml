name: phase5-surface-inventory-probe-20260916
on:
  push:
    branches:
      - codex/phase5-60-surface-closure-20260916
permissions:
  contents: write
jobs:
  inventory:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Emit exact 60-surface denominator
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('planning/HEPTABAO_REPLACEMENT_EXECUTION_V2.json')
          m = json.loads(p.read_text())
          rows = m['surfaces']
          assert len(rows) == 60
          counts = {}
          for i, r in enumerate(rows, 1):
              counts[r['implementation']] = counts.get(r['implementation'], 0) + 1
              print(json.dumps({
                  'i': i,
                  'id': r['surface_id'],
                  'category': r['category'],
                  'state': r['implementation'],
                  'owners': r['owner_work_packages'],
                  'runtime': r['runtime_sources'],
                  'contracts': r['contract_sources'],
                  'profiles': r['executable_profiles'],
                  'remaining': r['remaining_scope'],
              }, separators=(',', ':')))
          print('COUNTS=' + json.dumps(counts, sort_keys=True, separators=(',', ':')))
          PY
      - name: Remove inventory probe
        run: |
          set -euo pipefail
          rm .github/workflows/phase5-surface-inventory-probe-20260916.yml
          git config user.name "OpenAI phase5 inventory probe"
          git config user.email "noreply@openai.com"
          git add -A
          git commit -m "ops: remove phase5 surface inventory probe"
          git push origin HEAD:codex/phase5-60-surface-closure-20260916
