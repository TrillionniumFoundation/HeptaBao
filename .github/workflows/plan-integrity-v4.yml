name: plan-integrity-v4

on:
  push:
    branches:
      - "codex/plan-v1.2-execution-contracts-gap-closure-v1"
      - "codex/plan-v1.2.2-unified-gap-closure-v1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plan-integrity-v4-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  plan-and-python:
    if: ${{ (github.event_name != 'pull_request' || github.head_ref != 'codex/plan-v1.3-gap-closure-v2') && (github.event_name != 'push' || github.ref != 'refs/heads/codex/plan-v1.3-gap-closure-v2') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind exact immutable source
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          printf 'repository=%s\nref=%s\ncommit=%s\ntree=%s\n' \
            "$GITHUB_REPOSITORY" "$GITHUB_REF" "$SOURCE_SHA" "$(git rev-parse 'HEAD^{tree}')" \
            | tee "$RUNNER_TEMP/source-binding.txt"
      - name: Install exact Python validation dependencies
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-plan.txt
      - run: python3 -m pip install --disable-pip-version-check --requirement requirements-plan.txt
      - name: Validate V1.1 history and V1.2 current contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate_plan_v2.py
          python3 scripts/validate_plan_v2_extensions.py
          python3 scripts/validate_plan_v1_2.py
          python3 scripts/validate_plan_v1_2_1.py
          python3 scripts/validate_h02_exact_head_matrix_contract_v1.py
          python3 scripts/validate_h02_pr40_reconciliation_v1.py
          python3 scripts/validate_plan_v1_2_2.py
          python3 scripts/validate_h01_h02_next_v1.py
          python3 scripts/validate_h02_candidate_adapters_v1.py
          python3 scripts/validate_h02_openraft_inmemory_cluster_v1.py
          python3 scripts/validate_h02_openraft_fault_lab_v1.py
          python3 scripts/validate_h02_blocker_closure_v1.py
      - name: Execute every Python regression suite
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests/oracle -p 'test_*.py' -v
          python3 -m unittest discover -s tests/platform -p 'test_*.py' -v
          python3 -m unittest discover -s tests/plan -p 'test_*.py' -v
      - name: Resolve canonical project state
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python3 scripts/render_canonical_project_state_v1.py \
            --root . \
            --repository "$GITHUB_REPOSITORY" \
            --ref "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" \
            --commit "$SOURCE_SHA" \
            --tree "$(git rev-parse 'HEAD^{tree}')" \
            --environment-id "github-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --runner-name "$RUNNER_NAME" \
            --run-id "$GITHUB_RUN_ID" \
            --job-id "$GITHUB_JOB" \
            --require-clean \
            --output "$RUNNER_TEMP/canonical-project-state.resolved.json"
          python3 -m json.tool "$RUNNER_TEMP/canonical-project-state.resolved.json" >/dev/null
      - name: Upload exact V1.2 evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plan-v1.2-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/source-binding.txt
            ${{ runner.temp }}/canonical-project-state.resolved.json
          if-no-files-found: warn
          retention-days: 30

  root-rust:
    if: ${{ (github.event_name != 'pull_request' || github.head_ref != 'codex/plan-v1.3-gap-closure-v2') && (github.event_name != 'push' || github.ref != 'refs/heads/codex/plan-v1.3-gap-closure-v2') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Install Rust 1.98
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy
      - name: Format, test and lint root workspace
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.98.0 fmt --all -- --check
          cargo +1.98.0 test --locked --workspace --all-targets
          cargo +1.98.0 clippy --locked --workspace --all-targets -- -D warnings
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

  openraft-exact-graph-and-runtime:
    if: ${{ (github.event_name != 'pull_request' || github.head_ref != 'codex/plan-v1.3-gap-closure-v2') && (github.event_name != 'push' || github.ref != 'refs/heads/codex/plan-v1.3-gap-closure-v2') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      TOOLCHAINS: "1.88.0 1.98.0"
      SEEDS: "0x5eed20260828cafe 0x8badf00d12345678 0xd15ea5e5cafef00d"
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind exact immutable source
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          mkdir -p "$RUNNER_TEMP/openraft-results"
          printf 'repository=%s\nref=%s\ncommit=%s\ntree=%s\n' \
            "$GITHUB_REPOSITORY" "$GITHUB_REF" "$SOURCE_SHA" "$(git rev-parse 'HEAD^{tree}')" \
            | tee "$RUNNER_TEMP/openraft-results/source-binding.txt"
      - name: Install exact Python validation dependencies
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-plan.txt
      - run: python3 -m pip install --disable-pip-version-check --requirement requirements-plan.txt
      - name: Install exact effective toolchains
        shell: bash
        run: |
          set -euo pipefail
          for toolchain in $TOOLCHAINS; do
            rustup toolchain install "$toolchain" --profile minimal --component rustfmt,clippy
          done
      - name: Bind committed dependency graph
        shell: bash
        run: |
          set -euo pipefail
          manifest=probes/h02/openraft-tokio/Cargo.toml
          lock=probes/h02/openraft-tokio/Cargo.lock
          test -s "$lock"
          cargo +1.88.0 metadata --locked --format-version 1 --manifest-path "$manifest" \
            > "$RUNNER_TEMP/openraft-results/openraft-metadata.json"
          python3 scripts/validate_plan_v1_2.py
          python3 scripts/validate_plan_v1_2_1.py
          python3 scripts/validate_h02_exact_head_matrix_contract_v1.py
          python3 scripts/validate_h02_pr40_reconciliation_v1.py
          python3 scripts/validate_plan_v1_2_2.py
      - name: Compile, test and lint exact graph
        shell: bash
        run: |
          set -euo pipefail
          manifest=probes/h02/openraft-tokio/Cargo.toml
          cargo +1.98.0 fmt --manifest-path "$manifest" --all -- --check
          for toolchain in $TOOLCHAINS; do
            export CARGO_TARGET_DIR="$RUNNER_TEMP/openraft-target-$toolchain"
            cargo +"$toolchain" test --locked --all-targets --manifest-path "$manifest"
            cargo +"$toolchain" clippy --locked --all-targets --manifest-path "$manifest" -- -D warnings
          done
      - name: Execute all 24 exact-head entries and preserve every outcome
        id: exact-head-matrix
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set +e
          python3 scripts/h02_exact_head_matrix_v1.py \
            --repository "$GITHUB_REPOSITORY" \
            --ref "${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}" \
            --commit "$SOURCE_SHA" \
            --tree "$(git rev-parse 'HEAD^{tree}')" \
            --manifest probes/h02/openraft-tokio/Cargo.toml \
            --output-dir "$RUNNER_TEMP/openraft-results/matrix" \
            --cargo-target-root "$RUNNER_TEMP/openraft-target" \
            --entry-timeout-seconds 180 \
            > "$RUNNER_TEMP/openraft-results/matrix-runner.log" 2>&1
          rc=$?
          printf '%s\n' "$rc" > "$RUNNER_TEMP/openraft-results/matrix-runner.exit"
          cat "$RUNNER_TEMP/openraft-results/matrix-runner.log"
          exit 0
      - name: Upload complete exact-head diagnostics before final gate
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openraft-v1.2.2-exact-head-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/openraft-results/
          if-no-files-found: error
          retention-days: 30
      - name: Require schema-valid complete application-level PASS matrix
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(cat "$RUNNER_TEMP/openraft-results/matrix-runner.exit")" = 0
          python3 - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          from jsonschema import Draft202012Validator, FormatChecker

          root = Path.cwd()
          matrix_root = Path(os.environ["RUNNER_TEMP"]) / "openraft-results/matrix"
          summary = json.loads((matrix_root / "matrix-summary.json").read_text(encoding="utf-8"))
          schema = json.loads((root / "schemas/heptabao_h02_exact_head_matrix_summary_v1.schema.json").read_text(encoding="utf-8"))
          errors = sorted(
              Draft202012Validator(schema, format_checker=FormatChecker()).iter_errors(summary),
              key=lambda error: list(error.path),
          )
          assert not errors, [error.message for error in errors]
          toolchains = ("1.88.0", "1.98.0")
          seeds = ("0x5eed20260828cafe", "0x8badf00d12345678", "0xd15ea5e5cafef00d")
          kinds = ("inmemory", "hostile", "blocker", "durable")
          expected_ids = {
              f"{kind}-{toolchain}-{seed.removeprefix('0x')}"
              for toolchain in toolchains for seed in seeds for kind in kinds
          }
          entries = summary["entries"]
          assert len(entries) == 24
          assert {entry["entry_id"] for entry in entries} == expected_ids
          assert summary["source_binding"]["commit"] == os.environ["SOURCE_SHA"]
          actual_tree = subprocess.run(
              ["git", "rev-parse", "HEAD^{tree}"], check=True, capture_output=True, text=True
          ).stdout.strip()
          assert summary["source_binding"]["tree"] == actual_tree
          assert summary["matrix"]["executed_entry_count"] == 24
          assert summary["matrix"]["missing_entry_ids"] == []
          assert summary["matrix"]["unexpected_entry_ids"] == []
          assert summary["matrix"]["duplicate_entry_ids"] == []
          assert summary["runner_errors"] == []
          assert summary["counts"] == {"pass": 24, "fail": 0, "blocked": 0, "unknown": 0, "unexecuted": 0}
          assert summary["result"] == "PASS"
          assert summary["qualification"] is False
          assert summary["compatibility_claim"] is False
          assert summary["selection_effect"] == "NONE"
          assert summary["authority_effect"] == "NONE"

          def digest(path: Path) -> str:
              return "sha256:" + hashlib.sha256(path.read_bytes()).hexdigest()

          manifest = root / summary["dependency_binding"]["manifest_path"]
          lock = root / summary["dependency_binding"]["lock_path"]
          assert digest(manifest) == summary["dependency_binding"]["manifest_digest"]
          assert digest(lock) == summary["dependency_binding"]["lock_digest"]
          for entry in entries:
              assert entry["process_started"] is True, entry
              assert entry["conclusion"] == "PASS", entry
              assert entry["application_status"] == "EXECUTED_PASS", entry
              assert entry["exit_code"] == 0, entry
              assert entry["timed_out"] is False, entry
              assert entry["validation_errors"] == [], entry
              stdout_path = matrix_root / entry["stdout_path"]
              stderr_path = matrix_root / entry["stderr_path"]
              exit_path = matrix_root / entry["exit_path"]
              assert digest(stdout_path) == entry["stdout_digest"]
              assert digest(stderr_path) == entry["stderr_digest"]
              assert exit_path.read_text(encoding="utf-8").strip() == "0"
              command = json.dumps(entry["command"], sort_keys=True, separators=(",", ":"), ensure_ascii=False).encode()
              assert "sha256:" + hashlib.sha256(command).hexdigest() == entry["command_digest"]
          print("all 24 exact-head application results passed and every artifact digest verified")
          PY
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

  authority-sentinel:
    needs: [plan-and-python, root-rust, openraft-exact-graph-and-runtime]
    if: ${{ ((github.event_name != 'pull_request' || github.head_ref != 'codex/plan-v1.3-gap-closure-v2') && (github.event_name != 'push' || github.ref != 'refs/heads/codex/plan-v1.3-gap-closure-v2')) && (always()) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install exact Python validation dependencies
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-plan.txt
      - run: python3 -m pip install --disable-pip-version-check --requirement requirements-plan.txt
      - name: Require technical lanes and re-evaluate authority boundary
        env:
          PLAN: ${{ needs.plan-and-python.result }}
          ROOT_RUST: ${{ needs.root-rust.result }}
          OPENRAFT: ${{ needs.openraft-exact-graph-and-runtime.result }}
        run: |
          set -euo pipefail
          test "$PLAN" = success
          test "$ROOT_RUST" = success
          test "$OPENRAFT" = success
          python3 scripts/validate_plan_v1_2_1.py
          python3 scripts/validate_h02_pr40_reconciliation_v1.py
          python3 scripts/validate_plan_v1_2_2.py
          python3 - <<'PY'
          from pathlib import Path
          import yaml

          authority = yaml.safe_load(Path("planning/AUTHORITY_FLAGS_V2.yaml").read_text(encoding="utf-8"))
          canonical = yaml.safe_load(Path("planning/HEPTABAO_CANONICAL_PROJECT_STATE_V1.yaml").read_text(encoding="utf-8"))
          blockers = yaml.safe_load(Path("planning/HEPTABAO_BLOCKER_REGISTER_V1.yaml").read_text(encoding="utf-8"))
          assert all(value is False for key, value in authority["flags"].items() if key != "implementation_started")
          assert authority["active_grants"] == []
          assert canonical["qualification"] is False
          assert canonical["compatibility_claim"] is False
          assert canonical["selected_candidates"] == []
          assert all(value is False for value in canonical["authority_flags"].values())
          assert canonical["authority_effect"] == "NONE"
          assert not any(
              blocker["class"] != "REPOSITORY_CONTROLLED" and blocker["state"] == "CLOSED"
              for blocker in blockers["blockers"]
          )
          print("authority graph remains fail-closed after exact-head technical PASS")
          PY
          echo "V1.2.2 exact-head technical gates passed; qualification=false compatibility=false selection=0 authority=NONE"
