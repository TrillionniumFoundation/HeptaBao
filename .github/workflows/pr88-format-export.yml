name: PR88 rustfmt export

on:
  push:
    branches:
      - codex/pr83-ha-compose-closure-20260911-gpt56

permissions:
  contents: read

jobs:
  format-export:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install Rust 1.98
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt
      - name: Format diagnostic working tree
        run: cargo +1.98.0 fmt --all
      - name: Export formatted source
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pr88-rustfmt-${{ github.sha }}
          if-no-files-found: error
          retention-days: 1
          path: |
            crates/heptabao-server/src/ha.rs
            crates/heptabao-server/src/ha_state.rs
            crates/heptabao-server/src/http.rs
            crates/heptabao-server/src/service.rs
            crates/heptabao-server/src/main.rs
            crates/heptabao-raft-runtime/src/process/node.rs
