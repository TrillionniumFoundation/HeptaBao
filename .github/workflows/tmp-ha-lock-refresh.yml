name: Temporary lock refresh for HA composition

on:
  push:
    branches:
      - tmp/openbao-26-ha-lock-refresh-20260911
    paths:
      - crates/heptabao-server/Cargo.toml
      - .github/workflows/tmp-ha-lock-refresh.yml

permissions:
  contents: write

jobs:
  refresh-lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout temporary materialization branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Install exact Rust toolchain
        shell: bash
        run: rustup toolchain install 1.98.0 --profile minimal
      - name: Materialize dependency-only lock update
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.98.0 generate-lockfile
          git diff --check
          git diff --exit-code -- crates/heptabao-server/Cargo.toml
          if git diff --quiet -- Cargo.lock; then
            echo "Cargo.lock already current"
            exit 0
          fi
          git config user.name "heptabao-lock-materializer"
          git config user.email "actions@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "chore(lock): materialize HA server dependencies"
          git push origin HEAD:tmp/openbao-26-ha-lock-refresh-20260911
