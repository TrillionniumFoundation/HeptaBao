name: h02-openraft-fault-lab-v2

on:
  # Isolated current profile; bounded PR admission and manual reruns only.
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/h02-openraft-fault-lab-v2.yml"
      - "planning/HEPTABAO_H02_OPENRAFT_HOSTILE_FAULTS_LINEARIZABILITY_V2.yaml"
      - "scripts/h02_openraft_fault_lab_evidence_v2.py"
      - "scripts/validate_h02_openraft_fault_lab_v2.py"
      - "scripts/h02_linearizability_checker_v1.py"
      - ".github/workflows/h02-openraft-fault-lab.yml"
      - "planning/HEPTABAO_H02_OPENRAFT_HOSTILE_FAULTS_LINEARIZABILITY_V1.yaml"
      - "planning/HEPTABAO_H02_EXECUTION_QUEUE_V3.yaml"
      - "scripts/validate_h02_openraft_fault_lab_v1.py"
      - "scripts/h02_openraft_fault_lab_evidence_v1.py"
      - "schemas/heptabao_h02_openraft_fault_lab_evidence_v1.schema.json"
      - "tests/platform/test_h02_linearizability_checker_v1.py"
      - "tests/platform/test_h02_openraft_fault_lab_evidence_v1.py"
      - "schemas/heptabao_h02_openraft_fault_lab_evidence_v2.schema.json"
      - "schemas/heptabao_h02_openraft_hostile_snapshot_result_v1.schema.json"
      - "schemas/heptabao_h02_linearizability_history_v1.schema.json"
      - "schemas/heptabao_h02_linearizability_result_v1.schema.json"
      - "tests/platform/test_h02_openraft_fault_lab_evidence_v2.py"
      - "probes/h02/openraft-tokio/Cargo.toml"
      - "probes/h02/openraft-tokio/Cargo.lock"
      - "probes/h02/openraft-tokio/build.rs"
      - "probes/h02/openraft-tokio/src/**"
      - "probes/h02/openraft-tokio/tests/**"
      - "probes/h02/openraft-tokio/examples/**"
      - "probes/h02/openraft-tokio/benches/**"
      - "requirements-plan.txt"
      - "scripts/validate_workflow_trust.py"
      - "scripts/validate_workflow_trust_v1.py"
      - "scripts/workflow_trust_v2.py"
      - "scripts/workflow_trust_action_registry_v2.json"
      - "scripts/validate_acceptance_immutability.py"
permissions:
  contents: read

concurrency:
  group: h02-openraft-fault-lab-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-plan.txt
      - run: python -m pip install --disable-pip-version-check --requirement requirements-plan.txt
      - run: python scripts/validate_h02_openraft_fault_lab_v2.py
      - run: python -m unittest discover -s tests/platform -p 'test_h02_openraft_fault_lab_evidence_v2.py' -v

  fault-sequential:
    needs: validate-plan
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      TOOLCHAINS: "1.88.0 1.99.0"
      SEEDS: "0x5eed20260828cafe 0x8badf00d12345678 0xd15ea5e5cafef00d"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - run: python -m pip install --disable-pip-version-check --requirement requirements-plan.txt
      - name: Install exact Rust toolchains and retain setup outcomes
        shell: bash
        run: |
          set -u
          setup_root="$RUNNER_TEMP/h02-fault-v2-setup"
          mkdir -p "$setup_root"
          for toolchain in $TOOLCHAINS; do
            status=0
            rustup toolchain install "$toolchain" --profile minimal \
              >"$setup_root/install-$toolchain.log" 2>&1 || status=$?
            printf '%s\n' "$status" >"$setup_root/install-$toolchain-exit-code.txt"
            status=0
            rustup target add x86_64-unknown-linux-gnu --toolchain "$toolchain" \
              >"$setup_root/target-$toolchain.log" 2>&1 || status=$?
            printf '%s\n' "$status" >"$setup_root/target-$toolchain-exit-code.txt"
          done
          # The collector records missing-toolchain/build failures for every entry.
          exit 0
      - name: Execute all six entries serially and retain every outcome
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/h02_openraft_fault_lab_evidence_v2.py run \
            --execution-root "$RUNNER_TEMP/h02-fault-v2-work" \
            --evidence-root "$RUNNER_TEMP/h02-fault-v2-evidence" \
            --source-root "$GITHUB_WORKSPACE" \
            --expected-commit "${{ github.event.pull_request.head.sha || github.sha }}" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --runner-name "$RUNNER_NAME"
      - name: Validate all retained evidence before upload
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_h02_openraft_fault_lab_v2.py \
            --evidence-root "$RUNNER_TEMP/h02-fault-v2-evidence" \
            --producer-source-root "$GITHUB_WORKSPACE" \
            --producer-evidence-root "$RUNNER_TEMP/h02-fault-v2-evidence" \
            --source-commit "$(git rev-parse HEAD)" \
            --source-tree "$(git rev-parse 'HEAD^{tree}')" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --runner-name "$RUNNER_NAME" --execution-root "$RUNNER_TEMP/h02-fault-v2-work"
      - name: Upload every outcome before final gate
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: h02-openraft-fault-lab-v2-sequential-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/h02-fault-v2-evidence/
            ${{ runner.temp }}/h02-fault-v2-setup/
          if-no-files-found: error
          retention-days: 30
      - name: Require all six executed passes without qualification
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_h02_openraft_fault_lab_v2.py \
            --evidence-root "$RUNNER_TEMP/h02-fault-v2-evidence" \
            --producer-source-root "$GITHUB_WORKSPACE" \
            --producer-evidence-root "$RUNNER_TEMP/h02-fault-v2-evidence" \
            --source-commit "$(git rev-parse HEAD)" \
            --source-tree "$(git rev-parse 'HEAD^{tree}')" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --runner-name "$RUNNER_NAME" --execution-root "$RUNNER_TEMP/h02-fault-v2-work" \
            --require-pass

  authority-sentinel:
    needs: [validate-plan, fault-sequential]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Keep all authority closed
        env:
          VALIDATE_RESULT: ${{ needs.validate-plan.result }}
          FAULT_RESULT: ${{ needs.fault-sequential.result }}
        run: |
          set -euo pipefail
          printf 'validate=%s\nfault=%s\n' "$VALIDATE_RESULT" "$FAULT_RESULT"
          test "$VALIDATE_RESULT" = success
          test "$FAULT_RESULT" = success
          echo 'OpenRaft fault observations only; qualification=false selection=NONE authority=NONE.'
