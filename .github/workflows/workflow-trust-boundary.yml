name: HeptaBao workflow trust boundary

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: workflow-trust-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  verify:
    name: workflow-trust / ${{ matrix.source_kind }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        source_kind: [exact-head, prospective-merge]
    env:
      SOURCE_KIND: ${{ matrix.source_kind }}
      SOURCE_SHA: ${{ matrix.source_kind == 'prospective-merge' && github.sha || github.event.pull_request.head.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - name: Checkout immutable candidate without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify actual Git identities before candidate execution
        shell: bash
        run: |
          set -euo pipefail
          for value in "$SOURCE_SHA" "$HEAD_SHA" "$BASE_SHA"; do
            [[ "$value" =~ ^[0-9a-f]{40}$ ]]
          done
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          if [[ "$SOURCE_KIND" == prospective-merge ]]; then
            read -r commit parent_one parent_two extra <<<"$(git rev-list --parents -n 1 HEAD)"
            test "$commit" = "$SOURCE_SHA"
            test "$parent_one" = "$BASE_SHA"
            test "$parent_two" = "$HEAD_SHA"
            test -z "${extra:-}"
          else
            test "$SOURCE_KIND" = exact-head
            test "$SOURCE_SHA" = "$HEAD_SHA"
          fi
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          printf 'source_kind=%s\nsource_sha=%s\ntree=%s\n' "$SOURCE_KIND" "$SOURCE_SHA" "$(git rev-parse HEAD^{tree})"
      - name: Export tracked exact-head source for offline verification
        if: matrix.source_kind == 'exact-head'
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git bundle create "$RUNNER_TEMP/heptabao-exact-source.bundle" HEAD
          git bundle verify "$RUNNER_TEMP/heptabao-exact-source.bundle"
          printf 'repository=%s\ncommit=%s\ntree=%s\nrun_id=%s\nrun_attempt=%s\n' \
            "$GITHUB_REPOSITORY" "$SOURCE_SHA" "$(git rev-parse HEAD^{tree})" \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" > "$RUNNER_TEMP/source-binding.txt"
          (cd "$RUNNER_TEMP" && sha256sum heptabao-exact-source.bundle > heptabao-exact-source.bundle.sha256)
      - name: Retain tracked source snapshot without publishing repository changes
        if: matrix.source_kind == 'exact-head'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: heptabao-offline-source-${{ env.SOURCE_SHA }}
          path: |
            ${{ runner.temp }}/heptabao-exact-source.bundle
            ${{ runner.temp }}/heptabao-exact-source.bundle.sha256
            ${{ runner.temp }}/source-binding.txt
          if-no-files-found: error
          retention-days: 7
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Validate every installed workflow and hostile regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --requirement requirements-plan.txt
          python -m unittest discover -s tests/security -p 'test_*.py' -v
          python scripts/validate_workflow_trust.py
      - name: Preserve generation-appropriate current-source gates
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f planning/HEPTABAO_CANONICAL_PROJECT_STATE_V2_0.yaml ]]; then
            python scripts/validate_repository_v2.py
            python -m unittest discover -s tests/repository -p 'test_*.py' -v
            python scripts/validate_module_documentation_v1_4_4.py
            python -m unittest discover -s tests/plan -p 'test_module_documentation_v1_4_4.py' -v
            python -m unittest discover -s tests/plan -p 'test_external_completion_evidence_v1.py' -v
          else
            python scripts/validate_plan_v1_4_7.py
            python scripts/validate_plan_v1_4_6.py
            python scripts/validate_plan_v1_4_5.py
            python scripts/validate_module_documentation_v1_4_4.py
            python -m unittest discover -s tests/plan -p 'test_*v1_4_7.py' -v
            python -m unittest discover -s tests/plan -p 'test_external_completion_evidence_v1.py' -v
            python -m unittest discover -s tests/plan -p 'test_plan_v1_4_6.py' -v
            python -m unittest discover -s tests/plan -p 'test_plan_v1_4_5.py' -v
            python -m unittest discover -s tests/plan -p 'test_module_documentation_v1_4_4.py' -v
          fi
          python -m unittest discover -s tests/platform -p 'test_*.py' -v
          python -m unittest discover -s tests/oracle -p 'test_*.py' -v
      - name: Install declared Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
      - name: Validate unchanged Rust workspace
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.98.0 fmt --all -- --check
          cargo +1.98.0 test --locked --workspace --all-targets
          cargo +1.98.0 clippy --locked --workspace --all-targets -- -D warnings
          git diff --exit-code
