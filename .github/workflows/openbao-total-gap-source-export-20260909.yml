name: HeptaBao total-gap exact source export

on:
  push:
    branches:
      - exec/openbao-total-gap-source-export-20260909

permissions:
  contents: read

concurrency:
  group: heptabao-total-gap-source-export-${{ github.ref }}
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Bind and bundle exact tracked source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          out="$RUNNER_TEMP/heptabao-total-gap-exact-source"
          mkdir -p "$out"
          git bundle create "$out/heptabao-total-gap.bundle" HEAD
          git bundle verify "$out/heptabao-total-gap.bundle"
          git archive --format=tar.gz --output="$out/heptabao-total-gap.tar.gz" HEAD
          printf 'repository=TrillionniumFoundation/HeptaBao\ncommit=%s\ntree=%s\n' \
            "$(git rev-parse HEAD)" "$(git rev-parse 'HEAD^{tree}')" > "$out/source-binding.txt"
          (cd "$out" && sha256sum heptabao-total-gap.bundle heptabao-total-gap.tar.gz source-binding.txt > SHA256SUMS)

      - name: Upload exact-source artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: heptabao-total-gap-exact-source
          path: ${{ runner.temp }}/heptabao-total-gap-exact-source/
          if-no-files-found: error
          retention-days: 3
