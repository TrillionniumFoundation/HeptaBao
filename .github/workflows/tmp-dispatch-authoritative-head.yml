name: tmp-dispatch-authoritative-head

on:
  push:
    branches:
      - ops/heptabao-authoritative-dispatch-20260910
    paths:
      - .github/workflows/tmp-dispatch-authoritative-head.yml

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    steps:
      - name: Verify and dispatch exact candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_BRANCH: codex/openbao-replacement-v2.4-authoritative-closure-20260909
          SOURCE_SHA: 6480504418eaa2222dc372844114adb44c703510
        run: |
          set -euo pipefail
          observed="$(git ls-remote https://github.com/TrillionniumFoundation/HeptaBao.git "refs/heads/$SOURCE_BRANCH" | cut -f1)"
          test "$observed" = "$SOURCE_SHA"
          code="$(curl --silent --show-error --output "$RUNNER_TEMP/dispatch-response.txt" \
            --write-out '%{http_code}' --request POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            https://api.github.com/repos/TrillionniumFoundation/HeptaBao/actions/workflows/353656217/dispatches \
            --data '{"ref":"codex/openbao-replacement-v2.4-authoritative-closure-20260909"}')"
          cat "$RUNNER_TEMP/dispatch-response.txt"
          test "$code" = "204"
          printf 'dispatched_ref=%s\nexact_head=%s\n' "$SOURCE_BRANCH" "$SOURCE_SHA"
