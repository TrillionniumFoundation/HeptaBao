name: Codex OpenBao replacement full qualification

on:
  push:
    branches:
      - codex/openbao-replacement-full-closure-20260908
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codex-openbao-replacement-full-qualification
  cancel-in-progress: true

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact source without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Bind immutable source and clean tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          git diff --check

      - name: Install Python validation dependencies
        shell: bash
        run: python -m pip install --disable-pip-version-check --requirement requirements-plan.txt

      - name: Install exact Rust toolchain
        shell: bash
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy

      - name: Validate current repository truth
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_repository_v2.py
          python -m unittest discover -s tests/repository -p 'test_*.py' -v
          python -m unittest discover -s qa/openbao-acceptance/tests -p 'test_*.py' -v

      - name: Qualify complete Rust workspace and real TLS service
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.98.0 fmt --all -- --check
          cargo +1.98.0 test --locked --workspace --all-targets
          cargo +1.98.0 clippy --locked --workspace --all-targets -- -D warnings
          cargo +1.98.0 doc --locked --workspace --no-deps
          cargo +1.98.0 build --locked -p heptabao-server
          python qa/single-node/smoke.py \
            --binary "$PWD/target/debug/heptabao-server" \
            --work-dir "$RUNNER_TEMP/heptabao-openbao-replacement-smoke"

      - name: Confirm source remained immutable
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          git diff --check
