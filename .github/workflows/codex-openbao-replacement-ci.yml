name: Codex OpenBao replacement full qualification

on:
  push:
    branches:
      - codex/openbao-replacement-full-closure-20260908
      - codex/openbao-2-6-production-replacement-closure-20260911-r1
      - codex/openbao-2.6-production-gap-closure-20260911
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qualify:
    name: OpenBao replacement / ${{ matrix.source_kind }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        source_kind: ${{ fromJSON(github.event_name == 'pull_request' && '["head","merge"]' || '["head"]') }}
    env:
      EXPECTED_SOURCE: ${{ matrix.source_kind == 'merge' && github.sha || (github.event.pull_request.head.sha || github.sha) }}
      PR_HEAD: ${{ github.event.pull_request.head.sha }}
      PR_BASE: ${{ github.event.pull_request.base.sha }}
    steps:
      - name: Checkout immutable candidate without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ matrix.source_kind == 'merge' && github.sha || (github.event.pull_request.head.sha || github.sha) }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify source identity and prospective-merge parents
        shell: bash
        env:
          CANDIDATE: ${{ matrix.source_kind }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SOURCE" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          git diff --check
          if test "$GITHUB_EVENT_NAME" = pull_request && test "$CANDIDATE" = merge; then
            test "$(git show -s --format=%P HEAD | wc -w)" -eq 2
            test "$(git rev-parse HEAD^1)" = "$PR_BASE"
            test "$(git rev-parse HEAD^2)" = "$PR_HEAD"
          fi
          printf 'source_commit=%s\nsource_tree=%s\n' "$(git rev-parse HEAD)" "$(git rev-parse HEAD^{tree})"

      - name: Install Python validation dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --requirement requirements-plan.txt
          python scripts/verify_python_environment.py

      - name: Install exact Rust toolchain
        shell: bash
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy

      - name: Validate current repository truth and acceptance fixtures
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_repository_v2.py
          python scripts/validate_module_closure.py
          python scripts/surface_work.py
          python -m unittest discover -s tests/repository -p 'test_*.py' -v
          python -m unittest discover -s qa/openbao-acceptance/tests -p 'test_*.py' -v
          python -m unittest discover -s clients/python/tests -p 'test_*.py' -v

      - name: Test the complete locked Rust workspace
        if: ${{ success() || failure() }}
        shell: bash
        run: cargo +1.98.0 test --locked --workspace --all-targets

      - name: Check formatting without changing source
        if: ${{ success() || failure() }}
        shell: bash
        run: cargo +1.98.0 fmt --all -- --check

      - name: Check strict workspace Clippy
        if: ${{ success() || failure() }}
        shell: bash
        run: cargo +1.98.0 clippy --locked --workspace --all-targets -- -D warnings

      - name: Build workspace documentation
        if: ${{ success() || failure() }}
        shell: bash
        run: cargo +1.98.0 doc --locked --workspace --no-deps

      - name: Build and exercise the real TLS service
        if: ${{ success() || failure() }}
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.98.0 build --locked -p heptabao-server
          python qa/single-node/smoke.py \
            --binary "$PWD/target/debug/heptabao-server" \
            --work-dir "$RUNNER_TEMP/heptabao-openbao-replacement-smoke"

      - name: Preserve the original PR96 capacity response and fixture
        if: ${{ success() || failure() }}
        shell: bash
        run: |
          set -euo pipefail
          reports="$RUNNER_TEMP/heptabao-legacy-capacity-evidence"
          mkdir -m 700 "$reports"
          timeout 240 python qa/openbao-acceptance/capacity_legacy_live.py \
            --binary "$PWD/target/debug/heptabao-server" --output "$reports/capacity.json"

      - name: Exercise bounded state saturation and replay-preserving capacity recovery
        if: ${{ success() || failure() }}
        shell: bash
        run: |
          set -euo pipefail
          reports="$RUNNER_TEMP/heptabao-capacity-evidence"
          mkdir -m 700 "$reports"
          timeout 180 python qa/openbao-acceptance/capacity_live.py \
            --binary "$PWD/target/debug/heptabao-server" --output "$reports/capacity.json"

      - name: Exercise real three-process HA with synthetic state
        if: ${{ success() || failure() }}
        shell: bash
        run: |
          set -euo pipefail
          binary="$PWD/target/debug/heptabao-server"
          digest="$(sha256sum "$binary" | cut -d ' ' -f 1)"
          timeout 240 python qa/openbao-acceptance/ha_destructive.py \
            --binary "$binary" \
            --expected-binary-sha256 "$digest" \
            --work-dir "$RUNNER_TEMP/heptabao-three-process-ha"

      - name: Exercise real encrypted-link network partitions
        if: ${{ success() || failure() }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
          binary="$PWD/target/debug/heptabao-server"
          digest="$(sha256sum "$binary" | cut -d ' ' -f 1)"
          timeout 360 python qa/openbao-acceptance/ha_network_partition.py \
            --binary "$binary" \
            --expected-binary-sha256 "$digest" \
            --work-dir "$RUNNER_TEMP/heptabao-network-partition-ha"

      - name: Exercise actual private-output client and OTP wrapping HA
        if: ${{ success() || failure() }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
          binary="$PWD/target/debug/heptabao-server"
          evidence="$RUNNER_TEMP/heptabao-runtime-profile-evidence"
          mkdir -m 700 "$evidence"
          python qa/openbao-acceptance/client_live.py --binary "$binary" --output "$evidence/client.json"
          timeout 180 python qa/openbao-acceptance/agent_proxy_helper_live.py \
            --binary "$binary" --output "$evidence/agent-proxy-helper.json"
          timeout 360 python qa/openbao-acceptance/ssh_otp_ha.py \
            --binary "$binary" \
            --expected-binary-sha256 "$(sha256sum "$binary" | cut -d ' ' -f 1)" \
            --output "$evidence/ssh-ha.json"
          timeout 240 python qa/openbao-acceptance/idle_lifecycle_ha.py \
            --binary "$binary" \
            --expected-binary-sha256 "$(sha256sum "$binary" | cut -d ' ' -f 1)" \
            --output "$evidence/idle-ha.json"

      - name: Install the real PostgreSQL 17 prerequisite from signed packages
        if: ${{ success() || failure() }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_ACTIONS" = true
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-common ca-certificates
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y --no-install-recommends postgresql-17 postgresql-client-17
          /usr/lib/postgresql/17/bin/postgres --version
          dpkg-query -W postgresql-17 postgresql-client-17

      - name: Exercise actual PostgreSQL SQL and active-session revocation
        if: ${{ success() || failure() }}
        shell: bash
        run: |
          set -euo pipefail
          timeout 300 python qa/openbao-acceptance/postgres_live.py \
            --binary "$PWD/target/debug/heptabao-server" \
            --postgres-bin /usr/lib/postgresql/17/bin \
            --output "$RUNNER_TEMP/heptabao-postgresql-real.json"
          # The runner returns 77 for missing real binaries; that is a blocking
          # failure here, never a successful skip or a protocol-model fallback.

      - name: Acquire the checksum-pinned official binary in the Oracle lane
        if: ${{ success() || failure() }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/prepare_openbao_oracle.py --output "$RUNNER_TEMP/heptabao-official-oracle"

      - name: Exercise online authentication and durable cross-node code consumption
        if: ${{ success() || failure() }}
        shell: bash
        env:
          HB_ORACLE_BINARY: ${{ runner.temp }}/heptabao-official-oracle/bao
          HB_ORACLE_ARCHIVE: ${{ runner.temp }}/heptabao-official-oracle/oracle-official.tar.gz
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
          reports="$RUNNER_TEMP/heptabao-online-authentication"
          python -c 'import os,sys; os.mkdir(sys.argv[1],0o700); os.chmod(sys.argv[1],0o700)' "$reports"
          timeout 180 python qa/openbao-acceptance/kubernetes_online.py --binary "$PWD/target/debug/heptabao-server" --output "$reports/kubernetes.json"
          timeout 240 python qa/openbao-acceptance/oidc_code_live.py --binary "$PWD/target/debug/heptabao-server" --output "$reports/oidc.json"
          timeout 360 python qa/openbao-acceptance/online_auth_ha.py --binary "$PWD/target/debug/heptabao-server" --output "$reports/ha.json"
          # A controlled TokenReview fixture is not an actual Kubernetes cluster.
          # No secret-bearing service/issuer/client directories are uploaded.

      - name: Observe real migration catalogs and target capacity without cutover
        if: ${{ success() || failure() }}
        shell: bash
        env:
          HB_ORACLE_BINARY: ${{ runner.temp }}/heptabao-official-oracle/bao
          HB_ORACLE_ARCHIVE: ${{ runner.temp }}/heptabao-official-oracle/oracle-official.tar.gz
        run: |
          set -euo pipefail
          reports="$RUNNER_TEMP/heptabao-preflight-evidence"
          mkdir -m 700 "$reports"
          timeout 180 python qa/openbao-acceptance/migration_preflight_live.py \
            --binary "$PWD/target/debug/heptabao-server" --output "$reports/preflight.json"

      - name: Execute all bounded official-binary differential profiles
        if: ${{ success() || failure() }}
        shell: bash
        env:
          HB_ORACLE_BINARY: ${{ runner.temp }}/heptabao-official-oracle/bao
          HB_ORACLE_ARCHIVE: ${{ runner.temp }}/heptabao-official-oracle/oracle-official.tar.gz
        run: |
          set -euo pipefail
          binary="$PWD/target/debug/heptabao-server"
          # The comparison runners require a new caller-owned 0700 output parent;
          # RUNNER_TEMP itself may be searchable by other users. Keep that guard.
          reports="$RUNNER_TEMP/heptabao-official-profile-reports"
          mkdir -m 700 "$reports"
          failed=0
          for profile in core_isolation identity_live response_wrapping pki_live remote_jwks_compare; do
            if timeout 240 python "qa/openbao-acceptance/$profile.py" \
                --binary "$binary" --output "$reports/$profile.json"; then
              printf 'profile=%s process_exit=0 scope=bounded_not_independent\n' "$profile"
            else
              status=$?
              printf 'profile=%s process_exit=%s scope=blocked_or_failed\n' "$profile" "$status"
              failed=1
            fi
          done
          test "$failed" -eq 0

      - name: Re-encrypt actual official Transit ciphertext with restart and lost acknowledgement
        if: ${{ success() || failure() }}
        shell: bash
        env:
          HB_ORACLE_BINARY: ${{ runner.temp }}/heptabao-official-oracle/bao
          HB_ORACLE_ARCHIVE: ${{ runner.temp }}/heptabao-official-oracle/oracle-official.tar.gz
        run: |
          set -euo pipefail
          reports="$RUNNER_TEMP/heptabao-transit-migration-reports"
          mkdir -m 700 "$reports"
          timeout 300 python qa/openbao-acceptance/transit_migration_live.py \
            --binary "$PWD/target/debug/heptabao-server" --output "$reports/transit.json"
          # Missing official binaries (exit 77) remain a blocking failure.

      - name: Execute the fixed corpus against the official OpenBao binary
        if: ${{ success() || failure() }}
        shell: bash
        env:
          HB_ORACLE_BINARY: ${{ runner.temp }}/heptabao-official-oracle/bao
          HB_ORACLE_ARCHIVE: ${{ runner.temp }}/heptabao-official-oracle/oracle-official.tar.gz
        run: |
          set -euo pipefail
          timeout 300 python qa/openbao-acceptance/run_official_comparison.py \
            --binary "$PWD/target/debug/heptabao-server" --candidate-source "$PWD" \
            --work-dir "$RUNNER_TEMP/heptabao-fixed-corpus-comparison"

      - name: Rehearse the real bounded KV migration and lost acknowledgement
        if: ${{ success() || failure() }}
        shell: bash
        env:
          HB_ORACLE_BINARY: ${{ runner.temp }}/heptabao-official-oracle/bao
          HB_ORACLE_ARCHIVE: ${{ runner.temp }}/heptabao-official-oracle/oracle-official.tar.gz
        run: |
          set -euo pipefail
          timeout 300 python qa/openbao-acceptance/live_migration_rehearsal.py \
            --binary "$PWD/target/debug/heptabao-server" \
            --oracle-launcher "$PWD/qa/openbao-acceptance/official_openbao_launcher.py" \
            --work-dir "$RUNNER_TEMP/heptabao-live-kv-migration"

      - name: Exercise committed membership snapshot catch-up and real cleanup grace
        if: ${{ success() || failure() }}
        shell: bash
        run: |
          set -euo pipefail
          timeout 360 python qa/openbao-acceptance/raft_membership_live.py \
            --binary "$PWD/target/debug/heptabao-server" --dead-cleanup \
            --output "$RUNNER_TEMP/heptabao-raft-membership.json"

      - name: Exercise actual Kubernetes API etcd and RBAC with a pinned disposable node
        if: ${{ success() || failure() }}
        shell: bash
        run: |
          set -euo pipefail
          tools="$RUNNER_TEMP/heptabao-kind-input"
          reports="$RUNNER_TEMP/heptabao-real-kubernetes-reports"
          mkdir -m 700 "$tools" "$reports"
          curl --fail --silent --show-error --location --proto '=https' --proto-redir '=https' \
            --max-time 120 https://github.com/kubernetes-sigs/kind/releases/download/v0.31.0/kind-linux-amd64 \
            --output "$tools/kind"
          printf '%s  %s\n' eb244cbafcc157dff60cf68693c14c9a75c4e6e6fedaf9cd71c58117cb93e3fa "$tools/kind" | sha256sum -c -
          chmod 700 "$tools/kind"
          timeout 600 python qa/openbao-acceptance/kubernetes_cluster_live.py \
            --binary "$PWD/target/debug/heptabao-server" --kind "$tools/kind" \
            --output "$reports/actual-kubernetes.json" --allow-disposable-cluster
          # Exit 77, missing Docker, image failure, timeout and any failed case block CI.
          # No kubeconfig, TokenRequest response, private key or cluster data is uploaded.

      - name: Confirm source remained immutable
        if: ${{ success() || failure() }}
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          git diff --check
