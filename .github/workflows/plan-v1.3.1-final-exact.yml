name: plan-v1.3.1-final-exact

on:
  push:
    branches:
      - "codex/plan-v1.3-gap-closure-v2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plan-v1.3.1-final-exact-${{ github.ref }}
  cancel-in-progress: true

env:
  SOURCE_SHA: ${{ github.sha }}
  HEPTABAO_P0_BIND: 127.0.0.1:0
  HEPTABAO_P0_DEV_TOKEN: v1-3-1-final-development-root-token-000001
  HEPTABAO_P0_DEV_UNSEAL_KEY: v1-3-1-final-development-unseal-key-00001

jobs:
  serial-closure:
    name: serial exact-head repository closure
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout exact immutable source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact source and initialize evidence tree
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          evidence="$RUNNER_TEMP/v1.3.1-final-exact"
          mkdir -p "$evidence/root" "$evidence/p0" "$evidence/h02"
          printf 'repository=%s\nref=%s\ncommit=%s\ntree=%s\nrun_id=%s\nrun_attempt=%s\nrunner=%s\n' \
            "$GITHUB_REPOSITORY" "$GITHUB_REF" "$SOURCE_SHA" "$(git rev-parse 'HEAD^{tree}')" \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$RUNNER_NAME" \
            | tee "$evidence/source-binding.txt"

      - name: Install exact Python dependencies
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-plan.txt

      - name: Install plan dependencies
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check --requirement requirements-plan.txt

      - name: Execute Gate A without hiding failures
        shell: bash
        run: |
          set +e
          set -u
          set -o pipefail
          evidence="$RUNNER_TEMP/v1.3.1-final-exact/root"
          validators=(
            scripts/validate_plan_v2.py
            scripts/validate_plan_v2_extensions.py
            scripts/validate_plan_v1_2.py
            scripts/validate_plan_v1_2_1.py
            scripts/validate_plan_v1_2_2.py
            scripts/validate_plan_v1_3.py
            scripts/validate_plan_v1_3_1.py
            scripts/validate_v1_3_1_final_closure_v1.py
            scripts/validate_provenance_v1.py
            scripts/validate_evidence_objects_v1.py
            scripts/validate_oracle_foundation_v1.py
            scripts/validate_repository_identity_v1.py
            scripts/validate_dependency_bakeoff_v1.py
            scripts/validate_dependency_execution_profiles_v1.py
            scripts/validate_dependency_registry_evidence_v1.py
            scripts/validate_dependency_research_captures_v1.py
            scripts/validate_h01_h02_next_v1.py
            scripts/validate_h02_seeded_behavior_plan_v1.py
            scripts/validate_h02_candidate_adapters_v1.py
            scripts/validate_h02_openraft_inmemory_cluster_v1.py
            scripts/validate_h02_openraft_fault_lab_v1.py
            scripts/validate_h02_blocker_closure_v1.py
            scripts/validate_h02_exact_head_matrix_contract_v1.py
            scripts/validate_h02_pr40_reconciliation_v1.py
          )
          gate_rc=0
          : >"$evidence/validators.log"
          for script in "${validators[@]}"; do
            if [[ ! -f "$script" ]]; then
              printf 'missing validator: %s\n' "$script" | tee -a "$evidence/validators.log"
              gate_rc=1
              continue
            fi
            python3 "$script" >>"$evidence/validators.log" 2>&1 || gate_rc=1
          done
          python3 scripts/validate_rust_source_surface_v1.py \
            crates/heptabao-protocol/src/lib.rs \
            crates/heptabao-authbus-contracts/src/lib.rs \
            crates/heptabao-p0-server/src/lib.rs \
            crates/heptabao-p0-server/src/main.rs \
            --output "$evidence/rust-source-surface.json" \
            >>"$evidence/validators.log" 2>&1 || gate_rc=1
          for suite in oracle platform plan; do
            python3 -m unittest discover -s "tests/$suite" -p 'test_*.py' -v \
              >"$evidence/tests-$suite.log" 2>&1 || gate_rc=1
          done
          python3 -m compileall -q scripts tests || gate_rc=1
          if [[ -n "$(git status --porcelain=v1 --untracked-files=all)" ]]; then
            git status --porcelain=v1 --untracked-files=all >"$evidence/dirty-tree.txt"
            gate_rc=1
          fi
          printf 'gate_a=%s\n' "$gate_rc" >"$evidence/gate-a-exit.txt"
          exit 0

      - name: Install exact Rust toolchains
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 --fail --silent --show-error https://sh.rustup.rs \
              -o "$RUNNER_TEMP/rustup-init.sh"
            sh "$RUNNER_TEMP/rustup-init.sh" -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >>"$GITHUB_PATH"
            export PATH="$HOME/.cargo/bin:$PATH"
          fi
          for toolchain in 1.88.0 1.98.0; do
            rustup toolchain install "$toolchain" --profile minimal --component rustfmt,clippy
          done

      - name: Execute root Rust gate without hiding failures
        shell: bash
        run: |
          set +e
          evidence="$RUNNER_TEMP/v1.3.1-final-exact/root"
          fmt_rc=0
          test_rc=0
          clippy_rc=0
          cargo +1.98.0 fmt --all -- --check >"$evidence/rust-fmt.log" 2>&1 || fmt_rc=$?
          cargo +1.98.0 test --locked --workspace --all-targets \
            >"$evidence/rust-test.log" 2>&1 || test_rc=$?
          cargo +1.98.0 clippy --locked --workspace --all-targets -- -D warnings \
            >"$evidence/rust-clippy.log" 2>&1 || clippy_rc=$?
          clean_rc=0
          if [[ -n "$(git status --porcelain=v1 --untracked-files=all)" ]]; then
            git status --porcelain=v1 --untracked-files=all >"$evidence/root-dirty-tree.txt"
            clean_rc=1
          fi
          printf 'fmt=%s\ntest=%s\nclippy=%s\nclean=%s\n' \
            "$fmt_rc" "$test_rc" "$clippy_rc" "$clean_rc" >"$evidence/root-rust-exits.txt"
          exit 0

      - name: Execute and classify P0 transport evidence
        shell: bash
        env:
          HEPTABAO_P0_AUDIT_PATH: ${{ runner.temp }}/v1.3.1-final-exact/p0/audit-source.log
        run: |
          set +e
          set -u
          set -o pipefail
          evidence="$RUNNER_TEMP/v1.3.1-final-exact/p0"
          mkdir -p "$evidence"
          stderr="$evidence/server.stderr"
          cargo +1.98.0 run --quiet --locked -p heptabao-p0-server \
            >"$evidence/server.stdout" 2>"$stderr" &
          server_pid=$!
          cleanup() {
            kill "$server_pid" 2>/dev/null || true
            wait "$server_pid" 2>/dev/null || true
          }
          trap cleanup EXIT
          python3 scripts/p0_transport_exact_v1.py \
            --stderr "$stderr" \
            --audit "$HEPTABAO_P0_AUDIT_PATH" \
            --repository "$GITHUB_REPOSITORY" \
            --commit "$SOURCE_SHA" \
            --tree "$(git rev-parse 'HEAD^{tree}')" \
            >"$evidence/raw-result.json" 2>"$evidence/runner.stderr"
          p0_rc=$?
          classify_rc=1
          validate_rc=1
          if [[ -s "$evidence/raw-result.json" ]]; then
            python3 scripts/classify_p0_transport_evidence_v1.py \
              --input "$evidence/raw-result.json" \
              --output "$evidence/classified-result.json" \
              >"$evidence/classification.log" 2>&1
            classify_rc=$?
          fi
          if [[ -s "$evidence/classified-result.json" ]]; then
            python3 scripts/validate_p0_transport_evidence_v2.py \
              --input "$evidence/classified-result.json" \
              --expected-commit "$SOURCE_SHA" \
              --expected-tree "$(git rev-parse 'HEAD^{tree}')" \
              --expected-repository "$GITHUB_REPOSITORY" \
              >"$evidence/validation.log" 2>&1
            validate_rc=$?
          fi
          audit_rc=0
          if [[ -s "$HEPTABAO_P0_AUDIT_PATH" ]]; then
            cp "$HEPTABAO_P0_AUDIT_PATH" "$evidence/audit.log"
          else
            printf '%s\n' 'P0 audit log was not produced' >"$evidence/audit.log"
            audit_rc=1
          fi
          clean_rc=0
          if [[ -n "$(git status --porcelain=v1 --untracked-files=all)" ]]; then
            git status --porcelain=v1 --untracked-files=all >"$evidence/p0-dirty-tree.txt"
            clean_rc=1
          fi
          printf 'p0=%s\nclassify=%s\nvalidate=%s\naudit=%s\nclean=%s\n' \
            "$p0_rc" "$classify_rc" "$validate_rc" "$audit_rc" "$clean_rc" \
            >"$evidence/exits.txt"
          exit 0

      - name: Compile, lint and execute complete H02 matrix
        shell: bash
        run: |
          set +e
          evidence="$RUNNER_TEMP/v1.3.1-final-exact/h02"
          mkdir -p "$evidence/matrix"
          manifest=probes/h02/openraft-tokio/Cargo.toml
          cargo +1.88.0 metadata --locked --format-version 1 --manifest-path "$manifest" \
            >"$evidence/metadata.json" 2>"$evidence/metadata.stderr"
          metadata_rc=$?
          cargo +1.98.0 fmt --manifest-path "$manifest" --all -- --check \
            >"$evidence/fmt.log" 2>&1
          fmt_rc=$?
          compile_rc=0
          for toolchain in 1.88.0 1.98.0; do
            export CARGO_TARGET_DIR="$RUNNER_TEMP/h02-final-compile-$toolchain"
            cargo +"$toolchain" test --locked --all-targets --manifest-path "$manifest" \
              >"$evidence/test-$toolchain.log" 2>&1 || compile_rc=1
            cargo +"$toolchain" clippy --locked --all-targets --manifest-path "$manifest" -- -D warnings \
              >"$evidence/clippy-$toolchain.log" 2>&1 || compile_rc=1
            rm -rf "$CARGO_TARGET_DIR"
          done
          python3 scripts/h02_exact_head_matrix_v1.py \
            --repository "$GITHUB_REPOSITORY" \
            --ref "$GITHUB_REF_NAME" \
            --commit "$SOURCE_SHA" \
            --tree "$(git rev-parse 'HEAD^{tree}')" \
            --manifest "$manifest" \
            --output-dir "$evidence/matrix" \
            --cargo-target-root "$RUNNER_TEMP/h02-final-matrix-target" \
            --entry-timeout-seconds 240 \
            >"$evidence/matrix-runner.log" 2>&1
          matrix_rc=$?
          clean_rc=0
          if [[ -n "$(git status --porcelain=v1 --untracked-files=all)" ]]; then
            git status --porcelain=v1 --untracked-files=all >"$evidence/h02-dirty-tree.txt"
            clean_rc=1
          fi
          printf 'metadata=%s\nfmt=%s\ncompile=%s\nmatrix=%s\nclean=%s\n' \
            "$metadata_rc" "$fmt_rc" "$compile_rc" "$matrix_rc" "$clean_rc" \
            >"$evidence/exits.txt"
          exit 0

      - name: Upload complete evidence before the final gate
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: v1.3.1-final-exact-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/v1.3.1-final-exact/
          if-no-files-found: error
          retention-days: 30

      - name: Require every repository-controlled exact-head gate
        shell: bash
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/v1.3.1-final-exact"
          grep -qx 'gate_a=0' "$evidence/root/gate-a-exit.txt"
          grep -qx 'fmt=0' "$evidence/root/root-rust-exits.txt"
          grep -qx 'test=0' "$evidence/root/root-rust-exits.txt"
          grep -qx 'clippy=0' "$evidence/root/root-rust-exits.txt"
          grep -qx 'clean=0' "$evidence/root/root-rust-exits.txt"
          grep -qx 'p0=0' "$evidence/p0/exits.txt"
          grep -qx 'classify=0' "$evidence/p0/exits.txt"
          grep -qx 'validate=0' "$evidence/p0/exits.txt"
          grep -qx 'audit=0' "$evidence/p0/exits.txt"
          grep -qx 'clean=0' "$evidence/p0/exits.txt"
          grep -qx 'metadata=0' "$evidence/h02/exits.txt"
          grep -qx 'fmt=0' "$evidence/h02/exits.txt"
          grep -qx 'compile=0' "$evidence/h02/exits.txt"
          grep -qx 'matrix=0' "$evidence/h02/exits.txt"
          grep -qx 'clean=0' "$evidence/h02/exits.txt"
          python3 - "$evidence/p0/classified-result.json" "$evidence/h02/matrix/matrix-summary.json" <<'PY'
          import json
          import sys

          p0 = json.load(open(sys.argv[1], encoding="utf-8"))
          assert p0["result"] == "PASS", p0
          assert p0["counts"] == {
              "executed_pass": 11,
              "source_bound_pass": 2,
              "best_effort_source_bound_pass": 1,
              "fail": 0,
              "blocked": 0,
              "unexecuted": 0,
              "total": 14,
          }, p0
          h02 = json.load(open(sys.argv[2], encoding="utf-8"))
          assert h02["result"] == "PASS", h02
          assert h02["matrix"]["executed_entry_count"] == 24, h02
          assert h02["counts"] == {
              "pass": 24,
              "fail": 0,
              "blocked": 0,
              "unknown": 0,
              "unexecuted": 0,
          }, h02
          for result in (p0, h02):
              assert result["qualification"] is False
              assert result["compatibility_claim"] is False
              assert result["authority_effect"] == "NONE"
          assert h02["selection_effect"] == "NONE"
          PY
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          echo 'Repository-controlled exact-head gates PASS; qualification=false compatibility=false authority=NONE'
