name: export-exact-audit-source

on:
  push:
    branches:
      - "codex/plan-v1.2-canonical-gap-closure-v1"
      - "codex/plan-v1.3-gap-closure-v2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: export-exact-audit-source-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  export:
    if: ${{ github.event_name != 'pull_request' || github.head_ref != 'codex/plan-v1.3-gap-closure-v2' }}
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact source and create deterministic archive
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          printf 'repository=%s\nref=%s\ncommit=%s\ntree=%s\nrun_id=%s\nrun_attempt=%s\n' \
            "$GITHUB_REPOSITORY" "$GITHUB_REF" "$SOURCE_SHA" "$(git rev-parse 'HEAD^{tree}')" \
            "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" \
            > "$RUNNER_TEMP/source-binding.txt"
          git archive --format=tar --prefix=HeptaBao/ "$SOURCE_SHA" \
            > "$RUNNER_TEMP/heptabao-exact-source.tar"
          (
            cd "$RUNNER_TEMP"
            sha256sum heptabao-exact-source.tar \
              > heptabao-exact-source.tar.sha256
          )

      - name: Upload exact source snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: heptabao-exact-source-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/source-binding.txt
            ${{ runner.temp }}/heptabao-exact-source.tar
            ${{ runner.temp }}/heptabao-exact-source.tar.sha256
          if-no-files-found: error
          retention-days: 7
