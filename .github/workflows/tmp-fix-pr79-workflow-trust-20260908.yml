name: Temporary repair PR79 workflow trust registry

on:
  push:
    branches:
      - codex/openbao-replacement-full-closure-20260908

permissions:
  contents: write

concurrency:
  group: temporary-repair-pr79-workflow-trust-20260908
  cancel-in-progress: false

jobs:
  repair-and-push:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Patch the closed upload registry
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python - <<'PY'
          import json
          from pathlib import Path

          registry_path = Path("scripts/workflow_trust_action_registry_v2.json")
          registry = json.loads(registry_path.read_text(encoding="utf-8"))
          entry = {
              "file": "codex-openbao-replacement-source-export.yml",
              "location": "workflow.jobs.export.steps[2]",
              "path": "${{ runner.temp }}/heptabao-openbao-replacement-source/",
          }
          uploads = registry.get("uploads")
          if not isinstance(uploads, list):
              raise SystemExit("workflow upload registry is not a list")
          if entry not in uploads:
              uploads.append(entry)
          uploads.sort(key=lambda item: (item["file"], item["location"], item["path"]))
          if uploads.count(entry) != 1 or len(uploads) != 28:
              raise SystemExit("workflow upload registry did not converge to one exact 28-entry set")
          registry_path.write_text(json.dumps(registry, indent=2) + "\n", encoding="utf-8")

          policy_path = Path("scripts/workflow_trust_v2.py")
          policy = policy_path.read_text(encoding="utf-8")
          old = "if len(uploads) != 27 or len(downloads) != 1:"
          new = "if len(uploads) != 28 or len(downloads) != 1:"
          if new not in policy:
              if policy.count(old) != 1:
                  raise SystemExit("workflow trust cardinality assertion is not uniquely patchable")
              policy = policy.replace(old, new)
          policy_path.write_text(policy, encoding="utf-8")

          test_path = Path("tests/security/test_workflow_review.py")
          tests = test_path.read_text(encoding="utf-8")
          old = "self.assertEqual(27, len(policy.APPROVED_UPLOAD_PATHS))"
          new = "self.assertEqual(28, len(policy.APPROVED_UPLOAD_PATHS))"
          if new not in tests:
              if tests.count(old) != 1:
                  raise SystemExit("workflow registry test is not uniquely patchable")
              tests = tests.replace(old, new)
          test_path.write_text(tests, encoding="utf-8")
          PY

      - name: Validate the exact repair
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --requirement requirements-plan.txt
          python scripts/validate_repository_v2.py
          python -m unittest discover -s tests/repository -p 'test_*.py' -v
          python -m unittest discover -s tests/security -p 'test_*.py' -v
          python scripts/validate_workflow_trust.py
          python -m compileall -q scripts tests
          git diff --check

      - name: Publish one reviewed source repair
        shell: bash
        run: |
          set -euo pipefail
          branch=codex/openbao-replacement-full-closure-20260908
          git rm .github/workflows/tmp-fix-pr79-workflow-trust-20260908.yml
          changed="$(git status --short | sed 's/^...//')"
          test -n "$changed"
          while IFS= read -r path; do
            case "$path" in
              .github/workflows/tmp-fix-pr79-workflow-trust-20260908.yml|scripts/workflow_trust_action_registry_v2.json|scripts/workflow_trust_v2.py|tests/security/test_workflow_review.py) ;;
              *) echo "unexpected changed path: $path" >&2; exit 1 ;;
            esac
          done <<< "$changed"
          git fetch origin "$branch"
          test "$(git rev-parse "refs/remotes/origin/$branch")" = "$GITHUB_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/workflow_trust_action_registry_v2.json scripts/workflow_trust_v2.py tests/security/test_workflow_review.py
          git commit -m 'fix(ci): register exact OpenBao source export path'
          git push origin "HEAD:refs/heads/$branch"
