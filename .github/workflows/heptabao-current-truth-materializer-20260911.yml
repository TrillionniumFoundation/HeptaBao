name: HeptaBao current-truth materializer 20260911

on:
  workflow_dispatch:
  push:
    branches: [ops/heptabao-current-truth-materializer-20260911]

permissions:
  contents: write

concurrency:
  group: heptabao-current-truth-materializer-20260911
  cancel-in-progress: true

env:
  SOURCE_SHA: 004d1983d06f32701e64d9884bfeb08047a9da3e
  OUTPUT_BRANCH: candidate/heptabao-current-truth-20260911-r1
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  materialize-and-qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout trusted materializer source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Bind immutable source and output compare-and-swap
        shell: bash
        run: |
          set -euo pipefail
          cp scripts/materialize_current_truth_tests.py "$RUNNER_TEMP/patcher.py"
          test "$(git rev-parse "origin/$OUTPUT_BRANCH")" = "$SOURCE_SHA"
          git checkout --detach "$SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -f "$RUNNER_TEMP/patcher.py"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          echo PASS_SOURCE_BINDING

      - name: Install exact Python and Rust
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-plan.txt

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements-plan.txt
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
          cargo +1.98.0 --version

      - name: Repair frozen templates and materialize V1.4.7 truth
        shell: bash
        run: |
          set -euo pipefail
          cp "$RUNNER_TEMP/patcher.py" scripts/.patcher.py
          python scripts/.patcher.py
          rm scripts/.patcher.py
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              value = path.read_text(encoding="utf-8")
              count = value.count(old)
              if count != 1:
                  raise SystemExit(f"current-entry anchor drift for {path}: {count}")
              path.write_text(value.replace(old, new, 1), encoding="utf-8")

          readme = Path("README.md")
          inherited = (
              "Historical V1.x and V2.0 artifacts remain exact-source evidence but are not current state authority.\n"
          )
          replace_once(
              readme,
              inherited,
              inherited
              + "\nInherited repository gates remain visible: V1.4.6 authoritative recovery closure, V1.4.5 security invariant closure, and the V1.4.4 module-documentation baseline are historical, non-current baselines. Current Cargo workspace documentation: **45 / 45** existing crates. This candidate remains not production-deployable.\n",
          )

          portal = Path("docs/CURRENT_DOCUMENTATION.md")
          reconciliation = (
              "`docs/operations/HEPTABAO_MAIN_RECONCILIATION_2026_09_08.md` records reconciliation with main `92894aa52de06f2f4ba7d5f234a0a55f93314474`: current 45-package implementation and mandatory validation remain intact; inherited legal/security obligations and the historical V1.4.6 recovery baseline remain applicable within their original scope. Archived runner-probe material is historical evidence and is not an admitted workflow.\n"
          )
          replace_once(
              portal,
              reconciliation,
              reconciliation
              + "\nCurrent normative set: HEPTABAO-PLAN-2026-09-07-V2.1 and its V2 canonical-state, product-capability, blocker-register, and master-plan documents.\n\nSupersession chain: V1.4.4 module documentation → V1.4.5 security invariants → V1.4.6 authoritative recovery → V1.4.7 post-merge truth → V2.0 canonical repository state → V2.1 active development plan.\n\nThe V1.4.6 authoritative recovery closure and V1.4.5 security invariant closure remain inherited historical evidence only; neither supersedes the active V2.1 plan or grants production authority.\n",
          )
          print("PASS_CURRENT_ENTRY_INHERITANCE")
          PY
          python scripts/render_plan_v1_4_7.py --write
          git diff --name-status
          test -n "$(git diff --name-only)"
          python - <<'PY'
          import importlib.util
          import subprocess
          from pathlib import Path

          root = Path.cwd()
          spec = importlib.util.spec_from_file_location("renderer", root / "scripts/render_plan_v1_4_7.py")
          assert spec and spec.loader
          renderer = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(renderer)
          truth = renderer.build_truth(root)
          allowed = {path.as_posix() for path in renderer.normative_paths(truth)}
          allowed.update({
              "README.md",
              "docs/CURRENT_DOCUMENTATION.md",
              "planning/HEPTABAO_NORMATIVE_DOCUMENT_MANIFEST_V1_4_7.yaml",
              "scripts/_render_plan_v1_4_7_baseline.py",
              "scripts/render_plan_v1_4_7.py",
              "scripts/validate_plan_v1_4_5.py",
              "tests/plan/test_current_entry_v1_4_7.py",
              "tests/plan/test_module_source_truth_v1_4_7.py",
          })
          changed = set(filter(None, subprocess.check_output(["git", "diff", "--name-only"], text=True).splitlines()))
          unexpected = sorted(changed - allowed)
          if unexpected:
              raise SystemExit(f"unexpected generated changes: {unexpected}")
          for relative in changed:
              path = root / relative
              if not path.is_file() or path.is_symlink() or path.stat().st_size > 512_000:
                  raise SystemExit(f"invalid generated path: {relative}")
          print(f"PASS_CHANGESET files={len(changed)} modules={truth['module_count']}")
          PY
          git diff --check

      - name: Validate current and inherited plan gates
        shell: bash
        run: |
          set -euo pipefail
          python scripts/render_plan_v1_4_7.py --check
          python scripts/validate_plan_v1_4_7.py
          python -m unittest discover -s tests/plan -p 'test_*v1_4_7.py' -v
          python -m unittest discover -s tests/plan -p 'test_external_completion_evidence_v1.py' -v
          python scripts/validate_plan_v1_4_6.py
          python -m unittest discover -s tests/plan -p 'test_plan_v1_4_6.py' -v
          python scripts/validate_plan_v1_4_5.py
          python -m unittest discover -s tests/plan -p 'test_plan_v1_4_5.py' -v
          python scripts/validate_module_documentation_v1_4_4.py
          python -m unittest discover -s tests/plan -p 'test_module_documentation_v1_4_4.py' -v
          echo PASS_PLAN_GATES

      - name: Validate repository security platform and Oracle gates
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_repository_v2.py
          python scripts/validate_compatibility_corpus.py
          python scripts/validate_workflow_trust.py
          python -m unittest discover -s tests/repository -p 'test_*.py' -v
          python -m unittest discover -s tests/security -p 'test_*.py' -v
          python -m unittest discover -s tests/platform -p 'test_*.py' -v
          python -m unittest discover -s tests/oracle -p 'test_*.py' -v
          python -m compileall -q scripts tests
          echo PASS_REPOSITORY_GATES

      - name: Execute locked Rust workspace and strict lint
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.98.0 fmt --all -- --check
          cargo +1.98.0 test --locked --workspace --all-targets -- --test-threads=1
          cargo +1.98.0 clippy --locked --workspace --all-targets -- -D warnings
          cargo +1.98.0 doc --locked --workspace --no-deps
          cargo +1.98.0 build --locked -p heptabao-server
          echo PASS_RUST_GATES

      - name: Execute acceptance and smoke
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s qa/openbao-acceptance/tests -v
          python qa/single-node/smoke.py --binary "$PWD/target/debug/heptabao-server" --work-dir "$RUNNER_TEMP/heptabao-smoke"
          echo PASS_ACCEPTANCE_SMOKE

      - name: Commit deterministic candidate
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git add --all
          test -n "$(git diff --cached --name-only)"
          test -z "$(git diff --name-only)"
          git -c user.name='HeptaBao current truth materializer' -c user.email='current-truth@users.noreply.github.com' commit -m 'docs(plan): bind V1.4.7 truth to exact product head'
          test "$(git rev-parse HEAD^)" = "$SOURCE_SHA"
          echo "CANDIDATE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Publish exact candidate
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$OUTPUT_BRANCH"
          test "$(git rev-parse "origin/$OUTPUT_BRANCH")" = "$SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          git push origin "HEAD:refs/heads/$OUTPUT_BRANCH"
          test "$(git ls-remote origin "refs/heads/$OUTPUT_BRANCH" | cut -f1)" = "$CANDIDATE_SHA"
          echo "PASS_PUBLISHED_SHA=$CANDIDATE_SHA"
