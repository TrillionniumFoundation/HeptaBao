name: HeptaBao current-truth materializer 20260911

on:
  workflow_dispatch:
  push:
    branches:
      - ops/heptabao-current-truth-materializer-20260911

permissions:
  contents: write

concurrency:
  group: heptabao-current-truth-materializer-20260911
  cancel-in-progress: false

env:
  SOURCE_SHA: 004d1983d06f32701e64d9884bfeb08047a9da3e
  OUTPUT_BRANCH: candidate/heptabao-current-truth-20260911-r1
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:
  materialize-and-qualify:
    name: deterministic current truth / full qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout trusted materializer source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Bind immutable source and output compare-and-swap
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse "origin/$OUTPUT_BRANCH")" = "$SOURCE_SHA"
          git checkout --detach "$SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          echo PASS_HEPTABAO_CURRENT_TRUTH_SOURCE_BINDING

      - name: Install exact Python and plan dependencies
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-plan.txt

      - name: Install exact dependencies and Rust 1.98
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --requirement requirements-plan.txt
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
          python --version
          cargo +1.98.0 --version
          rustc +1.98.0 --version

      - name: Materialize frozen V1.4.7 current truth
        shell: bash
        run: |
          set -euo pipefail
          python scripts/render_plan_v1_4_7.py --write
          git diff --name-status
          test -n "$(git diff --name-only)"
          python - <<'PY'
          from __future__ import annotations

          import importlib.util
          import subprocess
          from pathlib import Path

          root = Path.cwd()
          spec = importlib.util.spec_from_file_location(
              "renderer", root / "scripts/render_plan_v1_4_7.py"
          )
          assert spec and spec.loader
          renderer = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(renderer)
          truth = renderer.build_truth(root)
          allowed = {path.as_posix() for path in renderer.normative_paths(truth)}
          allowed.add("planning/HEPTABAO_NORMATIVE_DOCUMENT_MANIFEST_V1_4_7.yaml")
          changed = {
              line
              for line in subprocess.check_output(
                  ["git", "diff", "--name-only"], text=True
              ).splitlines()
              if line
          }
          unexpected = sorted(changed - allowed)
          if unexpected:
              raise SystemExit(f"renderer changed non-normative files: {unexpected}")
          if not changed:
              raise SystemExit("renderer produced no current-truth changes")
          for relative in sorted(changed):
              path = root / relative
              if not path.is_file() or path.is_symlink():
                  raise SystemExit(f"invalid generated path: {relative}")
              if path.stat().st_size > 512_000:
                  raise SystemExit(
                      f"generated path exceeds repository blob policy: "
                      f"{relative}={path.stat().st_size}"
                  )
          print("PASS_HEPTABAO_CURRENT_TRUTH_CHANGESET")
          print("\n".join(sorted(changed)))
          PY
          git diff --check

      - name: Validate current and inherited normative plan gates
        shell: bash
        run: |
          set -euo pipefail
          python scripts/render_plan_v1_4_7.py --check
          python scripts/validate_plan_v1_4_7.py
          python -m unittest discover -s tests/plan -p 'test_*v1_4_7.py' -v
          python -m unittest discover -s tests/plan -p 'test_external_completion_evidence_v1.py' -v
          python scripts/validate_plan_v1_4_6.py
          python -m unittest discover -s tests/plan -p 'test_plan_v1_4_6.py' -v
          python scripts/validate_plan_v1_4_5.py
          python -m unittest discover -s tests/plan -p 'test_plan_v1_4_5.py' -v
          python scripts/validate_module_documentation_v1_4_4.py
          python -m unittest discover -s tests/plan -p 'test_module_documentation_v1_4_4.py' -v
          echo PASS_HEPTABAO_CURRENT_AND_INHERITED_PLAN_GATES

      - name: Validate repository security platform Oracle and source truth
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_repository_v2.py
          python scripts/validate_compatibility_corpus.py
          python scripts/validate_workflow_trust.py
          python -m unittest discover -s tests/repository -p 'test_*.py' -v
          python -m unittest discover -s tests/security -p 'test_*.py' -v
          python -m unittest discover -s tests/platform -p 'test_*.py' -v
          python -m unittest discover -s tests/oracle -p 'test_*.py' -v
          python -m compileall -q scripts tests
          echo PASS_HEPTABAO_REPOSITORY_AND_ORACLE_GATES

      - name: Execute locked Rust workspace and strict lint
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.98.0 fmt --all -- --check
          cargo +1.98.0 test --locked --workspace --all-targets -- --test-threads=1
          cargo +1.98.0 clippy --locked --workspace --all-targets -- -D warnings
          cargo +1.98.0 doc --locked --workspace --no-deps
          cargo +1.98.0 build --locked -p heptabao-server
          echo PASS_HEPTABAO_LOCKED_RUST_GATES

      - name: Execute acceptance harness and single-node smoke
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s qa/openbao-acceptance/tests -v
          python qa/single-node/smoke.py \
            --binary "$PWD/target/debug/heptabao-server" \
            --work-dir "$RUNNER_TEMP/heptabao-single-node-current-truth"
          echo PASS_HEPTABAO_ACCEPTANCE_AND_SMOKE

      - name: Commit deterministic current-truth candidate
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test -n "$(git diff --name-only)"
          git add --all
          test -n "$(git diff --cached --name-only)"
          test -z "$(git diff --name-only)"
          git -c user.name='HeptaBao current truth materializer' \
              -c user.email='current-truth@users.noreply.github.com' \
              commit -m 'docs(plan): bind V1.4.7 truth to exact product head'
          test "$(git rev-parse HEAD^)" = "$SOURCE_SHA"
          candidate_sha="$(git rev-parse HEAD)"
          echo "CANDIDATE_SHA=$candidate_sha" >> "$GITHUB_ENV"
          echo "PASS_HEPTABAO_CURRENT_TRUTH_CANDIDATE=$candidate_sha"

      - name: Revalidate output compare-and-swap
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$OUTPUT_BRANCH"
          remote_sha="$(git rev-parse "origin/$OUTPUT_BRANCH")"
          test "$remote_sha" = "$SOURCE_SHA"
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          echo PASS_HEPTABAO_CURRENT_TRUTH_OUTPUT_CAS

      - name: Publish exact current-truth candidate
        shell: bash
        run: |
          set -euo pipefail
          git push origin "HEAD:refs/heads/$OUTPUT_BRANCH"
          published_sha="$(git ls-remote origin "refs/heads/$OUTPUT_BRANCH" | cut -f1)"
          test "$published_sha" = "$CANDIDATE_SHA"
          echo "PASS_HEPTABAO_CURRENT_TRUTH_PUBLISHED=$published_sha"
