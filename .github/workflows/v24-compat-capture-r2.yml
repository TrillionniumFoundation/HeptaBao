          if marker not in t: raise SystemExit('test footer missing')
          t=t.replace(marker,extra,1)
          test.write_text(t,encoding='utf-8')
          docs=Path('docs/architecture/HEPTABAO_V2_4_DIFFERENTIAL_CAPTURE.md')
          d=docs.read_text(encoding='utf-8')
          if 'self-authenticates its canonical JSON structure' not in d:
              d += '\nBefore comparison, each capture artifact self-authenticates its canonical JSON structure and validates every bounded observation. This integrity check detects accidental or adversarial modification but does not replace an independent signature or admission authority.\n'
              docs.write_text(d,encoding='utf-8')
          PY
          rm -f .github/workflows/v24-compat-capture-r2.yml
          python -m unittest tests.repository.test_openbao_differential_runner_v2_4
          python -m py_compile scripts/openbao_differential_runner_v2_4.py

      - name: Publish package-qualified source when absent
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code origin "refs/heads/$OUTPUT_BRANCH" >/dev/null 2>&1; then
            echo 'qualified source branch already exists; preserving first writer'
            exit 0
          fi
          git config user.name 'HeptaBao V2.4 Compatibility Repair'
          git config user.email '102159240+ProfHepta@users.noreply.github.com'
          git add -A
          git commit -m 'fix(compat): validate differential artifact integrity and bounds'
          git push --force-with-lease="refs/heads/$OUTPUT_BRANCH:" origin "HEAD:refs/heads/$OUTPUT_BRANCH"
