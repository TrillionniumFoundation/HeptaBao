name: HeptaBao V2.4 compatibility capture source recovery r2

on:
  push:
    branches: [ops/v24-compat-capture-r2-20260909]

permissions:
  contents: write

concurrency:
  group: heptabao-v24-compat-capture-r2-recovery-v3
  cancel-in-progress: true

env:
  BASE_SHA: 633848024e5315f3def23c035a1dec53f83a62b3
  MATERIALIZER_BRANCH: ops/v24-compat-capture-r1-20260909
  MATERIALIZER_SHA: b29a64189c6fbd2829ebd89e8cb9cdff87218861
  MATERIALIZER_WORKFLOW: .github/workflows/v24-compat-capture-materializer.yml
  RECOVERY_PARENT_SHA: ba5b33a3f7a385b9b201df0fab6abfa7a8ac9ef2
  ORIGINAL_PATCH_SHA: 48157c2547ddc9f04883fa4eb21ec0dfa982f68a
  PATCH_WORKFLOW: .github/workflows/v24-compat-capture-r2.yml
  OUTPUT_BRANCH: codex/openbao-replacement-v2.4-compat-capture-source-20260909

jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout recovery controller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with: {fetch-depth: 0, persist-credentials: true}
      - name: Verify immutable controller inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$RECOVERY_PARENT_SHA"
          test "$(git merge-base "$RECOVERY_PARENT_SHA" "$BASE_SHA")" = "$BASE_SHA"
          test "$(git rev-parse "$ORIGINAL_PATCH_SHA^")" = "$BASE_SHA"
          test "$(git rev-parse "$ORIGINAL_PATCH_SHA:$PATCH_WORKFLOW")" = "466c18b051bdea4a7f8264ea2d0ee324bd5aa5b9"
          git fetch --no-tags origin "+refs/heads/$MATERIALIZER_BRANCH:refs/remotes/origin/compat-materializer"
          test "$(git rev-parse refs/remotes/origin/compat-materializer)" = "$MATERIALIZER_SHA"
          test "$(git rev-parse "$MATERIALIZER_SHA^")" = "$BASE_SHA"
          test "$(git rev-parse "$MATERIALIZER_SHA:$MATERIALIZER_WORKFLOW")" = "6d8f54c9af5b6b1f3e3a8b69078025ca3019d9e1"
          test "$(git diff --name-only "$BASE_SHA..$MATERIALIZER_SHA")" = "$MATERIALIZER_WORKFLOW"
      - name: Recover and qualify differential capture source
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/heptabao-compat-capture-r2"
          git worktree add --detach "$work" "$BASE_SHA"
          git show "$MATERIALIZER_SHA:$MATERIALIZER_WORKFLOW" > "$RUNNER_TEMP/materializer.yml"
          git show "$ORIGINAL_PATCH_SHA:$PATCH_WORKFLOW" > "$RUNNER_TEMP/patch.yml"
          python - "$RUNNER_TEMP/materializer.yml" "      - name: Materialize differential capture runner" "$RUNNER_TEMP/materialize.sh" <<'PY'
          from pathlib import Path
          import sys
          lines=Path(sys.argv[1]).read_text(encoding='utf-8').splitlines(); start=lines.index(sys.argv[2]); run=next(i for i in range(start+1,min(start+10,len(lines))) if lines[i]=='        run: |'); body=[]
          for line in lines[run+1:]:
              if line.startswith('      - name: '): break
              body.append(line[10:] if line.startswith('          ') else line)
          text='\n'.join(x for x in body if 'git rev-parse HEAD^' not in x)+'\n'
          for token in ('curl ','wget ','git push','GITHUB_TOKEN','secrets.',chr(36)+'{{','sudo '):
              if token in text: raise SystemExit(f'denied materializer token: {token}')
          Path(sys.argv[3]).write_text(text,encoding='utf-8')
          PY
          python - "$RUNNER_TEMP/patch.yml" "      - name: Enforce artifact self-integrity and observation bounds" "$RUNNER_TEMP/harden.sh" <<'PY'
          from pathlib import Path
          import sys
          lines=Path(sys.argv[1]).read_text(encoding='utf-8').splitlines(); start=lines.index(sys.argv[2]); run=next(i for i in range(start+1,min(start+10,len(lines))) if lines[i]=='        run: |'); body=[]
          for line in lines[run+1:]:
              if line.startswith('      - name: '): break
              body.append(line[10:] if line.startswith('          ') else line)
          text='\n'.join(body)+'\n'
          for token in ('curl ','wget ','git push','GITHUB_TOKEN','secrets.',chr(36)+'{{','sudo '):
              if token in text: raise SystemExit(f'denied hardening token: {token}')
          Path(sys.argv[3]).write_text(text,encoding='utf-8')
          PY
          chmod 0700 "$RUNNER_TEMP/materialize.sh" "$RUNNER_TEMP/harden.sh"
          (
            cd "$work"
            env -i PATH="$PATH" HOME="$HOME" RUNNER_TEMP="$RUNNER_TEMP" EXACT_PARENT="$BASE_SHA" bash "$RUNNER_TEMP/materialize.sh"
            bash "$RUNNER_TEMP/harden.sh"
            git config user.name 'HeptaBao Compatibility Capture Recovery'
            git config user.email '102159240+ProfHepta@users.noreply.github.com'
            git add -A && test -n "$(git status --porcelain)"
            git commit -m 'feat(compat): materialize bounded self-authenticating differential capture'
            new_sha="$(git rev-parse HEAD)"
            if git ls-remote --exit-code origin "refs/heads/$OUTPUT_BRANCH" >/dev/null 2>&1; then
              test "$(git ls-remote origin "refs/heads/$OUTPUT_BRANCH" | cut -f1)" = "$new_sha"
            else
              git push --force-with-lease="refs/heads/$OUTPUT_BRANCH:" origin "$new_sha:refs/heads/$OUTPUT_BRANCH"
            fi
          )
          git worktree remove --force "$work"
