name: materialize-runtime-replay-epoch-v2-20260916
on:
  push:
    branches:
      - codex/next-round-product-closure-20260916
permissions:
  contents: write
jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Bind exact parent
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "1871ad11db28096698b32550e58dea611194f5f9"
      - name: Install Rust 1.98 components
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
      - name: Materialize epoch-aware runtime consumer
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          durable = Path('crates/heptabao-durable-service/src/lib.rs')
          s = durable.read_text()
          old = '''    pub fn put_with_failpoint(\n        &mut self,\n        request: PutRequest,\n        failpoint: Failpoint,\n    ) -> Result<MutationOutcome, ServiceError> {\n        self.put_with_policy(request, failpoint, false)\n    }\n'''
          new = '''    pub fn put_with_failpoint(\n        &mut self,\n        request: PutRequest,\n        failpoint: Failpoint,\n    ) -> Result<MutationOutcome, ServiceError> {\n        self.put_with_failpoint_in_replay_epoch(0, request, failpoint)\n    }\n\n    pub fn put_with_failpoint_in_replay_epoch(\n        &mut self,\n        replay_epoch: u64,\n        request: PutRequest,\n        failpoint: Failpoint,\n    ) -> Result<MutationOutcome, ServiceError> {\n        self.put_with_epoch_policy(request, failpoint, false, replay_epoch)\n    }\n'''
          if s.count(old) != 1: raise SystemExit(f'put failpoint API count={s.count(old)}')
          s = s.replace(old, new, 1)
          old = '''    pub fn delete_with_failpoint(\n        &mut self,\n        request: DeleteRequest,\n        failpoint: Failpoint,\n    ) -> Result<MutationOutcome, ServiceError> {\n        self.delete_with_epoch_failpoint(request, failpoint, 0)\n    }\n'''
          new = '''    pub fn delete_with_failpoint(\n        &mut self,\n        request: DeleteRequest,\n        failpoint: Failpoint,\n    ) -> Result<MutationOutcome, ServiceError> {\n        self.delete_with_failpoint_in_replay_epoch(0, request, failpoint)\n    }\n\n    pub fn delete_with_failpoint_in_replay_epoch(\n        &mut self,\n        replay_epoch: u64,\n        request: DeleteRequest,\n        failpoint: Failpoint,\n    ) -> Result<MutationOutcome, ServiceError> {\n        self.delete_with_epoch_failpoint(request, failpoint, replay_epoch)\n    }\n'''
          if s.count(old) != 1: raise SystemExit(f'delete failpoint API count={s.count(old)}')
          durable.write_text(s.replace(old, new, 1))

          runtime = Path('crates/heptabao-runtime-service/src/lib.rs')
          s = runtime.read_text()
          old = '''        let result = match request.operation {\n            InboundOperation::Put(value) => PutRequest::new(\n'''
          new = '''        let replay_epoch = self.durable.replay_epoch();\n        let result = match request.operation {\n            InboundOperation::Put(value) => PutRequest::new(\n'''
          if s.count(old) != 1: raise SystemExit(f'runtime epoch insertion count={s.count(old)}')
          s = s.replace(old, new, 1)
          old = '''                self.durable\n                    .put_with_failpoint(mutation, failpoint)\n                    .map_err(map_durable_error)\n'''
          new = '''                self.durable\n                    .put_with_failpoint_in_replay_epoch(replay_epoch, mutation, failpoint)\n                    .map_err(map_durable_error)\n'''
          if s.count(old) != 1: raise SystemExit(f'runtime put count={s.count(old)}')
          s = s.replace(old, new, 1)
          old = '''                self.durable\n                    .delete_with_failpoint(mutation, failpoint)\n                    .map_err(map_durable_error)\n'''
          new = '''                self.durable\n                    .delete_with_failpoint_in_replay_epoch(replay_epoch, mutation, failpoint)\n                    .map_err(map_durable_error)\n'''
          if s.count(old) != 1: raise SystemExit(f'runtime delete count={s.count(old)}')
          s = s.replace(old, new, 1)
          old = '''        ServiceError::RequestBindingConflict\n        | ServiceError::RequestCapacityExhausted\n'''
          new = '''        ServiceError::ReplayEpochMismatch\n        | ServiceError::RequestBindingConflict\n        | ServiceError::RequestCapacityExhausted\n'''
          if s.count(old) != 1: raise SystemExit(f'error mapping count={s.count(old)}')
          runtime.write_text(s.replace(old, new, 1))
          PY
          cargo +1.98.0 fmt --all
          cargo +1.98.0 test --locked -p heptabao-durable-service -p heptabao-runtime-service
          cargo +1.98.0 clippy --locked -p heptabao-durable-service -p heptabao-runtime-service --all-targets -- -D warnings
      - name: Remove transport and publish source
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/materialize-runtime-replay-epoch-20260916.yml
          rm -f .github/workflows/materialize-runtime-replay-epoch-v2-20260916.yml
          git diff --check
          git config user.name "OpenAI runtime replay integrator"
          git config user.email "noreply@openai.com"
          git add -A
          git commit -m "fix(runtime): propagate replay epoch through durable mutations"
          git push origin HEAD:codex/next-round-product-closure-20260916
