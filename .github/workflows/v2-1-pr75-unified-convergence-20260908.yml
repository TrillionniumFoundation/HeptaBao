name: HeptaBao V2.1 PR75 unified repository convergence

on:
  push:
    branches:
      - exec/v2.1-pr75-unified-convergence-20260908

permissions:
  contents: write

concurrency:
  group: v2-1-pr75-unified-convergence
  cancel-in-progress: false

jobs:
  converge-validate-and-publish:
    if: github.event.head_commit.message == 'chore(exec): install unified PR75 repository convergence'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      CANDIDATE_BRANCH: codex/v2.1-main-convergence-durable-runtime-20260907
      ORIGINAL_HEAD: ff8ff379509baa95f54744f0b931810d1f115211
      G0_CONTROLLER: exec/v2.1-pr75-g0-remediation-20260908
      RECOVERY_CONTROLLER: exec/v2.1-recover-production-modules-20260908
    steps:
      - name: Checkout current candidate with bounded publish credential
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.CANDIDATE_BRANCH }}
          path: candidate
          fetch-depth: 0
          persist-credentials: true

      - name: Bind source and load reviewed controller scripts
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git -C candidate status --porcelain=v1 --untracked-files=all)"
          bound=$(git -C candidate rev-parse HEAD)
          remote=$(git -C candidate ls-remote origin "refs/heads/$CANDIDATE_BRANCH" | awk '{print $1}')
          test "$bound" = "$remote"
          git -C candidate fetch --quiet origin \
            "+refs/heads/$G0_CONTROLLER:refs/remotes/origin/$G0_CONTROLLER" \
            "+refs/heads/$RECOVERY_CONTROLLER:refs/remotes/origin/$RECOVERY_CONTROLLER" \
            '+refs/heads/*:refs/remotes/origin/*'
          git -C candidate show "refs/remotes/origin/$G0_CONTROLLER:tools/remediate_pr75_g0.py" > "$RUNNER_TEMP/remediate_pr75_g0.py"
          git -C candidate show "refs/remotes/origin/$RECOVERY_CONTROLLER:tools/recover_v21_modules.py" > "$RUNNER_TEMP/recover_v21_modules.py"
          git -C candidate show "refs/remotes/origin/$RECOVERY_CONTROLLER:tools/normalize_v21_workspace.py" > "$RUNNER_TEMP/normalize_v21_workspace.py"
          test -s "$RUNNER_TEMP/remediate_pr75_g0.py"
          test -s "$RUNNER_TEMP/recover_v21_modules.py"
          test -s "$RUNNER_TEMP/normalize_v21_workspace.py"
          echo "BOUND_HEAD=$bound" >> "$GITHUB_ENV"

      - name: Install exact Python dependencies
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: candidate/requirements-plan.txt

      - name: Apply idempotent G0 and module recovery
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --requirement candidate/requirements-plan.txt
          count=$(find candidate/crates -mindepth 1 -maxdepth 1 -type d -name 'heptabao-*' | wc -l)
          if test "$count" = 42 && test "$BOUND_HEAD" = "$ORIGINAL_HEAD"; then
            python "$RUNNER_TEMP/remediate_pr75_g0.py" candidate
          elif test "$count" = 42; then
            test -f candidate/planning/HEPTABAO_V2_1_G0_REMEDIATION_STATUS.yaml
          elif test "$count" != 53; then
            echo "unsupported partially converged package count: $count" >&2
            exit 1
          fi
          count=$(find candidate/crates -mindepth 1 -maxdepth 1 -type d -name 'heptabao-*' | wc -l)
          if test "$count" != 53; then
            python "$RUNNER_TEMP/recover_v21_modules.py" candidate
          fi
          python "$RUNNER_TEMP/normalize_v21_workspace.py" candidate
          git -C candidate diff --check

      - name: Install declared Rust toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy

      - name: Normalize source and execute complete exact-tree gates
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(find crates -mindepth 1 -maxdepth 1 -type d -name 'heptabao-*' | wc -l)" = 53
          cargo +1.98.0 fmt --all
          cargo +1.98.0 generate-lockfile
          python scripts/validate_repository_v2.py
          python -m unittest discover -s tests/repository -p 'test_*.py' -v
          python -m unittest discover -s tests/security -p 'test_*.py' -v
          python scripts/validate_workflow_trust.py
          python scripts/validate_module_documentation_v1_4_4.py
          python -m unittest discover -s tests/plan -p 'test_module_documentation_v1_4_4.py' -v
          python -m unittest discover -s tests/plan -p 'test_external_completion_evidence_v1.py' -v
          python -m unittest discover -s tests/platform -p 'test_*.py' -v
          python -m unittest discover -s tests/oracle -p 'test_*.py' -v
          python -m compileall -q scripts tests
          cargo +1.98.0 fmt --all -- --check
          cargo +1.98.0 test --locked --workspace --all-targets
          cargo +1.98.0 clippy --locked --workspace --all-targets -- -D warnings
          cargo +1.98.0 doc --locked --workspace --no-deps
          git diff --check

      - name: Verify final repository-only surface
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git diff --name-only | grep -E '^(\.github/workflows/|\.exec/|tools/)' || true)"
          test ! -e .exec/v2-g4-overlay.part-00
          test -f planning/HEPTABAO_V2_1_WORKSPACE_NORMALIZATION_STATUS.yaml
          grep -Fq 'workspace_packages: 53' planning/HEPTABAO_V2_1_WORKSPACE_NORMALIZATION_STATUS.yaml
          grep -Fq 'qualification: false' planning/HEPTABAO_V2_1_WORKSPACE_NORMALIZATION_STATUS.yaml
          for crate in \
            heptabao-aead-barrier heptabao-audit-file heptabao-single-node-runtime \
            heptabao-http-adapter heptabao-tls-server heptabao-network-server \
            heptabao-access-file heptabao-format-migration heptabao-plugin-host \
            heptabao-raft-replica heptabao-compatibility-runner; do
            test -f "crates/$crate/Cargo.toml"
            test -f "crates/$crate/src/lib.rs"
            test -f "docs/modules/$crate.md"
            test "$(grep -c "^name = \"$crate\"$" Cargo.lock)" = 1
          done

      - name: Publish one lease-bound fast-forward or verify no-op
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          if test -z "$(git status --porcelain=v1 --untracked-files=all)"; then
            echo "candidate already converged at $BOUND_HEAD" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          current_remote=$(git ls-remote origin "refs/heads/$CANDIDATE_BRANCH" | awk '{print $1}')
          test "$current_remote" = "$BOUND_HEAD"
          git config user.name 'HeptaBao V2.1 convergence controller'
          git config user.email 'heptabao-v2-1@users.noreply.github.com'
          git add --all
          git commit -m 'feat(v2.1): converge 53-package production-boundary source'
          test "$(git rev-parse HEAD^)" = "$BOUND_HEAD"
          git push --force-with-lease="refs/heads/$CANDIDATE_BRANCH:$BOUND_HEAD" origin "HEAD:refs/heads/$CANDIDATE_BRANCH"
          echo "published_head=$(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo 'workspace_packages=53' >> "$GITHUB_STEP_SUMMARY"
          echo 'qualification=false' >> "$GITHUB_STEP_SUMMARY"
          echo 'compatibility_claim=false' >> "$GITHUB_STEP_SUMMARY"
          echo 'production_authority=false' >> "$GITHUB_STEP_SUMMARY"
          echo 'release_authority=false' >> "$GITHUB_STEP_SUMMARY"
