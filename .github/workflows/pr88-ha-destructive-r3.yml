name: PR88 destructive HA r3

on:
  push:
    branches:
      - ops/pr88-destructive-ha-r3-20260911-gpt56

permissions:
  contents: read

jobs:
  destructive-ha:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout exact probe head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
          persist-credentials: false
      - name: Install Rust 1.98
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal
      - name: Build exact server
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile qa/openbao-acceptance/ha_destructive.py
          cargo +1.98.0 build --locked -p heptabao-server
      - name: Run three-process destructive qualification
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('qa/openbao-acceptance/ha_destructive.py')
          text = p.read_text()
          old = '''    except (FixtureError, OSError, subprocess.SubprocessError, urllib.error.URLError, ValueError, KeyError):\n        print("destructive HA fixture failed; inspect synthetic node logs", file=sys.stderr)\n        return 1\n'''
          new = '''    except (FixtureError, OSError, subprocess.SubprocessError, urllib.error.URLError, ValueError, KeyError) as error:\n        print(f"destructive HA fixture failed: {type(error).__name__}: {error}", file=sys.stderr)\n        return 1\n'''
          if text.count(old) != 1:
              raise SystemExit('redacted diagnostic patch target mismatch')
          p.write_text(text.replace(old, new, 1))
          PY
          BINARY="$(pwd)/target/debug/heptabao-server"
          ROOT="$(mktemp -d)"
          WORK="$ROOT/ha-destructive"
          set +e
          timeout 360s python qa/openbao-acceptance/ha_destructive.py --binary "$BINARY" --work-dir "$WORK" >"$ROOT/result.json" 2>"$ROOT/error.log"
          code=$?
          set -e
          cat "$ROOT/result.json" || true
          if [ "$code" -ne 0 ]; then
            cat "$ROOT/error.log" || true
            echo "--- synthetic server diagnostics ---"
            find "$WORK" -type f -name server.log -print 2>/dev/null | sort | while read -r log; do
              echo "--- $log ---"
              tail -n 120 "$log"
            done
          fi
          exit "$code"
