name: Codex materialize server maintenance APIs

on:
  push:
    branches:
      - codex/openbao-replacement-full-closure-20260908

permissions:
  contents: write

concurrency:
  group: codex-openbao-replacement-server-maintenance
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Verify source baseline and assemble bounded payload
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum crates/heptabao-server/src/http.rs | cut -d' ' -f1)" = "547ed3f399c0ae51e1a5ae1b940e5a81ea160248ddbf0dff04572a8548e18e71"
          test "$(sha256sum crates/heptabao-server/src/service.rs | cut -d' ' -f1)" = "4df5633b92fa5f01b5af07eaadca26cc0f678b7a81cf6c94399d85e3969a838c"
          test "$(sha256sum crates/heptabao-server/src/service_tests.rs | cut -d' ' -f1)" = "1831f1e04211568780df47aa88b101023761fd16e21fb49c6f93c5e27a4694ae"
          sha256sum --check <(head -n 1 .g1/codex-openbao-replacement/server-maintenance-tranche/payload.sha256)
          cat .g1/codex-openbao-replacement/server-maintenance-tranche/part-* > "$RUNNER_TEMP/server-maintenance.patch.gz.b64"
          test "$(sha256sum "$RUNNER_TEMP/server-maintenance.patch.gz.b64" | cut -d' ' -f1)" = "544b4cc2f4c9f525e31924e5f9757932b0849c20447193e3f4573860c116120d"
          base64 --decode "$RUNNER_TEMP/server-maintenance.patch.gz.b64" > "$RUNNER_TEMP/server-maintenance.patch.gz"
          gzip --test "$RUNNER_TEMP/server-maintenance.patch.gz"
          gzip --decompress --stdout "$RUNNER_TEMP/server-maintenance.patch.gz" > "$RUNNER_TEMP/server-maintenance.patch"
          test "$(sha256sum "$RUNNER_TEMP/server-maintenance.patch" | cut -d' ' -f1)" = "a6cb87ac7f38b2457527b8326b66870456cf237b5b0944c52c37adf3288d17c1"

      - name: Apply maintenance API source
        shell: bash
        run: |
          set -euo pipefail
          git apply --check --verbose "$RUNNER_TEMP/server-maintenance.patch"
          git apply --verbose "$RUNNER_TEMP/server-maintenance.patch"
          git diff --check

      - name: Install exact Rust toolchain
        shell: bash
        run: rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy

      - name: Qualify recovery query compaction and encrypted snapshot routes
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.98.0 fmt --all
          python scripts/validate_repository_v2.py
          cargo +1.98.0 test --locked -p heptabao-server
          cargo +1.98.0 clippy --locked -p heptabao-server --all-targets -- -D warnings
          git diff --check

      - name: Publish qualified source commit
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .g1/codex-openbao-replacement/server-maintenance-tranche
          rmdir .g1/codex-openbao-replacement 2>/dev/null || true
          rm -f .github/workflows/codex-server-maintenance-materialize.yml
          git config user.name "HeptaBao Codex Closure"
          git config user.email "102159240+ProfHepta@users.noreply.github.com"
          git add -A
          git commit -m "feat(server): expose recovery compaction and encrypted snapshot APIs"
          git push origin HEAD:codex/openbao-replacement-full-closure-20260908
