name: Personal credentials synthetic core

on:
  pull_request:
    paths:
      - crates/heptabao-credential-broker/**
      - crates/heptabao-personal-vault/**
      - crates/heptabao-personal-edge/**
      - crates/heptabao-filesystem-guard/**
      - clients/chromium/**
      - tools/heptabao_git_signer.py
      - tools/install_personal_browser.py
      - qa/personal_credentials/**
      - Cargo.lock
      - Cargo.toml
      - rust-toolchain.toml
      - .github/workflows/personal-credentials-synthetic.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: personal-credentials-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  synthetic-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EXPECTED_SOURCE: ${{ github.event.pull_request.head.sha || github.sha }}
      CARGO_BUILD_JOBS: "2"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify source and install exact compiler
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE"
          test -z "$(git status --porcelain)"
          git diff --check
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt,clippy
          rustc +1.98.0 -vV
          node --version
      - name: Check the three credential crates
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.98.0 fmt -p heptabao-credential-broker -p heptabao-personal-vault -p heptabao-personal-edge -- --check
          cargo +1.98.0 clippy --locked -p heptabao-credential-broker -p heptabao-personal-vault -p heptabao-personal-edge --all-targets -- -D warnings
          cargo +1.98.0 test --locked -p heptabao-credential-broker -- --test-threads=1
          cargo +1.98.0 test --locked -p heptabao-personal-vault -- --test-threads=1
          cargo +1.98.0 test --locked -p heptabao-personal-edge -- --test-threads=1
          node --test qa/personal_credentials/browser_worker_test.mjs
          python3 -B qa/personal_credentials/passkey_rp.py --self-test --crypto-backend openssl
          python3 -B qa/personal_credentials/verify_evidence.py --self-test
          python3 -B qa/personal_credentials/verify_evidence.py
          python3 -B qa/personal_credentials/android_driver_guard_tests.py -v
          python3 -B qa/personal_credentials/android_diagnostic_guard_tests.py -v
          python3 -B qa/personal_credentials/passkey_live_guard_test.py
      - name: Build the fixed native adapters and observe their identities
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -m 700 "$RUNNER_TEMP/heptabao-personal-public"
          cargo +1.98.0 build --locked -p heptabao-credential-broker -p heptabao-personal-vault -p heptabao-personal-edge --bins
          python3 - <<'PY'
          import hashlib, json, os, pathlib, platform, subprocess
          def sha(p):
              with pathlib.Path(p).open('rb') as f:
                  return hashlib.file_digest(f, 'sha256').hexdigest()
          names = ['heptabao-credential-broker', 'heptabao-vault', 'heptabao-browser', 'heptabao-sync']
          report = {
              'schema': 'heptabao.personal-credentials.ci-build.v1',
              'source_commit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'source_tree': subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip(),
              'source_dirty': bool(subprocess.check_output(['git', 'status', '--porcelain'], text=True)),
              'cargo_lock_sha256': sha('Cargo.lock'),
              'rustc': subprocess.check_output(['rustc', '+1.98.0', '-vV'], text=True),
              'build_argv': ['cargo', '+1.98.0', 'build', '--locked', '-p', 'heptabao-credential-broker', '-p', 'heptabao-personal-vault', '-p', 'heptabao-personal-edge', '--bins'],
              'build_env': {key: os.environ[key] for key in ['CARGO_BUILD_JOBS', 'CARGO_PROFILE_DEV_DEBUG', 'CARGO_PROFILE_TEST_DEBUG', 'CARGO_INCREMENTAL']},
              'runner': {'system': platform.system(), 'release': platform.release(), 'machine': platform.machine()},
              'github_run_id': os.environ['GITHUB_RUN_ID'],
              'github_run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'binary_sha256': {n: sha(pathlib.Path('target/debug', n)) for n in names},
              'test_binaries_equal_to_post_test_build_asserted': False,
              'synthetic_only': True,
              'production_qualified': False,
              'full_replacement_qualified': False,
              'real_browser_qualified': False,
              'android_qualified': False,
              'physical_two_device_qualified': False,
              'credential_manager_exercised': False,
              'p4_qualified': False,
              'independent_security_review': False,
              'p0_profile_executed': False,
              'p0_service_qualified': False,
              'p5_qualified': False,
          }
          assert report['source_commit'] == os.environ['EXPECTED_SOURCE'] and not report['source_dirty']
          pathlib.Path(os.environ['RUNNER_TEMP'], 'heptabao-personal-public', 'build.public.json').write_text(json.dumps(report, indent=2) + '\n')
          PY
      - name: Exercise real CLI processes, pipes and encrypted-store recovery
        shell: bash
        run: |
          set -euo pipefail
          python3 -B qa/personal_credentials/personal_edge_live.py -v
          python3 -B qa/personal_credentials/native_backpressure.py --report "$RUNNER_TEMP/heptabao-personal-public/native-backpressure.public.json"
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess
          root = pathlib.Path(os.environ['RUNNER_TEMP'], 'heptabao-personal-public')
          build = json.loads((root / 'build.public.json').read_text())
          for name, expected in build['binary_sha256'].items():
              with pathlib.Path('target/debug', name).open('rb') as f:
                  assert hashlib.file_digest(f, 'sha256').hexdigest() == expected
          assert subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() == build['source_commit']
          assert not subprocess.check_output(['git', 'status', '--porcelain'], text=True)
          result = dict(build, synthetic_core_status='passed', unchanged_binaries=True)
          (root / 'result.public.json').write_text(json.dumps(result, indent=2) + '\n')
          PY
      - name: Record bounded public qualification receipts in the job log
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          root = pathlib.Path(os.environ['RUNNER_TEMP'], 'heptabao-personal-public')
          for name in ['build.public.json', 'native-backpressure.public.json', 'result.public.json']:
              path = root / name
              if not path.exists():
                  print(json.dumps({'receipt': name, 'observation': 'not_reached'}))
                  continue
              data = path.read_bytes()
              assert len(data) <= 65536
              print(json.dumps({'receipt': name, 'sha256': hashlib.sha256(data).hexdigest(), 'data': json.loads(data)}))
          PY
