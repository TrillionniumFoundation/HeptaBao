name: Temporary OpenBao replacement gap closure R1

on:
  push:
    branches:
      - codex/openbao-replacement-gap-closure-r1-20260908

permissions:
  contents: write

concurrency:
  group: openbao-gap-closure-r1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          persist-credentials: true

      - name: Apply reviewed security closure
        shell: bash
        run: |
          set -euo pipefail
          cat .g1/openbao-gap-r1/part-* | tr -d '\n' > /tmp/patch.lzma.b64
          python - <<'PY'
          import base64
          import lzma
          from pathlib import Path
          encoded = Path('/tmp/patch.lzma.b64').read_bytes()
          Path('/tmp/patch.py').write_bytes(lzma.decompress(base64.b64decode(encoded)))
          PY
          python /tmp/patch.py
          python - <<'PY'
          import re
          from pathlib import Path

          cargo = Path('crates/heptabao-server/Cargo.toml')
          cargo_text = cargo.read_text(encoding='utf-8')
          old = 'zeroize = "=1.8.1"\n'
          if cargo_text.count(old) != 1:
              raise SystemExit('unexpected heptabao-server dependency block')
          cargo.write_text(cargo_text.replace(old, old + 'subtle = "=2.6.1"\n'), encoding='utf-8')

          service = Path('crates/heptabao-server/src/service.rs')
          text = service.read_text(encoding='utf-8')
          import_anchor = 'use serde_json::{Value, json};\n'
          if text.count(import_anchor) != 1:
              raise SystemExit('unexpected serde_json import')
          text = text.replace(import_anchor, import_anchor + 'use subtle::ConstantTimeEq;\n')
          text = text.replace(
              'ring::constant_time::verify_slices_are_equal(',
              'constant_time_equal(',
          )
          text, count = re.subn(
              r'constant_time_equal\((.*?)\)\s*\.is_err\(\)',
              lambda match: '!constant_time_equal(' + match.group(1) + ')',
              text,
              flags=re.DOTALL,
          )
          if count != 3:
              raise SystemExit(f'expected three constant-time comparisons, found {count}')
          helper_anchor = 'fn decode_secret_32(value: &str) -> Option<Zeroizing<[u8; 32]>> {'
          if text.count(helper_anchor) != 1:
              raise SystemExit('unexpected secret decoder location')
          helper = '''fn constant_time_equal(left: &[u8; 32], right: &[u8; 32]) -> bool {
              bool::from(left.as_slice().ct_eq(right.as_slice()))
          }

          '''
          text = text.replace(helper_anchor, helper + helper_anchor)
          mutable = 'let mut file = options.open(&self.init_escrow_path)?;'
          if text.count(mutable) != 1:
              raise SystemExit('unexpected escrow file open')
          text = text.replace(mutable, 'let file = options.open(&self.init_escrow_path)?;')
          service.write_text(text, encoding='utf-8')
          PY
          rm -rf .g1/openbao-gap-r1
          rm .github/workflows/tmp-openbao-gap-closure-r1.yml
          python -m compileall -q qa scripts tests

      - name: Install exact Rust 1.98
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
          rustc +1.98.0 --version --verbose
          cargo +1.98.0 --version --verbose

      - name: Format and verify focused server closure
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --requirement requirements-plan.txt
          cargo +1.98.0 fmt --all
          cargo +1.98.0 fmt --all -- --check
          git diff --check
          cargo +1.98.0 test --locked -p heptabao-server
          cargo +1.98.0 clippy --locked -p heptabao-server --all-targets -- -D warnings
          cargo +1.98.0 build --locked -p heptabao-server
          work_dir="${RUNNER_TEMP}/heptabao-gap-closure-smoke"
          rm -rf "$work_dir"
          python qa/single-node/smoke.py \
            --binary "$PWD/target/debug/heptabao-server" \
            --work-dir "$work_dir"

      - name: Verify repository and complete workspace
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_repository_v2.py
          python -m unittest discover -s tests/repository -p 'test_*.py' -v
          python -m unittest discover -s tests/security -p 'test_*.py' -v
          python -m unittest discover -s tests/plan -p 'test_*.py' -v
          python -m unittest discover -s qa/openbao-acceptance/tests -p 'test_*.py' -v
          cargo +1.98.0 test --locked --workspace --all-targets
          cargo +1.98.0 clippy --locked --workspace --all-targets -- -D warnings
          cargo +1.98.0 doc --locked --workspace --no-deps

      - name: Commit verified source and retire temporary inputs
        shell: bash
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(server): audit wire rejects and recover initialization"
          git push origin "HEAD:${BRANCH}"
