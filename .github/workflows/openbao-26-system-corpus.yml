name: OpenBao 2.6 system compatibility fixtures

on:
  push:
    branches:
      - ops/openbao-26-system-corpus-20260911-r1

permissions:
  contents: write

concurrency:
  group: openbao-26-system-corpus-20260911-r1
  cancel-in-progress: true

env:
  BASE_SHA: 90f5df1fd8dc2dfb6b7bc676d41ad1bacae537d4
  OUTPUT_BRANCH: tmp/openbao-26-system-corpus-source-20260911-r1

jobs:
  qualify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact base and materialize fixtures
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Materialize source-only candidate
        shell: bash
        run: |
          set -euo pipefail
          git checkout -B "$OUTPUT_BRANCH" "$BASE_SHA"
          python - <<'PY'
          from pathlib import Path
          import json

          p=Path('qa/openbao-acceptance/acceptance.py')
          s=p.read_text(encoding='utf-8')
          old='    "approle": ["login"],\n}'
          new='    "approle": ["login"],\n    "edge_tls": ["health"],\n    "system": ["init_status"],\n    "operations": ["seal_status"],\n}'
          if s.count(old)!=1: raise SystemExit('CASES anchor mismatch')
          s=s.replace(old,new,1)
          anchor='    def cleanup(self):\n'
          funcs='    def edge_tls_cases(self):\n        r = self.call("edge_tls.health", "GET", "/v1/sys/health")\n        self.check("edge_tls.health", r, 200, initialized=r.body.get("initialized") is True, unsealed=r.body.get("sealed") is False)\n\n    def system_cases(self):\n        r = self.call("system.init_status", "GET", "/v1/sys/init")\n        self.check("system.init_status", r, 200, initialized=r.body.get("initialized") is True)\n\n    def operations_cases(self):\n        r = self.call("operations.seal_status", "GET", "/v1/sys/seal-status")\n        self.check("operations.seal_status", r, 200, initialized=r.body.get("initialized") is True, unsealed=r.body.get("sealed") is False)\n\n'
          if s.count(anchor)!=1: raise SystemExit('cleanup anchor mismatch')
          s=s.replace(anchor,funcs+anchor,1)
          old='for module in ("kv", "token", "transit", "totp", "userpass", "approle"):'
          new='for module in ("kv", "token", "transit", "totp", "userpass", "approle", "edge_tls", "system", "operations"):'
          if s.count(old)!=1: raise SystemExit('module loop anchor mismatch')
          s=s.replace(old,new,1)
          old='default="kv,token,transit,totp,userpass,approle"'
          new='default="kv,token,transit,totp,userpass,approle,edge_tls,system,operations"'
          if s.count(old)!=1: raise SystemExit('default modules anchor mismatch')
          p.write_text(s.replace(old,new,1),encoding='utf-8')

          cp=Path('qa/openbao-acceptance/complete_surface_corpus_v1.json')
          d=json.loads(cp.read_text(encoding='utf-8'))
          sm=d['coverage_summary']
          if (sm['implemented_surface_count'],sm['defined_not_implemented_surface_count'],sm['fixture_case_count'])!=(9,51,41):
              raise SystemExit('corpus summary baseline mismatch')
          sm['implemented_surface_count']=12
          sm['defined_not_implemented_surface_count']=48
          sm['fixture_case_count']=44
          mapping={'HB-SURFACE-EDGE-HTTP-TLS':'edge_tls.health','HB-SURFACE-SYSTEM-BACKEND':'system.init_status','HB-SURFACE-OPERATIONS':'operations.seal_status'}
          for row in d['surfaces']:
              case=mapping.get(row['surface_id'])
              if case:
                  if row['fixture_state']!='DEFINED_NOT_IMPLEMENTED' or row['fixture_case_ids']:
                      raise SystemExit('surface baseline mismatch: '+row['surface_id'])
                  row['fixture_state']='IMPLEMENTED_SCOPED'
                  row['fixture_case_ids']=[case]
          cp.write_text(json.dumps(d,indent=2)+'\n',encoding='utf-8')

          vp=Path('scripts/validate_compatibility_corpus.py')
          t=vp.read_text(encoding='utf-8')
          old='60 surfaces, 41 scoped cases, 0 exact-head independent surfaces'
          if t.count(old)!=1: raise SystemExit('validator summary anchor mismatch')
          vp.write_text(t.replace(old,'60 surfaces, 44 scoped cases, 0 exact-head independent surfaces',1),encoding='utf-8')

          tp=Path('tests/repository/test_compatibility_corpus_v2_3.py')
          t=tp.read_text(encoding='utf-8')
          old='self.assertEqual(41, len(mapped))'
          if t.count(old)!=1: raise SystemExit('test count anchor mismatch')
          tp.write_text(t.replace(old,'self.assertEqual(44, len(mapped))',1),encoding='utf-8')
          PY
          git diff --check
      - name: Validate closed-world corpus
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --requirement requirements-plan.txt
          python scripts/validate_compatibility_corpus.py
          python -m unittest tests.repository.test_compatibility_corpus_v2_3 -v
          python -m py_compile qa/openbao-acceptance/acceptance.py
          python scripts/validate_repository_v2.py
          python -m unittest discover -s tests/repository -p 'test_*.py' -v
      - name: Publish source-only candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'OpenBao 2.6 Compatibility Closure'
          git config user.email '102159240+ProfHepta@users.noreply.github.com'
          git add qa/openbao-acceptance/acceptance.py qa/openbao-acceptance/complete_surface_corpus_v1.json scripts/validate_compatibility_corpus.py tests/repository/test_compatibility_corpus_v2_3.py
          git commit -m 'test(compat): add system and operator fixtures'
          git push --force-with-lease origin "$OUTPUT_BRANCH"
