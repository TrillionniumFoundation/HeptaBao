schema: heptabao.traceability-requirements.v1_1
plan_id: HEPTABAO-PLAN-2026-08-28
revision: '1.1'
status: NORMATIVE_TRACEABILITY_INPUT
chain: source_observation -> specification -> requirement -> threat -> invariant -> ADR -> work_package -> test -> evidence -> qualification_receipt -> compatibility_claim -> authority_grant
rules:
  - Every profile-required behavior must resolve to named requirements and evidence.
  - Security, crypto, durability, distributed-systems and operator-critical requirements are non-waivable.
  - Missing source, owner, acceptance, test lane or evidence reference fails closed.
  - Compatibility evidence and operational authority remain separate.
gates:
  H00:
    - id: HB-REQ-H00-001
      criticality: GOVERNANCE_CRITICAL
      statement: Repository, plan, evidence and authority objects must have one normative precedence model and fail-closed defaults.
      owner_domain: governance
      source_refs: [HEPTABAO_PLAN_V1_1_AMENDMENT, audit:P0-execution-model]
      invariant_refs: [HB-INV-AUTHORITY-DEFAULT-DENY]
      work_packages: [H00-WP01, H00-WP02, H00-WP03, H00-WP04]
      acceptance: [28 ordered Program Gates, at least 250 unique Work Packages, all authority false except implementation_started, semantic false-qualification test rejected]
      test_lanes: [plan-semantic, governance-rust]
      evidence_required: [validator-output, git-tree, schema-negative-test]
      waiver_allowed: false
    - id: HB-REQ-H00-002
      criticality: SECURITY_CRITICAL
      statement: Clean-room, legal, disclosure, signing, capacity and independent-review controls must be operational before H00 qualification.
      owner_domain: governance
      source_refs: [LICENSE-PLANNING, SECURITY]
      invariant_refs: [HB-INV-CLEAN-ROOM, HB-INV-INDEPENDENT-APPROVAL]
      work_packages: [H00-WP05, H00-WP06, H00-WP07, H00-WP08, H00-WP09, H00-WP10]
      acceptance: [real ACL separation, signed legal disposition, private disclosure channel, signing/revocation ceremony, funded reviewer plan, independent approvals]
      test_lanes: [governance-game-day, access-review]
      evidence_required: [access-receipt, legal-receipt, incident-drill, signing-attestation, approval-signatures]
      waiver_allowed: false
  H01:
    - id: HB-REQ-H01-001
      criticality: COMPATIBILITY_CRITICAL
      statement: The OpenBao Oracle inventory must enumerate every claimed HTTP, CLI, configuration, auth, secret, audit, plugin, storage and HA surface.
      owner_domain: oracle
      source_refs: [OpenBao-v2.6.2-binary, OpenBao-v2.6.2-docs]
      invariant_refs: [HB-INV-NO-UNCLASSIFIED-SURFACE]
      work_packages: [H01-WP01, H01-WP02, H01-WP03, H01-WP04, H01-WP05]
      acceptance: [100-percent security/operator-critical inventory coverage, owner and classification for every entry]
      test_lanes: [oracle-inventory, advisory-crosswalk]
      evidence_required: [binary-digest, inventory-manifest, coverage-report]
      waiver_allowed: false
    - id: HB-REQ-H01-002
      criticality: SECURITY_CRITICAL
      statement: Raw and sanitized fixtures must retain distinct hashes and normalization must not erase security-relevant differences.
      owner_domain: oracle
      source_refs: [oracle-capture-policy]
      invariant_refs: [HB-INV-ORACLE-INTEGRITY]
      work_packages: [H01-WP06, H01-WP07, H01-WP08, H01-WP09, H01-WP10]
      acceptance: [replayable raw capture, sanitized fixture provenance, reviewed ignored-field registry, side-effect observer]
      test_lanes: [fixture-replay, normalization-negative]
      evidence_required: [raw-digest, sanitized-digest, normalizer-version, reviewer-signature]
      waiver_allowed: false
  H02:
    - id: HB-REQ-H02-001
      criticality: SUPPLY_CHAIN_CRITICAL
      statement: Runtime, TLS, crypto, storage, Raft, serialization and plugin dependencies require versioned bakeoff and replacement seams.
      owner_domain: platform
      source_refs: [dependency-bakeoff-policy]
      invariant_refs: [HB-INV-DEPENDENCY-PROVENANCE]
      work_packages: [H02-WP01, H02-WP02, H02-WP03, H02-WP04, H02-WP05, H02-WP06, H02-WP07, H02-WP08]
      acceptance: [maintenance/security/license/unsafe/MSRV/performance/replacement assessment for each critical dependency]
      test_lanes: [dependency-vet, license, unsafe-inventory]
      evidence_required: [bakeoff-receipts, cargo-vet, SBOM]
      waiver_allowed: false
    - id: HB-REQ-H02-002
      criticality: SECURITY_CRITICAL
      statement: Fuzzing, model checking and dependency policy must be available before critical implementation gates begin.
      owner_domain: qualification
      source_refs: [H25-tooling-needs]
      invariant_refs: [HB-INV-SECURITY-BY-CONSTRUCTION]
      work_packages: [H02-WP09, H02-WP10]
      acceptance: [repeatable fuzz/model harness, pinned tools, vulnerability and license policy]
      test_lanes: [toolchain-reproducibility, negative-policy]
      evidence_required: [tool-digests, harness-smoke, policy-output]
      waiver_allowed: false
  H03:
    - id: HB-REQ-H03-001
      criticality: SECURITY_CRITICAL
      statement: Every route and internal action must resolve to one registered operation class before authentication, policy and dispatch decisions.
      owner_domain: protocol
      source_refs: [HEPTABAO_OPERATION_REGISTRY_V1]
      invariant_refs: [HB-INV-UNKNOWN-OP-DENY, HB-INV-INTERNAL-OP-CLOSED]
      work_packages: [H03-WP01, H03-WP02, H03-WP03, H03-WP07, H03-WP09]
      acceptance: [unknown operation denied, external bytes cannot construct internal operation, version mismatch denied]
      test_lanes: [operation-registry, parser-fuzz, compile-fail]
      evidence_required: [registry-digest, negative-fixtures, type-tests]
      waiver_allowed: false
    - id: HB-REQ-H03-002
      criticality: SECURITY_CRITICAL
      statement: Canonicalization, secret-bearing types and response-unknown policies must prevent path confusion, raw-secret projection and blind retry.
      owner_domain: protocol
      source_refs: [HEPTABAO_REQUEST_PIPELINE_STATE_MACHINE_V1]
      invariant_refs: [HB-INV-CANONICAL-CONTEXT, HB-INV-NO-BLIND-RETRY]
      work_packages: [H03-WP04, H03-WP05, H03-WP06, H03-WP08, H03-WP10]
      acceptance: [single canonical path, immutable namespace/mount context, nonserializable secret types, explicit deviation]
      test_lanes: [canonicalization-fuzz, secret-trait-compile-fail, effect-model]
      evidence_required: [fuzz-corpus, compile-fail-output, state-machine-traces]
      waiver_allowed: false
  H04:
    - id: HB-REQ-H04-001
      criticality: DATA_DURABILITY_CRITICAL
      statement: Physical storage must expose explicit transaction, CAS, list/scan, lock, consistent-read, snapshot and restore semantics.
      owner_domain: storage
      source_refs: [storage-transaction-model]
      invariant_refs: [HB-INV-STORAGE-CONTRACT]
      work_packages: [H04-WP01, H04-WP02, H04-WP03, H04-WP04]
      acceptance: [contract suite passes memory and PostgreSQL backends, no semantic fallback]
      test_lanes: [storage-contract, cross-backend-differential]
      evidence_required: [contract-results, backend-config-digests]
      waiver_allowed: false
    - id: HB-REQ-H04-002
      criticality: DATA_DURABILITY_CRITICAL
      statement: Committed state must survive crash, torn write, disk-full, corruption and schema migration with deterministic reopen or safe stop.
      owner_domain: storage
      source_refs: [durability-failure-model]
      invariant_refs: [HB-INV-COMMITTED-RPO-ZERO]
      work_packages: [H04-WP05, H04-WP06, H04-WP07, H04-WP08, H04-WP09]
      acceptance: [physical fsync evidence, kill-point recovery, corruption rejection, restore verification]
      test_lanes: [crash-injection, corruption, migration, backup-restore]
      evidence_required: [fault-manifest, reopen-traces, restore-receipt]
      waiver_allowed: false
  H05:
    - id: HB-REQ-H05-001
      criticality: CRYPTO_CRITICAL
      statement: Barrier ciphertext must use a versioned authenticated envelope bound to object, namespace, storage key, key version and cipher suite.
      owner_domain: barrier
      source_refs: [key-hierarchy-and-ceremony-spec]
      invariant_refs: [HB-INV-AUTHENTICATED-CIPHERTEXT]
      work_packages: [H05-WP01, H05-WP02, H05-WP04, H05-WP05]
      acceptance: [cross-object/namespace substitution rejected, unknown format/algorithm rejected]
      test_lanes: [KAT, tamper, cross-provider]
      evidence_required: [known-answer-vectors, envelope-spec, external-review]
      waiver_allowed: false
    - id: HB-REQ-H05-002
      criticality: CRYPTO_CRITICAL
      statement: Nonce uniqueness, key rotation, cache zeroization, tamper and rollback detection must hold across crash and snapshot clone.
      owner_domain: barrier
      source_refs: [barrier-threat-model]
      invariant_refs: [HB-INV-NONCE-UNIQUE, HB-INV-NO-PLAINTEXT-REMANENCE]
      work_packages: [H05-WP03, H05-WP06, H05-WP07, H05-WP08, H05-WP09, H05-WP10]
      acceptance: [no nonce collision, tamper rejected, rollback detected, external crypto review closes high/critical]
      test_lanes: [nonce-model, crash, memory-canary, external-audit]
      evidence_required: [model-output, crash-corpus, audit-report]
      waiver_allowed: false
  H06:
    - id: HB-REQ-H06-001
      criticality: CRYPTO_CRITICAL
      statement: Init, Shamir, seal, unseal, rekey, recovery and barrier-key rotation are separate idempotent ceremonies.
      owner_domain: seal
      source_refs: [seal-state-machine]
      invariant_refs: [HB-INV-SEALED-NO-SERVICE, HB-INV-CEREMONY-IDEMPOTENT]
      work_packages: [H06-WP01, H06-WP02, H06-WP03, H06-WP04, H06-WP05, H06-WP06, H06-WP07]
      acceptance: [share cannot count twice, partial ceremony safe, sealed scope rejects service]
      test_lanes: [ceremony-model, crash, share-negative]
      evidence_required: [state-traces, threshold-fixtures, memory-scan]
      waiver_allowed: false
    - id: HB-REQ-H06-002
      criticality: CRYPTO_CRITICAL
      statement: Auto-unseal providers must bind provider identity/key version and fail closed on outage, rollback or deletion.
      owner_domain: seal
      source_refs: [kms-hsm-failure-model]
      invariant_refs: [HB-INV-AUTO-UNSEAL-BOUND]
      work_packages: [H06-WP08, H06-WP09, H06-WP10]
      acceptance: [wrong KMS identity/key rejected, outage remains sealed, recovery is explicit]
      test_lanes: [kms-emulator, outage-game-day, memory-residue]
      evidence_required: [provider-vectors, outage-receipt, residue-report]
      waiver_allowed: false
  H07:
    - id: HB-REQ-H07-001
      criticality: SECURITY_CRITICAL
      statement: One authoritative pipeline must enforce context, operation, authentication, identity, policy, audit, intent, dispatch and response ordering.
      owner_domain: core
      source_refs: [HEPTABAO_REQUEST_PIPELINE_STATE_MACHINE_V1]
      invariant_refs: [HB-INV-NO-BYPASS-PIPELINE]
      work_packages: [H07-WP01, H07-WP02, H07-WP06, H07-WP10]
      acceptance: [backend dispatch before policy/audit equals zero, cancellation semantics deterministic]
      test_lanes: [pipeline-model, bypass-negative, cancellation]
      evidence_required: [trace-replay, dispatch-counter, happens-before-proof]
      waiver_allowed: false
    - id: HB-REQ-H07-002
      criticality: OPERATOR_CRITICAL
      statement: Mount/system mutations, route precedence, cache invalidation and active-owner fencing must be revisioned and crash safe.
      owner_domain: system
      source_refs: [mount-registry-spec]
      invariant_refs: [HB-INV-MOUNT-SINGLE-WRITER, HB-INV-STALE-CACHE-DENY]
      work_packages: [H07-WP03, H07-WP04, H07-WP05, H07-WP07, H07-WP08, H07-WP09]
      acceptance: [no mount shadow bypass, stale owner/caches reject, OpenAPI/help derives registry]
      test_lanes: [mount-crash, route-differential, cache-epoch]
      evidence_required: [registry-receipt, fault-traces, differential-report]
      waiver_allowed: false
  H08:
    - id: HB-REQ-H08-001
      criticality: SECURITY_CRITICAL
      statement: ACL matching must be deterministic, default-deny and monotonic under added deny or narrowed policy.
      owner_domain: policy
      source_refs: [OpenBao-v2.6.2-policy-oracle]
      invariant_refs: [HB-INV-POLICY-MONOTONIC]
      work_packages: [H08-WP01, H08-WP02, H08-WP03, H08-WP04]
      acceptance: [deny cannot be bypassed by glob/plus/star/slash/list/scan/pagination]
      test_lanes: [property, oracle-differential, adversarial]
      evidence_required: [policy-corpus, property-output, advisory-regressions]
      waiver_allowed: false
    - id: HB-REQ-H08-002
      criticality: SECURITY_CRITICAL
      statement: Parameter, template, wrapping, MFA/control-group and explain behavior must never widen capability or leak private metadata.
      owner_domain: policy
      source_refs: [policy-parameter-template-spec]
      invariant_refs: [HB-INV-POLICY-PARAMETER-CONSTRAINT]
      work_packages: [H08-WP05, H08-WP06, H08-WP07, H08-WP08, H08-WP09, H08-WP10]
      acceptance: [template recanonicalized, required/denied parameters enforced, explain redacted, cache invalidation immediate]
      test_lanes: [template-fuzz, parameter-negative, cache-race]
      evidence_required: [fuzz-corpus, negative-vectors, cache-traces]
      waiver_allowed: false
  H09:
    - id: HB-REQ-H09-001
      criticality: SECURITY_CRITICAL
      statement: Entity, alias and group state must be namespace/mount bound, revisioned and cycle safe.
      owner_domain: identity
      source_refs: [identity-oracle]
      invariant_refs: [HB-INV-IDENTITY-NONINTERFERENCE]
      work_packages: [H09-WP01, H09-WP02, H09-WP03, H09-WP04, H09-WP05, H09-WP06]
      acceptance: [no cross-namespace alias reuse, merge lineage auditable, group expansion bounded]
      test_lanes: [identity-differential, cycle-fuzz, merge-crash]
      evidence_required: [object-vectors, lineage-receipt, noninterference-report]
      waiver_allowed: false
    - id: HB-REQ-H09-002
      criticality: SECURITY_CRITICAL
      statement: MFA and OIDC challenges/keys must bind request, identity, namespace, operation, nonce, TTL and cache epoch.
      owner_domain: identity-oidc
      source_refs: [mfa-oidc-spec]
      invariant_refs: [HB-INV-MFA-NO-REPLAY, HB-INV-OIDC-KEY-ISOLATION]
      work_packages: [H09-WP07, H09-WP08, H09-WP09, H09-WP10]
      acceptance: [challenge replay rejected, wrong namespace key rejected, standby cannot use stale policy/key]
      test_lanes: [replay, key-rotation, standby-cache]
      evidence_required: [challenge-vectors, jwks-rotation-trace, cache-epoch-report]
      waiver_allowed: false
  H10:
    - id: HB-REQ-H10-001
      criticality: SECURITY_CRITICAL
      statement: Service/batch token codecs, accessors and parent/orphan graph must enforce namespace, policy, TTL, uses and revocation semantics.
      owner_domain: token
      source_refs: [token-oracle]
      invariant_refs: [HB-INV-PARENT-REVOKE, HB-INV-TOKEN-SECRET-NOT-STORED]
      work_packages: [H10-WP01, H10-WP02, H10-WP03, H10-WP04, H10-WP05, H10-WP06, H10-WP11]
      acceptance: [post-revoke descendant acceptance zero, token plaintext absent from storage/artifacts]
      test_lanes: [graph-model, million-node, codec-tamper, renew-revoke-race]
      evidence_required: [model-output, storage-scan, differential-report]
      waiver_allowed: false
    - id: HB-REQ-H10-002
      criticality: SECURITY_CRITICAL
      statement: Cubbyhole, wrapping, recovery and root ceremonies must be single-use, audited and minimally live.
      owner_domain: token
      source_refs: [wrapping-root-oracle]
      invariant_refs: [HB-INV-WRAP-SINGLE-USE, HB-INV-ROOT-WINDOW-MINIMAL]
      work_packages: [H10-WP07, H10-WP08, H10-WP09, H10-WP10]
      acceptance: [wrap replay rejected, response loss reconciled, root/recovery ceremony multi-party and audited]
      test_lanes: [wrapping-race, ceremony-model, active-standby-forward]
      evidence_required: [race-traces, ceremony-receipt, audit-events]
      waiver_allowed: false
  H11:
    - id: HB-REQ-H11-001
      criticality: SECURITY_CRITICAL
      statement: Lease expiry, renew and revoke state must persist across restart and bind issuing token, namespace, path, plugin and fence.
      owner_domain: lease
      source_refs: [lease-oracle]
      invariant_refs: [HB-INV-EXPIRED-NOT-RENEWABLE, HB-INV-LEASE-SINGLE-WRITER]
      work_packages: [H11-WP01, H11-WP02, H11-WP03, H11-WP04, H11-WP05, H11-WP10]
      acceptance: [expired/revoked credential cannot renew, restart preserves deadlines, stale owner rejected]
      test_lanes: [clock-fault, restart, renew-revoke-race]
      evidence_required: [lease-traces, reopen-report, fence-report]
      waiver_allowed: false
    - id: HB-REQ-H11-002
      criticality: SECURITY_CRITICAL
      statement: External-effect WAL, reconciliation, rollback and irrevocable states must forbid blind retry and false success.
      owner_domain: lease
      source_refs: [HEPTABAO_AUDIT_COMMIT_EFFECT_ORDERING_V1]
      invariant_refs: [HB-INV-NO-BLIND-RETRY, HB-INV-REVOKE-EVIDENCE]
      work_packages: [H11-WP06, H11-WP07, H11-WP08, H11-WP09, H11-WP11]
      acceptance: [10000 fault points, unknown stays indeterminate/manual, revoke error explicit]
      test_lanes: [fault-injection, provider-chaos, WAL-corruption]
      evidence_required: [fault-manifest, reconcile-traces, irrevocable-report]
      waiver_allowed: false
  H12:
    - id: HB-REQ-H12-001
      criticality: SECURITY_CRITICAL
      statement: Request/response audit gates must succeed according to profile before backend dispatch and secret release.
      owner_domain: audit
      source_refs: [HEPTABAO_AUDIT_COMMIT_EFFECT_ORDERING_V1]
      invariant_refs: [HB-INV-AUDIT-BEFORE-DISPATCH, HB-INV-AUDIT-BEFORE-SECRET]
      work_packages: [H12-WP01, H12-WP02, H12-WP03, H12-WP04, H12-WP09]
      acceptance: [unaudited backend dispatch zero, unaudited secret response zero, HMAC vectors pass]
      test_lanes: [audit-ordering, HMAC-KAT, secret-canary]
      evidence_required: [ordering-trace, KAT-output, canary-scan]
      waiver_allowed: false
    - id: HB-REQ-H12-002
      criticality: OPERATOR_CRITICAL
      statement: File/HTTP/socket/syslog devices must handle blockage, rotation, partial writes, SSRF and restart without silent bypass.
      owner_domain: audit
      source_refs: [audit-device-oracle]
      invariant_refs: [HB-INV-AUDIT-DEVICE-FAIL-CLOSED]
      work_packages: [H12-WP05, H12-WP06, H12-WP07, H12-WP08, H12-WP10, H12-WP11]
      acceptance: [blocked-device game day, destination controls, no secret leak]
      test_lanes: [disk-full, socket-block, HTTP-timeout, rotation, SSRF]
      evidence_required: [game-day-receipt, device-differential, leak-scan]
      waiver_allowed: false
  H13:
    - id: HB-REQ-H13-001
      criticality: SECURITY_CRITICAL
      statement: Plugin protocol and catalog must bind type, name, version, digest, command, args, runtime identity and cluster session.
      owner_domain: plugin
      source_refs: [OpenBao-v2.6.2-plugin-protocol]
      invariant_refs: [HB-INV-PLUGIN-IDENTITY]
      work_packages: [H13-WP01, H13-WP02, H13-WP03, H13-WP04, H13-WP05]
      acceptance: [malformed/downgraded/mismatched plugin rejected, four plugin classes interoperate]
      test_lanes: [Go-interop, protocol-fuzz, mTLS-negative]
      evidence_required: [interop-vectors, protocol-digest, negative-report]
      waiver_allowed: false
    - id: HB-REQ-H13-002
      criticality: SECURITY_CRITICAL
      statement: OCI, supervisor and sandbox must prevent substitution, host privilege expansion and orphan processes after seal/stepdown.
      owner_domain: plugin
      source_refs: [plugin-sandbox-threat-model]
      invariant_refs: [HB-INV-PLUGIN-NO-ESCAPE, HB-INV-NO-ORPHAN-PLUGIN]
      work_packages: [H13-WP06, H13-WP07, H13-WP08, H13-WP09, H13-WP10, H13-WP11, H13-WP12, H13-WP13]
      acceptance: [digest/signature enforced, crash/fork-bomb bounded, no orphan after lifecycle transition]
      test_lanes: [sandbox-red-team, OCI-negative, lifecycle-chaos]
      evidence_required: [sandbox-report, supply-chain-report, process-scan]
      waiver_allowed: false
  H14:
    - id: HB-REQ-H14-001
      criticality: SECURITY_CRITICAL
      statement: Namespace context must bind every storage, cache, policy, identity, token, lease, audit, plugin and OIDC key.
      owner_domain: namespace
      source_refs: [namespace-context-spec]
      invariant_refs: [HB-INV-NAMESPACE-NONINTERFERENCE]
      work_packages: [H14-WP01, H14-WP02, H14-WP03, H14-WP04, H14-WP05, H14-WP06]
      acceptance: [cross-namespace bleed zero, encoded parent escape rejected, cache key collision rejected]
      test_lanes: [noninterference-fuzz, cache-collision, route-negative]
      evidence_required: [fuzz-report, context-traces, differential-report]
      waiver_allowed: false
    - id: HB-REQ-H14-002
      criticality: CRYPTO_CRITICAL
      statement: Namespace keyrings, sealing, deletion, recreation and restore must preserve independent cryptographic authority and tombstones.
      owner_domain: namespace
      source_refs: [namespace-seal-oracle]
      invariant_refs: [HB-INV-NAMESPACE-KEY-ISOLATION]
      work_packages: [H14-WP07, H14-WP08, H14-WP09, H14-WP10]
      acceptance: [sealed namespace raw/sys reads rejected, recreate cannot revive old state, external crypto review pass]
      test_lanes: [seal-race, delete-recreate, restore, crypto-review]
      evidence_required: [keyring-vectors, tombstone-trace, audit-report]
      waiver_allowed: false
  H15:
    - id: HB-REQ-H15-001
      criticality: SECURITY_CRITICAL
      statement: Profile/CEL/template evaluation must be bounded, canonicalized and unable to construct unregistered internal operations.
      owner_domain: profile
      source_refs: [workflow-profile-oracle]
      invariant_refs: [HB-INV-WORKFLOW-OP-ALLOWLIST]
      work_packages: [H15-WP01, H15-WP02, H15-WP03, H15-WP04, H15-WP10]
      acceptance: [CPU/memory/depth/output limits, SSRF/secret-echo/internal-op tests reject]
      test_lanes: [template-fuzz, sandbox, cycle]
      evidence_required: [resource-limit-report, adversarial-corpus]
      waiver_allowed: false
    - id: HB-REQ-H15-002
      criticality: SECURITY_CRITICAL
      statement: Workflow steps only attenuate authority; compensation and self-init are idempotent and transient root is always revoked.
      owner_domain: workflow
      source_refs: [self-init-workflow-oracle]
      invariant_refs: [HB-INV-AUTH-ATTENUATION, HB-INV-TRANSIENT-ROOT-REVOKE]
      work_packages: [H15-WP05, H15-WP06, H15-WP07, H15-WP08, H15-WP09]
      acceptance: [no policy widening, crash-resume deterministic, root cleanup on success/failure]
      test_lanes: [workflow-state, crash, root-cleanup]
      evidence_required: [state-traces, audit-events, cleanup-receipt]
      waiver_allowed: false
  H16:
    - id: HB-REQ-H16-001
      criticality: SECURITY_CRITICAL
      statement: Every built-in auth method must implement its exact role/config/login/renew/revoke/MFA/namespace/audit semantics through the central token issuer.
      owner_domain: auth
      source_refs: [OpenBao-v2.6.2-auth-inventory]
      invariant_refs: [HB-INV-AUTH-NO-HIDDEN-TOKEN]
      work_packages: [H16-WP01, H16-WP02, H16-WP03, H16-WP04, H16-WP05, H16-WP06, H16-WP07, H16-WP08, H16-WP09, H16-WP10]
      acceptance: [100-percent critical endpoint coverage per method, auth failure produces no token]
      test_lanes: [real-service, oracle-differential, protocol-security]
      evidence_required: [method-receipts, service-matrix, security-review]
      waiver_allowed: false
    - id: HB-REQ-H16-002
      criticality: SECURITY_CRITICAL
      statement: JWT, cert, Kubernetes, LDAP, RADIUS and Kerberos trust inputs must resist algorithm, proxy, injection, replay and clock confusion.
      owner_domain: auth
      source_refs: [auth-threat-models]
      invariant_refs: [HB-INV-AUTH-TRUST-BOUND]
      work_packages: [H16-WP04, H16-WP05, H16-WP06, H16-WP07, H16-WP08, H16-WP09]
      acceptance: [all named attacks rejected and audited]
      test_lanes: [JWT-confusion, cert-proxy, LDAP-injection, replay, clock]
      evidence_required: [attack-corpus, external-review]
      waiver_allowed: false
  H17:
    - id: HB-REQ-H17-001
      criticality: COMPATIBILITY_CRITICAL
