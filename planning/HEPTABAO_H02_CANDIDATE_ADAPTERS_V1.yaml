plan_id: HEPTABAO-PLAN-2026-08-28
revision: '1.1'
status: IMPLEMENTED_UNEXECUTED_NOT_QUALIFIED
qualification: false
selection_effect: NONE
authority_effect: NONE

purpose:
  - Bind exact Tokio, rustls and OpenRaft candidate versions to the HeptaBao-owned seeded behavior harness.
  - Execute the same case IDs and seeds as the candidate-neutral reference models.
  - Classify invariant matches, incomplete evidence and deviations without requiring raw trace equality.
  - Keep candidate-specific types inside isolated probe workspaces and outside HeptaBao domain contracts.
  - Preserve compile, runtime, blocked and failed outcomes as evidence without promoting a candidate.

rules:
  - Candidate evidence uses execution_kind CANDIDATE_ADAPTER and candidate.bound=true.
  - Every execution binds an exact manifest digest, feature set, toolchain, target, source commit and source tree.
  - The feature_profile_sha256 includes the exact manifest, candidate features, complete allowlisted direct-dependency profile, toolchain and target; it is not reusable across dependency, feature, toolchain or target drift.
  - Candidate output is executed twice with the same seed and must be byte-for-byte equivalent after JSON parsing.
  - Reference and candidate evidence must have identical domain, seed and ordered case IDs.
  - Candidate traces may differ from reference traces; comparison is by named invariant outcome and explicit adapter scope.
  - FULL_REFERENCE_CASE_SET means only the six H02 reference cases were exercised, not production qualification.
  - API_SEAM_AND_FAILURE_MODEL_PARTIAL can never support candidate promotion by itself.
  - OpenRaft alpha.33 candidate execution starts at the proven effective Rust 1.88 floor; Rust 1.85 through 1.87 remain explicit expected-failure boundary evidence rather than adapter variants.
  - A Rust panic, non-zero process exit, missing output or malformed output becomes BLOCKED/FAIL evidence, never missing evidence.
  - Candidate evidence, comparison evidence and successful CI all retain qualification=false, selection_effect=NONE and authority_effect=NONE.

