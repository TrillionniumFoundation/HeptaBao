    state: IMPLEMENTED_PARTIAL_UNEXECUTED

comparison_results:
  INVARIANT_EQUIVALENT_UNREVIEWED:
    meaning: every named candidate case passed while the reference case passed and adapter scope is FULL_REFERENCE_CASE_SET
    promotion_effect: NONE
  PARTIAL_ADAPTER_SCOPE_BLOCKS_PROMOTION:
    meaning: all named cases passed but the adapter explicitly covers only an API seam/failure model
    promotion_effect: BLOCK
  DEVIATION_OR_DEFECT_REVIEW_REQUIRED:
    meaning: at least one candidate case failed while its reference case passed
    promotion_effect: BLOCK
  INCOMPLETE_BLOCKED:
    meaning: candidate evidence contains blocked, unexecuted or unknown cases
    promotion_effect: BLOCK

