schema: heptabao.h02-sbom-unsafe-policy.v1
plan_id: HEPTABAO-PLAN-2026-08-28
revision: '1.1'
status: NORMATIVE_EVIDENCE_POLICY
qualification: false
selection_effect: NONE
authority_effect: NONE

purpose:
  - Produce an exact dependency graph for every candidate feature profile.
  - Separate normal, build, development, platform-conditional and native dependencies.
  - Inventory build scripts, Cargo links values, native toolchains, FFI boundaries and heuristic unsafe surfaces.
  - Bind every inventory to one Cargo.lock, cargo metadata document, feature tree, target triple and toolchain.
  - Keep mechanical findings distinct from reviewed security conclusions.

required_evidence:
  graph:
    - exact root profile ID and profile digest
    - exact Cargo.lock SHA-256
    - cargo metadata SHA-256
    - package name, version, source and checksum for every node
    - dependency kind and target condition for every edge
    - activated feature set for every package
  build_surface:
    - every custom-build target
    - every package with a Cargo links value
    - every build dependency
    - every downloaded or generated native artifact
    - every environment variable read by build scripts when observable
    - every network access attempt during build
  unsafe_and_ffi:
    - heuristic unsafe token counts by package and file
    - extern-C, link, link_name and global assembly indicators
    - native C/C++/assembly source presence
    - bindgen, cc, cmake, pkg-config, vcpkg, nasm and provider-specific build tools
    - reviewed disposition for each authority-critical unsafe/FFI boundary
  licensing:
    - declared SPDX expression per package
    - license-file digest where supplied
    - unknown, non-SPDX and conflicting declarations
    - transitive copyleft and notice obligations
  advisories:
    - database/tool/version and update timestamp
    - findings for the exact locked graph
    - withdrawn/yanked/unmaintained/unsound status
    - false-positive or not-affected disposition with reviewer and expiry
  msrv:
    - declared rust-version where present
    - exact toolchain and target used for each execution
    - lockfile resolver behavior
    - build/test result for the exact feature profile
    - effective-MSRV search method and lower/upper bounds

classification:
  MECHANICAL_CAPTURE:
    meaning: generated by deterministic tooling without human security conclusion
    permits: [inventory, comparison, review queue]
    forbids: [scoring, candidate promotion, selection]
  HEURISTIC_UNREVIEWED:
    meaning: text/pattern-based unsafe, FFI or native-surface signal
    permits: [specialist triage]
    forbids: [claiming code is safe or unsafe solely from the count]
  REVIEWED_DISPOSITION:
    meaning: signed domain/security/license disposition for an exact artifact graph
    permits: [candidate scoring when all other gates pass]
    forbids: [implicit transfer to another version, target or feature profile]

fail_closed_conditions:
  - missing or mutable dependency version
  - lockfile or metadata digest mismatch
  - package checksum mismatch
  - unknown package source
  - unclassified build script or Cargo links package
  - build-time network access without an approved hermetic exception
  - generated native artifact without digest/provenance
  - unknown or rejected license
  - critical, high or unclassified advisory finding
  - authority-critical unsafe/FFI boundary without specialist disposition
  - required profile build/test skipped, blocked or unknown
  - effective MSRV inferred only from edition or declared metadata
  - graph generated for a feature or target profile different from the claim

candidate_specific_review:
  HB-DEP-ASYNC-TOKIO:
    focus:
      - OS-specific signal, networking and I/O FFI
      - timer/cancellation/task lifecycle
      - optional io-uring and taskdump surfaces remain disabled in the minimal profile
      - native platform dependencies under each supported target
    required_roles: [platform, security]
  HB-DEP-TLS-RUSTLS:
    focus:
      - ring versus aws-lc-rs provider graph separation
      - aws-lc-sys/ring native and unsafe surfaces
      - stateless ticket and session-resumption paths
      - certificate parser and crypto-provider feature expansion
      - FIPS must not be claimed from a feature flag alone
    required_roles: [platform, security, crypto, license]
  HB-DEP-RAFT-OPENRAFT:
    focus:
      - alpha API and serialized-state stability
      - runtime adapter and deterministic FSM separation
      - snapshot, membership and linearizable-read dependencies
      - build/test graph under the exact tokio/serde profile
      - cross-architecture and restart trace reproducibility
    required_roles: [platform, security, distributed-systems]

retention_and_redaction:
  - Raw dependency source and package archives remain in bounded external caches, not committed to the implementation repository.
  - Checked-in evidence contains package identity, digests, counts, paths and sanitized findings only.
  - Build logs are scanned for tokens, credentials, absolute home paths and environment secrets before publication.
  - Evidence artifacts are immutable and superseded rather than edited in place.
  - A second environment must reproduce critical graph and package checksums before review eligibility.

