      - {id: artifact-vcs-commit, assertion: package VCS commit matches the pinned release commit, failure_effect: FAIL_CLOSED_NO_SELECTION}
      - {id: artifact-origin-allowlist, assertion: every redirect terminates at an approved HTTPS origin, failure_effect: FAIL_CLOSED_NO_SELECTION}
      - {id: artifact-stream-size-bound, assertion: oversized or empty download is rejected and partial file removed, failure_effect: FAIL_CLOSED_NO_SELECTION}
      - {id: artifact-independent-reproduction, assertion: two environments reproduce package checksum and record source-archive observations, failure_effect: FAIL_CLOSED_NO_SELECTION}
