execution_contract:
  required_commands:
    - cargo generate-lockfile --manifest-path <probe_manifest>
    - cargo metadata --format-version 1 --locked --manifest-path <probe_manifest>
    - cargo tree --locked --edges normal,build --manifest-path <probe_manifest>
    - cargo tree --locked --edges features --manifest-path <probe_manifest>
    - cargo check --locked --all-targets --manifest-path <probe_manifest>
    - cargo test --locked --all-targets --manifest-path <probe_manifest>
  required_outputs:
    - Cargo.lock SHA-256
    - cargo metadata SHA-256 and normalized package graph
    - normal/build dependency tree SHA-256
    - feature tree SHA-256
    - build and test logs with exit status
    - source-tree heuristic unsafe/FFI/native/build-script inventory
    - exact runner, toolchain, target and environment identity
    - package source checksum and VCS commit binding
  post_run_enrichment:
    - GitHub numeric runner_id and job_id from the Actions API when applicable
    - independent reviewer identities and signatures
    - advisory and license disposition
    - replayable random seeds for behavioral profiles
