schema: heptabao.h02-candidate-probe-matrix.v1
plan_id: HEPTABAO-PLAN-2026-08-28
revision: '1.1'
status: SPECIFIED_UNEXECUTED
qualification: false
selection_effect: NONE
authority_effect: NONE

rules:
  - Probe profiles are isolated evaluation manifests and are not workspace dependencies.
  - Exact versions, feature sets, target triples and toolchains are immutable inputs to one evidence run.
  - A probe may download public dependencies but may not read production credentials or secret fixtures.
  - Generated lockfiles, metadata, feature trees, source scans and logs are evidence; none of them select a candidate.
  - A successful build on a declared toolchain is evidence for that exact profile only, not a general MSRV claim.
  - OpenRaft has no declared rust-version in the captured upstream workspace manifest; alpha.33 macros use Rust-2024 let chains, so the probe enforces an effective Rust 1.88 floor and separately requires bounded 1.85-1.87 failures plus 1.88/1.98 passes.
  - Rustls crypto-provider variants are compared separately; defining a variant does not select either provider.
  - Candidate source code is scanned heuristically for unsafe, FFI, native links and build scripts; heuristic counts require human review.
  - Failed, skipped, network-blocked or unknown critical steps block promotion and remain visible in the evidence object.
  - Every evidence object has qualification=false, selection_effect=NONE and authority_effect=NONE.

