os_process_suspend:
  implementation_state: IMPLEMENTED_UNQUALIFIED
  execution:
    - start a real three-node OpenRaft cluster in an isolated child process
    - commit values and perform ReadIndex reads while atomically publishing progress
    - send SIGSTOP through the Linux process interface
    - verify /proc reports a stopped process state
    - verify committed/read progress does not change during the stopped interval
    - send SIGCONT and require candidate commit and ReadIndex progress to resume
  scope_limit:
    topology: SINGLE_OS_PROCESS_THREE_INPROCESS_RAFT_NODES
    separate_process_per_raft_node: false
    separate_process_majority_election: false
  fail_closed:
    - missing child PID blocks
    - missing readiness or progress blocks
    - process state other than stopped fails
    - progress movement during SIGSTOP fails
    - failure to resume commit and ReadIndex progress fails

durable_storage:
  integrated_openraft_store:
    state: IMPLEMENTED_UNQUALIFIED
    candidate_id: HB-STORE-FILE-DURABLE-PROTOTYPE
    openraft_storage_integrated: true
    implements:
      - RaftLogReader
      - RaftLogStorage
      - RaftSnapshotBuilder
      - RaftStateMachine
    persistence_contract:
      envelope: magic + u64 payload length + payload + CRC32
      artifact_bound: 128 MiB
      publication: create-new temporary + write-all + flush + sync_all + rename + parent-directory sync_all
      vote_persisted_before_return: true
      committed_index_persisted_before_return: true
      append_IOFlushed_after_sync_all: true
      state_machine_persisted_before_client_responder: true
      snapshot_metadata_and_membership_validated: true
      explicit_create_reopen_lifecycle: true
      validated_current_discards_single_stale_previous: true
      corrupt_current_never_falls_back_to_previous: true
      multiple_previous_generations_fail_closed: true
      initialized_store_marker_persisted: true
      missing_initialized_generation_fails_closed: true
      legacy_generation_adoption_requires_full_validation: true
      marker_domain_and_file_binding_validated: true
    implemented_cases:
      - three-node replicated writes with non-empty durable artifacts
      - logical full-cluster shutdown and disk reopen in the same OS process
      - ReadIndex after disk reopen
      - post-reopen write surviving a second disk reopen
      - snapshot recovery when the state-machine file is missing
      - log corruption rejected on reopen
      - state-machine corruption rejected on reopen
      - bootstrap uses explicit create-new while restart uses explicit reopen-existing
      - initialized log generation deletion rejected on reopen
      - initialized state generation deletion rejected on reopen
      - corrupt or domain-mismatched initialization marker rejected
      - interrupted marker replacement recovered before classification
      - deleted initialized directory is not silently recreated by reopen-existing
      - legacy authoritative generation requires explicit validated adoption
      - valid current generation discards one stale previous only after validation
      - corrupt current generation never falls back silently to previous
      - multiple previous generations fail closed as ambiguous
      - isolated writer cannot advance committed state
    scope_limit:
      production_selected: false
      separate_process_node_restart: false
      kernel_power_cut: false
      storage_controller_cache_flush_proven: false
      filesystem_crash_consistency_lab: false
      silent_fresh_reinitialization_on_reopen: false
      whole_directory_loss_detectable_without_external_anchor: false
  storage_fault_seam:
    state: IMPLEMENTED_UNQUALIFIED
    format_magic: HBWAL001
    implemented_cases:
      - restart recovery from synced records
      - bounded injected disk stall with no post-deadline state advance
      - synced torn-tail detection and truncation to the last complete record
      - simulated loss of an unsynced tail
      - committed-record corruption detection and fail-closed reopen
      - atomic snapshot publication and reopen
    scope_limit:
      integrated_with_openraft_store: false
      kernel_power_loss: simulated only at the storage fault seam

