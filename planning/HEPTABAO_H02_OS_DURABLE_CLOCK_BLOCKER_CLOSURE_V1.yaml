invariants:
  - Implemented is not equivalent to executed, reviewed, selected or qualified.
  - A technical pass does not select OpenRaft or either file-storage prototype.
  - Process-fatal, blocked, queued, skipped or empty-step outcomes remain visible and cannot become a pass.
  - Same-process disk reopen cannot be represented as separate-process restart evidence.
  - Fault-seam fsync-loss simulation cannot be represented as kernel power-cut evidence.
  - Application wall-clock projection cannot be represented as kernel-clock mutation evidence.
  - A second GitHub-hosted OS is cross-environment evidence but is not independent attestation by itself.
  - Missing external approvals and signed receipts remain real blockers and are never fabricated.
  - Once an initialization marker exists, an absent authoritative generation is corruption and cannot be interpreted as a fresh store.
  - Loss of both a storage directory and its marker requires a separately qualified external rollback anchor; this prototype does not claim otherwise.
  - Bootstrap creation, existing-store reopen and legacy adoption are distinct caller-selected operations.
  - A missing marker or authoritative generation on reopen-existing is corruption, never permission to initialize empty state.
  - A validated current generation may retire one stale previous file; corrupt current state never rolls back silently.
  - qualification=false, selection_effect=NONE and authority_effect=NONE are immutable.
