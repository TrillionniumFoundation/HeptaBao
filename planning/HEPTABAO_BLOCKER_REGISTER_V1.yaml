  severity: CRITICAL
  title: durable generations can cross, disappear, or roll back through ambiguous reopen semantics
  owner_role: storage-distributed-systems
  state: REMEDIATION_IMPLEMENTED
  closure_criteria:
  - state and snapshot are stored in one atomic versioned bundle or manifest
  - bootstrap create-new and recovery reopen-existing are distinct operations
  - missing marker on reopen requires explicit legacy adoption rather than implicit initialization
  - valid current state retires stale previous state only after validation
  - corrupt current state never silently falls back to previous
  - multiple previous generations fail closed as ambiguous
  - interrupted replacement recovery is explicit
  - corruption and reopen fail closed
  - exact-head durable matrix passes across required toolchains and seeds
  - initialized-store markers distinguish first bootstrap from authoritative generation
    loss
  - marker domain and authoritative filename are versioned and validated
  - missing initialized log or state generations fail closed
  - corrupt markers and non-regular authoritative generations fail closed
  - legacy authoritative generations are adopted only after validation and marker
    publication
  - interrupted replacement recovery is explicit for generations and markers
  - whole-directory loss remains bound to an external rollback anchor rather than
    silent proof
  required_execution:
  - plan-integrity-v4/openraft-exact-graph-and-runtime
  - h02-openraft-blocker-closure
  - h02-final-gap-closure-arm64/exact-head-single-runner
