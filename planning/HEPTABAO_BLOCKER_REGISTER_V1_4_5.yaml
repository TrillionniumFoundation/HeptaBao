  severity: CRITICAL
  title: rollback and recovery receipts could be accepted without exact post-effect proof
  state: IMPLEMENTED_SOURCE
  closure_criteria:
  - rollback CAS receipt current checkpoint equals the exact requested checkpoint
  - alternate authenticated checkpoint receipt is rejected
  - wrong recovery receipt after publish is outcome unknown rather than safe contract failure
  - recovery receipt binds the anchor revision
  evidence:
  - crates/heptabao-rollback-anchor/src/lib.rs
  - crates/heptabao-recovery-core/src/lib.rs
  closure_receipt_required: true
