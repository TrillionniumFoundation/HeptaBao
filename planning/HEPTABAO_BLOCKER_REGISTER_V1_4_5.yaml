  severity: CRITICAL
  title: durable mutation intent could be reconciled without exact authoritative storage evidence
  state: IMPLEMENTED_SOURCE
  closure_criteria:
  - durable IntentCommitted to Reconciled transition is absent from the operation state machine
  - generic journaled-core reconciliation rejects a durable intent
  - exact generation and digest reread remains the only committed-state recovery path
  evidence:
  - crates/heptabao-operation-ledger/src/lib.rs
  - crates/heptabao-journaled-core/src/lib.rs
  closure_receipt_required: true
- id: HB-BLK-REPO-044
  class: REPOSITORY_CONTROLLED
  severity: CRITICAL
  title: stale checkpoint and archive-authenticated capabilities could bypass live-anchor restore admission
  state: IMPLEMENTED_SOURCE
  closure_criteria:
  - detached verified checkpoint is non-cloneable and cannot be downgraded
  - restore rereads and authenticates the current external anchor before capability handoff
  - target accepts only an unforgeable authorized recovery image
  - archive-authenticated image cannot release state or records
  - stale-checkpoint hostile restore test fails before target publication
  evidence:
  - crates/heptabao-rollback-anchor/src/lib.rs
  - crates/heptabao-recovery-core/src/lib.rs
  closure_receipt_required: true
