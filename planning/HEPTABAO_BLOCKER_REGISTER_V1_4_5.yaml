  severity: CRITICAL
  title: provider-neutral append outcome unknown did not poison operation or key ledgers
  state: IMPLEMENTED_SOURCE
  closure_criteria:
  - journal contract has conservative append-failure classification
  - operation ledger rejects all writes after an unknown append until authenticated replay
  - key lifecycle ledger rejects all writes after an unknown append until authenticated replay
  - hostile tests simulate a durable append followed by an error
  evidence:
  - crates/heptabao-journal-api/src/lib.rs
  - crates/heptabao-operation-ledger/src/lib.rs
  - crates/heptabao-key-lifecycle/src/lib.rs
  closure_receipt_required: true
- id: HB-BLK-REPO-043
