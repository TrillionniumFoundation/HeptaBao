- id: HB-BLK-REPO-057
  class: REPOSITORY_CONTROLLED
  severity: CRITICAL
  title: outer anchor-fence failure could relabel a completed recovery publication as a safe pre-entry failure
  state: IMPLEMENTED_SOURCE_REVIEW_REQUIRED
  closure_criteria:
  - AnchorFenceError distinguishes checkpoint rejection provider failure before entry and uncertainty after operation entry
  - CheckpointNotCurrent and ProviderBeforeEntry guarantee the publication closure was not invoked
  - OutcomeUnknownAfterEntry is mandatory whenever fence validity or completion is uncertain after closure entry
  - RecoveryRestorer preserves anchor contract provider and checkpoint-authenticator failure classes
  - deterministic hostile provider publishes the target and then fails fence completion
  - post-entry fence failure returns AnchorFenceOutcomeUnknown and requires anchor plus target reconciliation before retry
  evidence:
  - crates/heptabao-rollback-anchor/src/lib.rs
  - crates/heptabao-recovery-core/src/lib.rs
  - docs/recovery/HEPTABAO_AUTHORITATIVE_RECOVERY_PROTOCOL_V1.md
