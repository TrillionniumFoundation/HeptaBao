global_blockers:
  - missing executable and attributable CI evidence
  - missing independent reviewer identities or approvals
  - missing signed qualification, compatibility, selection or authority objects
  - failed, blocked, unknown or ambiguous critical test evidence
  - unresolved Critical or High security findings
  - incomplete clean-room provenance or source-material disposition
  - incomplete dependency license, advisory, unsafe, native or build-script review
  - incomplete durability, corruption, restart and disaster-recovery evidence
  - incomplete compatibility, migration or rollback evidence
  - unavailable signing, transparency or emergency revocation controls
  - capacity, budget or owner assignments below the normative baseline
  - any request to infer authority from implementation or qualification evidence
