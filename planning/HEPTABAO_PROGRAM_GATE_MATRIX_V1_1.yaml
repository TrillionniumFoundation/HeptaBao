dependency_semantics:
  work_start_requires: prerequisites required before implementation work may begin
  qualification_requires: evidence and approvals required before a gate may be qualified
  release_requires: evidence and authority required before release-affecting use
  missing_or_ambiguous: FAIL_CLOSED
  qualification_does_not_grant_authority: true
  compatibility_claim_does_not_grant_authority: true

