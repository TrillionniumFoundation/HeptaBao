hostile_snapshot_case:
  case_id: raft-hostile-stale-committed-snapshot-isolated
  implementation_state: IMPLEMENTED_UNQUALIFIED
  process_model:
    parent_timeout_seconds: 25
    child_operation_timeout_seconds: 10
    guard_settle_milliseconds: 100
    injection_marker: ABOUT_TO_INSTALL_STALE_COMMITTED_SNAPSHOT
    actual_scope: isolated child using the existing real three-voter OpenRaft cluster and guarded install_full_snapshot call
  classification:
    EXECUTED_PASS: injection reached and rejection, guarded idempotent no-op, or isolated child abort observed under the preserved native contract
    EXECUTED_FAIL: injection reached and stale snapshot accepted with a guarded-state change
    BLOCKED: missing injection, setup failure, timeout, unknown outcome or inconsistent result and exit code
  native_parent_exit_codes:
    EXECUTED_PASS: 0
    EXECUTED_FAIL: 1
    BLOCKED: 2
  availability_boundary:
    - process-fatal rejection after injection may preserve this bounded safety case
    - a process-fatal rejection is not an availability pass
    - timing behavior and process supervision require fresh native execution

linearizability_case:
  case_id: raft-readindex-single-register-external-check
  implementation_state: IMPLEMENTED_UNQUALIFIED
  history_schema: schemas/heptabao_h02_linearizability_history_v1.schema.json
  result_schema: schemas/heptabao_h02_linearizability_result_v1.schema.json
  model: single-register-v1
  algorithm: bounded-real-time-precedence-backtracking
  max_operations: 64
  real_time_rule: operation A precedes B when A.complete is strictly less than B.invoke
  classification:
    EXECUTED_PASS: a well-formed executed history has a legal witness order
    EXECUTED_FAIL: a well-formed executed history has no legal witness order
    BLOCKED: malformed, incomplete, unknown or out-of-contract history or checker execution
  observation_boundary:
    - one actual history and checker result per compiler and seed
    - retain and hash the actual raw history and independently recompute its result
    - legal concurrent schedules, RPC counts and witness orders may vary across executions
    - no raw-history, RPC, witness, child-diagnostic or snapshot-metadata replay equality is required

