selection_minimum_score: 38
prototype_selection_receipts: []
production_selection_authority: false
authority_effect: NONE
rules:
  - Candidate identification is not a dependency selection.
  - Exact release, commit and source digest are mandatory before selection.
  - Every score remains null until evidence is captured and independently reviewed.
  - Critical/high/unclassified findings block prototype selection.
  - A selected prototype still grants no compatibility or operational authority.
  - Runtime-facing code must depend on HeptaBao-owned traits so a selected library remains replaceable.
  - Crypto and Raft candidates require independent specialist review before prototype selection.
  - Unknown license, unsafe surface, MSRV or security history fails closed.
criteria_scale:
  0: unacceptable
  1: severe weakness
  2: material weakness
  3: acceptable with mitigation
  4: strong
  5: preferred
