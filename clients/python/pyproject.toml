[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "heptabao-client"
version = "0.1.0"
description = "Explicit, HTTPS-only HeptaBao client with private response publication"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
heptabao = "heptabao.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["heptabao*"]
