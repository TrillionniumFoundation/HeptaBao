name: plan-v1.4.3-descriptor-fencing

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - codex/plan-v1.4.2-recovery-foundation-v1
    paths:
      - Cargo.toml
      - Cargo.lock
      - crates/heptabao-filesystem-guard/**
      - crates/heptabao-single-node-store/Cargo.toml
      - crates/heptabao-single-node-store/src/lib.rs
      - crates/heptabao-single-node-journal/Cargo.toml
      - crates/heptabao-single-node-journal/src/lib.rs
      - docs/plan/HEPTABAO_PLAN_V1_4_3_DESCRIPTOR_ANCHOR_AND_WRITER_FENCING.md
      - docs/storage/HEPTABAO_DESCRIPTOR_ANCHOR_AND_WRITER_FENCE_V1.md
      - planning/HEPTABAO_BLOCKER_REGISTER_V1_4_3.yaml
      - planning/HEPTABAO_NORMATIVE_DOCUMENT_MANIFEST_V1_4_3.yaml
      - planning/HEPTABAO_V1_4_3_DESCRIPTOR_FENCING_STATUS.yaml
      - schemas/heptabao_normative_document_manifest_v1_4_3.schema.json
      - scripts/validate_plan_v1_4_3.py
      - scripts/validate_v1_4_3_inherited_surface.py
      - tests/plan/test_plan_v1_4_3.py
      - .github/workflows/plan-v1.4.3-descriptor-fencing.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: plan-v1.4.3-descriptor-fencing-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  descriptor-fencing:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Checkout exact source head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Bind exact source and clean tree
        shell: bash
        run: |
          set -euo pipefail
          expected="${{ github.event.pull_request.head.sha || github.sha }}"
          test "$(git rev-parse HEAD)" = "$expected"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          printf 'source_commit=%s\nsource_tree=%s\n' \
            "$expected" "$(git rev-parse HEAD^{tree})" \
            >"$RUNNER_TEMP/v1.4.3-source.txt"

      - name: Install exact Python dependencies
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-plan.txt

      - name: Validate current V1.4.3 source and regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --requirement requirements-plan.txt
          python scripts/validate_plan_v1_4_3.py
          python scripts/validate_v1_4_3_inherited_surface.py
          python -m unittest discover -s tests/plan -p 'test_plan_v1_4_3.py' -v
          python -m unittest discover -s tests/platform -p 'test_*.py' -v
          python -m unittest discover -s tests/oracle -p 'test_*.py' -v

      - name: Install exact Rust 1.98 toolchain
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
          rustc +1.98.0 --version --verbose
          cargo +1.98.0 --version --verbose

      - name: Replay frozen V1.4.2 Python and Rust gates
        shell: bash
        run: |
          set -euo pipefail
          baseline="34e8dc0caceb84288d4ef61f79cd7ca062718b63"
          historical_root="$RUNNER_TEMP/v1.4.2-baseline"
          cleanup() {
            git worktree remove --force "$historical_root" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          git worktree add --detach "$historical_root" "$baseline"
          (
            cd "$historical_root"
            python scripts/validate_plan_v1_4_2.py
            python scripts/validate_v1_4_2_inherited_surface.py
            python -m unittest discover -s tests/plan -p 'test_plan_v1_4_2.py' -v
            python -m unittest discover -s tests/platform -p 'test_*.py' -v
            python -m unittest discover -s tests/oracle -p 'test_*.py' -v
            cargo +1.98.0 fmt --all -- --check
            cargo +1.98.0 test --locked --workspace --all-targets
            cargo +1.98.0 clippy --locked --workspace --all-targets -- -D warnings
          )
          cleanup
          trap - EXIT

      - name: Format test and strictly lint current V1.4.3 workspace
        shell: bash
        run: |
          set -euo pipefail
          cargo +1.98.0 metadata --locked --no-deps --format-version 1 \
            >"$RUNNER_TEMP/v1.4.3-cargo-metadata.json"
          cargo +1.98.0 fmt --all -- --check
          cargo +1.98.0 test --locked --workspace --all-targets
          cargo +1.98.0 clippy --locked --workspace --all-targets -- -D warnings

      - name: Confirm V1.4.3 remains non-authoritative
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import yaml

          status = yaml.safe_load(
              Path('planning/HEPTABAO_V1_4_3_DESCRIPTOR_FENCING_STATUS.yaml')
              .read_text(encoding='utf-8')
          )
          expected = {
              'qualification': False,
              'compatibility_claim': False,
              'selected_candidates': [],
              'selection_effect': 'NONE',
              'production_authority': False,
              'migration_authority': False,
              'release_authority': False,
              'authority_effect': 'NONE',
          }
          if status.get('claims') != expected:
              raise SystemExit('V1.4.3 authority boundary drifted')
          print('V1.4.3 technical evidence has authority_effect=NONE')
          PY

      - name: Emit exact-head summary
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '## HeptaBao V1.4.3 descriptor anchoring and writer fencing'
            echo
            echo "- commit: \`$(git rev-parse HEAD)\`"
            echo "- tree: \`$(git rev-parse HEAD^{tree})\`"
            echo '- V1.4.3 semantic and hostile mutation validation: PASS'
            echo '- frozen V1.4.2 Python and Rust replay: PASS'
            echo '- current platform and Oracle regressions: PASS'
            echo '- current Rust 1.98 fmt/test/strict-Clippy: PASS'
            echo '- Linux subprocess writer-lock contention: PASS'
            echo '- root-path replacement resistance: PASS'
            echo '- qualification: false'
            echo '- production authority: false'
          } >>"$GITHUB_STEP_SUMMARY"
